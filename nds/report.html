<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NDS 新入會回報</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --primary: #8a2be2;
  --accent: #00d2ff;
  --accent-strong: #1ad1ff;
  --text-main: #ffffff;
  --text-soft: #d8e2f0;          /* 提高對比：說明文字也夠亮 */
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
html { font-size: 18px; }                       /* 銀髮族：整體放大基準 */
body {
  background-color: #0b1220;
  background-image: radial-gradient(at 0% 0%, rgba(138,43,226,0.25) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0,210,255,0.22) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px;
}
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 22px; padding: 28px 22px;
  width: 100%; max-width: 460px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  position: relative;
}
.header-title { text-align: center; margin-bottom: 22px; }
.header-title h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; color: #fff; }
.header-title p { color: var(--text-soft); font-size: 1rem; }
.profile-section { display: none; align-items: center; gap: 10px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-border); }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; }
.greeting { font-size: 1rem; color: var(--text-soft); }
.greeting span { color: var(--accent-strong); font-weight: 700; }

.section-label { font-size: 1.15rem; color: var(--accent-strong); font-weight: 800; margin: 26px 0 14px; padding-bottom: 6px; border-bottom: 2px solid rgba(0,210,255,0.3); }
.section-label:first-of-type { margin-top: 0; }

.form-group { margin-bottom: 20px; }
.form-group > label { display: block; font-size: 1.1rem; margin-bottom: 10px; color: #ffffff; font-weight: 700; }
.req::after { content: " *"; color: #ff7b7b; }
.hint { font-size: 0.92rem; color: var(--text-soft); margin-top: 8px; line-height: 1.5; }
.echo { font-size: 0.98rem; color: #7dffb0; font-weight: 700; margin-top: 8px; min-height: 1.2em; }

.styled-input, .styled-select {
  width: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25);
  border-radius: 14px; padding: 16px; color: #fff; font-size: 1.2rem; font-weight: 600;
  transition: all 0.2s ease; outline: none; -webkit-appearance: none; appearance: none;
}
.styled-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; }
.styled-input:focus, .styled-select:focus { background: rgba(0,0,0,0.35); border-color: var(--accent-strong); box-shadow: 0 0 0 4px rgba(0,210,255,0.25); }

/* 編號 + 分店 兩格 */
.dual { display: flex; align-items: center; gap: 10px; }
.dual .styled-input { text-align: center; letter-spacing: 2px; }
.dual .dash { font-size: 1.6rem; font-weight: 800; color: var(--text-soft); }
.dual .col { display: flex; flex-direction: column; }
.dual .col.main { flex: 2.2; }
.dual .col.branch { flex: 1; }
.dual .cap { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 4px; text-align: center; }

/* 大按鈕選擇組（性別/方案/付款） */
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-group input { display: none; }
.btn-group label {
  flex: 1; min-width: 90px; text-align: center; margin: 0;
  padding: 16px 10px; border: 2px solid rgba(255,255,255,0.25); border-radius: 14px;
  background: rgba(255,255,255,0.08); color: #fff; font-size: 1.1rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; line-height: 1.3;
}
.btn-group input:checked + label {
  background: var(--accent-strong); color: #062338; border-color: var(--accent-strong); font-weight: 800;
  box-shadow: 0 6px 18px -6px var(--accent);
}
.btn-group.col-2 label { flex: 1 1 calc(50% - 5px); }

/* 商品大按鈕（分檔位） */
.tier-group { margin-bottom: 18px; }
.tier-head { font-size: 1.05rem; font-weight: 800; color: var(--accent-strong); margin: 14px 0 10px; }
.prod-list { display: flex; flex-direction: column; gap: 10px; }
.prod-btn {
  width: 100%; text-align: left; padding: 16px 18px;
  border: 2px solid rgba(255,255,255,0.25); border-radius: 14px;
  background: rgba(255,255,255,0.08); color: #fff; font-size: 1.15rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.prod-btn.selected {
  background: var(--accent-strong); color: #062338; border-color: var(--accent-strong); font-weight: 800;
  box-shadow: 0 6px 18px -6px var(--accent);
}

.point-badge {
  display: none; margin-top: 14px; padding: 14px; border-radius: 12px;
  background: rgba(0,210,255,0.2); border: 2px solid var(--accent-strong);
  color: #eaffff; font-weight: 800; font-size: 1.2rem; text-align: center;
}

.submit-btn {
  width: 100%; padding: 20px; margin-top: 10px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border: none; border-radius: 16px; color: white;
  font-size: 1.3rem; font-weight: 800; cursor: pointer;
  transition: all 0.2s ease; box-shadow: 0 12px 24px -10px var(--accent);
  display: flex; justify-content: center; align-items: center; gap: 10px;
}
.submit-btn:active { transform: translateY(2px); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay { position: absolute; inset: 0; background: var(--glass-bg); border-radius: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
.loading-text { margin-top: 15px; color: var(--accent-strong); font-weight: 700; font-size: 1.05rem; }
.result-box { display: none; border-radius: 14px; padding: 18px; margin-bottom: 20px; font-size: 1.1rem; font-weight: 700; line-height: 1.5; text-align: center; }
.result-box.error { background: rgba(255,80,80,0.2); border: 2px solid rgba(255,80,80,0.6); color: #ffb0b0; }
.result-box.warning { background: rgba(255,190,50,0.2); border: 2px solid rgba(255,190,50,0.6); color: #ffe0a0; }
.hidden { display: none !important; }
.topic-chip{display:inline-block;border:2px solid rgba(255,255,255,0.25);border-radius:999px;
  padding:11px 18px;margin:5px 7px 0 0;cursor:pointer;font-size:1.05rem;font-weight:600;
  user-select:none;background:rgba(255,255,255,0.08);color:#fff;transition:all .2s}
.topic-chip.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#062338;font-weight:800;
  box-shadow:0 6px 18px -6px var(--accent)}
.intent-known{border:2px solid var(--accent-strong);border-radius:14px;padding:14px;
  background:rgba(0,210,255,0.08);color:#fff}
</style>
</head>
<body>
<div class="glass-card">
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner" style="display:block;width:42px;height:42px;border-width:4px;"></div>
    <div class="loading-text">載入身份中…</div>
  </div>

  <div class="header-title" id="headerTitle">
    <h1>新入會回報</h1>
    <p>幫新會員補齊資料與方案</p>
  </div>

  <div class="profile-section" id="profileSection">
    <img src="https://via.placeholder.com/44" alt="" class="avatar" id="userAvatar">
    <div class="greeting">回報人：<span id="userName">－</span></div>
  </div>

  <div class="result-box" id="resultBox"></div>

  <form id="ndsForm">
    <div class="section-label">這張表是誰在填？</div>
    <div class="form-group">
      <div class="btn-group">
        <input type="radio" name="whoFills" id="wf0" value="proxy" checked><label for="wf0">我幫他填</label>
        <input type="radio" name="whoFills" id="wf1" value="self"><label for="wf1">我就是這位新人</label>
      </div>
      <div class="hint" id="whoHint">代填的話，送出後會給你一條連結，傳給他點一下就完成綁定。</div>
    </div>

    <input type="hidden" id="lineId">
    <input type="hidden" id="displayName">
    <input type="hidden" id="oaId">

    <!-- A. 基本個資 -->
    <div class="section-label">A · 基本個資</div>
    <div class="form-group">
      <label class="req">會員編號</label>
      <div class="dual">
        <div class="col main"><span class="cap">編號（7碼）</span>
          <input type="text" id="midMain" class="styled-input" inputmode="numeric" placeholder="2675630" maxlength="7"></div>
        <span class="dash">－</span>
        <div class="col branch"><span class="cap">分店（3碼）</span>
          <input type="text" id="midBranch" class="styled-input" inputmode="numeric" placeholder="001" maxlength="3" value="001"></div>
      </div>
    </div>
    <div class="form-group">
      <label for="name" class="req">姓名</label>
      <input type="text" id="name" class="styled-input" placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label>性別</label>
      <div class="btn-group">
        <input type="radio" name="gender" id="gM" value="男"><label for="gM">男</label>
        <input type="radio" name="gender" id="gF" value="女"><label for="gF">女</label>
      </div>
    </div>
    <div class="form-group">
      <label for="birth">出生年月日</label>
      <input type="date" id="birth" class="styled-input">
    </div>
    <div class="form-group">
      <label for="phone" class="req">行動電話</label>
      <input type="tel" id="phone" class="styled-input" inputmode="numeric" placeholder="0912345678" maxlength="10">
    </div>

    <!-- B. 購買方案 -->
    <div class="section-label">B · 購買方案</div>
    <div class="form-group">
      <label class="req">購買商品（點選一項）</label>
      <div id="productArea"><div class="hint">載入中…</div></div>
      <div class="point-badge" id="pointBadge"></div>
    </div>
    <div class="form-group">
      <label class="req">方案長度</label>
      <div class="btn-group">
        <input type="radio" name="planLen" id="pl1" value="1+11"><label for="pl1">1+11<br>一年</label>
        <input type="radio" name="planLen" id="pl2" value="1+5"><label for="pl2">1+5<br>半年</label>
        <input type="radio" name="planLen" id="pl3" value="新12M"><label for="pl3">新12M</label>
      </div>
    </div>
    <div class="form-group" id="variantGroup">
      <label>給點方式</label>
      <div class="btn-group">
        <input type="radio" name="planVar" id="pvA" value="A"><label for="pvA">A 標準<br>月配給點</label>
        <input type="radio" name="planVar" id="pvB" value="B"><label for="pvB">B 預購<br>一次給點</label>
      </div>
      <div class="hint" id="deliveryHint"></div>
    </div>
    <div class="form-group">
      <label for="joinDate" class="req">入會日期</label>
      <input type="date" id="joinDate" class="styled-input">
      <div class="hint" id="billingHint">扣款日將依入會日自動計算</div>
    </div>
    <div class="form-group">
      <label class="req">續購付款方式</label>
      <div class="btn-group col-2">
        <input type="radio" name="payment" id="pay4" value="4"><label for="pay4">信用卡<br>自動扣款</label>
        <input type="radio" name="payment" id="pay1" value="1"><label for="pay1">銀行<br>自動扣款</label>
        <input type="radio" name="payment" id="pay2" value="2"><label for="pay2">貨到付款</label>
        <input type="radio" name="payment" id="pay3" value="3"><label for="pay3">臨櫃</label>
      </div>
      <div class="hint">12M 每月、或 1+11／1+5 方案結束後續購的扣款方式</div>
    </div>

    <!-- C. 推薦人與位置 -->
    <div class="section-label">C · 推薦人與位置</div>
    <div class="form-group">
      <label class="req">推薦人會員編號</label>
      <div class="dual">
        <div class="col main"><span class="cap">編號（7碼）</span>
          <input type="text" id="spMain" class="styled-input" inputmode="numeric" placeholder="2675630" maxlength="7"></div>
        <span class="dash">－</span>
        <div class="col branch"><span class="cap">分店（3碼）</span>
          <input type="text" id="spBranch" class="styled-input" inputmode="numeric" placeholder="001" maxlength="3"></div>
      </div>
      <div class="echo" id="sponsorEcho"></div>
    </div>
    <div class="form-group">
      <label>指定位置會員編號（選填）</label>
      <div class="dual">
        <div class="col main"><span class="cap">編號（7碼）</span>
          <input type="text" id="plMain" class="styled-input" inputmode="numeric" placeholder="掛在誰下面" maxlength="7"></div>
        <span class="dash">－</span>
        <div class="col branch"><span class="cap">分店（3碼）</span>
          <input type="text" id="plBranch" class="styled-input" inputmode="numeric" placeholder="001" maxlength="3"></div>
      </div>
      <div class="hint">不填則之後維護補</div>
    </div>

    <!-- D. 入會期待 -->
    <div class="section-label">D · 他為什麼加入</div>
    <div id="intentKnown" style="display:none" class="form-group"></div>
    <div id="intentAsk">
      <div class="form-group">
        <label class="req">主要期待</label>
        <div class="btn-group" id="intentCatGroup"></div>
        <div class="hint">之後回訪、滿意度調查都會拿這一題來對照，請照他自己說的選。</div>
      </div>
      <div class="form-group" id="intentTopicGroup" style="display:none">
        <label>具體是哪方面？（可複選）</label>
        <div id="intentTopics"></div>
      </div>
      <div class="form-group">
        <label>他原話補充（選填）</label>
        <input type="text" class="styled-input" id="intentDetail" placeholder="例：晚上睡不好，起來好幾次">
      </div>
      <div class="form-group">
        <label>這是誰說的</label>
        <div class="btn-group">
          <input type="radio" name="bySelf" id="bs0" value="0" checked><label for="bs0">我轉述的</label>
          <input type="radio" name="bySelf" id="bs1" value="1"><label for="bs1">他本人當場說</label>
        </div>
        <div class="hint">回訪時語氣會不同：本人說的可以直接引用，轉述的要先確認。</div>
      </div>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn" disabled>
      <span id="btnText">送出回報</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>
  </form>
</div>

<script>
/* ===== 待填設定 ===== */
const MY_LIFF_ID      = "2009692859-eFjxxjLe";
/* 多 OA 共用同一份頁面：依網址 ?oa= 對應各 OA 的 webhook（各自獨立 workflow / DB）。
   未來新增 OA 只要在這裡加一行，前端其餘完全不動。 */
const OA_ENDPOINTS = {
  randoph:    "https://aplustw.zeabur.app/webhook/nds-randoph"
  // qianweida: "https://aplustw.zeabur.app/webhook/nds-qianweida",
};
const DEFAULT_OA = "randoph";
const N8N_CATALOG_URL = "PLACEHOLDER_N8N_CATALOG_WEBHOOK_URL";

/* Supabase：回報直接寫進 randoph_nds.members（後台 corp.html 讀的同一張表） */
const SUPABASE_URL  = "https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const NDS_RPC_URL   = SUPABASE_URL + "/rest/v1/rpc/nds_report_submit";

/* 內建商品目錄 fallback（正式以 DB 為準）；ref_price 用於分組標題顯示 */
/* 顯示順序：用戶指定前段(喚活→明力多→48包系列→妍漾) + 其餘接後；spec 與 DB 一致供反查 */
const FALLBACK_CATALOG = [
  { product_code:"SR", product_name:"喚活",             spec:"120顆/包",  point_tier:15000, ref_price:6300, label:"喚活" },
  { product_code:"MP", product_name:"識霸明力多",       spec:"120顆/罐",  point_tier:15000, ref_price:6300, label:"識霸明力多" },
  { product_code:"IM", product_name:"活美水素水",       spec:"48包/盒",   point_tier:15000, ref_price:6300, label:"活美水素水（48包）" },
  { product_code:"PF", product_name:"普力活 FIRE",      spec:"48包/盒",   point_tier:15000, ref_price:6300, label:"普力活 FIRE（48包）" },
  { product_code:"BB", product_name:"普力活 BB",        spec:"48包/盒",   point_tier:15000, ref_price:6300, label:"普力活 BB（48包）" },
  { product_code:"AD", product_name:"妍漾飲",           spec:"10罐/盒",   point_tier:15000, ref_price:6300, label:"妍漾飲（10罐）" },
  { product_code:"AD", product_name:"妍漾飲",           spec:"14罐/盒",   point_tier:20000, ref_price:8400, label:"妍漾飲（14罐）" },
  { product_code:"SL", product_name:"識霸",             spec:"1罐",       point_tier:10000, ref_price:4200, label:"識霸" },
  { product_code:"IM", product_name:"活美水素水",       spec:"30包/盒",   point_tier:10000, ref_price:4200, label:"活美水素水（30包）" },
  { product_code:"PF", product_name:"普力活 FIRE",      spec:"30包/盒",   point_tier:10000, ref_price:4200, label:"普力活 FIRE（30包）" },
  { product_code:"BB", product_name:"普力活 BB",        spec:"30包/盒",   point_tier:10000, ref_price:4200, label:"普力活 BB（30包）" },
  { product_code:"MV", product_name:"識霸明力多(素食)", spec:"120顆/罐",  point_tier:15000, ref_price:6400, label:"識霸明力多（素食）" },
  { product_code:"DS", product_name:"晨星系列",         spec:"一盒",      point_tier:10000, ref_price:4200, label:"晨星系列" }
];

const RE_MAIN = /^\d{7}$/, RE_BRANCH = /^\d{3}$/;
let selectedProduct = null;   // { code, spec, tier, name, sku }

function getOaFromUrl(){ try { return new URLSearchParams(location.search).get('oa')||''; } catch(e){ return ''; } }
function showResult(msg,type){ const b=document.getElementById('resultBox'); b.className='result-box '+type; b.textContent=msg; b.style.display='block'; b.scrollIntoView({behavior:'smooth',block:'center'}); }
function hideResult(){ document.getElementById('resultBox').style.display='none'; }
function resetBtn(){ document.getElementById('submitBtn').disabled=false; document.getElementById('btnText').textContent='送出回報'; document.getElementById('btnSpinner').style.display='none'; }

/* ===== 商品目錄 → 大按鈕（依檔位分組）===== */
async function loadCatalog(){
  let list = FALLBACK_CATALOG;
  if (N8N_CATALOG_URL && !N8N_CATALOG_URL.startsWith('PLACEHOLDER')) {
    try { const r=await fetch(N8N_CATALOG_URL); if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length) list=d; } }
    catch(e){ console.warn('catalog fallback',e); }
  }
  const area = document.getElementById('productArea');
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'prod-list';
  list.forEach(it => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'prod-btn';
    btn.textContent = it.label || `${it.product_name} ${it.spec}`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.prod-btn').forEach(x => x.classList.remove('selected'));
      btn.classList.add('selected');
      selectedProduct = { code: it.product_code, spec: it.spec, tier: it.point_tier, name: it.product_name, sku: it.sku_id || null };
      const badge = document.getElementById('pointBadge');
      badge.textContent = `✓ ${it.label || (it.product_name + ' ' + it.spec)} · ${it.point_tier.toLocaleString()} 點`;
      badge.style.display = 'block';
    });
    wrap.appendChild(btn);
  });
  area.appendChild(wrap);
}

/* ===== 連動 ===== */
function getPlanLen(){ const r=document.querySelector('input[name="planLen"]:checked'); return r?r.value:''; }
function getPlanVar(){ const r=document.querySelector('input[name="planVar"]:checked'); return r?r.value:''; }
function refreshPlanUI(){
  const len=getPlanLen(), vg=document.getElementById('variantGroup'), dh=document.getElementById('deliveryHint');
  if(len==='新12M'){ vg.classList.add('hidden'); document.querySelectorAll('input[name="planVar"]').forEach(x=>x.checked=false); dh.textContent=''; }
  else if(len==='1+11'||len==='1+5'){
    vg.classList.remove('hidden'); const v=getPlanVar();
    dh.textContent = v==='A' ? '配送：月配（每月給點）' : v==='B' ? '配送：一次拿（商品提早全拿，效期不變）' : '';
  } else { vg.classList.add('hidden'); dh.textContent=''; }
}
function computeDelivery(){ const len=getPlanLen(), v=getPlanVar(); if(len==='新12M')return'月配'; if(v==='A')return'月配'; if(v==='B')return'一次拿'; return''; }
function refreshBillingHint(){
  const d=document.getElementById('joinDate').value;
  const h=document.getElementById('billingHint');
  if(d){ const day=Number(d.slice(8,10)); h.textContent=`💳 扣款日：每月 ${day} 號（依入會日）`; }
  else { h.textContent='扣款日將依入會日自動計算'; }
}

document.addEventListener("DOMContentLoaded", function(){
  loadCatalog();
  document.getElementById('joinDate').value = new Date().toISOString().slice(0,10);
  refreshBillingHint();
  document.querySelectorAll('input[name="planLen"]').forEach(x=>x.addEventListener('change',refreshPlanUI));
  document.querySelectorAll('input[name="planVar"]').forEach(x=>x.addEventListener('change',refreshPlanUI));
  document.getElementById('joinDate').addEventListener('change',refreshBillingHint);
  initializeLiff(MY_LIFF_ID);
});

async function initializeLiff(liffId){
  try {
    if (liffId.startsWith('PLACEHOLDER')) { document.getElementById('loadingOverlay').style.display='none'; document.getElementById('submitBtn').disabled=false; return; }
    await liff.init({ liffId });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const p = await liff.getProfile();
    document.getElementById('loadingOverlay').style.display='none';
    document.getElementById('headerTitle').style.display='none';
    document.getElementById('profileSection').style.display='flex';
    document.getElementById('userAvatar').src = p.pictureUrl || 'https://via.placeholder.com/44';
    document.getElementById('userName').textContent = p.displayName;
    document.getElementById('lineId').value = p.userId;
    document.getElementById('displayName').value = p.displayName;
    document.getElementById('oaId').value = getOaFromUrl();
    document.getElementById('submitBtn').disabled = false;
  } catch(err){
    console.error('LIFF init failed', err);
    document.getElementById('loadingOverlay').innerHTML = '<div class="loading-text" style="color:#ff8080;">載入失敗，請從 LINE 內開啟。</div>';
  }
}

/* ===== 送出 ===== */
document.getElementById('ndsForm').addEventListener('submit', async function(e){
  e.preventDefault(); hideResult();
  const btn=document.getElementById('submitBtn'); btn.disabled=true;
  document.getElementById('btnText').textContent='送出中…'; document.getElementById('btnSpinner').style.display='block';

  const midMain=document.getElementById('midMain').value.trim(), midBranch=document.getElementById('midBranch').value.trim();
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const gender=(document.querySelector('input[name="gender"]:checked')||{}).value||'';
  const birth=document.getElementById('birth').value||'';
  const joinDate=document.getElementById('joinDate').value||'';
  const planLen=getPlanLen(), planVar=getPlanVar();
  const payment=(document.querySelector('input[name="payment"]:checked')||{}).value||'';
  const spMain=document.getElementById('spMain').value.trim(), spBranch=document.getElementById('spBranch').value.trim();
  const plMain=document.getElementById('plMain').value.trim(), plBranch=document.getElementById('plBranch').value.trim();

  // 驗證
  if(!RE_MAIN.test(midMain)||!RE_BRANCH.test(midBranch)){ showResult('會員編號錯誤：編號7碼、分店3碼，例 2675630 / 001。','error'); resetBtn(); return; }
  if(name.length<2){ showResult('請輸入正確姓名。','error'); resetBtn(); return; }
  if(!/^09\d{8}$/.test(phone)){ showResult('請輸入正確的 10 碼手機（09 開頭）。','error'); resetBtn(); return; }
  if(!selectedProduct){ showResult('請點選購買商品。','error'); resetBtn(); return; }
  if(!planLen){ showResult('請選擇方案長度。','error'); resetBtn(); return; }
  if((planLen==='1+11'||planLen==='1+5') && !planVar){ showResult('請選擇給點方式（A／B）。','error'); resetBtn(); return; }
  if(!joinDate){ showResult('請選擇入會日期。','error'); resetBtn(); return; }
  if(!payment){ showResult('請選擇續購付款方式。','error'); resetBtn(); return; }
  if(!RE_MAIN.test(spMain)||!RE_BRANCH.test(spBranch)){ showResult('推薦人編號錯誤：編號7碼、分店3碼。','error'); resetBtn(); return; }
  const hasPl = plMain || plBranch;
  if(hasPl && (!RE_MAIN.test(plMain)||!RE_BRANCH.test(plBranch))){ showResult('指定位置編號格式錯誤。','error'); resetBtn(); return; }

  const payload = {
    oa_id:        document.getElementById('oaId').value,
    line_id:      document.getElementById('lineId').value,
    line_name:    document.getElementById('displayName').value,
    member_id:    midMain + '-' + midBranch,
    name, gender,
    birth_date:   birth || null,
    phone,
    registered_at: joinDate,
    billing_day:  Number(joinDate.slice(8,10)),
    product_code: selectedProduct.code,
    product_spec: selectedProduct.spec,
    point_tier:   selectedProduct.tier,
    product_sku_id: selectedProduct.sku,
    plan_length:  planLen,
    plan_variant: planLen==='新12M' ? null : planVar,
    delivery_mode: computeDelivery(),
    payment_method: Number(payment),
    sponsor_member_id: spMain + '-' + spBranch,
    placement_parent_id: hasPl ? (plMain + '-' + plBranch) : null
  };

  try {
    /* 主要寫入：直接進 Supabase（後台 corp.html 讀的同一張表） */
      const intentSkipped = PERSON && PERSON.found && PERSON.intent
                          && document.getElementById('intentAsk').style.display==='none';
    if(!INTENT_CAT && !intentSkipped && Object.keys(INTENT_OPTS).length){
      showResult('請選「D · 他為什麼加入」的主要期待。','warning'); resetBtn(); return;
    }
  const res = await fetch(NDS_RPC_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON, 'Authorization':'Bearer '+SUPABASE_ANON },
      body: JSON.stringify({ p: payload })
    });
    if(!res.ok) throw new Error('伺服器回應 '+res.status);
    const result = await res.json();
    if(result && result.success===false){ showResult(result.message||'送出失敗，請聯絡管理者。','warning'); resetBtn(); return; }

    /* 入會期待：主回報成功後才寫，寫失敗不影響回報結果 */
    const ip = intentPayload(payload.member_id, payload.line_name || payload.sponsor_member_id);
    if(ip){
      try{
        const ir = await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_intent_submit',{method:'POST',
          headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
          body: JSON.stringify({ p: ip })});
        const ires = await ir.json();
        if(ires && ires.success===false) console.warn('intent 寫入失敗（回報已成功）', ires.message);
      }catch(e){ console.warn('intent 寫入例外（回報已成功）', e); }
    }

    /* 次要通知：原 n8n webhook 保留，非阻塞（掛掉不影響回報成功） */
    const oaKey = getOaFromUrl() || DEFAULT_OA;
    const notifyUrl = OA_ENDPOINTS[oaKey] || OA_ENDPOINTS[DEFAULT_OA];
    fetch(notifyUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
      .catch(e=>console.warn('n8n notify failed (已寫入DB，不影響)',e));

    document.getElementById('btnText').textContent='回報成功！';
    document.getElementById('btnSpinner').style.display='none';
    btn.style.background='linear-gradient(135deg,#00b09b,#96c93d)';

    const isSelf = (document.querySelector('input[name="whoFills"]:checked')||{}).value==='self';
    if(isSelf){
      /* 本人填的：手上這支 LINE 就是他的，直接綁 */
      const tk = await rpc('nds_bind_issue', { member_id: payload.member_id, created_by:'本人填寫' });
      if(tk && tk.success){
        const bd = await rpc('nds_bind_confirm', { token:tk.token,
          line_uid: payload.line_id, line_name: payload.line_name });
        showResult(bd&&bd.success ? '✅ 回報成功，已綁定你的 LINE。'
                                  : '回報成功，但 LINE 綁定失敗：'+((bd&&bd.message)||'請聯絡總部'),
                   bd&&bd.success?'success':'warning');
      }
      setTimeout(()=>{ if(!MY_LIFF_ID.startsWith('PLACEHOLDER')) liff.closeWindow(); },2600);
    } else {
      /* 代填：發一條一次性連結，請他傳給本人 */
      const tk = await rpc('nds_bind_issue', { member_id: payload.member_id, created_by: payload.line_name });
      if(tk && tk.success){
        const url = location.origin + '/nds/bind.html?t=' + tk.token;
        showBindLink(tk.name, url);
      } else {
        showResult('回報成功。（綁定連結產生失敗，可稍後在戰情台補發）','warning');
        setTimeout(()=>{ if(!MY_LIFF_ID.startsWith('PLACEHOLDER')) liff.closeWindow(); },2200);
      }
    }
  } catch(err){ console.error('submit error',err); showResult('送出失敗：'+err.message,'error'); resetBtn(); }
});

/* ===== C. 入會期待 ===== */
let INTENT_OPTS={}, INTENT_CAT='', INTENT_TOPICS=new Set();
async function loadIntentOptions(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_intent_options',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
      body:'{}'});
    INTENT_OPTS=await r.json()||{};
  }catch(e){ console.warn('intent options 載入失敗',e); INTENT_OPTS={}; }
  const g=document.getElementById('intentCatGroup');
  const cats=Object.keys(INTENT_OPTS);
  if(!cats.length){ g.innerHTML='<div class="hint">選項載入失敗，可略過此區。</div>'; return; }
  g.innerHTML=cats.map((c,i)=>
    `<input type="radio" name="intentCat" id="ic${i}" value="${c}"><label for="ic${i}">${c}</label>`).join('');
  cats.forEach((c,i)=>{
    document.getElementById('ic'+i).addEventListener('change',()=>{ INTENT_CAT=c; INTENT_TOPICS.clear(); renderTopics(); });
  });
}
function renderTopics(){
  const box=document.getElementById('intentTopicGroup'), list=document.getElementById('intentTopics');
  const ts=INTENT_OPTS[INTENT_CAT]||[];
  if(!ts.length){ box.style.display='none'; return; }
  box.style.display='block';
  list.innerHTML=ts.map((t,i)=>
    `<span class="topic-chip" data-t="${t}" onclick="toggleTopic(this)">${t}</span>`).join('');
}
function toggleTopic(el){
  const t=el.dataset.t;
  if(INTENT_TOPICS.has(t)){ INTENT_TOPICS.delete(t); el.classList.remove('on'); }
  else { INTENT_TOPICS.add(t); el.classList.add('on'); }
}
function intentPayload(mid,by){
  if(!INTENT_CAT) return null;
  const bs=document.querySelector('input[name="bySelf"]:checked');
  return { member_id:mid, category:INTENT_CAT, topics:[...INTENT_TOPICS],
           detail:(document.getElementById('intentDetail').value||'').trim(),
           source:'入會回報', reported_by:by||'', by_self: bs ? bs.value==='1' : false };
}
document.addEventListener('DOMContentLoaded',loadIntentOptions);


/* ===== 同一個人開分店：自動帶入，不要重問 ===== */
let PERSON=null;
async function lookupPerson(){
  const main=(document.getElementById('midMain').value||'').replace(/\D/g,'');
  const box=document.getElementById('intentKnown'), ask=document.getElementById('intentAsk');
  if(main.length<6){ PERSON=null; box.style.display='none'; ask.style.display=''; return; }
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_person_lookup',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
      body:JSON.stringify({p:{main}})});
    PERSON=await r.json();
  }catch(e){ console.warn('person lookup failed',e); PERSON=null; return; }
  if(!PERSON||!PERSON.found){ box.style.display='none'; ask.style.display=''; return; }

  // 帶入基本資料（只填空欄，不覆蓋已打的字）
  const P=PERSON.person||{};
  const fill=(id,v)=>{ const el=document.getElementById(id); if(el&&!el.value&&v) el.value=v; };
  fill('name',P.name); fill('phone',P.phone); fill('birth',P.birth_date);
  if(P.gender){ const g=document.getElementById(P.gender==='女'?'gF':'gM'); if(g&&!document.querySelector('input[name="gender"]:checked')) g.checked=true; }
  // 建議下一個分號
  const mb=document.getElementById('midBranch');
  if(mb&&(!mb.value||mb.value==='001')&&PERSON.next_branch) mb.value=PERSON.next_branch;

  const I=PERSON.intent;
  if(I){
    // 已問過 → 整段收起來，只顯示已知
    ask.style.display='none';
    INTENT_CAT=''; INTENT_TOPICS.clear();
    box.style.display='';
    box.innerHTML=`<div class="intent-known">
      <div style="font-weight:800;font-size:1.05rem">✅ 這個人的期待已經記錄過了，不用再填</div>
      <div style="margin-top:8px;font-size:1.15rem"><b>${I.category}</b>${(I.topics||[]).length?'　'+I.topics.join('、'):''}</div>
      ${I.detail?`<div style="margin-top:6px;opacity:.85">「${I.detail}」</div>`:''}
      <div style="margin-top:8px;font-size:.95rem;opacity:.7">${I.asked_at}｜${I.source}｜由 ${I.member_id} 回報</div>
      <div style="margin-top:10px"><span class="topic-chip" onclick="reAskIntent()">期待改變了，重新填</span></div>
    </div>`;
  }else{
    box.style.display='none'; ask.style.display='';
    if(PERSON.branches&&PERSON.branches.length>1){
      // 有多個分號但沒問過期待 → 提示這是補問
      box.style.display='';
      box.innerHTML=`<div class="intent-known" style="border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)">
        這個人已有 ${PERSON.branches.length} 個位置（${PERSON.branches.join('、')}），但<b>還沒問過期待</b>——順便補一下，之後回訪才有對照。</div>`;
    }
  }
}
function reAskIntent(){
  document.getElementById('intentKnown').style.display='none';
  document.getElementById('intentAsk').style.display='';
}
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('midMain');
  if(el){ el.addEventListener('blur',lookupPerson); el.addEventListener('change',lookupPerson); }
});


async function rpc(fn,body){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
      body:JSON.stringify({p:body})});
    return await r.json();
  }catch(e){ console.warn(fn+' failed',e); return null; }
}
function showBindLink(name,url){
  const b=document.getElementById('resultBox');
  b.className='result-box success'; b.style.display='block';
  b.innerHTML=`<div style="font-weight:800;font-size:1.1rem">✅ 回報成功</div>
    <div style="margin-top:8px">把這條連結傳給 <b>${name}</b>，他點一下就完成 LINE 綁定：</div>
    <div style="margin-top:8px;padding:10px;background:rgba(0,0,0,.35);border-radius:10px;
                word-break:break-all;font-size:.9rem">${url}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span class="topic-chip" onclick="copyBind('${url}')">🔗 複製連結</span>
      <span class="topic-chip" onclick="shareBind('${name}','${url}')">💬 傳給他</span>
    </div>
    <div style="margin-top:8px;font-size:.85rem;opacity:.75">連結 24 小時內有效，只能用一次。過期或綁錯可在戰情台重發。</div>`;
  b.scrollIntoView({behavior:'smooth',block:'center'});
}
function copyBind(url){
  navigator.clipboard.writeText(url).then(()=>alert('已複製，貼給他就好'))
    .catch(()=>prompt('複製這條連結：',url));
}
function shareBind(name,url){
  const msg=name+' 你好，點這條連結完成 LINE 綁定（24小時內有效）：\n'+url;
  if(typeof liff!=='undefined' && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')){
    liff.shareTargetPicker([{type:'text',text:msg}]).catch(()=>copyBind(url));
  } else copyBind(url);
}
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('input[name="whoFills"]').forEach(r=>r.addEventListener('change',()=>{
    const self=document.getElementById('wf1').checked;
    document.getElementById('whoHint').textContent = self
      ? '你自己填的話，送出當下就直接綁定你的 LINE，不用再點連結。'
      : '代填的話，送出後會給你一條連結，傳給他點一下就完成綁定。';
  }));
});
