<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>綠佳利 · LINE 綁定</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#1a1f3a,#2d1b4e);color:#fff;
  font:18px/1.7 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.box{width:100%;max-width:420px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  border-radius:20px;padding:28px 24px;text-align:center}
h1{font-size:1.35rem;margin:0 0 6px}
.name{font-size:2.1rem;font-weight:800;margin:18px 0;color:#00d2ff}
.sub{opacity:.75;font-size:.95rem}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:20px;margin-top:14px;
  font-size:1.25rem;font-weight:800;cursor:pointer}
.yes{background:linear-gradient(135deg,#00b09b,#96c93d);color:#fff}
.no{background:transparent;border:2px solid rgba(255,255,255,.3);color:#fff;font-size:1.05rem;font-weight:600}
.msg{margin-top:16px;padding:14px;border-radius:12px;font-size:1.05rem;display:none}
.ok{background:rgba(0,176,155,.2);border:1px solid #00b09b}
.err{background:rgba(255,93,93,.15);border:1px solid #ff5d5d}
</style></head><body>
<div class="box">
  <div id="loading">
    <h1>正在確認…</h1><div class="sub">請稍候</div>
  </div>
  <div id="ask" style="display:none">
    <h1>請確認你的身分</h1>
    <div class="name" id="who">－</div>
    <div class="sub" id="byWho"></div>
    <button class="btn yes" onclick="confirmBind()">是，這是我</button>
    <button class="btn no" onclick="notMe()">不是我</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const LIFF_ID = "REPLACE_WITH_BIND_LIFF_ID";
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let PROFILE = null;
const $ = id => document.getElementById(id);
function say(text, ok){ const m=$('msg'); m.className='msg '+(ok?'ok':'err'); m.textContent=text; m.style.display='block'; }
async function rpc(fn, body){
  const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn, {method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body: JSON.stringify({p: body})});
  return r.json();
}
async function boot(){
  if(!TOKEN){ $('loading').style.display='none'; say('連結不完整，請向推薦人索取新的。', false); return; }
  try{
    if(!LIFF_ID.startsWith('REPLACE')){
      await liff.init({liffId: LIFF_ID});
      if(!liff.isLoggedIn()){ liff.login(); return; }
      PROFILE = await liff.getProfile();
    }
  }catch(e){ console.warn('liff init failed', e); }
  const d = await rpc('nds_bind_peek', {token: TOKEN});
  $('loading').style.display='none';
  if(!d || !d.success){ say((d && d.message) || '連結無效。', false); return; }
  $('who').textContent = d.name;
  $('byWho').textContent = d.created_by ? ('由 ' + d.created_by + ' 幫你回報') : '';
  $('ask').style.display = '';
}
async function confirmBind(){
  if(!PROFILE){ say('沒有取得 LINE 身分，請從 LINE 裡面點這條連結。', false); return; }
  $('ask').style.display='none';
  const d = await rpc('nds_bind_confirm', {token: TOKEN, line_uid: PROFILE.userId, line_name: PROFILE.displayName});
  if(d && d.success){
    say('✅ 綁定完成，' + d.name + ' 你好！之後的通知會直接發到這裡。', true);
    setTimeout(()=>{ if(!LIFF_ID.startsWith('REPLACE')) liff.closeWindow(); }, 3000);
  } else {
    say((d && d.message) || '綁定失敗，請聯絡推薦人。', false);
    $('ask').style.display='';
  }
}
function notMe(){
  $('ask').style.display='none';
  say('好的，這條連結不會綁到你身上。請通知推薦人重新確認。', true);
}
boot();
</script></body></html>
