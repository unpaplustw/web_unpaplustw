<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NDS 會員滿意度進程調查</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --primary: #8a2be2;
  --accent: #00d2ff;
  --accent-strong: #1ad1ff;
  --text-main: #ffffff;
  --text-soft: #d8e2f0;          /* 提高對比：說明文字也夠亮 */
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
html { font-size: 18px; }                       /* 銀髮族：整體放大基準 */
body {
  background-color: #0b1220;
  background-image: radial-gradient(at 0% 0%, rgba(138,43,226,0.25) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0,210,255,0.22) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px;
}
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 22px; padding: 28px 22px;
  width: 100%; max-width: 460px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  position: relative;
}
.header-title { text-align: center; margin-bottom: 22px; }
.header-title h1 { font-size: 2rem; font-weight: 800; margin-bottom: 6px; color: #fff; }
.header-title p { color: var(--text-soft); font-size: 1rem; }
.profile-section { display: none; align-items: center; gap: 10px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-border); }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; }
.greeting { font-size: 1rem; color: var(--text-soft); }
.greeting span { color: var(--accent-strong); font-weight: 700; }

.section-label { font-size: 1.15rem; color: var(--accent-strong); font-weight: 800; margin: 26px 0 14px; padding-bottom: 6px; border-bottom: 2px solid rgba(0,210,255,0.3); }
.section-label:first-of-type { margin-top: 0; }

.form-group { margin-bottom: 20px; }
.form-group > label { display: block; font-size: 1.1rem; margin-bottom: 10px; color: #ffffff; font-weight: 700; }
.req::after { content: " *"; color: #ff7b7b; }
.hint { font-size: 0.92rem; color: var(--text-soft); margin-top: 8px; line-height: 1.5; }
.echo { font-size: 0.98rem; color: #7dffb0; font-weight: 700; margin-top: 8px; min-height: 1.2em; }

.styled-input, .styled-select {
  width: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25);
  border-radius: 14px; padding: 16px; color: #fff; font-size: 1.2rem; font-weight: 600;
  transition: all 0.2s ease; outline: none; -webkit-appearance: none; appearance: none;
}
.styled-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; }
.styled-input:focus, .styled-select:focus { background: rgba(0,0,0,0.35); border-color: var(--accent-strong); box-shadow: 0 0 0 4px rgba(0,210,255,0.25); }

/* 編號 + 分店 兩格 */
.dual { display: flex; align-items: center; gap: 10px; }
.dual .styled-input { text-align: center; letter-spacing: 2px; }
.dual .dash { font-size: 1.6rem; font-weight: 800; color: var(--text-soft); }
.dual .col { display: flex; flex-direction: column; }
.dual .col.main { flex: 2.2; }
.dual .col.branch { flex: 1; }
.dual .cap { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 4px; text-align: center; }

/* 大按鈕選擇組（性別/方案/付款） */
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-group input { display: none; }
.btn-group label {
  flex: 1; min-width: 90px; text-align: center; margin: 0;
  padding: 16px 10px; border: 2px solid rgba(255,255,255,0.25); border-radius: 14px;
  background: rgba(255,255,255,0.08); color: #fff; font-size: 1.1rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; line-height: 1.3;
}
.btn-group input:checked + label {
  background: var(--accent-strong); color: #062338; border-color: var(--accent-strong); font-weight: 800;
  box-shadow: 0 6px 18px -6px var(--accent);
}
.btn-group.col-2 label { flex: 1 1 calc(50% - 5px); }

/* 商品大按鈕（分檔位） */
.tier-group { margin-bottom: 18px; }
.tier-head { font-size: 1.05rem; font-weight: 800; color: var(--accent-strong); margin: 14px 0 10px; }
.prod-list { display: flex; flex-direction: column; gap: 10px; }
.prod-btn {
  width: 100%; text-align: left; padding: 16px 18px;
  border: 2px solid rgba(255,255,255,0.25); border-radius: 14px;
  background: rgba(255,255,255,0.08); color: #fff; font-size: 1.15rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.prod-btn.selected {
  background: var(--accent-strong); color: #062338; border-color: var(--accent-strong); font-weight: 800;
  box-shadow: 0 6px 18px -6px var(--accent);
}

.point-badge {
  display: none; margin-top: 14px; padding: 14px; border-radius: 12px;
  background: rgba(0,210,255,0.2); border: 2px solid var(--accent-strong);
  color: #eaffff; font-weight: 800; font-size: 1.2rem; text-align: center;
}

.submit-btn {
  width: 100%; padding: 20px; margin-top: 10px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border: none; border-radius: 16px; color: white;
  font-size: 1.3rem; font-weight: 800; cursor: pointer;
  transition: all 0.2s ease; box-shadow: 0 12px 24px -10px var(--accent);
  display: flex; justify-content: center; align-items: center; gap: 10px;
}
.submit-btn:active { transform: translateY(2px); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay { position: absolute; inset: 0; background: var(--glass-bg); border-radius: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
.loading-text { margin-top: 15px; color: var(--accent-strong); font-weight: 700; font-size: 1.05rem; }
.result-box { display: none; border-radius: 14px; padding: 18px; margin-bottom: 20px; font-size: 1.1rem; font-weight: 700; line-height: 1.5; text-align: center; }
.result-box.error { background: rgba(255,80,80,0.2); border: 2px solid rgba(255,80,80,0.6); color: #ffb0b0; }
.result-box.warning { background: rgba(255,190,50,0.2); border: 2px solid rgba(255,190,50,0.6); color: #ffe0a0; }
.hidden { display: none !important; }
.topic-chip{display:inline-block;border:2px solid rgba(255,255,255,0.25);border-radius:999px;
  padding:11px 18px;margin:5px 7px 0 0;cursor:pointer;font-size:1.05rem;font-weight:600;
  user-select:none;background:rgba(255,255,255,0.08);color:#fff;transition:all .2s}
.topic-chip.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#062338;font-weight:800;
  box-shadow:0 6px 18px -6px var(--accent)}
.intent-known{border:2px solid var(--accent-strong);border-radius:14px;padding:14px;
  background:rgba(0,210,255,0.08);color:#fff}
.fold{border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:rgba(255,255,255,.04)}
.fold>summary{cursor:pointer;font-size:1.05rem;font-weight:700;list-style:none;padding:4px 0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;-webkit-tap-highlight-color:transparent}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"▾";opacity:.6;font-size:1.2rem;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(180deg)}
.foldnote{font-size:.85rem;font-weight:500;opacity:.65}

.kcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kcbtn{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:12px;
  padding:14px 0;font-size:1.3rem;font-weight:800;color:#fff;cursor:pointer}
.kcbtn.on{background:var(--accent-strong);color:#08131f;border-color:var(--accent-strong)}
.hist{border:1px solid var(--glass-border);border-radius:14px;padding:12px;margin-top:10px}
.hist div{padding:4px 0;font-size:.98rem;color:var(--text-soft)}
</style>
</head>
<body>
<div class="glass-card">
  <div id="loadingOverlay" style="position:absolute;inset:0;background:rgba(11,18,32,.85);border-radius:22px;display:flex;align-items:center;justify-content:center;z-index:9">載入中…</div>
  <div class="header-title"><h1>關懷紀錄</h1><p>期待會變、體感會變，每次聊完記一筆</p></div>

  <div class="section-label">這張表是誰在填？</div>
  <div class="form-group">
    <div class="btn-group">
      <input type="radio" name="whoFills" id="wProxy" value="proxy" checked><label for="wProxy">我幫別人記</label>
      <input type="radio" name="whoFills" id="wSelf" value="self"><label for="wSelf">我自己填</label>
    </div>
    <div class="hint" id="whoHint">幫夥伴記錄這次聊到的事。他自己填的話，會標記成本人親口說的。</div>
  </div>

  <div class="section-label">A · 對象</div>
  <div class="form-group">
    <label class="req">會員編號（7碼）</label>
    <input type="text" id="mid" class="styled-input" inputmode="numeric" placeholder="2675630" maxlength="7">
    <div class="echo" id="midEcho"></div>
    <div class="hint" id="midHint">分店號不用填。</div>
  </div>
  <div id="histBox"></div>

  <div class="section-label">B · 這次聊了什麼</div>
  <div class="form-group">
    <label>期待（有變才填）</label>
    <div class="btn-group" id="catGroup"></div>
  </div>
  <div class="form-group" id="topicGroup" style="display:none">
    <label>細項（可複選）</label>
    <div id="topics"></div>
  </div>
  <div class="form-group" id="detailGroup" style="display:none">
    <label>他原本怎麼說的</label>
    <input type="text" class="styled-input" id="detail" placeholder="例：晚上睡不好，起來好幾次">
  </div>
  <div class="form-group">
    <label>回饋／體感／這次聊到的事</label>
    <textarea id="note" class="styled-input" rows="3" placeholder="例：吃了兩個月，早上比較好起來；孫子下個月滿月"></textarea>
  </div>

  <div class="section-label">C · KC 抗氧化力（有測才填）</div>
  <div class="form-group">
    <label>剛測到的 KC 值</label>
    <div class="kcgrid" id="kcGrid"></div>
    <div class="hint" id="kcHint">🔴 1–4　🟡 5–7　🟢 8 以上。沒測就不用填。</div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="doSubmit()"><span id="btnText">送出紀錄</span></button>
  <div class="result-box" id="resultBox" style="display:none"></div>
</div>
<script>
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const MY_LIFF_ID="2009692859-2eRA3zlO";
let UID='', LNAME='', BOUND=null, OPTS={}, CAT='', TOPICS=[], KC=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function whoMode(){ return ($('wSelf').checked?'self':'proxy'); }
function show(msg,type){ const b=$('resultBox'); b.className='result-box '+type; b.textContent=msg; b.style.display='block'; b.scrollIntoView({behavior:'smooth',block:'center'}); }
async function rpc(fn,p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p})});
  return r.json().catch(()=>null);
}
document.addEventListener('DOMContentLoaded',init);
async function init(){
  try{
    if(!MY_LIFF_ID.startsWith('PLACEHOLDER')){
      await liff.init({liffId:MY_LIFF_ID});
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const pr=await liff.getProfile(); UID=pr.userId; LNAME=pr.displayName||'';
      BOUND=await rpc('nds_whoami',{line_user_id:UID});
      if(BOUND&&BOUND.bound){ $('wSelf').checked=true; $('mid').value=BOUND.main; onMid(); }
    }
  }catch(e){ console.warn('liff',e); }
  await loadOpts(); buildKc();
  $('mid').addEventListener('input',onMid);
  document.querySelectorAll('input[name="whoFills"]').forEach(r=>r.addEventListener('change',onWho));
  onWho();
  $('loadingOverlay').style.display='none';
}
function onWho(){
  const self=whoMode()==='self';
  $('whoHint').textContent=self?'你自己填的，會標記成本人親口說的（比較可信）。':'幫夥伴記錄這次聊到的事，會標記成轉述。';
  if(self&&BOUND&&BOUND.bound&&!$('mid').value){ $('mid').value=BOUND.main; onMid(); }
}
async function loadOpts(){
  const d=await rpc('nds_intent_options',{}); OPTS=(d&&!d.success===false)?d:{};
  if(d&&d.success===false) OPTS={};
  const g=$('catGroup');
  g.innerHTML='<input type="radio" name="cat" id="cNone" value="" checked><label for="cNone">沒變／不填</label>'
    + Object.keys(OPTS).map((c,i)=>'<input type="radio" name="cat" id="c'+i+'" value="'+esc(c)+'"><label for="c'+i+'">'+esc(c)+'</label>').join('');
  g.querySelectorAll('input[name="cat"]').forEach(r=>r.addEventListener('change',()=>{
    CAT=r.value; TOPICS=[];
    const box=$('topicGroup'), list=$('topics');
    if(!CAT){ box.style.display='none'; $('detailGroup').style.display='none'; return; }
    box.style.display=''; $('detailGroup').style.display='';
    list.innerHTML='<div class="btn-group">'+(OPTS[CAT]||[]).map((t,i)=>
      '<input type="checkbox" id="t'+i+'" value="'+esc(t)+'"><label for="t'+i+'">'+esc(t)+'</label>').join('')+'</div>';
    list.querySelectorAll('input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{
      TOPICS=[...list.querySelectorAll('input:checked')].map(x=>x.value); }));
  }));
}
function buildKc(){
  const g=$('kcGrid'); g.innerHTML='';
  for(let i=1;i<=12;i++){ const b=document.createElement('button');
    b.type='button'; b.className='kcbtn'; b.textContent=i;
    b.onclick=()=>{ KC=(KC===i?0:i); [...g.children].forEach((x,j)=>x.className='kcbtn'+((j+1)===KC?' on':'')); };
    g.appendChild(b); }
}
async function onMid(){
  const v=$('mid').value.trim(); $('midEcho').textContent=''; $('histBox').innerHTML='';
  if(!/^\d{7}$/.test(v)) return;
  const d=await rpc('nds_person_lookup',{member_id:v+'-001'});
  if(d&&d.found){
    $('midEcho').textContent='✅ '+(d.name||'');
    if(d.intent){ $('histBox').innerHTML='<div class="hist"><div><b>上次記錄的期待</b>：'+esc(d.intent.category||'')+
      ((d.intent.topics||[]).length?'（'+d.intent.topics.map(esc).join('、')+'）':'')+
      (d.intent.detail?'<br>「'+esc(d.intent.detail)+'」':'')+'</div><div class="hint">期待有變才填，沒變就留空。</div></div>'; }
  } else { $('midEcho').textContent='查無此編號'; }
}
async function doSubmit(){
  const mid=$('mid').value.trim();
  if(!/^\d{7}$/.test(mid)){ show('請填 7 碼會員編號。','warning'); return; }
  if(!CAT && !$('note').value.trim() && !KC){ show('至少填一項：期待、回饋、或 KC 值。','warning'); return; }
  const btn=$('submitBtn'); btn.disabled=true; $('btnText').textContent='送出中…';
  const d=await rpc('nds_care_submit',{ member_id:mid, by_self:whoMode()==='self',
    line_uid:UID, line_name:LNAME,
    category:CAT||null, topics:TOPICS, detail:$('detail')?$('detail').value.trim():'',
    note:$('note').value.trim(), note_kind:'回饋',
    metric:KC?'KC':null, value:KC?String(KC):null });
  if(!d||d.success!==true){ show((d&&d.message)||'送出失敗','warning'); btn.disabled=false; $('btnText').textContent='送出紀錄'; return; }
  show('✅ '+(d.message||'已記錄'),'success');
  $('btnText').textContent='已記錄';
  setTimeout(()=>{ if(!MY_LIFF_ID.startsWith('PLACEHOLDER')&&liff.isInClient&&liff.isInClient()) liff.closeWindow(); },2500);
}
</script>
</body>
</html>
