<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>定期檢視</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --primary:#8a2be2; --accent:#00d2ff; --accent2:#1ad1ff;
    --ink:#ffffff; --soft:#d8e2f0; --dim:#8fa0bb;
    --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.18);
    --ok:#3ddc97; --gold:#ffc24b;
    --ground:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-size:17px;line-height:1.55;
    font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(120% 55% at 85% -10%,rgba(138,43,226,.35),transparent 60%),
               radial-gradient(90% 45% at 0% 0%,rgba(0,210,255,.18),transparent 55%),var(--ground);
    -webkit-font-smoothing:antialiased}
  .card{max-width:440px;margin:0 auto;padding:22px 16px 40px}
  h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:1px}
  .sub{color:var(--soft);font-size:.92rem;margin:4px 0 0}
  .demo{display:inline-block;margin-top:8px;font-size:.72rem;color:var(--gold);border:1px solid rgba(255,194,75,.4);border-radius:99px;padding:1px 9px}

  .sec{margin-top:26px}
  .lab{display:flex;align-items:baseline;gap:8px;font-size:1.12rem;font-weight:800;color:var(--accent2);
    padding-bottom:7px;margin-bottom:12px;border-bottom:2px solid rgba(0,210,255,.3)}
  .lab .n{font-size:.8rem;color:var(--dim);font-weight:700}
  .lab .r{margin-left:auto;font-size:.78rem;color:var(--dim);font-weight:600}
  .hint{font-size:.86rem;color:var(--dim);margin-top:7px;line-height:1.5}
  .box{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px}
  .box + .box{margin-top:10px}

  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button,.chip{flex:1;min-width:90px;padding:13px 10px;border-radius:13px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:1.02rem;font-weight:700;cursor:pointer}
  .chip{flex:0 0 auto;min-width:0;padding:9px 13px;font-size:.95rem}
  .seg button.on,.chip.on{border-color:var(--accent);background:rgba(0,210,255,.2)}

  input[type=text],input[type=number],textarea,select{width:100%;padding:13px 14px;border-radius:13px;border:2px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:1.02rem}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,.38)}
  select option{color:#000}
  .echo{margin-top:8px;color:var(--ok);font-weight:700}

  /* 關注項目 */
  .item{padding:14px}
  .ihead{display:flex;align-items:center;gap:8px}
  .tag{font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:99px}
  .tag.h{background:rgba(61,220,151,.16);color:var(--ok)}
  .tag.w{background:rgba(255,194,75,.16);color:var(--gold)}
  .iname{font-size:1.15rem;font-weight:800}
  .since{margin-left:auto;font-size:.8rem;color:var(--dim)}
  .quote{margin:6px 0 0;font-size:.9rem;color:var(--soft)}
  .score{display:flex;align-items:flex-end;gap:14px;margin:12px 0 10px}
  .score .col{display:flex;flex-direction:column;align-items:center;line-height:1}
  .score .k{font-size:.8rem;color:var(--dim);font-weight:700;margin-bottom:4px}
  .score .v{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--soft)}
  .score .v small{font-size:.9rem;font-weight:700;margin-left:2px;color:var(--dim)}
  .score .now .v{background:linear-gradient(160deg,#1ad1ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .now.five .v{background:linear-gradient(160deg,#ffd37a,#ff8a5b);-webkit-background-clip:text;background-clip:text}
  .score .arrow{font-size:1.4rem;color:var(--dim);padding-bottom:10px}
  .score .none{font-size:.95rem;color:var(--dim);padding-bottom:8px}
  .energy{position:relative;margin-top:14px;height:22px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);overflow:visible}
  .energy .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .35s ease;
    background:linear-gradient(90deg,#00d2ff,#8a2be2);box-shadow:0 0 14px rgba(0,210,255,.45)}
  .energy .fill.ghost{background:rgba(255,255,255,.18);box-shadow:none}
  .energy .fill.five{background:linear-gradient(90deg,#ffd37a,#ff8a5b);box-shadow:0 0 16px rgba(255,170,90,.55)}
  .energy .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
  .energy .lastmark{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;opacity:.85}
  .energy .lastmark::after{content:"上次";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.66rem;color:var(--dim);white-space:nowrap}
  .elabel{display:flex;justify-content:space-between;margin-top:6px;font-size:.8rem;color:var(--dim)}
  .elabel b{color:var(--soft)}
  .dots{display:flex;gap:8px}
  .dot{flex:1;aspect-ratio:1;max-width:58px;border-radius:50%;border:2px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.05);color:var(--soft);font:inherit;font-size:1.25rem;font-weight:800;cursor:pointer;position:relative;transition:.15s}
  .dot.prev{border-color:rgba(255,255,255,.55);border-style:dashed}
  .dot.fill{background:linear-gradient(145deg,#1ad1ff,#8a2be2);border-color:transparent;color:#fff}
  .dot.fill.five{background:linear-gradient(145deg,#ffd37a,#ff8a5b)}
  .delta{margin-top:8px;font-size:.92rem;font-weight:700;min-height:1.4em}
  .delta.up{color:var(--ok)} .delta.same{color:var(--soft)} .delta.down{color:var(--gold)}
  .follow{margin-top:10px;padding:12px;border-radius:13px;background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.25)}
  .follow p{margin:0 0 9px;font-weight:700}
  .follow .seg button{padding:11px 8px;font-size:.98rem}
  .grp{margin:18px 2px 8px;font-size:.92rem;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:8px}
  .grp:first-child{margin-top:4px}
  .grp::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
  .said{margin-top:12px}
  .said label{display:block;font-size:.86rem;color:var(--soft);font-weight:700;margin-bottom:6px}
  .said input{padding:11px 12px;font-size:.98rem}
  .kcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:4px}
  .kcgrid button{padding:10px 0;border-radius:11px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .kcgrid button.on{border-color:var(--accent);background:rgba(0,210,255,.22)}
  .kcgrid button.prev{border-style:dashed;border-color:rgba(255,255,255,.55)}
  .energy .zone{position:absolute;top:0;bottom:0;opacity:.22}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .stat{padding:13px 12px 12px;border-radius:15px;background:rgba(255,194,75,.06);border:1px solid rgba(255,194,75,.2)}
  .stat.wide{grid-column:1/3;background:linear-gradient(135deg,rgba(255,194,75,.14),rgba(255,138,91,.08));border-color:rgba(255,194,75,.35)}
  .stat .num{font-size:2.1rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:#ffe2a3}
  .stat.wide .num{font-size:2.5rem;background:linear-gradient(160deg,#ffd37a,#ff9a5b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .num small{font-size:.95rem;font-weight:700;margin-left:3px;color:var(--soft);-webkit-text-fill-color:var(--soft)}
  .stat .t{margin-top:4px;font-size:.98rem;font-weight:800;color:#fff}
  .stat .m{margin-top:3px;font-size:.84rem;line-height:1.5;color:var(--soft)}
  .grow{margin-top:10px;padding:11px 13px;border-radius:13px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);
    font-size:.95rem;font-weight:700;color:#bff5dc}
  .grow b{font-size:1.2rem;color:var(--ok)}
  .cheer{margin:12px 2px 0;font-size:.95rem;line-height:1.65;color:var(--soft)}
  .cheer b{color:#fff}
  .iname.eb{background:none;border:0;color:#fff;font:inherit;font-size:1.15rem;font-weight:800;padding:0;cursor:pointer;text-align:left}
  .pen{font-size:.78rem;opacity:.55;margin-left:3px}
  .editbox{margin-top:10px;padding:12px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18)}
  .editbox label{display:block;font-size:.8rem;color:var(--dim);font-weight:700;margin:9px 0 4px}
  .editbox label:first-child{margin-top:0}
  .editbox input{padding:10px 12px;font-size:.98rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .primary.sm{margin-top:12px;padding:11px}
  .hist2{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.15)}
  .hk{font-size:.82rem;color:var(--dim);font-weight:700;margin-bottom:5px}
  .hl{font-size:.93rem;color:var(--soft);line-height:1.55;padding:2px 0}
  .hl .d{display:inline-block;min-width:46px;color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums}
  .hl .orig{font-size:.68rem;color:var(--gold);border:1px solid rgba(255,194,75,.4);border-radius:99px;padding:0 6px;margin-left:5px;vertical-align:1px}
  .more{background:none;border:0;color:var(--accent);font:inherit;font-size:.86rem;padding:4px 0 0;cursor:pointer}
  .go.wide{width:100%;margin-top:8px;padding:11px}
  .ghostbtn{width:100%;margin-top:8px;padding:11px;border-radius:13px;border:2px solid rgba(0,210,255,.5);background:rgba(0,210,255,.06);
    color:var(--accent2);font:inherit;font-weight:800;cursor:pointer}
  .cgrp{font-size:.8rem;color:var(--dim);font-weight:700;margin:10px 0 6px}
  .cgrp:first-child{margin-top:0}
  #addPreview{margin-top:10px}
  .pv{font-size:.86rem;color:var(--soft);padding:3px 0}
  .pv b{color:#fff}
  .elabel .lo,.elabel .hi{max-width:48%;line-height:1.35}
  .elabel .hi{text-align:right;color:var(--soft);font-weight:700}
  .closed{opacity:.55}
  .closed .iname{text-decoration:line-through}

  .addbtn{width:100%;margin-top:10px;padding:14px;border-radius:14px;border:2px dashed rgba(255,255,255,.3);
    background:none;color:var(--soft);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer}
  .addpanel{margin-top:10px}
  .addpanel .row{margin-top:12px}
  .addpanel .row > .sm{font-size:.9rem;color:var(--soft);font-weight:700;margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .inline{display:flex;gap:8px;margin-top:8px}
  .inline input{flex:1}
  .go{padding:0 16px;border-radius:13px;border:0;background:linear-gradient(135deg,#3ddc97,#00d2ff);color:#04241a;font:inherit;font-weight:800;cursor:pointer}
  .primary{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#3ddc97,#00d2ff);
    color:#04241a;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer}

  /* 付出配合 */
  .sub2{font-size:.95rem;font-weight:800;color:var(--soft);margin:0 0 10px}
  .prow{padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}
  .prow:first-of-type{border-top:0}
  .ptop{display:flex;align-items:center;gap:8px}
  .ptop b{flex:1}
  .ptop input{width:64px;padding:8px;text-align:center}
  .x{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,138,138,.45);background:rgba(255,138,138,.08);color:#ff9f9f;font-size:1rem;cursor:pointer}
  .slots{display:flex;gap:6px;margin-top:8px}
  .slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:11px;
    border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);cursor:pointer;user-select:none}
  .slot.on{border-color:var(--accent);background:rgba(0,210,255,.15)}
  .slot small{font-size:.78rem;color:var(--dim)}
  .slot b{font-size:1.05rem}
  .slot .pm{display:flex;gap:4px}
  .slot .pm button{width:24px;height:22px;border:0;border-radius:6px;background:rgba(255,255,255,.14);color:#fff;font-size:.95rem;line-height:1;cursor:pointer}
  .slot:not(.on) .pm{visibility:hidden}
  .pros{padding:10px 0;border-top:1px solid rgba(255,255,255,.1);display:grid;grid-template-columns:1fr 36px;gap:7px}
  .pros:first-of-type{border-top:0}
  .pros select,.pros .memo{grid-column:1/3}

  /* 進度 */
  .kc{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .kc button{padding:11px 0;border-radius:11px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  .kc button.on{border-color:var(--accent);background:rgba(0,210,255,.22)}
  .org{line-height:1.95;font-size:1.03rem}
  .org .big{font-size:1.35rem;font-weight:800}
  .org .dim{color:var(--dim);font-size:.88rem}

  .check{display:flex;align-items:center;gap:12px;padding:15px;border-radius:15px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);cursor:pointer;font-weight:700}
  .check input{width:24px;height:24px;accent-color:#00d2ff;flex:none}
  .submit{width:100%;margin-top:22px;padding:18px;border-radius:16px;border:0;font:inherit;font-size:1.18rem;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#8a2be2,#00d2ff);cursor:pointer;letter-spacing:1px}
  .toast{margin-top:14px;padding:14px;border-radius:14px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);font-size:.94rem;line-height:1.7}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .echo{margin-top:8px;color:var(--ok);font-weight:700;min-height:1.2em}
  .toast.warn{background:rgba(255,190,50,.14);border-color:rgba(255,190,50,.5)}
  .toast.err{background:rgba(255,80,80,.14);border-color:rgba(255,80,80,.5)}
  #loading{position:fixed;inset:0;background:rgba(11,18,32,.9);display:flex;align-items:center;justify-content:center;z-index:9;font-size:1.1rem}
</style>
</head>
<body>
<div id="loading">載入中…</div>
<div class="card">
  <h1>定期檢視</h1>
  <p class="sub">每次談完記一筆，下次接著談</p>

  <!-- 1 誰在填 -->
  <div class="sec">
    <div class="lab"><span class="n">1</span>誰在填</div>
    <div class="seg" id="who">
      <button class="on" data-v="proxy">我幫別人記</button>
      <button data-v="self">我自己填</button>
    </div>
    <div class="hint" id="whoHint"></div>
  </div>

  <!-- 2 對象 -->
  <div class="sec">
    <div class="lab"><span class="n">2</span>對象</div>
    <div id="midWrap">
      <input type="text" id="mid" inputmode="numeric" maxlength="7" placeholder="會員編號 7 碼（分店號不用填）">
    </div>
    <div class="echo" id="echo"></div>
  </div>

  <div id="main" hidden>
  <!-- 3 關注項目 -->
  <div class="sec">
    <div class="lab"><span class="n">3</span>關注項目<span class="r">1~5 分</span></div>
    <div id="items"></div>
    <button class="addbtn" id="addToggle">＋ 新增關注項目</button>
    <div class="box addpanel" id="addPanel" hidden>
      <div class="row">
        <div class="sm">哪一類</div>
        <div class="seg" id="addCat">
          <button data-v="健康">🩺 健康</button>
          <button data-v="財富">💰 財富</button>
        </div>
      </div>
      <div class="row" id="addTopicRow" hidden>
        <div class="sm">要關注哪些（可複選）</div>
        <div id="addTopics"></div>
        <div id="addPreview"></div>
      </div>
      <div class="row" id="addCustomRow" hidden>
        <div class="sm">不在上面？自己加</div>
        <input type="text" id="addCustom">
        <input type="text" id="addCustomHi" style="margin-top:8px">
        <div class="hint" style="margin-top:6px">5 分的樣子可以不填。</div>
        <button class="ghostbtn" id="addCustomBtn">＋ 加進上面的選項</button>
      </div>
      <button class="primary" id="addConfirm" hidden>加入關注項目</button>
    </div>
  </div>

  <!-- 4 付出配合 -->
  <div class="sec">
    <div class="lab"><span class="n">4</span>付出配合</div>
    <div class="box">
      <p class="sub2">🩺 一天吃幾份</p>
      <div class="chips" id="combos"></div>
      <div id="plan" style="margin-top:8px"></div>
      <select id="planAdd" style="margin-top:10px"></select>
      <div class="hint" id="planHint"></div>
    </div>
    <div class="box">
      <p class="sub2">💰 這個月想到誰</p>
      <div id="pros"></div>
      <button class="addbtn" id="prosAdd" style="margin-top:6px">＋ 再加一個</button>
    </div>
  </div>

  <!-- 5 希望更好的建議 -->
  <div class="sec">
    <div class="lab"><span class="n">5</span>希望更好的建議</div>
    <textarea id="suggest" rows="3" placeholder="例：希望每週有人提醒一次；想知道出門時怎麼帶比較方便"></textarea>
  </div>

  <div class="sec" id="saidSec">
    <label class="check"><input type="checkbox" id="said"> 以上是他本人當場說的</label>
    <div class="hint">不勾＝你轉述的。下次回訪時語氣會不一樣。</div>
  </div>

  <button class="submit" id="submit">送出紀錄</button>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const MY_LIFF_ID="2009692859-2eRA3zlO";
const SLOTS=['早','中','晚','睡'];
const ST=['還沒開口','講過了在考慮','說不要','入會了'];
const SAID_PH={'健康':'例：最近半夜只起來一次，早上比較有精神','財富':'例：有跟女兒提了，她說再想想'};
const CUSTOM_PH={'健康':['標題，例：右手握力','5 分的樣子，例：握緊筷子'],'財富':['標題，例：換新家具','5 分的樣子，例：客廳整套換新']};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>d?String(d).slice(5).replace('-','/'):'';
let UID='', LNAME='', BOUND=null, LOAD=null, PRESETS={}, PRODUCTS=[], COMBOS={};
let items=[], kc={last:null,lastOn:'',now:null}, ORG=null, plan={}, planDirty=false, pros=[];

async function rpc(fn,p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify(p===undefined?{}:{p})});
  return r.json().catch(()=>null);
}
function toast(msg,cls){ const t=$('toast'); t.className='toast '+(cls||''); t.innerHTML=msg; t.hidden=false; t.scrollIntoView({behavior:'smooth',block:'center'}); }
const whoMode=()=>$('who').querySelector('.on').dataset.v;

document.addEventListener('DOMContentLoaded',init);
async function init(){
  try{
    if(!MY_LIFF_ID.startsWith('PLACEHOLDER')){
      await liff.init({liffId:MY_LIFF_ID});
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const pr=await liff.getProfile(); UID=pr.userId; LNAME=pr.displayName||'';
      BOUND=await rpc('nds_whoami',{line_uid:UID});
      if(BOUND&&BOUND.bound){ setWho('self'); }
    }
  }catch(e){ console.warn('liff',e); }
  $('who').querySelectorAll('button').forEach(b=>b.onclick=()=>setWho(b.dataset.v));

  $('addToggle').onclick=()=>{ $('addPanel').hidden=!$('addPanel').hidden; };
  $('addCat').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    addCat=b.dataset.v; addSel=new Map();

    $('addTopicRow').hidden=$('addCustomRow').hidden=$('addConfirm').hidden=false;
    $('addCustom').placeholder=CUSTOM_PH[addCat][0]; $('addCustomHi').placeholder=CUSTOM_PH[addCat][1];
    renderAddTopics();
  });
  $('addCustomBtn').onclick=()=>{ const n=$('addCustom').value.trim(); if(!n) return; const hi=$('addCustomHi').value.trim();
    addSel.set(n,['還很遠',hi||'達成了']); $('addCustom').value=''; $('addCustomHi').value=''; renderAddTopics(); };
  $('addConfirm').onclick=()=>{
    if(!addSel.size) return;
    addSel.forEach((v,n)=>items.push({id:null,cat:addCat,name:n,lo:v[0],hi:v[1],since:null,last:null,now:null,said:[],draft:'',ans:null,closed:false,edit:false,more:false,edited:false}));
    addCat=''; addSel=new Map();
    $('addCat').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    $('addTopicRow').hidden=$('addCustomRow').hidden=$('addConfirm').hidden=true; $('addPanel').hidden=true;

  };

  $('submit').onclick=doSubmit;

}
function setWho(v){
  $('who').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));

  $('midWrap').hidden=self; $('saidSec').hidden=self;

    else { $('mid').value=''; $('echo').textContent='你的 LINE 還沒綁定會員編號。請先到「新入會登錄」按「這就是我，綁定我的 LINE」，或改選「我幫別人記」。'; $('main').hidden=true; }

async function onMid(){
  const v=$('mid').value.trim(); $('echo').textContent=''; $('main').hidden=true;
  if(!/^\d{7}$/.test(v)) return;
  const d=await rpc('nds_care_load',{main:v});
  if(!d||!d.found){ $('echo').textContent='查無此編號'; return; }
  LOAD=d; const o=d.options||{};
  PRESETS=o.focus||{}; PRODUCTS=(o.products||[]).map(p=>[p.code,p.name,p.unit]); COMBOS=o.combos||{};
  $('echo').textContent='✅ '+(d.name||'')+(d.last_visit?'　上次 '+fmtD(d.last_visit):'　第一次談');
  items=(d.focus||[]).map(f=>({id:f.id,cat:f.cat,name:f.name,lo:f.lo||'還很遠',hi:f.hi||'達成了',since:f.opened_on,last:f.last_score,now:null,
    said:(f.said||[]).map(x=>({on:x.on,t:x.t})),draft:'',ans:null,closed:false,edit:false,more:false,edited:false}));
  kc={last:d.kc?d.kc.value:null,lastOn:d.kc?d.kc.on:'',now:null};
  ORG=d.org?{direct:d.org.direct_cnt,sponsor:d.org.sponsor_cnt,L:d.org.left_units,R:d.org.right_units,asof:d.org.as_of,
             prevSponsor:d.org_prev?d.org_prev.sponsor_cnt:null,prevOn:d.org_prev?d.org_prev.as_of:null}:null;
  plan={}; (d.plan||[]).forEach(x=>{ plan[x.product_code]={...(x.slot_qty||{})}; }); planDirty=false;
  pros=(d.prospects||[]).map(x=>({id:x.id,name:x.name,status:x.status,memo:x.memo||'',dirty:false}));
  renderItems(); renderCombos(); renderPlan(); renderPros();
  $('planHint').textContent=(d.plan||[]).length?'現行計畫（'+fmtD(d.plan[0].effective_from)+' 設）。有改才會寫入。':'還沒有服用計畫——按上面的組合帶入，或一樣一樣加。';
  $('main').hidden=false;
}

const pinfo=c=>PRODUCTS.find(p=>p[0]===c)||[c,c,''];
function split(total,on){ const o={}; if(!on.length) return o; const b=Math.floor(total/on.length); let r=total-b*on.length; on.forEach(s=>{o[s]=b+(r>0?1:0); if(r>0)r--;}); return o; }
function renderCombos(){
  const pref=['基本','＋腸胃加強','＋美容加強'];
  const names=Object.keys(COMBOS).sort((a,b)=>(pref.indexOf(a)+1||99)-(pref.indexOf(b)+1||99));
  $('combos').innerHTML=names.map(k=>`<button type="button" class="chip">${esc(k)}</button>`).join('');
  [...$('combos').children].forEach((b,i)=>b.onclick=()=>{ Object.entries(COMBOS[names[i]]).forEach(([c,s])=>plan[c]={...s}); b.classList.add('on'); planDirty=true; renderPlan(); });
}
function renderPlan(){
  const box=$('plan'); box.innerHTML='';
  PRODUCTS.map(p=>p[0]).filter(c=>plan[c]).forEach(c=>{
    const s=plan[c], [,name,unit]=pinfo(c), total=Object.values(s).reduce((a,b)=>a+(+b||0),0), on=SLOTS.filter(x=>s[x]!=null);
    const d=document.createElement('div'); d.className='prow';
    d.innerHTML=`<div class="ptop"><b>${esc(name)}</b>一天 <input type="number" inputmode="numeric" value="${total}"> ${esc(unit)}<button type="button" class="x" aria-label="移除">✕</button></div>
      <div class="slots">${SLOTS.map(x=>`<div class="slot ${s[x]!=null?'on':''}" data-s="${x}"><small>${x}</small><b>${s[x]!=null?s[x]:'–'}</b><span class="pm"><button type="button" data-d="-1">−</button><button type="button" data-d="1">＋</button></span></div>`).join('')}</div>`;
    d.querySelector('input').onchange=e=>{ plan[c]=split(Math.max(0,+e.target.value||0),on.length?on:['早']); planDirty=true; renderPlan(); };
    d.querySelector('.x').onclick=()=>{ delete plan[c]; planDirty=true; renderPlan(); };
    d.querySelectorAll('.slot').forEach(el=>{
      const x=el.dataset.s;
      el.onclick=e=>{ if(e.target.dataset.d) return; const cur=SLOTS.filter(y=>s[y]!=null); const nx=s[x]!=null?cur.filter(y=>y!==x):[...cur,x].sort((a,b)=>SLOTS.indexOf(a)-SLOTS.indexOf(b)); plan[c]=split(total,nx); planDirty=true; renderPlan(); };
      el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ s[x]=Math.max(0,(+s[x]||0)+(+b.dataset.d)); planDirty=true; renderPlan(); });
    });
    box.appendChild(d);
  });
  const left=PRODUCTS.filter(p=>!plan[p[0]]);
  $('planAdd').innerHTML='<option value="">＋ 加一樣商品</option>'+left.map(p=>`<option value="${esc(p[0])}">${esc(p[1])}</option>`).join('');
  $('planAdd').hidden=!left.length;
}

  const focus_add=items.filter(i=>!i.id).map(i=>({cat:i.cat,name:i.name,lo:i.lo,hi:i.hi}));
  const focus_edit=items.filter(i=>i.id&&i.edited).map(i=>({id:i.id,name:i.name,lo:i.lo,hi:i.hi}));
  const focus_log=items.filter(i=>i.now!=null||i.draft.trim()||i.ans).map(i=>({id:i.id,name:i.name,score:i.now,said:i.draft.trim()||null,answer:i.ans}));
  const planOut=planDirty?Object.entries(plan).map(([c,s])=>({product_code:c,daily_qty:Object.values(s).reduce((a,b)=>a+(+b||0),0),slot_qty:s})).filter(x=>x.daily_qty>0):[];
  const prospects=pros.filter(r=>r.name.trim()&&(r.dirty||!r.id)).map(r=>({id:r.id,name:r.name.trim(),status:r.status,memo:r.memo.trim()}));
  const suggestion=$('suggest').value.trim();
  if(!focus_add.length&&!focus_edit.length&&!focus_log.length&&!planOut.length&&!prospects.length&&!suggestion&&!kc.now){ toast('至少填一項。','warn'); return; }
  const btn=$('submit'); btn.disabled=true; btn.textContent='送出中…';
  const d=await rpc('nds_care_submit',{ member_id:mid, by_self:whoMode()==='self', said_by_self:whoMode()==='self'||$('said').checked,
    line_uid:UID, line_name:LNAME,
    focus_add, focus_edit, focus_log, plan:planOut, prospects, suggestion:suggestion||null,
    metric:kc.now?'KC':null, value:kc.now?String(kc.now):null });
  if(!d||d.success!==true){ toast((d&&d.message)||'送出失敗','err'); btn.disabled=false; btn.textContent='送出紀錄'; return; }
  toast('✅ '+(d.message||'已記錄'));
  btn.textContent='已記錄';
  setTimeout(()=>{ if(!MY_LIFF_ID.startsWith('PLACEHOLDER')&&liff.isInClient&&liff.isInClient()) liff.closeWindow(); },2500);
}
</script>
