<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFC 戰情台｜2675630</title>
<style>
:root{--bg:#101418;--card:#1a2027;--line:#2a3340;--tx:#e8ecf1;--mut:#8b96a5;--acc:#4f8cff;--ok:#37c978;--warn:#ffb020;--bad:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.inp{background:#0d1116;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 12px;font-size:15px}
.btn{background:var(--acc);border:0;border-radius:8px;color:#fff;padding:9px 16px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px;border:1px solid var(--line);cursor:pointer;color:var(--mut)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px}
.p-待處理{background:#3a2f18;color:var(--warn)}.p-已聯絡{background:#16324a;color:var(--acc)}
.p-完成{background:#173627;color:var(--ok)}.p-失聯{background:#3a1d1d;color:var(--bad)}.p-取消{background:#262c33;color:var(--mut)}
.msg{color:var(--warn);min-height:20px;margin:6px 0}
select.inp{padding:8px}
.hidden{display:none}
.mut{color:var(--mut)}
@media(max-width:640px){.wrap{padding:8px}td,th{padding:6px}}
</style></head><body><div class="wrap">
<h1>🎯 CFC 戰情台 <span style="color:#8b96a5;font-size:14px;font-weight:400">2675630 組織</span></h1>

<div id="login" class="card">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <input id="u" class="inp" placeholder="帳號">
    <input id="pw" class="inp" type="password" placeholder="密碼">
    <button class="btn" onclick="login()">登入</button>
  </div>
  <div class="msg" id="lmsg"></div>
</div>

<div id="app" class="hidden">
<div class="tabs">
  <div class="tab on" data-v="ov" onclick="sw(this)">📊 總覽</div>
  <div class="tab" data-v="tasks" onclick="sw(this)">📋 任務板</div>
  <div class="tab" data-v="assign" onclick="sw(this)">➕ 派工</div>
  <div class="tab" data-v="bind" onclick="sw(this)">👥 綁定審核</div>
</div>

<div id="v-ov">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <b style="font-size:17px">🎯 CFC 目標：左右各 12 個成就達成者</b>
      <span class="mut" id="ovAsof"></span>
    </div>
    <div class="mut" style="margin-top:4px">最近成就結果：<b style="color:var(--warn)">5-6月期 左2／右0</b>（公司頁人工紀錄）｜9/1 起由 fc_status 採集自動更新｜階梯目標：<b>9-10月先拿一星（左1＋右1）</b></div>
  </div>
  <div class="card"><b>左右線體質</b><div style="overflow-x:auto;margin-top:8px"><table>
    <thead><tr><th>線</th><th>活位置</th><th>7月買</th><th>8月買</th><th>9月買</th><th>三月未買</th><th>⏳倒數</th><th>方案有效</th><th>直推≥2(人)</th><th>自動扣款(人)</th></tr></thead>
    <tbody id="ovLeg"></tbody></table></div>
    <div class="mut" id="ovLegNote" style="margin-top:6px"></div></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>💡 建議任務</b>
      <button class="btn sm" onclick="autoAssign()">⚡ 一鍵建立（倒數全部＋30天內續約，自動歸戶）</button>
    </div>
    <div class="msg" id="ovMsg"></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">
      <div style="flex:1;min-width:280px"><b class="mut">🚨 倒數最急</b><div style="overflow-x:auto"><table>
        <thead><tr><th>對象</th><th>線</th><th>剩</th><th>建議負責</th></tr></thead><tbody id="ovCd"></tbody></table></div></div>
      <div style="flex:1;min-width:280px"><b class="mut">📄 30天內方案到期</b><div style="overflow-x:auto"><table>
        <thead><tr><th>對象</th><th>線</th><th>方案</th><th>到期</th></tr></thead><tbody id="ovRn"></tbody></table></div></div>
    </div></div>
  <div class="card"><b>👥 領袖出勤</b><div style="overflow-x:auto;margin-top:8px"><table>
    <thead><tr><th>領袖</th><th>層級</th><th>未結案任務</th><th>已完成</th></tr></thead>
    <tbody id="ovLd"></tbody></table></div>
    <div class="mut" id="ovTk" style="margin-top:6px"></div></div>
</div>
<div id="v-tasks" class="card hidden">
  <div style="margin-bottom:10px">
    <select id="fstat" class="inp" onchange="loadTasks()">
      <option value="">全部狀態</option><option>待處理</option><option>已聯絡</option>
      <option>完成</option><option>失聯</option><option>取消</option>
    </select>
    <button class="btn ghost sm" onclick="loadTasks()">重新整理</button>
  </div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th>型別</th><th>對象</th><th>說明</th><th>負責</th><th>期限</th><th>狀態</th><th>回報</th><th></th>
  </tr></thead><tbody id="tbody"></tbody></table></div>
</div>

<div id="v-assign" class="card hidden">
  <div style="margin-bottom:10px">
    <select id="ctype" class="inp"><option>倒數救援</option><option>回訪</option><option>續約</option></select>
    <button class="btn" onclick="loadCand()">載入候選名單</button>
    <span class="mut" id="ccount"></span>
  </div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th><input type="checkbox" onchange="document.querySelectorAll('.ck').forEach(c=>c.checked=this.checked)"></th>
    <th>對象</th><th>線</th><th>說明</th><th>期限</th><th>指派給</th>
  </tr></thead><tbody id="cbody"></tbody></table></div>
  <div style="margin-top:12px"><button class="btn" onclick="createTasks()">建立勾選的任務</button>
  <span class="msg" id="amsg"></span></div>
</div>

<div id="v-bind" class="card hidden">
  <button class="btn ghost sm" onclick="loadBind()">重新整理</button>
  <div style="overflow-x:auto"><table><thead><tr>
    <th>LINE 名稱</th><th>申請綁定</th><th>層級</th><th>申請時間</th><th>狀態</th><th></th>
  </tr></thead><tbody id="bbody"></tbody></table></div>
</div>
</div>

<div id="mcard" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;overflow:auto;padding:16px">
 <div style="max-width:820px;margin:0 auto;background:var(--card,#161b22);border:1px solid #30363d;border-radius:12px;padding:18px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div id="mcHead"></div>
    <button class="btn sm" onclick="closeCard()">✕ 關閉</button>
  </div>
  <div id="mcBody" style="margin-top:12px"></div>
 </div>
</div>

<script>
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
let CRED={}, LEADERS=[
 {id:'2758220-001',n:'張麗玲'},{id:'2758221-001',n:'張憶文'},{id:'2758843-001',n:'熊愛茶'},
 {id:'2778705-001',n:'李晉豪'},{id:'2846880-001',n:'陳莉莉'},{id:'2854552-001',n:'黃莉芳'},
 {id:'2893275-001',n:'李尚謙'},{id:'2787664-001',n:'黎玉嬌'}];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function api(p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_hq',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...CRED,...p}})});
  return r.json();
}
async function login(){
  CRED={username:document.getElementById('u').value.trim(),password:document.getElementById('pw').value};
  const d=await api({action:'list_tasks'});
  if(!d.success){document.getElementById('lmsg').textContent=d.message||'登入失敗';return;}
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderTasks(d.rows); loadOv();
}
function sw(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  ['ov','tasks','assign','bind'].forEach(v=>document.getElementById('v-'+v).classList.toggle('hidden',v!==el.dataset.v));
  if(el.dataset.v==='ov')loadOv(); if(el.dataset.v==='tasks')loadTasks(); if(el.dataset.v==='bind')loadBind();
}
async function loadTasks(){
  const d=await api({action:'list_tasks',status:document.getElementById('fstat').value});
  if(d.success)renderTasks(d.rows);
}
function renderTasks(rows){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(r.task_type)}</td><td><a href="javascript:openCard('${esc(r.target_member_id)}')" style="color:#58a6ff;font-weight:600">${esc(r.target_name||'')}</a><br><span class="mut">${esc(r.target_member_id)}</span></td>
    <td>${esc(r.detail||'')}</td><td>${esc(r.assignee_name||'—')}</td><td>${esc(r.due_date||'')}</td>
    <td><span class="pill p-${esc(r.status)}">${esc(r.status)}</span></td>
    <td>${esc(r.result_note||'')}</td>
    <td><button class="btn ghost sm" onclick="editTask(${r.id},'${esc(r.status)}')">改</button></td>`;
    tb.appendChild(tr);
  });
}
async function editTask(id,cur){
  const s=prompt('新狀態（待處理/已聯絡/完成/失聯/取消）',cur);if(!s)return;
  const note=prompt('備註（可空）','');
  const d=await api({action:'update_task',id:String(id),status:s,result_note:note||''});
  if(d.success)loadTasks();else alert(d.message||'失敗');
}
async function loadCand(){
  const d=await api({action:'candidates',type:document.getElementById('ctype').value});
  const tb=document.getElementById('cbody');tb.innerHTML='';
  if(!d.success){alert(d.message);return;}
  document.getElementById('ccount').textContent=' 共 '+d.rows.length+' 筆（已排除有未結案任務者）';
  d.rows.forEach((r,i)=>{
    const opts=LEADERS.map(l=>`<option value="${l.id}" ${l.id===r.suggest?'selected':''}>${l.n}${l.id===r.suggest?'（建議）':''}</option>`).join('')
      +`<option value="" ${!r.suggest?'selected':''}>游育杰自理</option>`;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><input type="checkbox" class="ck" data-i="${i}" checked></td>
    <td>${esc(r.name)}<br><span class="mut">${esc(r.member_id)}</span></td><td>${esc(r.leg||'')}</td>
    <td>${esc(r.detail)}</td><td>${esc(r.due_date||'')}</td>
    <td><select class="inp asg" data-i="${i}">${opts}</select></td>`;
    tb.appendChild(tr);
  });
  window.__cand=d.rows;
}
async function createTasks(){
  const type=document.getElementById('ctype').value, tasks=[];
  document.querySelectorAll('.ck:checked').forEach(c=>{
    const i=+c.dataset.i, r=window.__cand[i];
    const asg=document.querySelector('.asg[data-i="'+i+'"]').value;
    tasks.push({task_type:type,target_member_id:r.member_id,target_name:r.name,
      detail:r.detail,assignee_member_id:asg,due_date:r.due_date||''});
  });
  if(!tasks.length){alert('沒有勾選');return;}
  const d=await api({action:'create_tasks',tasks});
  document.getElementById('amsg').textContent=d.success?('已建立 '+d.created+' 件任務'):(d.message||'失敗');
  if(d.success)loadCand();
}
async function loadBind(){
  const d=await api({action:'bindings'});
  const tb=document.getElementById('bbody');tb.innerHTML='';
  if(!d.success)return;
  d.rows.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(r.display_name||'')}</td><td>${esc(r.leader_name)}<br><span class="mut">${esc(r.member_id)}</span></td>
    <td>${esc(r.tier)}</td><td>${esc((r.applied_at||'').slice(0,16).replace('T',' '))}</td>
    <td>${esc(r.status)}</td>
    <td>${r.status==='pending'?`<button class="btn sm" onclick="setBind('${esc(r.line_user_id)}','approved')">核准</button>
    <button class="btn ghost sm" onclick="setBind('${esc(r.line_user_id)}','rejected')">拒絕</button>`:''}</td>`;
    tb.appendChild(tr);
  });
}
async function setBind(uid,st){
  const d=await api({action:'binding_set',line_user_id:uid,status:st});
  if(d.success)loadBind();else alert(d.message||'失敗');
}

async function api2(p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_hq_stats',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...CRED,...p}})});
  return r.json();
}
async function loadOv(){
  const d=await api2({action:'overview'});
  if(!d.success)return;
  document.getElementById('ovAsof').textContent='資料日 '+(d.as_of||'');
  const fp={}; (d.first_principle||[]).forEach(x=>fp[x.leg]=x);
  const tb=document.getElementById('ovLeg');tb.innerHTML='';
  (d.byleg||[]).forEach(x=>{
    const f=fp[x.leg]||{};
    tb.innerHTML+=`<tr><td><b>${esc(x.leg)}</b></td><td>${x.active}</td><td>${x.m7}</td><td>${x.m8}</td><td>${x.m9}</td>
    <td style="color:var(--warn)">${x.no3m}</td><td style="color:var(--bad,#ff5d5d)">${x.countdown}</td>
    <td>${x.plan_active}</td><td>${f.sponsor2??'—'}</td><td>${f.autopay??'—'}</td></tr>`;
  });
  document.getElementById('ovLegNote').textContent='第一性原理：①循環購買 ②直推2（有效）。右線兩項皆遠低於左線＝CFC 瓶頸。';
  const cd=document.getElementById('ovCd');cd.innerHTML='';
  (d.countdown_top||[]).forEach(x=>{cd.innerHTML+=`<tr><td><a href="javascript:openCard('${esc(x.member_id)}')" style="color:#58a6ff;font-weight:600">${esc(x.name)}</a><br><span class="mut">${esc(x.member_id)}</span></td>
    <td>${esc(x.leg)}</td><td style="color:var(--bad,#ff5d5d);font-weight:700">${esc(x.auto_cancel_days)}</td><td>${esc(x.route)}</td></tr>`;});
  const rn=document.getElementById('ovRn');rn.innerHTML='';
  (d.renewal30||[]).forEach(x=>{rn.innerHTML+=`<tr><td><a href="javascript:openCard('${esc(x.member_id)}')" style="color:#58a6ff;font-weight:600">${esc(x.name)}</a><br><span class="mut">${esc(x.member_id)}</span></td>
    <td>${esc(x.leg)}</td><td>${esc(x.plan_code||'')}</td><td>${esc(x.until)}</td></tr>`;});
  const ld=document.getElementById('ovLd');ld.innerHTML='';
  (d.leaders||[]).forEach(x=>{ld.innerHTML+=`<tr><td>${esc(x.name)}</td><td>${esc(x.tier)}</td>
    <td>${x.open_tasks}</td><td>${x.done}</td></tr>`;});
  const tk=d.tasks||{};
  document.getElementById('ovTk').textContent='任務統計：'+(Object.keys(tk).length?
    Object.entries(tk).map(([k,v])=>k+' '+v).join('｜'):'尚未建立任務——按上方「⚡ 一鍵建立」開始');
}
async function autoAssign(){
  if(!confirm('將建立：全部倒數救援＋30天內續約任務，並自動歸戶給領袖。確定？'))return;
  const d=await api2({action:'auto_assign'});
  document.getElementById('ovMsg').textContent=d.success?
    ('✅ 已建立 倒數救援 '+d.countdown_created+' 件、續約 '+d.renewal_created+' 件'):(d.message||'失敗');
  if(d.success)loadOv();
}


function openCard(id){
  document.getElementById('mcard').classList.remove('hidden');
  document.getElementById('mcHead').innerHTML='<b>載入中…</b>';
  document.getElementById('mcBody').innerHTML='';
  fetch(SUPABASE_URL+'/rest/v1/rpc/nds_member_card',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...CRED,member_id:id}})}).then(r=>r.json()).then(renderCard);
}
function closeCard(){document.getElementById('mcard').classList.add('hidden');}
function pm(n){return {0:'❌已解約',1:'自動扣款',2:'匯款',3:'預購一次付',4:'信用卡'}[n]||('代碼'+n);}
function renderCard(d){
  if(!d.success){document.getElementById('mcHead').innerHTML='<b>'+esc(d.message||'讀取失敗')+'</b>';return;}
  const b=d.base, isBC=b.sponsor_member_id&&b.sponsor_member_id.split('-')[0]===b.member_id.split('-')[0];
  const dead=b.payment_method===0;
  document.getElementById('mcHead').innerHTML=
    `<div style="font-size:20px;font-weight:700">${esc(b.name)} ${dead?'<span style="color:#ff5d5d;font-size:13px">已解約</span>':''}</div>
     <div class="mut">${esc(b.member_id)}｜<b>${esc(b.leg||'?')}線</b>｜入會 ${esc(b.registered_at)}（${b.tenure_months} 個月）
     ｜歸戶 <b>${esc(b.route_leader)}</b></div>`;
  // 消費三月燈號
  const dot=v=>v==='1'?'<span style="color:#3fb950">●</span>':'<span style="color:#484f58">○</span>';
  const cd=b.auto_cancel_days?`<div style="background:#3d1418;border:1px solid #ff5d5d;border-radius:8px;padding:8px;margin-bottom:10px">
     🚨 <b style="color:#ff5d5d">自動解約倒數 ${esc(b.auto_cancel_days)}</b>　歸零後位置永久消失、編號不可回收</div>`:'';
  // 子樹
  let tree='<div class="mut">此位置底下無安置人員（末端位置）</div>';
  if((d.tree||[]).length){
    tree='<table><thead><tr><th>子樹</th><th>總位置</th><th>未解約</th><th>本月有效</th><th>9月有買</th></tr></thead><tbody>'+
      d.tree.map(t=>`<tr><td><b>${esc(t.side||'?')}</b></td><td>${t.total}</td><td>${t.active}</td><td>${t.valid}</td><td>${t.bought_m9}</td></tr>`).join('')+
      '</tbody></table>';
  }
  // 直推
  let dir='<div class="mut">尚無直接推薦</div>';
  if((d.directs||[]).length){
    dir=d.directs.map(x=>`<span class="pill" onclick="openCard('${esc(x.member_id)}')" style="cursor:pointer;display:inline-block;border:1px solid #30363d;border-radius:14px;padding:3px 10px;margin:3px 4px 0 0">
      ${x.cancelled?'❌':(x.is_valid?'✅':'⚠️')} ${esc(x.name)}</span>`).join('');
  }
  // 同主編號
  let hs='<div class="mut">此人只有這一個位置</div>';
  if((d.household||[]).length){
    hs='<table><thead><tr><th>分號</th><th>狀態</th><th>方案</th><th>9月</th><th>倒數</th></tr></thead><tbody>'+
      d.household.map(h=>`<tr><td><a href="javascript:openCard('${esc(h.member_id)}')" style="color:#58a6ff">${esc(h.member_id)}</a></td>
      <td>${h.cancelled?'<span style="color:#ff5d5d">已解約</span>':(h.is_valid?'✅有效':'⚠️未達')}</td>
      <td>${esc(h.plan_code||'—')}</td><td>${dot(h.m9)}</td>
      <td>${h.auto_cancel_days?'<span style="color:#ff5d5d">'+esc(h.auto_cancel_days)+'</span>':'—'}</td></tr>`).join('')+
      '</tbody></table>';
  }
  document.getElementById('mcBody').innerHTML = cd + `
   <div style="display:flex;gap:14px;flex-wrap:wrap">
     <div style="flex:1;min-width:250px">
       <b>💳 方案與消費</b>
       <table><tbody>
