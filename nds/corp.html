<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDS 會員管理</title>
<style>
:root{--primary:#8a2be2;--accent:#00d2ff;--bg:#0b1220;--card:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.14);--muted:#9fb0c8;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;}
body{background:var(--bg);color:#fff;min-height:100vh;}
.inp{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:#fff;font-size:1rem;outline:none;width:100%;}
.inp:focus{border-color:var(--accent);}
select.inp{cursor:pointer;}
.btn{background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:10px;padding:11px 18px;color:#fff;font-weight:700;cursor:pointer;font-size:.95rem;}
.btn:active{transform:translateY(1px);}
.btn.sm{padding:6px 12px;font-size:.85rem;}
.btn.ghost{background:rgba(255,255,255,0.12);}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;}
#login h1{font-size:1.7rem;}
#login .inp{width:260px;}
#app{display:none;padding:18px;max-width:1240px;margin:0 auto;}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.topbar h1{font-size:1.3rem;margin-right:auto;}
.topbar .inp{width:auto;}
.lbl{font-size:.78rem;color:var(--muted);margin-left:4px;}
.count{color:var(--muted);font-size:.9rem;}
.tablewrap{overflow:auto;max-height:74vh;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;background:var(--card);}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem;white-space:nowrap;}
th{background:#16203250;color:var(--accent);font-weight:700;position:sticky;top:0;}
.grouprow td{background:rgba(138,43,226,.14);font-weight:700;cursor:pointer;font-size:.95rem;}
.grouprow:hover td{background:rgba(138,43,226,.22);}
.child td{background:rgba(255,255,255,0.02);}
.child.hidden{display:none;}
.tag{padding:2px 8px;border-radius:6px;font-size:.78rem;}
.tag.active{background:rgba(0,200,100,.2);color:#7dffb0;}
.tag.terminated{background:rgba(255,80,80,.2);color:#ffb0b0;}
.stage{padding:2px 7px;border-radius:6px;font-size:.78rem;background:rgba(138,43,226,.25);color:#d7b3ff;}
.stage.s2{background:rgba(0,210,255,.2);color:#9fe9ff;}
.stage.s0{background:rgba(255,255,255,.1);color:var(--muted);}
.miss{color:#ff9b9b;}
.cd{font-weight:700;font-size:.85rem;}
.cd.warn{color:#ffd070;}
.cd.over{color:#ff8080;}
.cd.ok{color:#7dffb0;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50;}
.modal-card{background:#121a2b;border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:600px;}
.modal-card h2{margin-bottom:6px;font-size:1.15rem;}
.msub{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
.sec{font-size:.82rem;color:var(--accent);font-weight:700;margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tierbadge{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:8px;background:rgba(0,210,255,.18);border:1px solid var(--accent);color:#eaffff;font-weight:700;font-size:.9rem;}
.hidden{display:none!important;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.9rem;display:none;}
.msg.err{background:rgba(255,80,80,.15);border:1px solid rgba(255,80,80,.4);color:#ffb0b0;}
.msg.ok{background:rgba(0,200,100,.15);border:1px solid rgba(0,200,100,.4);color:#7dffb0;}
</style>
</head>
<body>
<div id="login">
  <h1>🔐 NDS 會員管理</h1>
  <input type="text" id="operator" class="inp" placeholder="你的姓名（用於紀錄更新者）" onkeydown="if(event.key==='Enter')login()">
  <input type="password" id="pw" class="inp" placeholder="請輸入管理密碼" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">登入</button>
  <div class="msg err" id="loginErr"></div>
</div>

<div id="app">
  <div class="topbar">
    <h1>會員管理</h1>
    <input type="text" id="search" class="inp" placeholder="搜尋 編號/姓名" onkeydown="if(event.key==='Enter')loadData()">
    <select id="filter" class="inp" onchange="loadData()" title="資料篩選">
      <option value="all">全部</option>
      <option value="active">有效</option>
      <option value="terminated">已解約</option>
      <option value="no_sponsor">缺推薦人</option>
    </select>
    <select id="stageFilter" class="inp" onchange="applyView()" title="階段">
      <option value="">階段：全部</option>
      <option value="新入會">新入會</option>
      <option value="再購">再購</option>
      <option value="無方案">無方案</option>
    </select>
    <select id="sortBy" class="inp" onchange="applyView()" title="排序">
      <option value="number">🔢 依編號（同人相鄰）</option>
      <option value="countdown">⏰ 方案倒數（快到期優先）</option>
      <option value="updated">🔄 最近更新</option>
      <option value="registered">📅 入會日（新→舊）</option>
    </select>
    <button class="btn sm" onclick="loadData()">查詢</button>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>編號</th><th>姓名</th><th>階段</th><th>商品</th><th>入會</th><th>方案倒數</th><th>更新</th><th>更新者</th><th>狀態</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="modal">
  <div class="modal-card">
    <h2 id="mTitle">編輯會員</h2>
    <div class="msub" id="mSub"></div>
    <div class="msg" id="mMsg"></div>
    <input type="hidden" id="m_member_id">
    <div class="sec">基本（公司登錄資料）</div>
    <div class="grid2">
      <div class="fg"><label>姓名</label><input class="inp" id="m_name"></div>
      <div class="fg"><label>性別</label><select class="inp" id="m_gender"><option value="">－</option><option>男</option><option>女</option></select></div>
      <div class="fg"><label>生日</label><input class="inp" type="date" id="m_birth_date"></div>
      <div class="fg"><label>狀態（是否有效）</label><select class="inp" id="m_status"><option value="active">有效</option><option value="terminated">已解約</option></select></div>
    </div>
    <div class="sec">方案（公司端可變更）</div>
    <div class="grid2">
      <div class="fg"><label>入會日期</label><input class="inp" type="date" id="m_registered_at"></div>
      <div class="fg"><label>方案階段</label><select class="inp" id="m_plan_stage"><option value="">無方案</option><option value="新入會">新入會</option><option value="再購">再購</option></select></div>
      <div class="fg"><label>購買商品</label><select class="inp" id="m_product"><option value="">－ 不變更 －</option></select><div class="tierbadge" id="m_tier_badge" style="display:none;"></div></div>
      <div class="fg" id="fg_length"><label>方案長度</label><select class="inp" id="m_plan_length"><option value="">－</option></select></div>
      <div class="fg" id="fg_variant"><label>給點方式</label><select class="inp" id="m_plan_variant"><option value="">－</option><option value="A">A 標準</option><option value="B">B 預購</option></select></div>
      <div class="fg"><label>續購付款</label><select class="inp" id="m_payment_method"><option value="">－</option><option value="4">信用卡自動</option><option value="1">銀行自動</option><option value="2">貨到付款</option><option value="3">臨櫃</option><option value="0">終止</option></select></div>
      <div class="fg"><label>扣款日</label><input class="inp" id="m_billing_day"></div>
    </div>
    <div class="sec">推薦與位置</div>
    <div class="grid2">
      <div class="fg"><label>推薦人編號</label><input class="inp" id="m_sponsor_member_id" placeholder="2675630-001"></div>
      <div class="fg"><label>指定位置編號（掛在誰下面）</label><input class="inp" id="m_placement_parent_id" placeholder="2675630-001"></div>
    </div>
    <div class="fg"><label>備註</label><input class="inp" id="m_notes"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="save()">儲存變更</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const RPC_URL = SUPABASE_URL + "/rest/v1/rpc/nds_admin";
const CATALOG = [
  { code:"SR", label:"喚活",            spec:"120顆/包", tier:15000 },
  { code:"MP", label:"識霸明力多",      spec:"120顆/罐", tier:15000 },
  { code:"IM", label:"活美水素水（48包）", spec:"48包/盒", tier:15000 },
  { code:"PF", label:"普力活 FIRE（48包）", spec:"48包/盒", tier:15000 },
  { code:"BB", label:"普力活 BB（48包）", spec:"48包/盒", tier:15000 },
  { code:"AD", label:"妍漾飲（10罐）",  spec:"10罐/盒", tier:15000 },
  { code:"AD", label:"妍漾飲（14罐）",  spec:"14罐/盒", tier:20000 },
  { code:"SL", label:"識霸",            spec:"1罐",     tier:10000 },
  { code:"IM", label:"活美水素水（30包）", spec:"30包/盒", tier:10000 },
  { code:"PF", label:"普力活 FIRE（30包）", spec:"30包/盒", tier:10000 },
  { code:"BB", label:"普力活 BB（30包）", spec:"30包/盒", tier:10000 },
  { code:"MV", label:"識霸明力多（素食）", spec:"120顆/罐", tier:15000 },
  { code:"DS", label:"晨星系列",        spec:"一盒",    tier:10000 }
];
const LEN_BY_STAGE = { "新入會":["1+11","1+5","新12M"], "再購":["12+2","6+1","24M"], "":[] };
const NO_VARIANT = ["新12M","24M"];
const EFFECT_MONTHS = { "1+11":12, "1+5":6, "新12M":12, "12+2":12, "6+1":6, "24M":24 };

let PW = "", OPERATOR = "", ROWS = [];

async function api(payload){
  const r = await fetch(RPC_URL, { method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON, 'Authorization':'Bearer '+SUPABASE_ANON },
    body: JSON.stringify({ p: { ...payload, password: PW, operator: OPERATOR } }) });
  if(!r.ok) throw new Error('Supabase '+r.status);
  return await r.json();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function prefixOf(id){ return String(id||'').split('-')[0]; }
function tenure(reg){
  if(!reg) return '';
  const r=new Date(reg), now=new Date();
  const days=Math.floor((now-r)/86400000);
  let months=(now.getFullYear()-r.getFullYear())*12+(now.getMonth()-r.getMonth());
  if(now.getDate()<r.getDate()) months--;
  if(months<18) return days+' 天';
  const y=Math.floor(months/12), m=months%12;
  return y+' 年'+(m?(' '+m+' 個月'):'');
}
function countdown(reg, len){
  if(!reg || !len || !EFFECT_MONTHS[len]) return null;
  const exp=new Date(reg); exp.setMonth(exp.getMonth()+EFFECT_MONTHS[len]);
  return { exp: exp.toISOString().slice(0,10), days: Math.ceil((exp-new Date())/86400000) };
}
function cdDays(m){ const c=countdown(m.registered_at,m.plan_length); return c?c.days:Infinity; }
function cdHtml(reg, len){
  const c=countdown(reg,len);
  if(!c) return '<span class="miss">－</span>';
  if(c.days<0)  return `<span class="cd over">已到期</span>`;
  if(c.days<=30) return `<span class="cd warn">⚠剩 ${c.days} 天</span>`;
  return `<span class="cd ok">剩 ${c.days} 天</span>`;
}
function agoText(ts){ if(!ts) return '<span class="miss">－</span>'; const d=Math.floor((new Date()-new Date(ts))/86400000); return d<=0?'今天':(d+' 天前'); }

async function login(){
  PW=document.getElementById('pw').value;
  OPERATOR=document.getElementById('operator').value.trim();
  const err=document.getElementById('loginErr'); err.style.display='none';
  if(!OPERATOR){ err.textContent='請先輸入你的姓名'; err.style.display='block'; return; }
  try{
    const d=await api({action:'list',filter:'all',limit:1});
    if(d.success===false){ err.textContent=d.message||'密碼錯誤'; err.style.display='block'; return; }
    localStorage.setItem('nds_operator', OPERATOR);
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    buildProductOptions(); bindPlanEvents(); loadData();
  }catch(e){ err.textContent='連線失敗：'+e.message; err.style.display='block'; }
}
(function(){ const saved=localStorage.getItem('nds_operator'); if(saved) document.getElementById('operator').value=saved; })();
function buildProductOptions(){
  const sel=document.getElementById('m_product');
  CATALOG.forEach(it=>{ const o=document.createElement('option'); o.value=it.code+'|'+it.spec; o.textContent=it.label;
    o.dataset.code=it.code; o.dataset.spec=it.spec; o.dataset.tier=it.tier; sel.appendChild(o); });
}
function fillLengths(stage,current){
  const sel=document.getElementById('m_plan_length'); sel.innerHTML='<option value="">－</option>';
  (LEN_BY_STAGE[stage]||[]).forEach(L=>{ const o=document.createElement('option'); o.value=L; o.textContent=L; sel.appendChild(o); });
  if(current && (LEN_BY_STAGE[stage]||[]).includes(current)) sel.value=current;
  toggleVariant();
}
function toggleVariant(){
  const L=document.getElementById('m_plan_length').value;
  document.getElementById('fg_variant').classList.toggle('hidden', NO_VARIANT.includes(L));
  if(NO_VARIANT.includes(L)) document.getElementById('m_plan_variant').value='';
}
function bindPlanEvents(){
  document.getElementById('m_plan_stage').addEventListener('change',()=>fillLengths(document.getElementById('m_plan_stage').value,''));
  document.getElementById('m_plan_length').addEventListener('change',toggleVariant);
  document.getElementById('m_product').addEventListener('change',()=>{
    const o=document.getElementById('m_product').selectedOptions[0], b=document.getElementById('m_tier_badge');
    if(o&&o.dataset.tier){ b.textContent='✓ '+Number(o.dataset.tier).toLocaleString()+' 點'; b.style.display='inline-block'; } else b.style.display='none';
  });
}

/* 後端取資料（搜尋＋狀態篩） */
async function loadData(){
  const search=document.getElementById('search').value.trim();
  const filter=document.getElementById('filter').value;
  const d=await api({action:'list',search,filter});
  ROWS=d.rows||[];
  applyView();
}
/* 前端：階段篩 + 排序 + 渲染 */
function applyView(){
  const stage=document.getElementById('stageFilter').value;
  const sort=document.getElementById('sortBy').value;
  let rows=ROWS.slice();
  if(stage) rows=rows.filter(m=>(m.plan_stage||'無方案')===stage);
  if(sort==='countdown') rows.sort((a,b)=>cdDays(a)-cdDays(b));
  else if(sort==='updated') rows.sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));
  else if(sort==='registered') rows.sort((a,b)=>String(b.registered_at||'').localeCompare(String(a.registered_at||'')));
  else rows.sort((a,b)=>String(a.member_id).localeCompare(String(b.member_id)));
  renderRows(rows);
}
function rowCells(m){
  const stg=m.plan_stage||'無方案'; const scls=stg==='再購'?'s2':(stg==='新入會'?'':'s0');
  const prod=m.product?esc(m.product):(m.product_code?esc(m.product_code):'<span class="miss">－</span>');
  return `<td><span class="stage ${scls}">${esc(stg)}</span></td><td>${prod}</td>`
    +`<td>${m.registered_at?(esc(m.registered_at)+'<div style="color:#9fb0c8;font-size:.78rem;">入會 '+tenure(m.registered_at)+'</div>'):'<span class="miss">－</span>'}</td>`
    +`<td>${cdHtml(m.registered_at,m.plan_length)}</td><td>${agoText(m.updated_at)}</td>`
    +`<td>${m.updated_by?esc(m.updated_by):'<span class="miss">－</span>'}</td>`
    +`<td><span class="tag ${esc(m.status)}">${esc(m.status)}</span></td>`;
}
function editBtn(m){ const b=document.createElement('button'); b.className='btn sm'; b.textContent='編輯';
  b.addEventListener('click',(e)=>{ e.stopPropagation(); openEdit(m.member_id); }); return b; }

function renderRows(rows){
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  rows.forEach(m=>{ const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(m.member_id)}</td><td>${esc(m.name)}</td>`+rowCells(m)+`<td></td>`;
    tr.lastChild.appendChild(editBtn(m)); tb.appendChild(tr); });
  document.getElementById('count').textContent='共 '+rows.length+' 筆';
}

function openEdit(id){
  const m=ROWS.find(x=>x.member_id===id); if(!m)return;
  document.getElementById('mTitle').textContent='編輯 '+m.member_id;
  const c=countdown(m.registered_at,m.plan_length);
  document.getElementById('mSub').textContent=(m.name||'')+(c?('　方案'+(c.days<0?'已到期':('剩 '+c.days+' 天'))):'')+(m.updated_by?('　上次更新：'+m.updated_by):'');
  const set=(k,v)=>{document.getElementById('m_'+k).value=(v==null?'':v);};
  set('member_id',m.member_id);set('name',m.name);set('birth_date',m.birth_date);set('billing_day',m.billing_day);
  set('registered_at',m.registered_at);set('sponsor_member_id',m.sponsor_member_id);set('placement_parent_id',m.placement_parent_id);set('notes',m.notes);
  document.getElementById('m_gender').value=m.gender||'';
  document.getElementById('m_status').value=m.status||'active';
  document.getElementById('m_plan_stage').value=m.plan_stage||'';
  fillLengths(m.plan_stage||'', m.plan_length||'');
  document.getElementById('m_plan_variant').value=m.plan_variant||'';
  document.getElementById('m_payment_method').value=(m.payment_method==null?'':String(m.payment_method));
  const ps=document.getElementById('m_product'); ps.value=''; document.getElementById('m_tier_badge').style.display='none';
  if(m.product_code){ for(const o of ps.options){ if(o.dataset.code===m.product_code){ ps.value=o.value;
    const b=document.getElementById('m_tier_badge'); b.textContent='目前 '+Number(o.dataset.tier).toLocaleString()+' 點'; b.style.display='inline-block'; break; } } }
  document.getElementById('mMsg').style.display='none';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
function computeDelivery(len,variant){
  if(len==='新12M'||len==='24M')return'月配'; if(len==='12+2'||len==='6+1')return'一次拿';
  if(variant==='A')return'月配'; if(variant==='B')return'一次拿'; return'';
}
async function save(){
  const g=k=>document.getElementById('m_'+k).value;
  const len=g('plan_length'), variant=g('plan_variant');
  const payload={ action:'update', member_id:g('member_id'),
    name:g('name'), gender:g('gender'), birth_date:g('birth_date'), status:g('status'), registered_at:g('registered_at'),
    plan_stage:g('plan_stage'), plan_length:len, plan_variant:variant, delivery_mode:computeDelivery(len,variant),
    payment_method:g('payment_method'), billing_day:g('billing_day'),
    sponsor_member_id:g('sponsor_member_id'), placement_parent_id:g('placement_parent_id'), notes:g('notes') };
  const ps=document.getElementById('m_product');
  if(ps.value){ const o=ps.selectedOptions[0]; payload.product_code=o.dataset.code; payload.product_spec=o.dataset.spec; payload.point_tier=o.dataset.tier; }
  const mMsg=document.getElementById('mMsg');
  try{
    const d=await api(payload);
    if(d.success){ mMsg.className='msg ok'; mMsg.textContent='已儲存 ✓'; mMsg.style.display='block'; setTimeout(()=>{closeModal();loadData();},600); }
    else{ mMsg.className='msg err'; mMsg.textContent=d.message||'儲存失敗'; mMsg.style.display='block'; }
  }catch(e){ mMsg.className='msg err'; mMsg.textContent='失敗：'+e.message; mMsg.style.display='block'; }
}
</script>
</body>
</html>
