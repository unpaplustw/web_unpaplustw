<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的任務</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f6f8f5;--card:#fff;--line:#d9dfda;--tx:#20261f;--mut:#6b756c;--acc:#2f6b4f;--warn:#a85a1f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:10px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--acc);border:0;border-radius:10px;color:#fff;padding:14px;font-size:18px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--tx)}
.btn.row{display:inline-block;width:auto;padding:10px 16px;font-size:16px;margin-right:8px}
.btn.b-done{background:var(--acc)}.btn.b-call{background:#3b6ea5}.btn.b-lost{background:#8a8f8b}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:#e7efe9;color:var(--acc);margin-right:6px}
.tag.t-倒數救援{background:#f7e5d8;color:var(--warn)}
.due{color:var(--bad);font-weight:700}
.mut{color:var(--mut);font-size:14px}
.big{font-size:20px;font-weight:700}
.msg{color:var(--warn);min-height:22px}
.hidden{display:none}
</style></head><body><div class="wrap">
<h1>📋 我的任務</h1>
<div id="loading" class="card">連線中…</div>

<div id="pick" class="card hidden">
  <div class="big">請選擇你是誰</div>
  <div class="mut" style="margin:6px 0 10px">送出後由總部核准，只需做一次</div>
  <div id="pickList"></div>
  <div class="msg" id="pmsg"></div>
</div>

<div id="pending" class="card hidden">
  <div class="big">✋ 已送出申請</div>
  <p>等總部核准後，重新打開這個頁面就能看到任務。</p>
</div>

<div id="main" class="hidden">
  <div class="card"><span class="big" id="who"></span>　<span class="mut" id="cnt"></span></div>
  <div id="list"></div>
</div>

<script>
const LIFF_ID = "REPLACE_WITH_LIFF_ID"; // ⚠️ 建好 LIFF app 後把 ID 填進來
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
let UID=null, DNAME='';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const show=id=>{['loading','pick','pending','main'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));};
async function api(p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_leader',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...p,line_user_id:UID}})});
  return r.json();
}
async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login();return;}
    const prof=await liff.getProfile(); UID=prof.userId; DNAME=prof.displayName||'';
  }catch(e){
    document.getElementById('loading').innerHTML='⚠️ LIFF 初始化失敗：'+esc(String(e))+'<br><span class="mut">請從 LINE 開啟本頁</span>';
    return;
  }
  const me=await api({action:'me'});
  if(!me.success){document.getElementById('loading').textContent=me.message||'錯誤';return;}
  if(!me.bound){renderPick(me.leaders);show('pick');return;}
  if(me.status!=='approved'){show('pending');return;}
  loadTasks();
}
function renderPick(leaders){
  const el=document.getElementById('pickList');el.innerHTML='';
  leaders.forEach(l=>{
    const b=document.createElement('button');b.className='btn ghost';
    b.textContent=l.name+'（'+l.tier+'）';
    b.onclick=async()=>{
      const d=await api({action:'apply',member_id:l.member_id,display_name:DNAME});
      if(d.success)show('pending');
      else document.getElementById('pmsg').textContent=d.message||'失敗';
    };
    el.appendChild(b);
  });
}
async function loadTasks(){
  const d=await api({action:'tasks'});
  if(!d.success){document.getElementById('loading').textContent=d.message;show('loading');return;}
  document.getElementById('who').textContent='👤 '+(d.name||'');
  document.getElementById('cnt').textContent='待辦 '+d.rows.length+' 件';
  const list=document.getElementById('list');list.innerHTML='';
  if(!d.rows.length){list.innerHTML='<div class="card">🎉 目前沒有待辦任務</div>';}
  d.rows.forEach(t=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div><span class="tag t-${esc(t.task_type)}">${esc(t.task_type)}</span>
      ${t.due_date?'<span class="due">期限 '+esc(t.due_date)+'</span>':''}</div>
      <div class="big" style="margin:6px 0">${esc(t.target_name||t.target_member_id)}</div>
      <div class="mut">${esc(t.target_member_id)}｜${esc(t.detail||'')}${t.status==='已聯絡'?'｜🔵已聯絡':''}</div>
      <div style="margin-top:10px">
        <button class="btn row b-call" onclick="rep(${t.id},'已聯絡')">📞 已聯絡</button>
        <button class="btn row b-done" onclick="rep(${t.id},'完成')">✅ 完成</button>
        <button class="btn row b-lost" onclick="rep(${t.id},'失聯')">😶 失聯</button>
      </div>`;
    list.appendChild(c);
  });
  show('main');
}
async function rep(id,status){
  const note=prompt(status+'：補充一句（可空白）','')||'';
  const d=await api({action:'report',id:String(id),status,note});
  if(d.success)loadTasks();else alert(d.message||'失敗');
}
boot();
</script></div></body></html>
