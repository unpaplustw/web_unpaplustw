<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的名單</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f6f8f5;--card:#fff;--line:#d9dfda;--tx:#20261f;--mut:#6b756c;--acc:#2f6b4f;--warn:#a85a1f;--bad:#c0392b;--blue:#3b6ea5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;background:var(--acc);border:0;border-radius:10px;color:#fff;padding:13px;font-size:17px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--tx)}
.mut{color:var(--mut);font-size:14px}
.big{font-size:19px;font-weight:700}
.hidden{display:none!important}
.sec{font-size:15px;font-weight:700;margin:16px 2px 8px}
.tip{background:#fff6ec;border:1px solid #f0d9bf;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px}
.who{font-size:18px;font-weight:700}
.side{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;background:#eef1ee;color:var(--mut)}
.side.weak{background:#fde8e6;color:var(--bad)}
.act{margin:6px 0 2px;font-size:16px}
.due{color:var(--bad);font-weight:700}
.last{margin-top:6px;font-size:14px;padding:7px 9px;background:#f4f6f4;border-radius:8px}
.st{font-weight:700}
.st-已聯絡{color:var(--warn)}.st-未聯繫上{color:var(--bad)}.st-答應{color:var(--acc)}.st-拒絕{color:var(--mut)}.st-尚未聯絡{color:var(--mut)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:16px;cursor:pointer;color:var(--tx)}
.sb.on{border-color:var(--acc);background:#e7efe9}
.form{margin-top:10px}
.form textarea{width:100%;min-height:64px;border:2px solid var(--line);border-radius:10px;padding:9px;font:16px/1.5 inherit;resize:vertical}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:6px 6px 0 0;font-size:14px;cursor:pointer;background:#fff}
.msg{color:var(--bad);font-size:14px;min-height:18px;margin-top:4px}
.warn{color:var(--bad);font-weight:700}
details summary{cursor:pointer;color:var(--mut);font-size:15px;margin:14px 2px 6px}
</style></head><body><div class="wrap">
<h1>📋 我的名單</h1>
<div id="loading" class="card">連線中…</div>

<div id="pick" class="card hidden">
  <div class="big">請選擇你是誰</div>
  <div class="mut" style="margin:6px 0 10px">送出後由總部核准，只需做一次</div>
  <div id="pickList"></div>
  <div class="msg" id="pmsg"></div>
</div>

<div id="pending" class="card hidden">
  <div class="big">✋ 已送出申請</div>
  <p>等總部核准後，重新打開這個頁面就能看到名單。</p>
</div>

<div id="main" class="hidden">
  <div class="card">
    <div class="who" id="who"></div>
    <div class="mut" id="sum" style="margin-top:2px"></div>
    <div id="tipBox" style="margin-top:8px"></div>
  </div>
  <div class="sec" id="h1"></div>
  <div id="L1"></div>
  <details id="dOther" class="hidden"><summary id="h2"></summary><div id="L2"></div></details>
  <details id="dMiss2" class="hidden"><summary id="h3"></summary><div id="L3"></div></details>
  <div id="taskWrap" class="hidden"><div class="sec">📌 總部交辦</div><div id="L4"></div></div>
  <p class="mut" style="margin:18px 4px">做到了不用回報——公司資料更新後，這個人會自己從名單上消失。</p>
</div>

<script>
// ⚠️ 在 LINE Developers 建好 LIFF（Endpoint＝https://unpaplus.com.tw/nds/leader.html）後，把 ID 填進來
const LIFF_ID = "REPLACE_WITH_LIFF_ID";
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
let UID=null, DNAME='', DATA=null;
const STATUS=['已聯絡','未聯繫上','答應','拒絕'];
const ICON={'已聯絡':'📞','未聯繫上':'😶','答應':'👍','拒絕':'✋'};
const CHIPS={'已聯絡':['說下週會買','要再想想','已約見面'],'未聯繫上':['打了沒接','已讀不回','電話換了'],
  '答應':['答應 _/_ 刷卡','答應這個月買','答應推薦朋友'],'拒絕':['經濟因素','覺得沒效果','先停一陣子']};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const show=id=>{['loading','pick','pending','main'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));};
const md=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?String(s).slice(5).replace('-','/'):(d.getMonth()+1)+'/'+d.getDate();};
async function api(p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_leader',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...p,line_user_id:UID}})});
  return r.json();
}
async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login();return;}
    const prof=await liff.getProfile(); UID=prof.userId; DNAME=prof.displayName||'';
  }catch(e){
    document.getElementById('loading').innerHTML='⚠️ 無法連線 LINE：'+esc(String(e))+'<br><span class="mut">請從 LINE 官方帳號的選單打開</span>';
    return;
  }
  const me=await api({action:'me'});
  if(!me.success){document.getElementById('loading').textContent=me.message||'錯誤';return;}
  if(!me.bound){renderPick(me.leaders);show('pick');return;}
  if(me.status!=='approved'){show('pending');return;}
  load();
}
function renderPick(leaders){
  const el=document.getElementById('pickList');el.innerHTML='';
  (leaders||[]).forEach(l=>{
    const b=document.createElement('button');b.className='btn ghost';
    b.textContent=l.name+'（'+l.tier+'）';
    b.onclick=async()=>{
      const d=await api({action:'apply',member_id:l.member_id,display_name:DNAME});
      if(d.success)show('pending'); else document.getElementById('pmsg').textContent=d.message||'失敗';
    };
    el.appendChild(b);
  });
}
async function load(){
  const d=await api({action:'cfc_list'});
  if(!d||!d.success){document.getElementById('loading').textContent=(d&&d.message)||'讀取失敗';show('loading');return;}
  DATA=d;
  document.getElementById('who').textContent='👤 '+(d.name||'');
  document.getElementById('sum').innerHTML='這期目標 <b>'+(d.target==null?'還沒定':d.target+' 組')+'</b> ・ 已成 <b>'+d.done+' 組</b>（左 '+d.done_l+'・右 '+d.done_r+'）';
  document.getElementById('tipBox').innerHTML=d.weak
    ?'<div class="tip">👉 你的小邊是<b>'+d.weak+'邊</b>：'+d.weak+'邊每多 1 個，就多 1 組</div>':'';
  const m1=d.miss1||[], m2=d.miss2||[];
  const a=d.weak?m1.filter(x=>x.on_weak):m1, b=d.weak?m1.filter(x=>!x.on_weak):[];
  document.getElementById('h1').textContent=d.weak?'先找這些（補'+d.weak+'邊會直接成組）'+a.length+' 位':'只差一件 '+a.length+' 位';
  fill('L1',a);
  document.getElementById('dOther').classList.toggle('hidden',!b.length);
  document.getElementById('h2').textContent='另一邊 '+b.length+' 位（補了先單掛，不急）'; fill('L2',b);
  document.getElementById('dMiss2').classList.toggle('hidden',!m2.length);
  document.getElementById('h3').textContent='差兩件 '+m2.length+' 位'; fill('L3',m2);
  show('main');
  loadTasks();
}
// 戰術板「發令」產生的交辦（actions）；沒有就不顯示
async function loadTasks(){
  const d=await api({action:'tasks'}); const rows=(d&&d.success&&d.rows)||[];
  document.getElementById('taskWrap').classList.toggle('hidden',!rows.length);
  const box=document.getElementById('L4'); box.innerHTML='';
  rows.forEach(t=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="mut">'+esc(t.task_type)+(t.due_date?'　<span class="due">期限 '+esc(t.due_date)+'</span>':'')+'</div>'
      +'<div class="who" style="font-size:17px">'+esc(t.target_name||t.target_member_id)+'</div>'
      +'<div class="mut">'+esc(t.detail||'')+(t.status==='已聯絡'?'｜已聯絡':'')+'</div>'
      +'<div class="bar"><button class="sb" data-s="已聯絡">📞 已聯絡</button><button class="sb" data-s="完成">✅ 完成</button><button class="sb" data-s="失聯">😶 失聯</button></div>';
    c.querySelectorAll('.sb').forEach(b=>b.onclick=async()=>{
      const note=prompt(b.dataset.s+'：補充一句（可空白）','')||'';
      const r=await api({action:'report',id:String(t.id),status:b.dataset.s,note});
      if(r.success)loadTasks(); else alert(r.message||'失敗');
    });
    box.appendChild(c);
  });
}
function fill(boxId,rows){
  const box=document.getElementById(boxId); box.innerHTML='';
  if(!rows.length){box.innerHTML='<div class="card mut">這裡沒有人 🎉</div>';return;}
  rows.forEach(x=>box.appendChild(card(x)));
}
function card(x){
  const c=document.createElement('div'); c.className='card'; c.dataset.id=x.member_id;
  const F=x.follow||{}, bc=String(x.member_id).split('-')[1];
  const dueTxt=(x.g1==='待重消'&&x.next_due)?'<span class="due">'+md(x.next_due)+' 前</span>　':'';
  c.innerHTML='<div><span class="who" style="font-size:17px">'+esc(x.name)+'-'+esc(bc)+'</span>'
      +'<span class="side'+(x.on_weak?' weak':'')+'">'+esc(x.side||'')+'邊</span></div>'
    +'<div class="act">'+dueTxt+esc(x.action_text||'')+'</div>'
    +(F.status?'<div class="last">'+(F.conflict?'<span class="warn">⚠ 說法不同</span> ':'')
        +'<span class="st st-'+esc(F.status)+'">'+esc(F.status)+'</span>'+(F.note?'｜'+esc(F.note):'')
        +'<div class="mut" style="font-size:12px">'+esc(F.by||'')+(F.src==='LINE'?'（LINE）':'')+' '+md(F.at)+(F.n>1?' ・ 共 '+F.n+' 筆':'')+'</div></div>':'')
    +'<div class="bar">'+STATUS.map(s=>'<button class="sb" data-s="'+s+'">'+ICON[s]+' '+s+'</button>').join('')+'</div>'
    +'<div class="form hidden"><div class="mut" data-f="lab"></div>'
      +'<textarea placeholder="寫一句（必填）"></textarea><div class="chips"></div>'
      +'<div class="msg"></div>'
      +'<button class="btn" data-f="ok">送出</button><button class="btn ghost" data-f="no">取消</button></div>';
  const form=c.querySelector('.form'), ta=form.querySelector('textarea'), msg=form.querySelector('.msg');
  let pick=null;
  c.querySelectorAll('.sb').forEach(btn=>btn.onclick=()=>{
    pick=btn.dataset.s;
    c.querySelectorAll('.sb').forEach(z=>z.classList.toggle('on',z===btn));
    form.classList.remove('hidden'); msg.textContent='';
    form.querySelector('[data-f=lab]').textContent='「'+pick+'」寫一句註記：';
    form.querySelector('.chips').innerHTML=(CHIPS[pick]||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
    form.querySelectorAll('.chips span').forEach(sp=>sp.onclick=()=>{ta.value=sp.textContent;ta.focus();});
    ta.focus();
  });
  form.querySelector('[data-f=no]').onclick=()=>{form.classList.add('hidden');c.querySelectorAll('.sb').forEach(z=>z.classList.remove('on'));};
  form.querySelector('[data-f=ok]').onclick=async(ev)=>{
    const note=ta.value.trim();
    if(!note){msg.textContent='要寫一句才會送出';return;}
    ev.target.disabled=true; ev.target.textContent='送出中…';
    const d=await api({action:'cfc_report',member_id:x.member_id,status:pick,note});
    ev.target.disabled=false; ev.target.textContent='送出';
    if(!d||!d.success){msg.textContent=(d&&d.message)||'失敗，再試一次';return;}
    x.follow=d.follow; c.replaceWith(card(x));
  };
  return c;
}
boot();
</script></div></body></html>
