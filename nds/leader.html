<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的名單</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f6f8f5;--card:#fff;--line:#d9dfda;--tx:#20261f;--mut:#6b756c;--acc:#2f6b4f;--warn:#a85a1f;--bad:#c0392b;--pur:#7a4fb5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card.due{border:2px solid var(--bad)}
.btn{display:block;width:100%;background:var(--acc);border:0;border-radius:10px;color:#fff;padding:13px;font-size:17px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--tx)}
.btn.rec{background:#fff;border:2px solid var(--acc);color:var(--acc);font-weight:700}
.mut{color:var(--mut);font-size:14px}
.big{font-size:19px;font-weight:700}
.hidden{display:none!important}
.sec{font-size:15px;font-weight:700;margin:16px 2px 8px}
.tip{background:#fff6ec;border:1px solid #f0d9bf;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:8px}
.alert{background:#fdecea;border:1px solid #f3c2bc;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;margin-top:8px}
.who{font-size:18px;font-weight:700}
.side{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;background:#eef1ee;color:var(--mut)}
.side.weak{background:#fde8e6;color:var(--bad)}
.act{margin:6px 0 2px;font-size:16px}
.red{color:var(--bad);font-weight:700}
.hint{font-size:14px;margin-top:2px}
.last{margin-top:8px;font-size:14px;padding:8px 10px;background:#f4f6f4;border-radius:8px}
.next{margin-top:6px;font-size:15px;font-weight:700}
.c-未聯繫上{color:var(--bad)}.c-考慮中{color:var(--warn)}.c-卡關{color:var(--pur)}.c-答應{color:var(--acc)}.c-拒絕{color:var(--mut)}
.lab{font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:15px;cursor:pointer;color:var(--tx)}
.sb.on{border-color:var(--acc);background:#e7efe9;font-weight:700}
textarea,input[type=text],input[type=date]{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px;font:16px/1.4 inherit;background:#fff}
textarea{min-height:58px;resize:vertical}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:6px 6px 0 0;font-size:14px;cursor:pointer;background:#fff}
.row2{display:grid;grid-template-columns:130px 1fr;gap:6px}
.msg{color:var(--bad);font-size:14px;min-height:18px;margin-top:6px}
details summary{cursor:pointer;color:var(--mut);font-size:15px;margin:14px 2px 6px}
</style></head><body><div class="wrap">
<h1>📋 我的名單</h1>
<div id="loading" class="card">連線中…</div>

<div id="pick" class="card hidden">
  <div class="big">請選擇你是誰</div>
  <div class="mut" style="margin:6px 0 10px">送出後由總部核准，只需做一次</div>
  <div id="pickList"></div>
  <div class="msg" id="pmsg"></div>
</div>

<div id="pending" class="card hidden">
  <div class="big">✋ 已送出申請</div>
  <p>等總部核准後，重新打開這個頁面就能看到名單。</p>
</div>

<div id="main" class="hidden">
  <div class="card">
    <div class="who" id="who"></div>
    <div class="mut" id="sum" style="margin-top:2px"></div>
    <div id="alertBox"></div>
    <div id="tipBox"></div>
  </div>
  <div id="toast" class="tip hidden" style="background:#e7efe9;border-color:#bcd6c6;color:var(--acc)"></div>
  <div id="ownWrap" class="hidden"><div class="sec" id="h0"></div><div id="L0"></div></div>
  <div class="sec" id="h1"></div>
  <div id="L1"></div>
  <details id="dAll" class="hidden"><summary id="h2"></summary><div id="L2"></div></details>
  <div id="taskWrap" class="hidden"><div class="sec">📌 總部交辦</div><div id="L4"></div></div>
  <p class="mut" style="margin:18px 4px">做到了不用回報——公司資料更新後，這個人會自己從名單上消失。</p>
</div>

<script>
// LIFF「NDS 我的名單」（2026-09-28 Randoph 建；Endpoint＝https://unpaplus.com.tw/nds/leader.html、Full）
// 入口：https://liff.line.me/2009692859-IpsyNXD9
const LIFF_ID = "2009692859-IpsyNXD9";
const SUPABASE_URL="https://nsgqsopqlkhayuefdout.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
let UID=null, DNAME='', ME='';
// 推薦人是本人（自己的分店）或就是我 → 不顯示
const samePerson=(a,b)=>!!(a&&b)&&String(a).split('-')[0]===String(b).split('-')[0];
// 一筆跟進＝方式／結論／註記／下一步（日期＋要做什麼）；負責人在 LINE 上固定是你自己
const METHODS=[['見面','🤝'],['電話','📞'],['LINE訊息','💬']];
const CONCL=[['未聯繫上','😶'],['考慮中','🤔'],['卡關','🚧'],['答應','👍'],['拒絕','✋']];
const NOTE_CHIPS={'未聯繫上':['打了沒接','已讀不回','電話換了'],'考慮中':['說要再想想','要跟家人商量','先吃完這盒再說'],
  '卡關':['等發薪才買','要先看到效果','家人反對'],'答應':['答應 _/_ 刷卡','答應這個月買','答應推薦朋友'],'拒絕':['經濟因素','覺得沒效果','先停一陣子']};
const NEXT_CHIPS=['再打一次','確認有沒有刷卡','約見面','等他回覆'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const show=id=>{['loading','pick','pending','main'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));};
const md=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?String(s).slice(5).replace('-','/'):(d.getMonth()+1)+'/'+d.getDate();};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function api(p){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nds_leader',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p:{...p,line_user_id:UID}})});
  return r.json();
}
async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login();return;}
    const prof=await liff.getProfile(); UID=prof.userId; DNAME=prof.displayName||'';
  }catch(e){
    document.getElementById('loading').innerHTML='⚠️ 無法連線 LINE：'+esc(String(e))+'<br><span class="mut">請從 LINE 官方帳號的選單打開</span>';
    return;
  }
  const me=await api({action:'me'});
  if(!me.success){document.getElementById('loading').textContent=me.message||'錯誤';return;}
  if(!me.bound){renderPick(me.leaders);show('pick');return;}
  if(me.status!=='approved'){show('pending');return;}
  load();
}
function renderPick(leaders){
  const el=document.getElementById('pickList');el.innerHTML='';
  (leaders||[]).forEach(l=>{
    const b=document.createElement('button');b.className='btn ghost';
    b.textContent=l.name+'（'+l.tier+'）';
    b.onclick=async()=>{
      const d=await api({action:'apply',member_id:l.member_id,display_name:DNAME});
      if(d.success)show('pending'); else document.getElementById('pmsg').textContent=d.message||'失敗';
    };
    el.appendChild(b);
  });
}
async function load(){
  const d=await api({action:'cfc_list'});
  if(!d||!d.success){document.getElementById('loading').textContent=(d&&d.message)||'讀取失敗';show('loading');return;}
  ME=d.member_id||'';
  document.getElementById('who').textContent='👤 '+(d.name||'');
  document.getElementById('sum').innerHTML='這期目標 <b>'+(d.target==null?'還沒定':d.target+' 組')+'</b> ・ 已成 <b>'+d.done+' 組</b>（左 '+d.done_l+'・右 '+d.done_r+'）';
  document.getElementById('alertBox').innerHTML=(d.overdue||d.today)
    ?'<div class="alert">⏰ '+(d.overdue?'逾期 '+d.overdue+' 位':'')+(d.overdue&&d.today?'・':'')+(d.today?'今天要跟 '+d.today+' 位':'')+'（排在最上面）</div>':'';
  document.getElementById('tipBox').innerHTML=d.weak?'<div class="tip">👉 你的小邊是<b>'+d.weak+'邊</b>：'+d.weak+'邊每多 1 個，就多 1 組</div>':'';
  const m1=d.miss1||[], m2=d.miss2||[];
  const isOwn=x=>samePerson(x.member_id,ME);
  const due=x=>['overdue','today'].includes((x.follow||{}).due), rej=x=>(x.follow||{}).status==='拒絕';
  const sink=a=>a.filter(x=>!rej(x)).concat(a.filter(rej));
  const byDue=(a,b)=>String(a.next_due||'9').localeCompare(String(b.next_due||'9'));
  // 🏠 自己的分店：問題就是自己，只看狀況、不記跟進
  const own=m1.concat(m2).filter(isOwn).sort(byDue);
  const p1=m1.filter(x=>!isOwn(x)), p2=m2.filter(x=>!isOwn(x));
  // 📌 今天要找的人＝逾期＋今天到期＋還沒跟進過的小邊前 5 位（重消日最早的在前）
  const dueList=p1.concat(p2).filter(due);
  const fresh=p1.filter(x=>!x.follow&&!due(x)&&(d.weak?x.on_weak:true)).sort(byDue).slice(0,5);
  const today=dueList.concat(fresh);
  const rest=sink(p1.concat(p2));
  document.getElementById('ownWrap').classList.toggle('hidden',!own.length);
  document.getElementById('h0').textContent='🏠 你自己的分店（'+own.length+'）——只看狀況';
  const L0=document.getElementById('L0'); L0.innerHTML=''; own.forEach(x=>L0.appendChild(ownCard(x)));
  document.getElementById('h1').textContent='📌 今天要找的人（'+today.length+'）';
  if(today.length) fill('L1',today);
  else document.getElementById('L1').innerHTML='<div class="card" style="text-align:center">今天沒有要做的 🎉<div class="mut">要找其他人，打開下面的全部名單</div></div>';
  document.getElementById('dAll').classList.toggle('hidden',!rest.length);
  document.getElementById('h2').textContent='全部名單（'+rest.length+'）'; fill('L2',rest);
  show('main');
  loadTasks();
}
function ownCard(x){
  const c=document.createElement('div'); c.className='card'; const E=x.extra||{}, bc=String(x.member_id).split('-')[1];
  c.innerHTML='<div><span class="who" style="font-size:17px">'+esc(x.name)+'-'+esc(bc)+'</span><span class="side'+(x.on_weak?' weak':'')+'">'+esc(x.side||'')+'邊</span></div>'
    +'<div class="act">'+((x.g1==='待重消'&&x.next_due)?'<span class="red">'+md(x.next_due)+' 前</span>　':'')+esc(x.action_text||'')+'</div>'
    +(E.win_hint?'<div class="hint red">⏳ '+esc(E.win_hint)+'</div>':'')
    +(E.water_hint?'<div class="hint mut">💧 '+esc(E.water_hint)+'</div>':'');
  return c;
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),4000); }
function fill(boxId,rows){
  const box=document.getElementById(boxId); box.innerHTML='';
  if(!rows.length){box.innerHTML='<div class="card mut">這裡沒有人 🎉</div>';return;}
  rows.forEach(x=>box.appendChild(card(x)));
}
function card(x){
  const c=document.createElement('div'); const F=x.follow||{}, E=x.extra||{}, bc=String(x.member_id).split('-')[1];
  c.className='card'+(['overdue','today'].includes(F.due)?' due':''); if(F.status==='拒絕') c.style.opacity='.55';
  const dueTxt=(x.g1==='待重消'&&x.next_due)?'<span class="red">'+md(x.next_due)+' 前</span>　':'';
  let h='<div><span class="who" style="font-size:17px">'+esc(x.name)+'-'+esc(bc)+'</span>'
      +'<span class="side'+(x.on_weak?' weak':'')+'">'+esc(x.side||'')+'邊</span></div>'
    +(E.sponsor_name&&!samePerson(E.sponsor_id,x.member_id)&&!samePerson(E.sponsor_id,ME)?'<div class="mut">推薦人：'+esc(E.sponsor_name)+'（可以請他幫忙講）</div>':'')
    +'<div class="act">'+dueTxt+esc(x.action_text||'')+'</div>'
    +(E.win_hint?'<div class="hint red">⏳ '+esc(E.win_hint)+'</div>':'')
    +(E.water_hint?'<div class="hint mut">💧 '+esc(E.water_hint)+'</div>':'');
  if(F.status){
    h+='<div class="last">'+(F.conflict?'<span class="red">⚠ 說法不同</span>　':'')
      +'<span class="mut" style="font-size:13px">'+md(F.at)+' '+esc(F.method||'')+' ・ '+esc(F.by||'')+(F.src==='LINE'?'':'（開會記的）')+'</span><br>'
      +'<b class="c-'+esc(F.status)+'">'+esc(F.status)+'</b>'+(F.note?'｜'+esc(F.note):'')
      +(F.n>1?'<div class="mut" style="font-size:12px">共 '+F.n+' 筆紀錄</div>':'')+'</div>';
    if(F.next_date) h+='<div class="next'+(F.due==='overdue'||F.due==='today'?' red':'')+'">→ '+(F.due==='overdue'?'逾期 ':(F.due==='today'?'今天 ':''))+md(F.next_date)+'　'+esc(F.next_action||'')+'</div>';
  }
  h+='<button class="btn rec">＋ 記一筆</button><div class="form hidden"></div>';
  c.innerHTML=h;
  const form=c.querySelector('.form'), rec=c.querySelector('.rec');
  rec.onclick=()=>{ if(!form.classList.contains('hidden')){form.classList.add('hidden');return;} buildForm(form,x,c); form.classList.remove('hidden'); };
  return c;
}
function buildForm(form,x,c){
  let method='', concl='';
  const d3=new Date(Date.now()+3*864e5);
  form.innerHTML='<div class="lab">① 怎麼聯絡的</div><div class="grid3">'+METHODS.map(([v,i])=>'<button class="sb" data-m="'+v+'">'+i+' '+v+'</button>').join('')+'</div>'
    +'<div class="lab">② 結果</div><div class="grid5">'+CONCL.map(([v,i])=>'<button class="sb" data-c="'+v+'">'+i+' '+v+'</button>').join('')+'</div>'
    +'<div class="lab" data-f="nl">③ 他怎麼說（必填）</div><textarea data-f="note" placeholder="寫一句"></textarea><div class="chips" data-f="nc"></div>'
    +'<div class="lab" data-f="xl">④ 下一步：哪天、做什麼</div>'
    +'<div class="row2"><input type="date" data-f="nd" value="'+ymd(d3)+'"><input type="text" data-f="na" placeholder="例：確認有沒有刷卡"></div>'
    +'<div class="chips">'+NEXT_CHIPS.map(t=>'<span data-n="1">'+esc(t)+'</span>').join('')+'</div>'
    +'<div class="msg"></div><button class="btn" data-f="ok">送出</button><button class="btn ghost" data-f="no">取消</button>';
  const q=s=>form.querySelector(s), msg=q('.msg'), ta=q('[data-f=note]'), na=q('[data-f=na]');
  form.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{method=b.dataset.m; form.querySelectorAll('[data-m]').forEach(z=>z.classList.toggle('on',z===b));});
  form.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    concl=b.dataset.c; form.querySelectorAll('[data-c]').forEach(z=>z.classList.toggle('on',z===b));
    q('[data-f=nl]').textContent=concl==='卡關'?'③ 卡在什麼條件（必填）':(concl==='拒絕'?'③ 原因（必填）':'③ 他怎麼說（必填）');
    q('[data-f=xl]').textContent=concl==='拒絕'?'④ 下一步（拒絕可以不填）':'④ 下一步：哪天、做什麼';
    q('[data-f=nc]').innerHTML=(NOTE_CHIPS[concl]||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
    q('[data-f=nc]').querySelectorAll('span').forEach(sp=>sp.onclick=()=>{ta.value=sp.textContent;ta.focus();});
  });
  form.querySelectorAll('[data-n]').forEach(sp=>sp.onclick=()=>{na.value=sp.textContent;});
  q('[data-f=no]').onclick=()=>form.classList.add('hidden');
  q('[data-f=ok]').onclick=async(ev)=>{
    const note=ta.value.trim(), act=na.value.trim();
    if(!method){msg.textContent='先選怎麼聯絡的';return;}
    if(!concl){msg.textContent='選一個結果';return;}
    if(!note){msg.textContent=concl==='卡關'?'要寫卡在什麼條件':'要寫一句才會送出';return;}
    if(concl!=='拒絕'&&!act){msg.textContent='要寫下一步做什麼';return;}
    ev.target.disabled=true; ev.target.textContent='送出中…';
    const d=await api({action:'cfc_report',member_id:x.member_id,method,status:concl,note,
      next_date:(concl==='拒絕'&&!act)?'':q('[data-f=nd]').value,next_action:act});
    ev.target.disabled=false; ev.target.textContent='送出';
    if(!d||!d.success){msg.textContent=(d&&d.message)||'失敗，再試一次';return;}
    // 重新整理名單：下一步移到之後的人，會自己離開「今天要找的人」
    toast('✅ 已記錄：'+x.name+'　下一步 '+(d.follow&&d.follow.next_date?md(d.follow.next_date):'—'));
    window.scrollTo({top:0,behavior:'smooth'}); load();
  };
}
// 戰術板「發令」產生的交辦（actions）；沒有就不顯示
async function loadTasks(){
  const d=await api({action:'tasks'}); const rows=(d&&d.success&&d.rows)||[];
  document.getElementById('taskWrap').classList.toggle('hidden',!rows.length);
  const box=document.getElementById('L4'); box.innerHTML='';
  rows.forEach(t=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="mut">'+esc(t.task_type)+(t.due_date?'　<span class="red">期限 '+esc(t.due_date)+'</span>':'')+'</div>'
      +'<div class="who" style="font-size:17px">'+esc(t.target_name||t.target_member_id)+'</div>'
      +'<div class="mut">'+esc(t.detail||'')+(t.status==='已聯絡'?'｜已聯絡':'')+'</div>'
      +'<div class="grid3" style="margin-top:8px"><button class="sb" data-s="已聯絡">📞 已聯絡</button><button class="sb" data-s="完成">✅ 完成</button><button class="sb" data-s="失聯">😶 失聯</button></div>';
    c.querySelectorAll('.sb').forEach(b=>b.onclick=async()=>{
      const note=prompt(b.dataset.s+'：補充一句（可空白）','')||'';
      const r=await api({action:'report',id:String(t.id),status:b.dataset.s,note});
      if(r.success)loadTasks(); else alert(r.message||'失敗');
    });
    box.appendChild(c);
  });
}
boot();
</script></div></body></html>
