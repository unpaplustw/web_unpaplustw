<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f7f5f0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>醫檢師講座・課後作業 | 活動廣場</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{ --bg:#f7f5f0; --bg2:#ffffff; --ink:#1a1a2e; --ink2:#5b5647;
  --line:rgba(184,150,12,.30); --gold:#b8960c; --gold-bright:#8a6d00;
  --ok:#16a34a; --no:#dc2626; }
html,body{ min-height:100%; }
body{ font-family:"Noto Sans TC",-apple-system,sans-serif; background:var(--bg);
  background-image:linear-gradient(rgba(184,150,12,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(184,150,12,.06) 1px,transparent 1px);
  background-size:44px 44px; color:var(--ink); }

.wrap{ max-width:820px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top,0px)) 20px
  calc(40px + env(safe-area-inset-bottom,0px)); }
.view{ display:none; } .view.on{ display:block; }

.kicker{ font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.35em;
  color:var(--gold); }
h1{ font-size:clamp(28px,6.5vw,44px); font-weight:900; line-height:1.25; margin-top:10px; }
.lead{ color:var(--ink2); font-size:clamp(16px,3.6vw,19px); line-height:1.75; margin-top:14px; }
.lead b{ color:var(--gold-bright); }

/* 課程卡 */
.clist{ margin-top:26px; display:flex; flex-direction:column; gap:14px; }
.ccard{ border:2px solid var(--line); border-radius:18px; padding:20px 22px;
  background:var(--bg2); cursor:pointer; transition:border-color .2s, transform .15s; }
.ccard:hover{ border-color:var(--gold); transform:translateY(-2px); }
.ccard:active{ transform:scale(.99); }
.cno{ font-family:"JetBrains Mono",monospace; color:var(--gold); font-size:13px; letter-spacing:.2em; }
.ctitle{ font-size:clamp(19px,4.6vw,25px); font-weight:900; margin-top:6px; line-height:1.4; }
.cmeta{ color:var(--ink2); font-size:14px; margin-top:8px; }
.cbadge{ display:inline-block; margin-top:12px; font-size:13px; font-weight:900;
  border-radius:999px; padding:5px 14px; border:1px solid var(--line); color:var(--gold-bright); }
.ccard.done .cbadge{ border-color:var(--ok); color:var(--ok); }

/* 題目 */
.pbar{ height:6px; border-radius:999px; background:rgba(26,26,46,.08); margin-top:18px; overflow:hidden; }
.pfill{ height:100%; background:var(--gold); width:0%; transition:width .3s; }
.qno{ font-family:"JetBrains Mono",monospace; color:var(--gold); font-size:14px;
  letter-spacing:.2em; margin-top:22px; }
.qtext{ font-size:clamp(20px,4.8vw,27px); font-weight:900; line-height:1.55; margin-top:10px; }
.opts{ margin-top:20px; display:flex; flex-direction:column; gap:12px; }
.opt{ display:flex; align-items:flex-start; gap:14px; text-align:left;
  border:2px solid var(--line); border-radius:16px; padding:16px 18px;
  background:var(--bg2); color:var(--ink); font-family:inherit;
  font-size:clamp(16px,3.9vw,19px); line-height:1.6; font-weight:400; cursor:pointer;
  transition:border-color .2s, background .2s; }
.opt .k{ font-family:"JetBrains Mono",monospace; font-weight:900; color:var(--gold); flex-shrink:0; }
.opt:hover{ border-color:var(--gold); }
.opt.sel{ border-color:var(--gold-bright); background:rgba(184,150,12,.10); }

.btn{ width:100%; min-height:62px; margin-top:24px; border-radius:16px; border:none;
  background:var(--gold); color:#ffffff; font-family:inherit;
  font-size:clamp(18px,4.4vw,22px); font-weight:900; cursor:pointer; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn.ghost{ background:transparent; border:2px solid var(--line); color:var(--ink); }
.btn:active:not(:disabled){ transform:scale(.98); }

/* 成績 */
.score{ text-align:center; border:2px solid var(--line); border-radius:22px;
  padding:28px 22px; margin-top:22px; background:var(--bg2); }
.scoreN{ font-family:"JetBrains Mono",monospace; font-weight:900; line-height:1;
  font-size:clamp(64px,18vw,110px); }
.scoreN.pass{ color:var(--ok); } .scoreN.fail{ color:var(--gold-bright); }
.scoreN small{ font-size:.32em; color:var(--ink2); margin-left:6px; }
.scoreTxt{ font-size:clamp(18px,4.4vw,23px); font-weight:900; margin-top:12px; }
.scoreSub{ color:var(--ink2); font-size:15px; margin-top:8px; line-height:1.6; }

.rev{ margin-top:26px; display:flex; flex-direction:column; gap:16px; }
.rq{ border:2px solid var(--line); border-radius:16px; padding:18px 20px; background:var(--bg2); }
.rq.ok{ border-color:rgba(95,201,127,.5); } .rq.no{ border-color:rgba(239,106,106,.5); }
.rmark{ font-weight:900; font-size:15px; }
.rq.ok .rmark{ color:var(--ok); } .rq.no .rmark{ color:var(--no); }
.rqt{ font-weight:900; font-size:clamp(16px,3.9vw,19px); margin-top:8px; line-height:1.5; }
.rline{ font-size:15px; margin-top:10px; line-height:1.6; color:var(--ink2); }
.rline b{ color:var(--ink); }
.rline .good{ color:var(--ok); font-weight:900; }
.rline .bad{ color:var(--no); font-weight:900; }
.rwhy{ font-size:14.5px; line-height:1.75; color:var(--ink2); margin-top:12px;
  padding-top:12px; border-top:1px solid rgba(184,150,12,.20); }
.rwhy b{ color:var(--gold-bright); }

/* QR 投影 */
.qrbtn{ width:100%; margin-top:18px; min-height:56px; border-radius:14px;
  border:2px dashed var(--line); background:transparent; color:var(--ink2);
  font-family:inherit; font-size:16px; font-weight:900; cursor:pointer; }
.qrbtn:hover{ border-color:var(--gold); color:var(--gold-bright); }
#qrfull{ display:none; position:fixed; inset:0; z-index:90; background:rgba(247,245,240,.98);
  flex-direction:column; align-items:center; justify-content:center; padding:24px; cursor:pointer; }
#qrfull.on{ display:flex; }
#qrfull .qtitle{ font-size:clamp(20px,4.5vw,32px); font-weight:900; margin-bottom:20px; text-align:center; }
#qrfull .qbox{ width:min(72vh,86vw); height:min(72vh,86vw); background:#ffffff;
  border-radius:20px; padding:16px; box-shadow:0 0 0 2px var(--line), 0 10px 40px rgba(184,150,12,.18); }
#qrfull .qurl{ font-family:"JetBrains Mono",monospace; font-weight:900; margin-top:22px;
  font-size:clamp(16px,3.6vw,26px); color:var(--gold-bright); }
#qrfull .qhint{ color:var(--ink2); font-size:14px; margin-top:14px; }

.foot{ margin-top:34px; text-align:center; color:#8a8577; font-size:13px; }
.foot a{ color:var(--ink2); text-decoration:none; }
</style>
</head>

<div class="wrap">

<!-- 課程列表 -->
<section id="v-list" class="view on">

<section id="v-result" class="view">

    <div class="scoreN" id="r-n">0<small>/5</small></div>
    <p class="scoreTxt" id="r-txt">—</p>
    <p class="scoreSub" id="r-sub"></p>
  </div>
  <div class="rev" id="r-rev"></div>
  <button class="btn ghost" onclick="retry()">重寫一次</button>
  <button class="btn ghost" onclick="backList()">回課程列表</button>
  <p class="foot">活動廣場 · 醫檢師講座</p>
</section>

/* ═══════════════════════════════════════════════════════
   課程題庫 —— 講師考題原文照抄，勿改寫。
   新增一堂課：複製一個物件加進 COURSES 陣列即可。
   a = 正解索引（0=A, 1=B, 2=C, 3=D）
   ═══════════════════════════════════════════════════════ */
const COURSES = [
  {
    no: '001',
    title: '營養素與亞健康指標的調理對策',
    teacher: '吳秀鴻 講師',
    date: '114/07/03',
    qs: [
      { q:'下列何者最符合「亞健康」的定義？',
        o:['已確診重大疾病，需要住院治療。',
           '身體完全健康，沒有任何不適。',
           '身體已有疲勞、睡眠差或代謝異常等警訊，但尚未達疾病診斷標準。',
           '只有高齡者才會出現的狀態。'],
        a:2,
        w:'亞健康是介於健康與疾病之間的狀態，可能出現疲勞、睡眠品質下降、壓力大、免疫力降低、血糖或血脂偏高等情況，但尚未符合疾病診斷標準，因此應及早介入改善。' },
      { q:'下列哪一項檢驗最能反映近 2–3 個月平均血糖控制情形？',
        o:['空腹血糖（FPG）','飯後血糖','糖化血色素（HbA1c）','尿糖'],
        a:2,
        w:'HbA1c 可反映近 2–3 個月的平均血糖，是評估長期血糖控制的重要指標。但若有貧血、輸血或血紅素異常，可能影響判讀。' },
      { q:'氫水目前研究較支持的可能作用為何？',
        o:['提供大量維生素。','調節氧化壓力與發炎相關反應。','完全消除所有自由基。','可取代降血壓藥物。'],
        a:1,
        w:'目前研究顯示，氫分子可能具有選擇性抗氧化及調節細胞訊號的作用，但證據仍持續累積，不應視為藥物替代品。' },
      { q:'植化素最主要的生理作用為何？',
        o:['提供大量熱量。','活化抗氧化防禦系統，降低氧化壓力。','增加膽固醇生成。','完全取代藥物治療。'],
        a:1,
        w:'植化素富含多酚、類胡蘿蔔素等活性成分，可協助調節抗氧化防禦、減少自由基造成的氧化傷害，支持細胞健康，但不能取代醫療治療。' },
      { q:'普力活（益生菌）最主要的健康作用為何？',
        o:['提高血糖。','調整腸道菌相，支持免疫與代謝健康。','增加膽固醇。','完全取代均衡飲食。'],
        a:1,
        w:'益生菌有助於維持腸道菌相平衡，支持腸道屏障與免疫功能，並可能對代謝健康產生正面影響，但仍需搭配健康生活型態。' }
    ]
  },
  {
    no: '002',
    title: '腦神經營養管理與阿茲海默症',
    teacher: '吳秀鴻 講師',
    date: '115/08/10',
    qs: [
      { q:'下列何者最能說明營養對腦神經健康的重要性？',
        o:['大腦不需要葡萄糖與氧氣',

           '只要補充蛋白質，就能清除 Aβ',

        w:'大腦對氧化壓力相對敏感，因為它具有：高耗氧量、高能量需求、豐富的不飽和脂肪酸、神經元本身抗氧化能力有限。<br><b>過多 ROS（活性氧）→ 粒線體與細胞膜氧化傷害 → 神經功能受損 → 可能加重神經發炎與神經退化環境。</b>' },

const KEYS=['A','B','C','D'];
let course=null, qi=0, picks=[];

function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on'); window.scrollTo(0,0); }

/* 課程列表（完成過的用 localStorage 標記） */
function paintList(){
  const el=document.getElementById('clist');
  el.innerHTML=COURSES.map((c,i)=>{
    const rec=localStorage.getItem('class_'+c.no);
    const done=rec? '<span class="cbadge">✓ 已完成 '+rec+'/5</span>'
                  : '<span class="cbadge">尚未作答 · 5 題</span>';
    return '<div class="ccard'+(rec?' done':'')+'" onclick="startCourse('+i+')">'
      +'<div class="cno">LESSON '+c.no+'</div>'
      +'<div class="ctitle">'+c.title+'</div>'
      +'<div class="cmeta">'+c.teacher+'　·　'+c.date+'</div>'
      +done+'</div>'; }).join('');
}
function startCourse(i){ course=COURSES[i]; qi=0; picks=new Array(course.qs.length).fill(-1);
  document.getElementById('q-course').textContent=course.title;
  document.getElementById('r-course').textContent=course.title;
  paintQ(); show('v-quiz'); }
function paintQ(){
  const item=course.qs[qi], n=course.qs.length;
  document.getElementById('q-fill').style.width=((qi)/n*100)+'%';
  document.getElementById('q-no').textContent='第 '+(qi+1)+' 題 / '+n;
  document.getElementById('q-text').textContent=item.q;
  document.getElementById('q-opts').innerHTML=item.o.map((t,k)=>
    '<button class="opt'+(picks[qi]===k?' sel':'')+'" onclick="pick('+k+')">'
    +'<span class="k">'+KEYS[k]+'</span><span>'+t+'</span></button>').join('');
  const btn=document.getElementById('q-next');
  btn.disabled = picks[qi]<0;
  btn.textContent = (qi+1<n) ? '下一題 →' : '交卷，看結果 ✓';
}
function pick(k){ picks[qi]=k; paintQ(); }
function nextQ(){ if(picks[qi]<0) return;
  if(qi+1<course.qs.length){ qi++; paintQ(); } else grade(); }

/* 批改 */
function grade(){
  let right=0;
  course.qs.forEach((item,i)=>{ if(picks[i]===item.a) right++; });
  const n=course.qs.length;
  const el=document.getElementById('r-n');
  el.innerHTML=right+'<small>/'+n+'</small>';
  el.className='scoreN '+(right===n?'pass':'fail');
  document.getElementById('r-txt').textContent =
    right===n ? '全對！觀念很扎實 🎉'
    : (right>=4 ? '很不錯，差一點滿分'
    : (right>=3 ? '及格，還有進步空間' : '再複習一次會更好'));
  document.getElementById('r-sub').textContent =
    right===n ? '每一題的解析還是看一下，能講給別人聽才算真的懂。'
              : '下面有每一題的解析，看完再寫一次會更清楚。';
  document.getElementById('r-rev').innerHTML=course.qs.map((item,i)=>{
    const ok = picks[i]===item.a;
    return '<div class="rq '+(ok?'ok':'no')+'">'
      +'<div class="rmark">'+(ok?'✓ 答對':'✗ 答錯')+'　第 '+(i+1)+' 題</div>'
      +'<div class="rqt">'+item.q+'</div>'
      +'<div class="rline">你的答案：<span class="'+(ok?'good':'bad')+'">'
        +KEYS[picks[i]]+'. '+item.o[picks[i]]+'</span></div>'
      +(ok?'':'<div class="rline">正確答案：<span class="good">'
        +KEYS[item.a]+'. '+item.o[item.a]+'</span></div>')
      +'<div class="rwhy"><b>解析</b>　'+item.w+'</div>'
      +'</div>'; }).join('');
  localStorage.setItem('class_'+course.no, right);
  show('v-result');
}
function retry(){ qi=0; picks=new Array(course.qs.length).fill(-1); paintQ(); show('v-quiz'); }
function backList(){ paintList(); show('v-list'); }

function showQR(){ document.getElementById('qrfull').classList.add('on'); }
function hideQR(){ document.getElementById('qrfull').classList.remove('on'); }

paintList();
