<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 團隊入口 — 環貫綠佳利 APLUS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--panel:#ffffff;--border:rgba(0,0,0,0.08);
  --cyan:#b8960c;--amber:#d4af37;--red:#c0392b;--green:#00b900;--purple:#9a7b1f;
  --text:#1a1a2e;--sub:#6b7280;--dim:#efe9dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:24px 28px}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.hdr-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hdr-title{font-family:'Playfair Display',serif;font-size:2.8rem;color:var(--cyan);letter-spacing:.06em;line-height:1}
.hdr-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--sub);letter-spacing:.18em}
.hdr-right{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--sub);padding-bottom:2px}
.pulse{width:7px;height:7px;background:var(--cyan);border-radius:50%;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CFC GROUPS */
.cfc-group{margin-bottom:36px}
.cfc-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cfc-line{width:3px;height:24px;border-radius:2px;background:var(--c,var(--cyan));flex-shrink:0}
.cfc-name{font-family:'Playfair Display',serif;font-size:1.3rem;letter-spacing:.1em;color:var(--text)}
.cfc-badge{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--c,var(--cyan));background:rgba(0,0,0,.03);border:1px solid var(--border);padding:2px 8px;border-radius:2px;margin-left:auto;white-space:nowrap}

/* ANCHOR NAV */
.anchor-nav-wrap{margin-bottom:28px}
.anchor-nav-label{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--sub);letter-spacing:.1em;margin-bottom:8px}
.anchor-nav{display:flex;flex-wrap:wrap;gap:8px}
.anchor-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:3px;background:var(--panel);border:1px solid var(--border);color:var(--sub);font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-decoration:none;transition:all .2s;cursor:pointer}
.anchor-btn:hover{border-color:var(--c,var(--cyan));color:var(--c,var(--cyan))}
.anchor-dot{width:6px;height:6px;border-radius:50%;background:var(--c,var(--cyan));flex-shrink:0}

/* TEAMS GRID */
.teams-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* TEAM CARD — warroom panel style */
.team-card{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:box-shadow .2s;animation:up .45s ease both}
.team-card::before,.team-card::after{content:'';position:absolute;width:10px;height:10px}
.team-card::before{top:-1px;left:-1px;border-top:2px solid var(--c,var(--cyan));border-left:2px solid var(--c,var(--cyan))}
.team-card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--c,var(--cyan));border-right:2px solid var(--c,var(--cyan))}
.team-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card-top{display:flex;align-items:flex-start;gap:12px}
.card-avatar{width:44px;height:44px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;letter-spacing:1px;color:var(--c,var(--cyan));background:var(--dim);border:1px solid var(--border);flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-family:'Playfair Display',serif;font-size:1.1rem;letter-spacing:.06em;color:var(--text);line-height:1.2;margin-bottom:8px}

.leader-rows{display:flex;flex-direction:column;gap:4px}
.leader-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.leader-tier{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.06em;padding:2px 6px;border-radius:2px;background:var(--dim);color:var(--sub);border:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.leader-names{font-size:.78rem;color:var(--text);line-height:1.5;font-weight:300}
.leader-empty{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--sub);font-style:italic}

/* TIER BADGES */
.tier-cfc{background:rgba(255,215,0,.1);color:#b8960c}
.tier-peak{background:var(--dim);color:var(--sub)}
.tier-achieve{background:rgba(26,138,90,.1);color:var(--green)}

/* LINE BUTTON */
.line-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--green);border-radius:3px;color:#fff;font-size:16px;font-weight:500;text-decoration:none;transition:all .2s;border:none;cursor:pointer;line-height:1}
.line-btn:hover{background:#009a00;box-shadow:0 4px 12px rgba(0,185,0,.25)}
.line-btn svg{flex-shrink:0}

/* APLUS SECTION */
.aplus-section{margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.aplus-label{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.14em;color:var(--sub);margin-bottom:16px}
.aplus-card{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:24px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.aplus-card::before,.aplus-card::after{content:'';position:absolute;width:10px;height:10px}
.aplus-card::before{top:-1px;left:-1px;border-top:2px solid var(--green);border-left:2px solid var(--green)}
.aplus-card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--green);border-right:2px solid var(--green)}
.aplus-icon{width:52px;height:52px;border-radius:3px;background:var(--dim);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.aplus-body{flex:1}
.aplus-title-label{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.12em;color:var(--sub);margin-bottom:4px}
.aplus-title{font-family:'Playfair Display',serif;font-size:1.2rem;letter-spacing:.06em;color:var(--text);margin-bottom:6px}
.aplus-desc{font-size:.78rem;color:var(--sub);line-height:1.7}
.aplus-btn{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;font-size:15px;font-weight:500;padding:12px 22px;border-radius:3px;text-decoration:none;white-space:nowrap;transition:all .2s;flex-shrink:0}
.aplus-btn:hover{background:#009a00}

footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:.58rem;color:var(--sub);text-align:center}

@media(max-width:640px){
  .teams-grid{grid-template-columns:1fr}
  .aplus-card{flex-direction:column;text-align:center}
  .aplus-btn{width:100%;justify-content:center}
  body{padding:16px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <a href="index.html" style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--sub);letter-spacing:.1em;text-decoration:none">← 指揮中心</a>
    <div class="hdr-title">LINE 團隊入口</div>
    <div class="hdr-sub">CFC 環貫綠佳利 · APLUS AI 顧問系統</div>
  </div>
  <div class="hdr-right">
    <div class="pulse"></div>
    <span>即時可加入</span>
  </div>
</header>

<div id="anchor-nav-wrap">
  <div class="anchor-nav-label">CFC 大團隊快捷</div>
  <div class="anchor-nav" id="anchor-nav"></div>
</div>

<div id="groups-container"></div>

<!-- APLUS 非系統入口 -->
<div class="aplus-section">
  <div class="aplus-label">NON-APLUS MEMBER · 非系統入口</div>
  <div class="aplus-card">
    <div class="aplus-icon">💬</div>
    <div class="aplus-body">
      <div class="aplus-title-label">還不屬於任何團隊？</div>
      <div class="aplus-title">Aplus 公關</div>
      <div class="aplus-desc">不確定要加哪個團隊，或是還沒有推薦人，歡迎先加入公關帳號，由專人為你說明。</div>
    </div>
    <a class="aplus-btn" href="https://line.me/R/ti/p/%40752oqdzy" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.630 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
      加入 LINE
    </a>
  </div>
</div>

<footer>環貫綠佳利 APLUS © 2026 · npplus.club</footer>

<script>
const LINE_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.630 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>`;

/* ════ 資料設定 ════
   修改 leaders 裡的名單即可，其餘不需要動
*/
const GROUPS = [
  {
    id: 'cfc-ganlin', name: 'CFC 甘霖大團隊', color: '#00e5b0', badge: '3 個團隊',
    teams: [
      { name:'基紐團隊', handle:'@741zwxpr', initials:'基紐',
        cfc:['林甘霖'], peak:['林佳蓉'], achieve:[] },
      { name:'魷魚團隊', handle:'@453ajvfv', initials:'魷魚',
        cfc:[], peak:['游育杰','李晉豪'], achieve:['張麗玲','張憶文','熊愛茶','林詩萍'] },
      { name:'威達團隊', handle:'@802czzku', initials:'威達',
        cfc:[], peak:['陳立双'], achieve:[] },
    ]
  },
  {
    id: 'cfc-liyu', name: 'CFC 麗玉大團隊', color: '#f472b6', badge: '3 個團隊',
    teams: [
      { name:'舜心團隊', handle:'@659pbthw', initials:'舜心',
        cfc:[], peak:['黃舜心'], achieve:[] },
      { name:'宥妍團隊', handle:'@185ouwvh', initials:'宥妍',
        cfc:[], peak:['李宥妍'], achieve:[] },
      { name:'輝岳團隊', handle:'@568yngtp', initials:'輝岳',
        cfc:[], peak:['游輝岳'], achieve:[] },
    ]
  },
  {
    id: 'cfc-yixun', name: 'CFC 奕迅大團隊', color: '#b06dff', badge: '2 個團隊',
    teams: [
      { name:'翊迅團隊', handle:'@514okzir', initials:'翊迅',
        cfc:['凌翊迅','林姍嬅'], peak:[], achieve:[] },
      { name:'姍玥團隊', handle:'@579cpvba', initials:'姍玥',
        cfc:[], peak:['林姍玥','沈軍駥','許茹棋'], achieve:[] },
    ]
  },
  {
    id: 'cfc-jinghao', name: 'CFC 敬豪大團隊', color: '#38bdf8', badge: '1 個團隊',
    teams: [
      { name:'敬豪團隊', handle:'@809lipop', initials:'敬豪',
        cfc:['楊敬豪'], peak:[], achieve:[] },
    ]
  },
];

/* ════ RENDER ════ */
function leaderRow(tier, names, cls) {
  if (!names.length) return '';
  return `<div class="leader-row">
    <span class="leader-tier ${cls}">${tier}</span>
    <span class="leader-names">${names.join('・')}</span>
  </div>`;
}

function teamCard(t, color, delay) {
  const url = `https://line.me/R/ti/p/${encodeURIComponent(t.handle)}`;
  const hasLeaders = t.cfc.length || t.peak.length || t.achieve.length;
  const leadersHtml = hasLeaders
    ? `<div class="leader-rows">
        ${leaderRow('CFC',t.cfc,'tier-cfc')}
        ${leaderRow('高峰',t.peak,'tier-peak')}
        ${leaderRow('成就',t.achieve,'tier-achieve')}
       </div>`
    : `<div class="leader-rows"><span class="leader-empty">成員招募中</span></div>`;

  return `
    <div class="team-card" style="--c:${color};animation-delay:${delay}s">
      <div class="card-top">
        <div class="card-avatar">${t.initials}</div>
        <div class="card-info">
          <div class="card-name">${t.name}</div>
          ${leadersHtml}
        </div>
      </div>
      <a class="line-btn" href="${url}" target="_blank" rel="noopener">
        ${LINE_SVG} 加入 LINE
      </a>
    </div>`;
}

function render() {
  // Anchor nav
  const nav = document.getElementById('anchor-nav');
  nav.innerHTML = GROUPS.map(g => `
    <a class="anchor-btn" style="--c:${g.color}" href="#${g.id}">
      <span class="anchor-dot"></span>${g.name.replace('CFC ','').replace('大團隊','')}
    </a>`).join('');

  // Groups
  const container = document.getElementById('groups-container');
  let delay = 0.04;
  container.innerHTML = GROUPS.map(g => {
    const cards = g.teams.map(t => {
      const d = delay; delay += 0.06;
      return teamCard(t, g.color, d);
    }).join('');
    return `
      <div class="cfc-group" id="${g.id}">
        <div class="cfc-header" style="--c:${g.color}">
          <div class="cfc-line"></div>
          <div class="cfc-name">${g.name}</div>
          <div class="cfc-badge">${g.badge}</div>
        </div>
        <div class="teams-grid">${cards}</div>
      </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
