<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINEAI APLUS — LINE 團隊排行榜</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--panel:#ffffff;--border:rgba(0,0,0,0.08);
  --cyan:#b8960c;--amber:#d4af37;--red:#c0392b;--green:#1a8a5a;--purple:#9a7b1f;
  --text:#1a1a2e;--sub:#6b7280;--dim:#efe9dd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:24px 28px}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.hdr-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hdr-title{font-family:'Playfair Display',serif;font-size:2.8rem;color:var(--cyan);letter-spacing:.06em;line-height:1}
.hdr-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--sub);letter-spacing:.18em}
.hdr-right{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--sub);padding-bottom:2px}
.pulse{width:7px;height:7px;background:var(--cyan);border-radius:50%;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toggle-wrap{margin-bottom:28px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:4px;width:fit-content}
.tog{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;padding:6px 16px;border-radius:2px;cursor:pointer;color:var(--sub);border:none;background:transparent;transition:all .2s}
.tog.active{background:var(--dim);color:var(--cyan);border:1px solid rgba(184,150,12,.3)}
.tog:hover:not(.active){color:var(--text)}

.section-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;margin-top:40px}
.section-title{font-family:'Playfair Display',serif;font-size:1.4rem;letter-spacing:.1em;color:var(--cyan)}
.section-count{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--sub)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}

.board{background:var(--panel);border:1px solid var(--border);border-radius:3px;overflow:hidden;position:relative;animation:fadeUp .45s ease both}
.board::before,.board::after{content:'';position:absolute;width:10px;height:10px}
.board::before{top:-1px;left:-1px;border-top:2px solid var(--c,var(--cyan));border-left:2px solid var(--c,var(--cyan))}
.board::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--c,var(--cyan));border-right:2px solid var(--c,var(--cyan))}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.board:nth-child(1){animation-delay:.04s}.board:nth-child(2){animation-delay:.09s}
.board:nth-child(3){animation-delay:.13s}.board:nth-child(4){animation-delay:.17s}

.board-hd{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.board-hd-l{display:flex;align-items:center;gap:9px;min-width:0}
.board-icon{width:28px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--dim);border:1px solid var(--border);flex-shrink:0}
.board-name{font-family:'Playfair Display',serif;font-size:.95rem;letter-spacing:.08em;color:var(--c,var(--cyan));white-space:nowrap}
.board-sub{font-family:'DM Mono',monospace;font-size:.5rem;color:var(--sub);margin-top:1px;letter-spacing:.04em}
.board-badge{font-family:'DM Mono',monospace;font-size:.52rem;padding:2px 7px;border-radius:2px;background:var(--dim);border:1px solid var(--border);color:var(--sub);white-space:nowrap;flex-shrink:0}

.rank-list{padding:4px 0}
.rank-row{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--border);transition:background .18s;animation:slideIn .35s ease both}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--dim)}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.rank-row:nth-child(1){animation-delay:.08s}.rank-row:nth-child(2){animation-delay:.13s}.rank-row:nth-child(3){animation-delay:.18s}
.rank-num{font-family:'Playfair Display',serif;font-size:1.1rem;line-height:1;min-width:18px;text-align:center;color:var(--sub)}
.r1 .rank-num{color:var(--amber)}.r2 .rank-num{color:var(--sub)}.r3 .rank-num{color:var(--sub)}
.rank-medal{font-size:14px;line-height:1;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:.78rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name small{font-size:.62rem;color:var(--sub);font-weight:300;margin-left:4px}
.rank-bar-bg{margin-top:4px;height:2px;background:var(--dim);border-radius:2px;overflow:hidden}
.rank-bar{height:100%;border-radius:2px;background:var(--c,var(--cyan));width:0;transition:width 1s cubic-bezier(.16,1,.3,1)}
.rank-val-wrap{text-align:right;flex-shrink:0}
.rank-val{font-family:'DM Mono',monospace;font-size:1.05rem;line-height:1;color:var(--c,var(--cyan))}
.rank-unit{font-family:'DM Mono',monospace;font-size:.5rem;color:var(--sub);margin-top:2px}
.empty-state{padding:20px 14px;text-align:center;font-family:'DM Mono',monospace;font-size:.58rem;color:var(--sub)}

.sk{background:linear-gradient(90deg,var(--dim) 25%,var(--panel) 50%,var(--dim) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:2px;display:inline-block}
@keyframes shimmer{to{background-position:-200% 0}}

footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-family:'DM Mono',monospace;font-size:.58rem;color:var(--sub)}

@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}body{padding:16px}footer{flex-direction:column;gap:4px}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <a href="index.html" style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--sub);letter-spacing:.1em;text-decoration:none">← 指揮中心</a>
    <div class="hdr-title">LINE 排行榜</div>
    <div class="hdr-sub">TEAM LEADERBOARD · 環貫綠佳利 APLUS</div>
  </div>
  <div class="hdr-right">
    <div class="pulse"></div>
    <span id="data-badge">每日更新</span>
  </div>
</header>

<div class="toggle-wrap">
  <button class="tog active" data-period="month"   onclick="switchPeriod(this)">本月</button>
  <button class="tog"        data-period="quarter" onclick="switchPeriod(this)">本季</button>
  <button class="tog"        data-period="year"    onclick="switchPeriod(this)">本年</button>
  <button class="tog"        data-period="all"     onclick="switchPeriod(this)">全時段</button>
</div>

<!-- ── TENANT ── -->
<div class="section-hd">
  <h2 class="section-title">LINE 團隊排行榜</h2>
  <span class="section-count">10 個榜單</span>
</div>
<div class="grid-4">
  <div class="board" id="b-recruit"  style="--c:var(--cyan)"></div>
  <div class="board" id="b-approved" style="--c:var(--green)"></div>
  <div class="board" id="b-active"   style="--c:var(--red)"></div>
  <div class="board" id="b-density"  style="--c:var(--purple)"></div>
</div>
<div class="grid-4">
  <div class="board" id="b-morning"  style="--c:var(--amber)"></div>
  <div class="board" id="b-noon"     style="--c:var(--cyan)"></div>
  <div class="board" id="b-evening"  style="--c:var(--purple)"></div>
  <div class="board" id="b-night"    style="--c:var(--sub)"></div>
</div>
<div class="grid-2">
  <div class="board" id="b-npfacts"  style="--c:var(--red)"></div>
  <div class="board" id="b-miss"     style="--c:var(--sub)"></div>
</div>

<!-- ── INDIVIDUAL ── -->
<div class="section-hd" style="margin-top:52px">
  <h2 class="section-title">個人排行榜</h2>
  <span class="section-count">7 個榜單 · 核准會員</span>
</div>
<div class="grid-4">
  <div class="board" id="b-ind-q"   style="--c:var(--cyan)"></div>
  <div class="board" id="b-ind-sd"  style="--c:var(--purple)"></div>
  <div class="board" id="b-ind-cmp" style="--c:var(--amber)"></div>
  <div class="board" id="b-ind-tr"  style="--c:var(--red)"></div>
</div>
<div class="grid-3">
  <div class="board" id="b-ind-esc" style="--c:var(--red)"></div>
  <div class="board" id="b-ind-db"  style="--c:var(--sub)"></div>
  <div class="board" id="b-ind-tn"  style="--c:var(--green)"></div>
</div>

<footer>
  <div>最後更新：<span id="last-upd">—</span></div>
  <div>Supabase · nsgqsopqlkhayuefdout</div>
</footer>

<script>
/* ════════════════════════ CONFIG ════════════════════════ */
const SB_URL = 'https://nsgqsopqlkhayuefdout.supabase.co';
const SB_KEY = 'YOUR_MEMBERS_ANON_KEY';
let period = 'month';

/* ════════════════════════ BOARD DEFS ════════════════════ */
const TB = [
  {id:'b-recruit', icon:'👑',name:'新進招募',badge:'成員數',  sub:'member count',  unit:'人',   key:'member_count', dec:false},
  {id:'b-approved',icon:'✅',name:'核准達人',badge:'入會數',  sub:'approved',      unit:'人',   key:'approved',     dec:false},
  {id:'b-active',  icon:'🔥',name:'活躍霸主',badge:'活躍度',  sub:'messages',      unit:'則',   key:'msgs',         dec:false},
  {id:'b-density', icon:'💬',name:'問題密度',badge:'黏著度',  sub:'msg / member',  unit:'則/人',key:'density',      dec:true },
  {id:'b-morning', icon:'🌅',name:'早鳥榜',  badge:'06–11時', sub:'morning peak',  unit:'則',   key:'morning',      dec:false},
  {id:'b-noon',    icon:'☀️',name:'午間榜',  badge:'12–17時', sub:'noon peak',     unit:'則',   key:'noon',         dec:false},
  {id:'b-evening', icon:'🌆',name:'夜間榜',  badge:'18–21時', sub:'evening peak',  unit:'則',   key:'evening',      dec:false},
  {id:'b-night',   icon:'🌙',name:'夜貓子',  badge:'22–05時', sub:'night owl',     unit:'則',   key:'night',        dec:false},
  {id:'b-npfacts', icon:'🏷️',name:'NP情報控',badge:'商品問答',sub:'np facts hit',  unit:'次',   key:'np_facts',     dec:false},
  {id:'b-miss',    icon:'📭',name:'資料庫維護',badge:'未命中',sub:'knowledge gap', unit:'題',   key:'miss',         dec:false},
];

const IB = [
  {id:'b-ind-q',  icon:'🎙️',name:'提問達人',  badge:'最愛問',  sub:'most messages',  unit:'則',key:'msgs',         dec:false},
  {id:'b-ind-sd', icon:'🧐',name:'深思熟慮獎',badge:'自我探索',sub:'self doubt',      unit:'pt',key:'self_doubt',   dec:false},
  {id:'b-ind-cmp',icon:'🔍',name:'情報調查員',badge:'比較研究',sub:'comparison',      unit:'pt',key:'comparison',   dec:false},
  {id:'b-ind-tr', icon:'⚖️',name:'獨立評審官',badge:'標準最高',sub:'trust building',  unit:'pt',key:'trust',        dec:false},
  {id:'b-ind-esc',icon:'🤖',name:'AI擊破者',  badge:'讓AI投降',sub:'escalate count',  unit:'次',key:'escalations',  dec:false},
  {id:'b-ind-db', icon:'🔬',name:'資料庫貢獻',badge:'未知領域',sub:'knowledge miss',  unit:'題',key:'miss',         dec:false},
  {id:'b-ind-tn', icon:'📊',name:'Tone深潛者',badge:'最深層',  sub:'close tone count',unit:'次',key:'tone_close',   dec:false},
];

const MEDALS = ['🥇','🥈','🥉'];

/* ════════════════════════ UTILS ════════════════════════ */
function maskName(n) {
  if (!n) return '—';
  if (n.length <= 2) return n[0] + '*';
  return n[0] + '*'.repeat(n.length - 2) + n[n.length - 1];
}

function since(p) {
  const now = new Date();
  if (p === 'month')   return new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
  if (p === 'quarter') return new Date(now.getFullYear(), Math.floor(now.getMonth()/3)*3, 1).toISOString();
  if (p === 'year')    return new Date(now.getFullYear(), 0, 1).toISOString();
  return null;
}

async function get(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ════════════════════════ SKELETON ════════════════════════ */
function skel(b) {
  const el = document.getElementById(b.id);
  el.innerHTML = `
    <div class="board-hd">
      <div class="board-hd-l">
        <div class="board-icon">${b.icon}</div>
        <div><div class="board-name">${b.name}</div><div class="board-sub">${b.sub}</div></div>
      </div>
      <div class="board-badge">${b.badge}</div>
    </div>
    <div class="rank-list">
      ${[0,1,2].map(i=>`
        <div class="rank-row r${i+1}" style="animation-delay:${.08+i*.05}s">
          <div class="rank-num">${i+1}</div><div class="rank-medal">${MEDALS[i]}</div>
          <div class="rank-info">
            <div class="sk" style="height:13px;width:${68-i*12}%;margin-bottom:7px"></div>
            <div class="rank-bar-bg"><div class="rank-bar"></div></div>
          </div>
          <div class="rank-val-wrap"><div class="sk" style="height:22px;width:34px;margin-left:auto"></div></div>
        </div>`).join('')}
    </div>`;
}

/* ════════════════════════ RENDER ════════════════════════ */
function render(b, rows, isInd) {
  const el = document.getElementById(b.id);
  const top3 = rows.filter(r => (r[b.key]||0) > 0).slice(0,3);
  const max = top3[0]?.[b.key] || 1;

  const body = top3.length === 0
    ? `<div class="empty-state">暫無數據</div>`
    : top3.map((row,i) => {
        const v = row[b.key] || 0;
        const pct = Math.round(v / max * 100);
        const disp = b.dec ? v.toFixed(2) : Math.round(v).toLocaleString();
        const nameHtml = isInd
          ? `${maskName(row.name)}<small>${row.team||''}</small>`
          : row.name;
        return `
          <div class="rank-row r${i+1}" style="animation-delay:${.08+i*.05}s">
            <div class="rank-num">${i+1}</div>
            <div class="rank-medal">${MEDALS[i]}</div>
            <div class="rank-info">
              <div class="rank-name">${nameHtml}</div>
              <div class="rank-bar-bg"><div class="rank-bar" data-pct="${pct}"></div></div>
            </div>
            <div class="rank-val-wrap">
              <div class="rank-val">${disp}</div>
              <div class="rank-unit">${b.unit}</div>
            </div>
          </div>`;
      }).join('');

  el.innerHTML = `
    <div class="board-hd">
      <div class="board-hd-l">
        <div class="board-icon">${b.icon}</div>
        <div><div class="board-name">${b.name}</div><div class="board-sub">${b.sub}</div></div>
      </div>
      <div class="board-badge">${b.badge}</div>
    </div>
    <div class="rank-list">${body}</div>`;

  requestAnimationFrame(() => {
    el.querySelectorAll('.rank-bar').forEach(bar => {
      bar.style.width = (bar.dataset.pct||0) + '%';
    });
  });
}

/* ════════════════════════ FETCH & PROCESS ════════════════ */
async function load(p) {
  const s = since(p);
  const df = s ? `&created_at=gte.${s}` : '';
  const jf = s ? `&joined_at=gte.${s}`  : '';
  const hf = s ? `&hour_start=gte.${s}` : '';

  const [tenants, members, msgs, hourly] = await Promise.all([
    get('tenants?select=id,owner_name&is_active=eq.true'),
    get(`members?select=id,tenant_id,name,level,line_user_id,total_credits_used,trust_building_count,comparison_count,self_doubt_count${jf}`),
    get(`message_logs?select=tenant_id,line_user_id,is_greeting,rag_results_count,np_facts_count,should_escalate,tone${df}`),
    get(`hourly_usage_stats?select=tenant_id,hour_start,total_messages${hf}`),
  ]);

  /* tenant stats */
  const tm = {};
  tenants.forEach(t => {
    tm[t.id] = {name:t.owner_name, member_count:0, approved:0, msgs:0, np_facts:0, miss:0, density:0, morning:0, noon:0, evening:0, night:0};
  });

  members.forEach(m => {
    if (!tm[m.tenant_id]) return;
    tm[m.tenant_id].member_count++;
    if (m.level >= 1) tm[m.tenant_id].approved++;
  });

  msgs.forEach(ml => {
    if (!tm[ml.tenant_id] || ml.is_greeting) return;
    const t = tm[ml.tenant_id];
    t.msgs++;
    if (ml.np_facts_count > 0) t.np_facts++;
    if (!ml.rag_results_count && !ml.np_facts_count) t.miss++;
  });

  hourly.forEach(h => {
    if (!tm[h.tenant_id]) return;
    const t = tm[h.tenant_id];
    const hr = (new Date(h.hour_start).getUTCHours() + 8 + 24) % 24;
    const n = h.total_messages || 0;
    if (hr >= 6  && hr < 12) t.morning  += n;
    else if (hr >= 12 && hr < 18) t.noon += n;
    else if (hr >= 18 && hr < 22) t.evening += n;
    else t.night += n;
  });

  const tRows = Object.values(tm).map(t => ({
    ...t,
    density: t.member_count > 0 ? Math.round(t.msgs/t.member_count*100)/100 : 0
  }));

  /* individual stats */
  const approved = members.filter(m => m.level >= 1);
  const im = {};
  approved.forEach(m => {
    im[m.line_user_id] = {
      name: m.name,
      team: tenants.find(t=>t.id===m.tenant_id)?.owner_name || '',
      msgs: 0, self_doubt: m.self_doubt_count||0,
      comparison: m.comparison_count||0, trust: m.trust_building_count||0,
      escalations: 0, miss: 0, tone_close: 0,
    };
  });

  msgs.forEach(ml => {
    if (!im[ml.line_user_id] || ml.is_greeting) return;
    const p = im[ml.line_user_id];
    p.msgs++;
    if (ml.should_escalate) p.escalations++;
    if (!ml.rag_results_count && !ml.np_facts_count) p.miss++;
    if (ml.tone === 'close') p.tone_close++;
  });

  return { tRows, iRows: Object.values(im) };
}

/* ════════════════════════ FALLBACK ════════════════════════ */
function fallback() {
  const tRows = [
    {name:'輝岳團隊', member_count:8, approved:0, msgs:10, np_facts:0,  miss:10, density:1.25, morning:1, noon:0, evening:4, night:0},
    {name:'魷魚團隊', member_count:6, approved:2, msgs:33, np_facts:10, miss:15, density:5.5,  morning:9, noon:8, evening:4, night:4},
    {name:'敬豪團隊', member_count:4, approved:0, msgs:5,  np_facts:2,  miss:1,  density:1.25, morning:1, noon:3, evening:1, night:0},
    {name:'翊迅團隊', member_count:2, approved:0, msgs:3,  np_facts:1,  miss:2,  density:1.5,  morning:1, noon:0, evening:2, night:0},
    {name:'宥妍團隊', member_count:1, approved:0, msgs:6,  np_facts:0,  miss:5,  density:6.0,  morning:1, noon:3, evening:1, night:0},
    {name:'威達團隊', member_count:1, approved:0, msgs:3,  np_facts:0,  miss:3,  density:3.0,  morning:1, noon:1, evening:0, night:0},
    {name:'基紐團隊', member_count:2, approved:0, msgs:1,  np_facts:0,  miss:1,  density:0.5,  morning:1, noon:0, evening:0, night:0},
  ];
  const iRows = [
    {name:'游育杰', team:'魷魚團隊', msgs:32, self_doubt:1, comparison:1, trust:1, escalations:0, miss:18, tone_close:1},
    {name:'張麗玲', team:'魷魚團隊', msgs:4,  self_doubt:1, comparison:0, trust:2, escalations:0, miss:0,  tone_close:0},
  ];
  renderAll(tRows, iRows);
}

/* ════════════════════════ CACHE ════════════════════════ */
const CACHE_KEY = 'lineai_lb';
const CACHE_TTL = 24 * 60 * 60 * 1000; // 24小時

function cacheGet(p) {
  try {
    const raw = localStorage.getItem(`${CACHE_KEY}_${p}`);
    if (!raw) return null;
    const {data, ts} = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) return null;
    return {data, ts};
  } catch { return null; }
}

function cacheSet(p, data) {
  try {
    localStorage.setItem(`${CACHE_KEY}_${p}`, JSON.stringify({data, ts: Date.now()}));
  } catch {}
}

function cacheClear() {
  ['month','quarter','year','all'].forEach(p => {
    try { localStorage.removeItem(`${CACHE_KEY}_${p}`); } catch {}
  });
}

/* ════════════════════════ STATUS BAR ════════════════════ */
function setStatus(ts) {
  const d = new Date(ts);
  const timeStr = d.toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
  document.getElementById('last-upd').textContent = timeStr;
  document.getElementById('data-badge').textContent = '每日更新';
}

/* ════════════════════════ RENDER ALL ════════════════════ */
function renderAll(tRows, iRows) {
  TB.forEach(b => {
    const sorted = [...tRows].sort((a,z) => (z[b.key]||0) - (a[b.key]||0));
    render(b, sorted, false);
  });
  IB.forEach(b => {
    const sorted = [...iRows].sort((a,z) => (z[b.key]||0) - (a[b.key]||0));
    render(b, sorted, true);
  });
}

/* ════════════════════════ INIT ════════════════════════ */
async function init(force = false) {
  if (!force) {
    const cached = cacheGet(period);
    if (cached) {
      renderAll(cached.data.tRows, cached.data.iRows);
      setStatus(cached.ts);
      return;
    }
  }
  [...TB,...IB].forEach(skel);
  try {
    const result = await load(period);
    cacheSet(period, result);
    renderAll(result.tRows, result.iRows);
    setStatus(Date.now());
  } catch(e) {
    console.warn('API failed, using fallback', e);
    fallback();
    setStatus(Date.now());
  }
}

function forceRefresh() {
  cacheClear();
  init(true);
}

function switchPeriod(btn) {
  document.querySelectorAll('.tog').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  period = btn.dataset.period;
  init();
}

init();
</script>
</body>
