<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>榮譽榜審核｜APLUS 系統</title>
<!-- 榮譽榜審核（私人連結，2026-11-15）。每位審核人一條專屬連結 #t=…；點「保留／建議下架」只是做標記，不會直接改網頁。
     名單 data.json 由 wiki/_scripts/優秀會員重生.py 產生（只含公開頁本來就有的內容＋資料來源）。標記寫 Supabase honor_review_*。 -->
<style>
  :root { --bg:#f7f5f0; --card:#fff; --border:rgba(0,0,0,.08); --shadow:0 2px 12px rgba(0,0,0,.06); --gold:#b8960c; --gold-deep:#96790a;
    --gold-light:rgba(184,150,12,.12); --grad:linear-gradient(135deg,#96790a,#d4af37); --text:#1a1a2e; --muted:#6b7280; --red:#b42318; --green:#1f7a4d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'PingFang TC','Heiti TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding-bottom:150px; }
  header { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--border); box-shadow:var(--shadow); padding:12px 16px; }
  .hrow { display:flex; align-items:center; gap:10px; max-width:720px; margin:0 auto; }
  .hrow h1 { font-size:17px; font-weight:800; color:var(--gold-deep); flex:1; }
  .who { font-size:13px; color:var(--muted); }
  .bar { max-width:720px; margin:8px auto 0; height:6px; border-radius:99px; background:var(--gold-light); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--grad); width:0; transition:width .3s; }
  .prog { max-width:720px; margin:4px auto 0; font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { border:1px solid var(--border); background:var(--card); border-radius:99px; padding:8px 14px; font-size:14px; font-weight:600; color:var(--text); font-family:inherit; cursor:pointer; }
  .tabs button.on { background:var(--grad); color:#fff; border-color:transparent; }
  input[type=search], input[type=text] { width:100%; height:46px; border:1px solid var(--border); border-radius:10px; padding:0 14px; font-size:16px; background:var(--card); font-family:inherit; outline:none; }
  input:focus { border-color:var(--gold); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:18px; margin-top:12px; }
  .top { display:flex; gap:14px; align-items:center; }
  .ava { width:72px; height:72px; border-radius:50%; overflow:hidden; flex:none; background:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--gold-deep); }
  .ava img { width:100%; height:100%; object-fit:cover; object-position:50% 8%; }
  .nm { font-size:24px; font-weight:800; line-height:1.3; }
  .occ { font-size:14px; color:var(--muted); }
  .kind { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--gold-light); color:var(--gold-deep); margin-top:4px; }
  h4 { font-size:12.5px; letter-spacing:.08em; color:var(--muted); margin:16px 0 6px; font-weight:700; }
  .ms li, .sum li { list-style:none; font-size:15.5px; padding:3px 0 3px 14px; position:relative; }
  .ms li::before, .sum li::before { content:""; position:absolute; left:0; top:13px; width:5px; height:5px; border-radius:50%; background:var(--gold); }
  .q { font-size:17px; font-weight:700; margin-top:14px; }
  .q::before { content:"「"; color:var(--gold); } .q::after { content:"」"; color:var(--gold); }
  .src { font-size:14px; color:var(--muted); }
  .pub { display:inline-block; margin-top:12px; font-size:14px; color:var(--gold-deep); font-weight:700; text-decoration:none; }
  .mine { margin-top:12px; font-size:14px; font-weight:700; }
  .mine.keep { color:var(--green); } .mine.remove { color:var(--red); }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--border); box-shadow:0 -4px 16px rgba(0,0,0,.08);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .dock .in { max-width:720px; margin:0 auto; }
  .dock input { height:40px; font-size:15px; margin-bottom:8px; }
  .btns { display:flex; gap:10px; }
  .btns button { flex:1; height:56px; border-radius:14px; font-size:18px; font-weight:800; font-family:inherit; cursor:pointer; }
  .b-keep { background:var(--grad); color:#fff; border:0; }
  .b-rm { background:#fff; color:var(--red); border:2px solid var(--red); }
  .b-nav { flex:none !important; width:56px; background:#fff; border:1px solid var(--border); color:var(--muted); font-size:22px !important; }
  .row { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-top:8px; cursor:pointer; }
  .row .ava { width:44px; height:44px; font-size:17px; }
  .row b { font-size:16px; } .row small { color:var(--muted); font-size:13px; display:block; }
  .tag { margin-left:auto; font-size:12.5px; font-weight:800; padding:3px 9px; border-radius:99px; flex:none; }
  .tag.keep { background:rgba(31,122,77,.12); color:var(--green); } .tag.remove { background:rgba(180,35,24,.1); color:var(--red); }
  .msg { text-align:center; color:var(--muted); padding:60px 20px; font-size:16px; }
  .more { display:block; width:100%; margin-top:12px; height:46px; border-radius:99px; border:1px solid var(--gold); background:#fff; color:var(--gold-deep); font-weight:700; font-size:15px; font-family:inherit; }
  .sumrow { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:8px; }
  .sumrow b { font-size:16px; } .sumrow p { font-size:14px; color:var(--muted); }
  .copy { height:48px; border-radius:12px; border:0; background:var(--grad); color:#fff; font-size:16px; font-weight:800; width:100%; font-family:inherit; margin-top:6px; }
  .toast { position:fixed; left:50%; bottom:170px; transform:translateX(-50%); background:#1a1a2e; color:#fff; padding:9px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .2s; z-index:30; pointer-events:none; }
  .toast.on { opacity:.92; }
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>榮譽榜審核</h1><span class="who" id="who"></span></div>
  <div class="bar"><i id="barI"></i></div>
  <div class="prog"><span id="progL"></span><span id="progR"></span></div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"><p class="msg">載入中⋯</p></div>
</div>
<div class="dock" id="dock" style="display:none"><div class="in">
  <input type="text" id="note" placeholder="建議下架的原因（可不填）" maxlength="200">
  <div class="btns">
    <button class="b-nav" onclick="step(-1)" aria-label="上一位">‹</button>
    <button class="b-rm" onclick="vote('remove')">建議下架</button>
    <button class="b-keep" onclick="vote('keep')">保留</button>
    <button class="b-nav" onclick="step(1)" aria-label="下一位">›</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const SB = "https://nsgqsopqlkhayuefdout.supabase.co", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y";
const RANK = ["AQA","CFC Master","CFC","高峰","12星鑽","9星鑽","7星鑽","5星鑽","3星鑽","1星鑽","星鑽","終身成就","進階成就","成就"];
const KIND = { self:"本人自述", mag:"月刊故事", hold:"自述暫不上線" };
let token = "", me = null, people = [], byK = {}, votes = {}, tab = "todo", cur = null, q = "", shown = 40, summary = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
async function rpc(fn, args) {
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method:"POST", headers:{ apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json" }, body:JSON.stringify(args) });
  if (!r.ok) throw new Error(fn + " " + r.status);
  return r.json();
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1400); }
function ava(p) { return `<div class="ava">${p.t ? `<img src="../t/${esc(p.t)}" alt="" loading="lazy">` : esc(p.n[0])}</div>`; }
function topRank(p) { const bs = (p.ms || []).map(x => x.split("・")[0]); return RANK.find(r => bs.includes(r)) || ""; }

function pool() {
  let rows = people;
  if (tab === "todo") rows = rows.filter(p => !votes[p.k]);
  else if (tab === "remove") rows = rows.filter(p => votes[p.k] && votes[p.k].v === "remove");
  else if (tab === "keep") rows = rows.filter(p => votes[p.k] && votes[p.k].v === "keep");
  if (q) rows = rows.filter(p => p.n.includes(q) || (p.a || []).some(a => a.includes(q)) || (p.o || "").includes(q));
  return rows;
}
function drawHead() {
  const done = Object.keys(votes).filter(k => byK[k]).length, rm = Object.values(votes).filter(v => v.v === "remove").length;
  $("barI").style.width = (people.length ? done / people.length * 100 : 0) + "%";
  $("progL").textContent = `已標 ${done}／${people.length}`; $("progR").textContent = `建議下架 ${rm}`;
  const T = [["todo","還沒標"],["all","全部"],["remove","我標下架"],["keep","我標保留"]].concat(me && me.admin ? [["sum","彙整"]] : []);
  $("tabs").innerHTML = T.map(([k, l]) => `<button class="${tab === k ? "on" : ""}" onclick="setTab('${k}')">${l}</button>`).join("");
}
function setTab(t) { tab = t; cur = null; shown = 40; q = ""; draw(); }

function draw() {
  drawHead();
  if (tab === "sum") return drawSummary();
  if (cur && byK[cur]) return drawCard(byK[cur]);
  drawList();
}
function drawList() {
  $("dock").style.display = "none";
  const rows = pool();
  let h = `<input type="search" id="q" placeholder="搜尋姓名或職業" value="${esc(q)}">`;
  if (tab === "todo" && rows.length && !q) h += `<button class="copy" style="margin-top:12px" onclick="openCard('${rows[0].k}')">開始審核（從第 1 位）</button>`;
  if (!rows.length) h += `<p class="msg">${tab === "todo" ? "全部標完了，謝謝你！" : "這裡目前沒有人"}</p>`;
  h += rows.slice(0, shown).map(p => { const v = votes[p.k];
    return `<div class="row" onclick="openCard('${p.k}')">${ava(p)}<div><b>${esc(p.n)}</b><small>${esc([topRank(p), p.o].filter(Boolean).join("・"))}</small></div>
      ${v ? `<span class="tag ${v.v}">${v.v === "keep" ? "保留" : "建議下架"}</span>` : ""}</div>`; }).join("");
  if (rows.length > shown) h += `<button class="more" onclick="shown+=40;drawList()">再看 40 位（共 ${rows.length} 位）</button>`;
  $("view").innerHTML = h;
  const qi = $("q"); qi.addEventListener("input", () => { q = qi.value.trim(); shown = 40; const pos = qi.selectionStart; drawList(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); });
}
function openCard(k) { cur = k; draw(); window.scrollTo(0, 0); }
function drawCard(p) {
  const v = votes[p.k];
  $("view").innerHTML = `<button class="more" style="margin-top:0;height:40px" onclick="cur=null;draw()">← 回名單</button>
    <div class="card"><div class="top">${ava(p)}<div><div class="nm">${esc(p.n)}</div><div class="occ">${esc(p.o || "本業未載")}</div>
      ${p.s ? `<span class="kind">${KIND[p.s] || ""}</span>` : `<span class="kind">只有榮耀紀錄</span>`}</div></div>
    <h4>獎銜</h4>${(p.ms || []).length ? `<ul class="ms">${p.ms.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="src">沒有榮耀紀錄</p>`}
    ${p.q || (p.sum || []).length ? `<h4>摘要</h4>` : ""}${p.q ? `<p class="q">${esc(p.q)}</p>` : ""}
    ${(p.sum || []).length ? `<ul class="sum">${p.sum.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <h4>資料來源</h4><p class="src">${esc(p.src || "未載")}</p>
    <a class="pub" href="../#${esc(p.k)}" target="_blank" rel="noopener">看他在公開網頁上的樣子 →</a>
    ${v ? `<p class="mine ${v.v}">你標的是：${v.v === "keep" ? "保留" : "建議下架"}${v.n ? "（" + esc(v.n) + "）" : ""}　<a href="#" onclick="vote('');return false" style="color:var(--muted);font-weight:500">取消標記</a></p>` : ""}</div>`;
  $("note").value = (v && v.n) || ""; $("dock").style.display = "block";
}
function step(d) {
  const rows = tab === "todo" ? people : pool(); let i = rows.findIndex(p => p.k === cur);
  if (tab === "todo") { for (let j = i + d; j >= 0 && j < rows.length; j += d) if (!votes[rows[j].k] || d < 0) { openCard(rows[j].k); return; } }
  else if (rows[i + d]) { openCard(rows[i + d].k); return; }
  cur = null; draw();
}
async function vote(v) {
  if (!cur) return; const k = cur, note = v === "remove" ? $("note").value.trim() : "";
  try {
    const r = await rpc("honor_review_vote", { p_token: token, p_code: k, p_vote: v, p_note: note });
    if (!r || !r.ok) throw new Error((r && r.err) || "fail");
  } catch (e) { toast("沒存到，請再按一次"); return; }
  if (v) votes[k] = { v, n: note || null }; else delete votes[k];
  summary = null; toast(v === "keep" ? "已標：保留" : v === "remove" ? "已標：建議下架" : "已取消標記");
  if (!v) { draw(); return; }
  step(1);
}
async function drawSummary() {
  $("dock").style.display = "none"; $("view").innerHTML = `<p class="msg">彙整中⋯</p>`;
  try { summary = summary || await rpc("honor_review_summary", { p_token: token }); } catch (e) { $("view").innerHTML = `<p class="msg">讀不到彙整，請稍後再試</p>`; return; }
  if (!summary) { $("view").innerHTML = `<p class="msg">只有管理員看得到彙整</p>`; return; }
  const by = {}; summary.votes.forEach(x => (by[x.code] = by[x.code] || []).push(x));
  const rows = Object.entries(by).map(([k, xs]) => ({ k, p: byK[k], xs, rm: xs.filter(x => x.v === "remove").length, kp: xs.filter(x => x.v === "keep").length }))
    .filter(r => r.p && r.rm > 0).sort((a, b) => b.rm - a.rm || a.kp - b.kp);
  window._rmList = rows.map(r => `${r.p.n}（${r.p.k}）下架 ${r.rm} 票／保留 ${r.kp} 票` + r.xs.filter(x => x.v === "remove" && x.n).map(x => `｜${x.name}：${x.n}`).join("")).join("\n");
  $("view").innerHTML = `<div class="sumrow"><b>審核人進度</b><p>${summary.reviewers.map(r => `${esc(r.name)} ${r.n} 筆`).join("　") || "尚無"}</p></div>
    <h4>被建議下架的人（${rows.length} 位，票數多的在前）</h4>
    ${rows.length ? `<button class="copy" onclick="copyList()">複製這份名單（貼給 Claude 處理）</button>` : `<p class="msg">目前沒有人被建議下架</p>`}
    ${rows.map(r => `<div class="sumrow" onclick="tab='all';openCard('${r.k}')"><b>${esc(r.p.n)}</b>　<span class="tag remove">下架 ${r.rm}</span> <span class="tag keep">保留 ${r.kp}</span>
      <p>${r.xs.map(x => `${esc(x.name)}：${x.v === "keep" ? "保留" : "下架"}${x.n ? "（" + esc(x.n) + "）" : ""}`).join("　")}</p></div>`).join("")}`;
}
async function copyList() { try { await navigator.clipboard.writeText(window._rmList); toast("已複製"); } catch (e) { prompt("長按全選複製：", window._rmList); } }

async function init() {
  const m = location.hash.match(/t=([a-z0-9]{20,})/);
  try { token = m ? m[1] : (localStorage.getItem("hr_t") || ""); } catch (e) { token = m ? m[1] : ""; }
  if (!token) { $("view").innerHTML = `<p class="msg">這一頁需要專屬連結才能進入。<br>請聯絡 游育杰（魷魚）。</p>`; return; }
  try {
    me = await rpc("honor_review_me", { p_token: token });
    if (!me) { $("view").innerHTML = `<p class="msg">連結無效或已停用。<br>請聯絡 游育杰（魷魚）。</p>`; return; }
    try { localStorage.setItem("hr_t", token); } catch (e) {}
    people = await (await fetch("data.json")).json();
    /* 順序：有故事的人在前（網頁上看得到的），再來是只有榮耀紀錄的；各自依資料豐富度 */
    people.sort((a, b) => (a.s ? 0 : 1) - (b.s ? 0 : 1) || (b.w || 0) - (a.w || 0));
    people.forEach(p => byK[p.k] = p); votes = me.votes || {};
    $("who").textContent = me.name + (me.admin ? "（管理）" : "");
    draw();
  } catch (e) { $("view").innerHTML = `<p class="msg">載入失敗，請稍後再試。</p>`; }
}
init();
</script>
</body>
</html>
