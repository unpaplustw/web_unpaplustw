<html lang="zh-TW">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: rgba(0,0,0,0.07);
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --gold-main: #b8960c;
    --gold-deep: #96790a;
    --gold-light: rgba(184,150,12,.12);
    --gold-grad: linear-gradient(135deg, #96790a, #d4af37);
    --text-dark: #1a1a2e;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text-dark); line-height: 1.6; }

  /* ── header：與首頁一致 ── */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .header-wrap { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--gold-main); text-decoration: none; letter-spacing: 1px; }
  nav a { margin-left: 24px; color: var(--text-dark); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .3s; }
  nav a:hover, nav a.on { color: var(--gold-main); }
  @media (max-width: 768px) { nav a { display: none; } nav a.on { display: inline; margin-left: 0; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 20px 90px; }

  /* ── hero ── */
  .hhero { text-align: center; margin-bottom: 32px; }
  .hhero .tagline { font-size: 13px; color: var(--gold-main); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .hhero h1 { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; margin-bottom: 12px; line-height: 1.2; }
  .hhero p { font-size: 16px; color: var(--text-muted); }
  @media (max-width: 768px) { .hhero h1 { font-size: 30px; } .wrap { padding: 32px 16px 80px; } }

  /* ── 搜尋 / 篩選 ── */
  .search { margin: 24px 0 14px; }
  .search input { width: 100%; height: 50px; border: 1px solid var(--border); border-radius: 10px; padding: 0 18px;
    font-size: 16px; background: var(--card); color: var(--text-dark); outline: none; font-family: inherit; box-shadow: var(--shadow); }
  .search input::placeholder { color: var(--text-muted); }
  .search input:focus { border-color: var(--gold-main); }
  .filter { margin-bottom: 26px; border: 1px solid var(--border); border-radius: 11px;
    background: var(--card); box-shadow: var(--shadow); padding: 0 16px 16px; }
  .filter > summary { cursor: pointer; padding: 14px 0; font-size: 14.5px; font-weight: 700;
    list-style: none; display: flex; align-items: center; gap: 8px; color: var(--text-dark); }
  .filter > summary::-webkit-details-marker { display: none; }
  .filter > summary::before { content: "▸"; color: var(--gold-main); font-size: 13px; transition: transform .2s; }
  .filter[open] > summary::before { transform: rotate(90deg); }
  .filter:not([open]) { padding-bottom: 0; }
  .flabel { font-size: 12.5px; font-weight: 700; color: var(--text-muted); letter-spacing: .1em; margin: 14px 0 9px; }
  .flabel:first-child { margin-top: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: .18s; font-family: inherit; }
  .chips button:hover { border-color: var(--gold-main); color: var(--gold-deep); }
  .chips button.on { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* ── 卡片 grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    cursor: pointer; box-shadow: var(--shadow); transition: all .3s ease; text-align: left; font-family: inherit; }
  .pcard:hover { transform: translateY(-4px); border-color: var(--gold-main); box-shadow: 0 8px 20px rgba(184,150,12,.15); }
  .ava { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; margin-bottom: 12px; background: var(--gold-light); color: var(--gold-deep);
    overflow: hidden; border: 1px solid rgba(184,150,12,.3); }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .pcard h3 { font-size: 17px; font-weight: 700; color: var(--text-dark); }
  .pcard .occ { font-size: 12.5px; color: var(--text-muted); margin: 3px 0 10px; min-height: 19px; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px;
    background: rgba(0,0,0,.05); color: var(--text-muted); }
  .badge.t-cfc   { background: rgba(99,91,196,.12);  color: #4f46a8; }
  .badge.t-peak  { background: rgba(22,145,90,.12);  color: #15803d; }
  .badge.t-star  { background: rgba(184,150,12,.15); color: var(--gold-deep); }
  .badge.t-money { background: rgba(200,80,50,.12);  color: #b4472e; }
  .badge.t-base  { background: rgba(0,0,0,.05);      color: var(--text-muted); }
  .mag { display: inline-block; font-size: 10px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--gold-main); color: var(--gold-deep); background: transparent; margin-left: 4px; }

  .count { font-size: 13px; color: var(--text-muted); margin-top: 24px; text-align: center; }
  .empty { text-align: center; color: var(--text-muted); padding: 56px 0; font-size: 15px; }
  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }

  /* ── 詳細頁 ── */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text-muted);
    cursor: pointer; background: none; border: none; font-weight: 700; font-family: inherit; padding: 8px 0; }
  .back:hover { color: var(--gold-main); }
  .share { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600;
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    color: var(--text-dark); cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: .25s; }
  .share:hover { border-color: var(--gold-main); color: var(--gold-deep); }
  .share.done { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 金句：手機第一屏就看到重點，不是頭銜 */
  .quote { max-width: 760px; margin: 0 auto 20px; text-align: center; }
  .quote blockquote { font-family: 'Playfair Display', serif; font-size: 27px; font-weight: 700;
    line-height: 1.55; color: var(--text-dark); position: relative; padding: 0 8px; }
  .quote blockquote::before { content: "「"; color: var(--gold-main); }
  .quote blockquote::after  { content: "」"; color: var(--gold-main); }
  @media (max-width: 768px) { .quote blockquote { font-size: 21px; } }

  /* 人物標籤：放姓名旁邊，可點連回同類型的人 */
  .ptags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ptag { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(184,150,12,.32); background: var(--gold-light); color: var(--gold-deep);
    cursor: pointer; font-family: inherit; transition: .18s; }
  .ptag:hover { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 重點摘要：口語化條列，給人快速掃 */
  .hl { background: var(--gold-light); border: 1px solid rgba(184,150,12,.22);
    border-radius: 11px; padding: 18px 20px; margin: 22px 0; }
  .hl h4 { font-size: 13px; font-weight: 700; color: var(--gold-deep); letter-spacing: .1em; margin-bottom: 11px; }
  .hl ul { list-style: none; }
  .hl li { font-size: 15px; line-height: 1.8; color: var(--text-dark); padding-left: 19px;
    position: relative; margin-bottom: 8px; }
  .hl li:last-child { margin-bottom: 0; }
  .hl li::before { content: "▪"; position: absolute; left: 3px; color: var(--gold-main); }

  /* 30 秒介紹詞：會員真正要唸出口的那段，接在重點摘要下面同一塊 */
  .tupwrap { margin-top: 17px; padding-top: 15px; border-top: 1px dashed rgba(184,150,12,.35); }
  .tupbox { background: var(--card); border: 1px solid rgba(184,150,12,.25); border-radius: 9px;
    padding: 14px 16px; font-size: 14.5px; line-height: 1.95; color: var(--text-dark); }
  .copytup { margin-top: 10px; font-size: 13px; font-weight: 700; padding: 8px 15px; border-radius: 7px;
    border: 1px solid var(--gold-main); background: var(--card); color: var(--gold-deep);
    cursor: pointer; font-family: inherit; transition: .2s; }
  .copytup:hover, .copytup.done { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 折疊：要深入才點開 */
  details.fold { border: 1px solid var(--border); border-radius: 11px; margin: 14px 0; background: var(--card); }
  details.fold > summary { cursor: pointer; padding: 15px 18px; font-size: 15.5px; font-weight: 700;
    list-style: none; display: flex; align-items: center; gap: 8px; color: var(--text-dark); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--gold-main); font-size: 13px; transition: transform .2s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > div { padding: 0 18px 20px; }

  .src { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.05); color: var(--text-muted); }
  .src.self { background: rgba(22,145,90,.13); color: #15803d; }
  .src.co { background: rgba(99,91,196,.12); color: #4f46a8; }

  /* 共同報導說明：放在故事開頭，避免讀者以為點錯人 */
  .conote { background: rgba(99,91,196,.07); border-left: 3px solid #8b84d4; border-radius: 6px;
    padding: 11px 14px; font-size: 13.5px; line-height: 1.75; color: var(--text-muted); margin-bottom: 16px; }
  .conote strong { color: #4f46a8; }

  .profile { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 28px; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
  @media (max-width: 768px) { .profile { padding: 24px 20px; } }
  /* 上對齊：加了標籤之後右欄變高，置中會讓頭像掉到名字下面 */
  .phead { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .phead .ava { width: 68px; height: 68px; font-size: 26px; margin: 0; flex-shrink: 0; }
  .phead h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
  .phead .occ { font-size: 13.5px; color: var(--text-muted); margin-top: 3px; }
  .sec { font-size: 12px; color: var(--gold-main); letter-spacing: .22em; margin: 28px 0 14px; font-weight: 700; }
  .story { font-size: 16px; line-height: 2.05; white-space: pre-wrap; color: var(--text-dark); }

  .hook { border-bottom: 2px dashed; cursor: pointer; font-weight: 700; }
  .hook.health   { color: #15803d; border-color: #15803d; }
  .hook.business { color: #4f46a8; border-color: #4f46a8; }
  .hook.other    { color: var(--gold-deep); border-color: var(--gold-deep); }
  .expand { border-radius: 10px; padding: 13px 16px; margin: 10px 0; font-size: 14.5px; line-height: 1.85; display: none; }
  .expand.health   { background: rgba(22,145,90,.08);  color: #14532d; }
  .expand.business { background: rgba(99,91,196,.09);  color: #3b3480; }
  .expand.other    { background: var(--gold-light);    color: #6b5606; }

  /* 錨點對不上內文的展開內容，附在故事後面，不讓它消失 */
  .orphan { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .olab { font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  .olab.health   { color: #15803d; }
  .olab.business { color: #4f46a8; }
  .olab.other    { color: var(--gold-deep); }
  .otxt { font-size: 14.5px; line-height: 1.9; color: var(--text-muted); margin-bottom: 14px; white-space: normal; }
  .otxt:last-child { margin-bottom: 0; }

  .tl { margin-top: 4px; }
  .tli { display: flex; gap: 14px; }
  .tlrail { display: flex; flex-direction: column; align-items: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--gold-main); margin-top: 9px; flex-shrink: 0; }
  .rail { width: 2px; flex: 1; background: var(--border); }
  .tlbody { padding-bottom: 20px; }
  .tlbody h4 { font-size: 16px; font-weight: 700; }
  .tlbody p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  footer { background: var(--card); border-top: 1px solid var(--border); padding: 28px 20px; text-align: center; }
  footer p { font-size: 13px; color: var(--text-muted); }
</style>
</head>

  ["time",   "沒有時間",     ["時間", "全年無休", "沒日沒夜", "加班", "分身乏術", "蠟燭兩頭", "忙到", "休假"]],
  ["family", "放不下家人",   ["家人", "孩子", "小孩", "父母", "照顧", "家庭", "女兒", "兒子", "母親", "父親", "先生", "太太", "婆婆"]],
  ["future", "看不到未來",   ["未來", "年紀", "老後", "下半輩子", "天花板", "瓶頸", "茫然", "方向", "撐多久", "退休金"]],
];

/* 標籤 id → 顯示文字／屬於哪一軸。兩軸共用同一組詞彙，標籤才點得回篩選。 */
function tagLabel(id) {
  const r = ROLES.find(x => x[0] === id); if (r) return r[1].replace(/^\S+\s/, "");
  const p = PAINS.find(x => x[0] === id); if (p) return p[1];
  return id;
}
function tagKind(id) { return ROLES.some(x => x[0] === id) ? "role" : (PAINS.some(x => x[0] === id) ? "pain" : ""); }

/* 點人物標籤 → 回列表並套用該篩選，看到同類型的所有人 */
function jumpTag(id) {
  const k = tagKind(id);
  if (k === "role") { activeRole = id; activePain = ""; }
  else if (k === "pain") { activePain = id; activeRole = ""; }
  else return;
  /* ⚠️ 搜尋框要在 renderGrid 之前清空，否則舊關鍵字還在生效
     （實際踩過：點「自己當老闆」chip 顯示 72 人，畫面卻只剩 1 張） */
  document.getElementById("q").value = "";
  goList(); drawChips(); renderGrid();
  /* 從人物頁點標籤跳回來，要讓他看到「現在正在篩什麼」 */
  document.getElementById("filterBox").open = true;
  window.scrollTo(0, 0);
}

function classify(p) {
  /* 🔴 人工標的優先：有 tags 就用，比關鍵字推導準。沒有才退回推導。 */
  const manual = Array.isArray(p.tags) ? p.tags : [];
  if (manual.length) {
    p._role = manual.find(t => ROLES.some(r => r[0] === t)) || "other";
    p._pains = manual.filter(t => PAINS.some(x => x[0] === t));
    return;
  }
  const occ = p.occupation || "";
  const story = p.story_base || "";
  /* 兩段式：先只看 occupation（明確、可靠），判不出來才退回故事內文。
     不可以把兩欄併起來一次比對——例：李春燕職業是「記帳事務所老闆」，
     但故事裡提到「媽媽」，合併比對時 home 排在 boss 前面會先中，把老闆歸成家庭主婦。 */
  let hit = ROLES.find(r => r[2].some(k => occ.includes(k)));
  if (!hit) hit = ROLES.find(r => r[2].some(k => story.includes(k)));
  p._role = (hit || ["other"])[0];
  /* 處境是多標籤、不互斥，合併比對沒問題 */
  const hay = occ + " " + story;
  p._pains = PAINS.filter(x => x[2].some(k => hay.includes(k))).map(x => x[0]);
}

let profiles = [];
let activeRole = "";
let activePain = "";

async function api(path) {
  const res = await fetch(SB_URL + "/rest/v1/" + path, { headers: HEADERS });
  if (!res.ok) throw new Error("API " + res.status);
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

function tierClass(b) {
  b = b || "";
  if (b.includes("CFC")) return "t-cfc";
  if (b.includes("高峰")) return "t-peak";
  if (b.includes("星鑽")) return "t-star";
  if (b.includes("美金")) return "t-money";
  return "t-base";
}

function isMag(p) {
  return Array.isArray(p.honor_milestones) && p.honor_milestones.length > 0;
}

/* 🔴 一個人可以同時持有多個授勳，不是互相取代（Randoph 2026-09-25）。
   實測 357 人中 73 人（20%）持有 2 種以上，最多 4 種。
   所以徽章要全部列出，不能只顯示一個 current_badge。
   排序見 優秀會員/README：AQA、CFC Master、CFC > 高峰 > 12→1星鑽 > 終身成就 > 進階成就 > 成就 */
const RANK_ORDER = ["AQA", "CFC Master", "CFC", "高峰",
  "12星鑽", "9星鑽", "7星鑽", "5星鑽", "3星鑽", "1星鑽", "星鑽",
  "終身成就", "進階成就", "成就"];
const MONEY_ORDER = ["4千萬美金", "三千萬美金", "兩千萬美金", "千萬美金", "百萬美金"];

function allBadges(p) {
  const seen = [];
  (p.honor_milestones || []).forEach(m => {
    if (m.badge && !seen.includes(m.badge)) seen.push(m.badge);
  });
  if (!seen.length && p.current_badge && p.current_badge !== "待補") seen.push(p.current_badge);
  const idx = b => {
    const i = RANK_ORDER.indexOf(b);
    if (i >= 0) return i;
    const j = MONEY_ORDER.indexOf(b);
    return j >= 0 ? 100 + j : 200;   // 美金里程碑是另一軸，排在位階之後
  };
  return seen.sort((a, b) => idx(a) - idx(b));
}

/* 🔴 對外用語對照（Randoph 2026-09-23）：內部位階名新朋友聽不懂，聽不懂就接不到情緒。
   只改「顯示」，資料庫的 current_badge 不動（榮譽榜重生腳本靠它分組）。
   要改回原樣：把這張表清空即可。 */
const BADGE_ALIAS = { "成就": "全球分紅" };
/* 位階待補／空白的人不顯示徽章——公開頁面掛「待補」很難看 */
function badgeHtml(b) {
  if (!b || b === "待補") return "";
  const show = BADGE_ALIAS[b] || b;
  return `<span class="badge ${tierClass(b)}">${esc(show)}</span>`;
}

/* 30 秒介紹詞的複製鈕。重點摘要是給人「掃」的，TUP 是給會員「唸」的，兩者都要。 */
async function copyTup() {
  const btn = document.getElementById("tupBtn");
  const txt = document.getElementById("tupbox").textContent;
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  btn.textContent = "✓ 已複製，可以直接唸了";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = "複製這段介紹詞"; btn.classList.remove("done"); }, 2400);
}

/* chips 標籤帶人數，0 人的不顯示——避免按下去一片空白 */
function drawChips() {
  const roleN = {}, painN = {};
  profiles.forEach(p => {
    roleN[p._role] = (roleN[p._role] || 0) + 1;
    p._pains.forEach(x => painN[x] = (painN[x] || 0) + 1);
  });
  document.getElementById("roleChips").innerHTML =
    `<button class="${activeRole ? "" : "on"}" onclick="setRole('')">全部 ${profiles.length}</button>` +
    ROLES.filter(r => roleN[r[0]]).map(r =>
      `<button class="${r[0] === activeRole ? "on" : ""}" onclick="setRole('${r[0]}')">${r[1]} ${roleN[r[0]]}</button>`
    ).join("") +
    (roleN.other ? `<button class="${activeRole === "other" ? "on" : ""}" onclick="setRole('other')">其他 ${roleN.other}</button>` : "");

  document.getElementById("painChips").innerHTML =
    `<button class="${activePain ? "" : "on"}" onclick="setPain('')">不限</button>` +
    PAINS.filter(x => painN[x[0]]).map(x =>
      `<button class="${x[0] === activePain ? "on" : ""}" onclick="setPain('${x[0]}')">${x[1]} ${painN[x[0]]}</button>`
    ).join("");

  /* 收合時也要看得出目前篩了什麼，否則使用者會忘記自己還在篩選中 */
  const on = [activeRole && tagLabel(activeRole), activePain && tagLabel(activePain)].filter(Boolean);
  document.getElementById("filterSum").textContent = on.length ? "篩選：" + on.join(" ＋ ") : "篩選";
}
function setRole(r) { activeRole = (activeRole === r) ? "" : r; drawChips(); renderGrid(); }
function setPain(x) { activePain = (activePain === x) ? "" : x; drawChips(); renderGrid(); }

/* 加權洗牌：每次進頁洗一次，勳章高／有故事／越晚進榜者傾向領頭 */
function tierRank(b) {
  b = b || "";
  for (let i = 0; i < BADGE_ORDER.length; i++) if (b.includes(BADGE_ORDER[i])) return BADGE_ORDER.length - i;
  return 0;
}
function freshScore(p, newestTs, span) {
  const t = p.created_at ? Date.parse(p.created_at) : 0;
  return span > 0 ? Math.max(0, (t - (newestTs - span)) / span) : 0;
}
function weightedShuffle(arr) {
  const ts = arr.map(p => p.created_at ? Date.parse(p.created_at) : 0).filter(Boolean);
  const newest = ts.length ? Math.max(...ts) : 0;
  const span = newest && ts.length ? newest - Math.min(...ts) : 0;
  arr.forEach(p => {
    const w = 1 + tierRank(allBadges(p)[0]) * 0.5 + (p.story_base ? 1.2 : 0) + freshScore(p, newest, span) * 1.0;
    p._k = Math.pow(Math.random() || 1e-9, 1 / w);
  });
  arr.sort((a, b) => b._k - a._k);
}

function renderGrid() {
  const q = document.getElementById("q").value.trim();
  const rows = profiles.filter(p => {
    const hitQ = !q || (p.name + (p.occupation || "") + (p.story_base || "")).includes(q);
    const hitR = !activeRole || p._role === activeRole;
    const hitP = !activePain || p._pains.includes(activePain);
    return hitQ && hitR && hitP;
  });
  /* ⚠️ 搜尋時姓名命中要排前面。搜尋範圍含 story_base，夫妻共同報導裡寫了對方的名字，
     不排序的話搜「謝安妮」第一張會是陳勤聰，使用者會以為點錯人。 */
  if (q) {
    const score = p => (p.name.includes(q) ? 0 : (p.occupation || "").includes(q) ? 1 : 2);
    rows.sort((a, b) => score(a) - score(b));
  }
  const grid = document.getElementById("grid");
  if (!rows.length) {
    grid.innerHTML = `<p class="empty" style="grid-column:1/-1;">這個組合目前沒有人，把「我卡在⋯」改成「不限」再試一次</p>`;
    document.getElementById("count").textContent = "";
    return;
  }
  grid.innerHTML = rows.map(p => `
    <button class="pcard" onclick="openDetail('${p.id}')">
      <div class="ava">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(p.name[0])}</div>
      <h3>${esc(p.name)}</h3>
      <p class="occ">${esc(p.occupation || "")}</p>
      ${allBadges(p).map(badgeHtml).join("")}${p.source_type === "self" ? '<span class="src self">🗣 自述</span>' : ""}
    </button>`).join("");
  document.getElementById("count").textContent = `共 ${rows.length} 位夥伴`;
}

/* 🔴 expansions 的錨點一律屬於「月刊那篇」：story_magazine 有值就對它，否則對 story_base。
   同一人可同時有本人自述與月刊報導——兩份都留，網頁只決定呈現順序。 */
function magText(p) { return p.story_magazine || (p.source_type === "self" ? "" : p.story_base || ""); }

/* 回傳 [內文HTML, 對不上錨點的 expansions]。
   ⚠️ 404 個錨點裡有 80 個（20%）對不上內文——那些是「標題式」寫法
   （例：「女兒引薦母親入行」），不是內文裡的句子。原本的寫法會讓那些
   展開內容永遠顯示不出來，等於被隱形刪掉。改成撈出來附在故事後面。 */
function renderStory(p, text) {
  let html = esc(text != null ? text : (p.story_base || ""));
  const orphan = [];
  (p.expansions || []).forEach((ex, i) => {
    const anchor = esc(ex.anchor);
    if (anchor && html.includes(anchor)) {
      html = html.replace(anchor, `<span class="hook ${esc(ex.type)}" onclick="toggleEx(${i})">${anchor}</span><span id="exslot${i}"></span>`);
    } else if (ex.content) {
      orphan.push(ex);
    }
  });
  if (orphan.length) {
    html += `<div class="orphan">` + orphan.map(ex =>
      `<p class="olab ${esc(ex.type)}">${esc(ex.anchor)}</p><p class="otxt">${esc(ex.content)}</p>`
    ).join("") + `</div>`;
  }
  return html;
}
function toggleEx(i) {
  const el = document.getElementById("ex" + i);
  if (el) el.style.display = el.style.display === "block" ? "none" : "block";
}

/* ── 分享：每個人有自己的網址，可直接傳 LINE ── */
async function shareThis() {
  const btn = document.getElementById("shareBtn");
  const url = location.href;
  const title = document.querySelector("#profile h2")?.textContent || "優秀會員歷程";
  if (navigator.share) {
    try { await navigator.share({ title: title + "｜優秀會員歷程", url }); return; } catch (e) { /* 取消就改複製 */ }
  }
  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  btn.textContent = "✓ 連結已複製";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = "🔗 複製這個人的連結"; btn.classList.remove("done"); }, 2200);
}

/* 點卡片 → 推一筆歷史，手機「上一頁」才回得了列表 */
function openDetail(id) {
  history.pushState({ id }, "", "#" + id);
  showDetail(id);
}
function goList() {
  history.pushState({}, "", location.pathname);
  showList();
}
function showList() {
  document.getElementById("detail-view").style.display = "none";
  document.getElementById("list-view").style.display = "block";
}
window.addEventListener("popstate", () => {
  const h = location.hash.slice(1);
  if (h) showDetail(h); else showList();
});

async function showDetail(id) {
  const p = profiles.find(x => x.id === id);
  if (!p) { showList(); return; }
  document.getElementById("list-view").style.display = "none";
  document.getElementById("detail-view").style.display = "block";
  window.scrollTo(0, 0);

  /* 金句放最上面：手機第一屏看到的是處境，不是頭銜 */
  document.getElementById("quoteBox").innerHTML =
    p.quote ? `<blockquote>${esc(p.quote)}</blockquote>` : "";

  const isSelf = p.source_type === "self";
  /* 人工標的優先；沒有就用推導結果，讓 282 人也有標籤可點 */
  const tags = (Array.isArray(p.tags) && p.tags.length)
    ? p.tags
    : [p._role, ...(p._pains || [])].filter(t => t && t !== "other");
  let html = `
    <div class="phead">
      <div class="ava">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(p.name[0])}</div>
      <div>
        <h2>${esc(p.name)}</h2>
        <p class="occ">${esc(p.occupation || "")}</p>
        <p style="margin-top:7px;"><span class="src ${isSelf ? "self" : ""}">${isSelf ? "🗣 本人自述" : "📰 月刊報導"}</span>${
          p.co_with && p.co_with.name
            ? ` <span class="src co">👥 與 ${esc(p.co_with.name)} ${esc(p.co_with.relation)}共同</span>` : ""
        }</p>
        ${tags.length ? `<div class="ptags">${tags.map(t =>
          `<button class="ptag" onclick="jumpTag('${esc(t)}')">${esc(tagLabel(t))}</button>`).join("")}</div>` : ""}
      </div>
      <div style="margin-left:auto;text-align:right;max-width:46%;">
        ${allBadges(p).map(badgeHtml).join(" ")}
      </div>
    </div>`;

  /* 重點摘要（掃的）＋ 30 秒介紹詞（唸的）——同一塊，不標「給夥伴用」 */
  const hls = Array.isArray(p.highlights) ? p.highlights : [];
  if (hls.length || p.tup) {
    html += `<div class="hl">`;
    if (hls.length) {
      html += `<h4>重點摘要</h4><ul>${hls.map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;
    }
    if (p.tup) {
      html += `<div class="${hls.length ? "tupwrap" : ""}">
        <h4>30 秒這樣介紹他</h4>
        <div class="tupbox" id="tupbox">${esc(p.tup)}</div>
        <button class="copytup" id="tupBtn" onclick="copyTup()">複製這段介紹詞</button>
      </div>`;
    }
    html += `</div>`;
  }

  /* 🔴 本人自述在上（當下最新鮮、第一人稱），月刊報導折疊在下當佐證。
     兩份都留、互不覆蓋——知識庫只進不出，網頁只決定呈現順序。 */
  if (isSelf && p.story_base) {
    html += `<details class="fold"><summary>看他完整的故事（本人自述）</summary><div>
      <div class="story">${esc(p.story_base)}</div>
    </div></details>`;
  }

  const mag = magText(p);
  if (mag) {
    /* 月刊常寫夫妻檔／家族檔，一篇報導兩人共用——標清楚，讀者才知道
       為什麼開頭寫的是另一個人。只標示，不合併、不刪除。 */
    const co = p.co_with && p.co_with.name ? p.co_with : null;
    const title = co
      ? `展翅月刊報導（與 ${esc(co.name)} ${esc(co.relation)}共同）`
      : "展翅月刊報導";
    html += `<details class="fold"><summary>${title}</summary><div>
      ${co ? `<p class="conote">這是一篇<strong>${esc(co.relation)}共同報導</strong>，內容同時講 ${esc(p.name)} 與 ${esc(co.name)} 兩個人，所以開頭不一定從 ${esc(p.name)} 講起。</p>` : ""}
      ${isSelf ? `<p class="conote">這是較早的月刊報導，放在這裡當佐證。上面那篇才是他自己現在講的版本。</p>` : ""}
      <div class="story" id="storybox">${renderStory(p, mag)}</div>
      ${(p.expansions || []).length ? `<p class="hint">虛線文字可以點開，看更多細節</p>` : ""}
    </div></details>`;
  }
  html += `<p class="sec">成就歷程</p><div class="tl" id="tl"><p class="hint">載入中⋯</p></div>`;
  document.getElementById("profile").innerHTML = html;

  (p.expansions || []).forEach((ex, i) => {
    const slot = document.getElementById("exslot" + i);
    if (!slot) return;
    const box = document.createElement("span");
    box.className = "expand " + ex.type;
    box.id = "ex" + i;
    box.textContent = ex.content;
    slot.after(box);
  });

  try {
    const ms = await api(`honor_milestones?profile_id=eq.${id}&select=badge,achieved_date,content,source_ref&order=achieved_date.desc.nullslast,created_at.desc`);
    const tl = document.getElementById("tl");
    if (!ms.length) { tl.innerHTML = `<p class="hint">歷程整理中</p>`; return; }
    tl.innerHTML = ms.map((m, i) => {
      const meta = [m.achieved_date ? m.achieved_date.slice(0, 7).replace("-", ".") : "", m.source_ref || ""].filter(Boolean).join(" · ");
      const summary = (m.content || "").replace(/（wiki:[^）]*）/g, "").trim();
      return `
      <div class="tli">
        <div class="tlrail"><div class="dot"></div>${i < ms.length - 1 ? '<div class="rail"></div>' : ""}</div>
        <div class="tlbody"><h4>${esc(m.badge)}</h4><p>${esc(summary)}</p>${meta ? `<p>${esc(meta)}</p>` : ""}</div>
      </div>`;
    }).join("");
  } catch (e) {
    document.getElementById("tl").innerHTML = `<p class="hint">歷程載入失敗，請稍後再試</p>`;
  }
}

async function init() {
  try {
    /* honor_milestones(badge) 取回全部授勳——一個人可能有多個，要全部顯示 */
    profiles = await api("honor_profiles?select=id,name,photo_url,occupation,current_badge,source_type,co_with,quote,tags,highlights,tup,story_base,story_magazine,expansions,created_at,honor_milestones(badge)&order=name");
    profiles.forEach(classify);
    weightedShuffle(profiles);
    /* 桌機空間夠就攤開；手機收起來，先讓人看到人而不是一片按鈕 */
    if (window.innerWidth >= 768) document.getElementById("filterBox").open = true;
    drawChips();
    renderGrid();
    const hash = location.hash.slice(1);
    if (hash) showDetail(hash);
  } catch (e) {
    document.getElementById("grid").innerHTML = `<p class="empty" style="grid-column:1/-1;">資料載入失敗，請稍後再試</p>`;
  }
}
document.getElementById("q").addEventListener("input", renderGrid);
init();
</script>
