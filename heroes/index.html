<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>優秀會員歷程｜APLUS 系統</title>
<meta name="description" content="上百位夥伴的真實歷程。看他們當時卡在哪，後來怎麼翻過來的。">
<meta property="og:title" content="優秀會員歷程｜APLUS 系統">
<meta property="og:description" content="每一位，都曾是和你一樣的普通人。">
<!-- 中文字用手機內建（蘋方／思源黑體），不下載 Noto Sans TC：那包約 1.8 MB，比整頁資料大 7 倍（2026-11-06 實測）。只載英文標題字。 -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: rgba(0,0,0,0.07);
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --gold-main: #b8960c;
    --gold-deep: #96790a;
    --gold-light: rgba(184,150,12,.12);
    --gold-grad: linear-gradient(135deg, #96790a, #d4af37);
    --text-dark: #1a1a2e;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', 'Noto Sans CJK TC', sans-serif; background: var(--bg); color: var(--text-dark); line-height: 1.6; }

  /* ── header：與首頁一致 ── */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .header-wrap { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--gold-main); text-decoration: none; letter-spacing: 1px; }
  nav a { margin-left: 24px; color: var(--text-dark); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .3s; }
  nav a:hover, nav a.on { color: var(--gold-main); }
  @media (max-width: 768px) { nav a { display: none; } nav a.on { display: inline; margin-left: 0; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 20px 90px; }

  /* ── hero ── */
  .hhero { text-align: center; margin-bottom: 32px; }
  .hhero .tagline { font-size: 13px; color: var(--gold-main); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .hhero h1 { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; margin-bottom: 12px; line-height: 1.2; }
  .hhero p { font-size: 16px; color: var(--text-muted); }
  @media (max-width: 768px) { .hhero h1 { font-size: 30px; } .wrap { padding: 32px 16px 80px; } }

  /* ── 搜尋 / 篩選 ── */
  /* 緣分卡（Randoph 2026-11-14）：一進來隨機一位有照片＋金句的夥伴；約三分之一畫面，不把搜尋推走 */
  .fate { margin: 18px 0 0; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    padding: 18px 18px 16px; display: grid; grid-template-columns: 96px 1fr; gap: 6px 16px; align-items: center; }
  .fate .fava { grid-row: span 2; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: var(--gold-light);
    border: 3px solid transparent; background-image: linear-gradient(var(--card), var(--card)), var(--gold-grad); background-origin: border-box; background-clip: padding-box, border-box; }
  .fate .fava img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; transition: opacity .25s; }
  .fate .fq { font-size: 18px; font-weight: 700; line-height: 1.5; color: var(--text-dark); align-self: end; }
  .fate .fq::before { content: "「"; color: var(--gold-main); } .fate .fq::after { content: "」"; color: var(--gold-main); }
  .fate .fn { font-size: 14px; color: var(--text-muted); align-self: start; }
  .fate .fn b { color: var(--text-dark); font-weight: 700; margin-right: 6px; }
  .fate .fbtn { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 10px; }
  .fate .fbtn button { flex: 1; height: 46px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .fate .go { background: var(--gold-grad); color: #fff; border: 0; }
  .fate .again { background: var(--card); color: var(--gold-deep); border: 1.5px solid var(--gold-main); }
  .fate.swap .fq, .fate.swap .fn, .fate.swap .fava img { opacity: 0; }
  .fate .fq, .fate .fn { transition: opacity .25s; }
  .search { margin: 24px 0 14px; }
  .search input { width: 100%; height: 50px; border: 1px solid var(--border); border-radius: 10px; padding: 0 18px;
    font-size: 16px; background: var(--card); color: var(--text-dark); outline: none; font-family: inherit; box-shadow: var(--shadow); }
  .search input::placeholder { color: var(--text-muted); }
  .search input:focus { border-color: var(--gold-main); }
  .filter { margin-bottom: 26px; border: 1px solid var(--border); border-radius: 11px;
    background: var(--card); box-shadow: var(--shadow); padding: 0 16px 16px; }
  .filter > summary { cursor: pointer; padding: 14px 0; font-size: 14.5px; font-weight: 700;
    list-style: none; display: flex; align-items: center; gap: 8px; color: var(--text-dark); }
  .filter > summary::-webkit-details-marker { display: none; }
  .filter > summary::before { content: "▸"; color: var(--gold-main); font-size: 13px; transition: transform .2s; }
  .filter[open] > summary::before { transform: rotate(90deg); }
  .filter:not([open]) { padding-bottom: 0; }
  .flabel { font-size: 12.5px; font-weight: 700; color: var(--text-muted); letter-spacing: .1em; margin: 14px 0 9px; }
  .flabel:first-child { margin-top: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: .18s; font-family: inherit; }
  .chips button:hover { border-color: var(--gold-main); color: var(--gold-deep); }
  .chips button.on { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* ── 卡片 grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    cursor: pointer; box-shadow: var(--shadow); transition: all .3s ease; text-align: left; font-family: inherit; }
  .pcard:hover { transform: translateY(-4px); border-color: var(--gold-main); box-shadow: 0 8px 20px rgba(184,150,12,.15); }
  .ava { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; margin-bottom: 12px; background: var(--gold-light); color: var(--gold-deep);
    overflow: hidden; border: 1px solid rgba(184,150,12,.3); }
  .ava img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; }  /* 直式照片臉在上方，不從正中裁（2026-11-06 陳佩瑩） */
  .pcard h3 { font-size: 17px; font-weight: 700; color: var(--text-dark); }
  .pcard .occ { font-size: 12.5px; color: var(--text-muted); margin: 3px 0 10px; min-height: 19px; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px;
    background: rgba(0,0,0,.05); color: var(--text-muted); }
  .badge.t-cfc   { background: rgba(99,91,196,.12);  color: #4f46a8; }
  .badge.t-peak  { background: rgba(22,145,90,.12);  color: #15803d; }
  .badge.t-star  { background: rgba(184,150,12,.15); color: var(--gold-deep); }
  .badge.t-money { background: rgba(200,80,50,.12);  color: #b4472e; }
  .badge.t-base  { background: rgba(0,0,0,.05);      color: var(--text-muted); }
  .mag { display: inline-block; font-size: 10px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--gold-main); color: var(--gold-deep); background: transparent; margin-left: 4px; }

  .count { font-size: 13px; color: var(--text-muted); margin-top: 24px; text-align: center; }
  .empty { text-align: center; color: var(--text-muted); padding: 56px 0; font-size: 15px; }
  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }

  /* ── 詳細頁 ── */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text-muted);
    cursor: pointer; background: none; border: none; font-weight: 700; font-family: inherit; padding: 8px 0; }
  .back:hover { color: var(--gold-main); }
  .share { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600;
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    color: var(--text-dark); cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: .25s; }
  .share:hover { border-color: var(--gold-main); color: var(--gold-deep); }
  .share.done { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 金句：手機第一屏就看到重點，不是頭銜 */
  .quote { max-width: 760px; margin: 0 auto 20px; text-align: center; }
  .quote blockquote { font-family: 'Playfair Display', serif; font-size: 27px; font-weight: 700;
    line-height: 1.55; color: var(--text-dark); position: relative; padding: 0 8px; }
  .quote blockquote::before { content: "「"; color: var(--gold-main); }
  .quote blockquote::after  { content: "」"; color: var(--gold-main); }
  @media (max-width: 768px) { .quote blockquote { font-size: 20px; line-height: 1.6; } .quote { margin-bottom: 16px; padding: 0 4px; } }

  /* 人物標籤：放姓名旁邊，可點連回同類型的人 */
  .ptags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ptag { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(184,150,12,.32); background: var(--gold-light); color: var(--gold-deep);
    cursor: pointer; font-family: inherit; transition: .18s; }
  .ptag:hover { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 重點摘要：口語化條列，給人快速掃 */
  .hl { background: var(--gold-light); border: 1px solid rgba(184,150,12,.22);
    border-radius: 11px; padding: 18px 20px; margin: 22px 0; }
  .hl h4 { font-size: 13px; font-weight: 700; color: var(--gold-deep); letter-spacing: .1em; margin-bottom: 11px; }
  .hl ul { list-style: none; }
  .hl li { font-size: 15px; line-height: 1.8; color: var(--text-dark); padding-left: 19px;
    position: relative; margin-bottom: 8px; }
  .hl li:last-child { margin-bottom: 0; }
  .hl li::before { content: "▪"; position: absolute; left: 3px; color: var(--gold-main); }

  /* 30 秒介紹詞：會員真正要唸出口的那段，接在重點摘要下面同一塊 */
  .tupwrap { margin-top: 17px; padding-top: 15px; border-top: 1px dashed rgba(184,150,12,.35); }
  .tupbox { background: var(--card); border: 1px solid rgba(184,150,12,.25); border-radius: 9px;
    padding: 14px 16px; font-size: 14.5px; line-height: 1.95; color: var(--text-dark); }
  .copytup { margin-top: 10px; font-size: 13px; font-weight: 700; padding: 8px 15px; border-radius: 7px;
    border: 1px solid var(--gold-main); background: var(--card); color: var(--gold-deep);
    cursor: pointer; font-family: inherit; transition: .2s; }
  .copytup:hover, .copytup.done { background: var(--gold-grad); color: #fff; border-color: transparent; }

  /* 折疊：要深入才點開 */
  details.fold { border: 1px solid var(--border); border-radius: 11px; margin: 14px 0; background: var(--card); }
  details.fold > summary { cursor: pointer; padding: 15px 18px; font-size: 15.5px; font-weight: 700;
    list-style: none; display: flex; align-items: center; gap: 8px; color: var(--text-dark); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--gold-main); font-size: 13px; transition: transform .2s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > div { padding: 0 18px 20px; }

  .src { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.05); color: var(--text-muted); }
  .src.self { background: rgba(22,145,90,.13); color: #15803d; }
  .src.co { background: rgba(99,91,196,.12); color: #4f46a8; }

  /* 共同報導說明：放在故事開頭，避免讀者以為點錯人 */
  .conote { background: rgba(99,91,196,.07); border-left: 3px solid #8b84d4; border-radius: 6px;
    padding: 11px 14px; font-size: 13.5px; line-height: 1.75; color: var(--text-muted); margin-bottom: 16px; }
  .conote strong { color: #4f46a8; }

  .profile { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 28px; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
  @media (max-width: 768px) { .profile { padding: 22px 16px; }
    details.fold > summary { padding: 13px 14px; } details.fold > div { padding: 0 14px 16px; } }
  /* 上對齊：加了標籤之後右欄變高，置中會讓頭像掉到名字下面 */
  /* 頭部上下排：照片＋姓名一行，徽章／來源／關係／標籤各佔整條寬（手機不再被右欄擠成半邊） */
  .phead { padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .prow { display: flex; align-items: center; gap: 16px; }
  .phead .ava { width: 76px; height: 76px; font-size: 28px; margin: 0; flex-shrink: 0; }
  .phead h2 { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; line-height: 1.3; }
  .phead .occ { font-size: 14px; color: var(--text-muted); margin: 2px 0 0; min-height: 0; }
  .pbadges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 16px; }
  .bmore { font-size: 12.5px; color: var(--gold-deep); text-decoration: none; margin-left: 4px; font-weight: 700; }
  .pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 12px; }
  .pmeta .rel { font-size: 13px; color: var(--text-muted); margin: 0; }
  .phead .ptags { margin-top: 14px; }
  .ptag { font-size: 13px; padding: 5px 13px; }
  .sec { font-size: 12px; color: var(--gold-main); letter-spacing: .22em; margin: 28px 0 14px; font-weight: 700; }
  .story { font-size: 16px; line-height: 2.05; white-space: pre-wrap; color: var(--text-dark); }
  /* 分段故事：段落之間留白，行距收一點；pre-wrap 會把模板縮排當成空行，分段時關掉 */
  .story:has(> .beat) { white-space: normal; }
  .beat { font-size: 16.5px; line-height: 1.95; margin-bottom: 18px; }
  .beat:first-child::first-letter { font-size: 1.25em; font-weight: 700; color: var(--gold-deep); }

  .hook { border-bottom: 2px dashed; cursor: pointer; font-weight: 700; }
  .hook.health   { color: #15803d; border-color: #15803d; }
  .hook.business { color: #4f46a8; border-color: #4f46a8; }
  .hook.other    { color: var(--gold-deep); border-color: var(--gold-deep); }
  .expand { border-radius: 10px; padding: 13px 16px; margin: 10px 0; font-size: 14.5px; line-height: 1.85; display: none; }
  .expand.health   { background: rgba(22,145,90,.08);  color: #14532d; }
  .expand.business { background: rgba(99,91,196,.09);  color: #3b3480; }
  .expand.other    { background: var(--gold-light);    color: #6b5606; }

  /* 錨點對不上內文的展開內容，附在故事後面，不讓它消失 */
  .orphan { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .olab { font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  .olab.health   { color: #15803d; }
  .olab.business { color: #4f46a8; }
  .olab.other    { color: var(--gold-deep); }
  .otxt { font-size: 14.5px; line-height: 1.9; color: var(--text-muted); margin-bottom: 14px; white-space: normal; }
  .otxt:last-child { margin-bottom: 0; }

  .tl { margin-top: 4px; }
  .tli { display: flex; gap: 14px; }
  .tlrail { display: flex; flex-direction: column; align-items: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--gold-main); margin-top: 9px; flex-shrink: 0; }
  .rail { width: 2px; flex: 1; background: var(--border); }
  .tlbody { padding-bottom: 20px; }
  .tlbody h4 { font-size: 16px; font-weight: 700; }
  .tlbody p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  footer { background: var(--card); border-top: 1px solid var(--border); padding: 28px 20px; text-align: center; }
  footer p { font-size: 13px; color: var(--text-muted); }
  /* ── 2026-11-06 靜態檔版新增 ── */
  .pcard .q { font-size: 13px; line-height: 1.6; color: var(--text-dark); margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .q::before { content: "「"; color: var(--gold-main); }
  .pcard .q::after  { content: "」"; color: var(--gold-main); }
  .more { display: block; margin: 22px auto 0; font-size: 14px; font-weight: 700; padding: 11px 26px; border-radius: 999px;
    border: 1px solid var(--gold-main); background: var(--card); color: var(--gold-deep); cursor: pointer; font-family: inherit; }
  .rel { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .exits { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; max-width: 760px; margin: 22px auto 0; }
  .exits button { font-size: 14.5px; font-weight: 700; padding: 12px 22px; border-radius: 999px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--gold-main); background: var(--card); color: var(--gold-deep); }
  .exits button.main { background: var(--gold-grad); color: #fff; border-color: transparent; }
  .srch-note { font-size: 12.5px; color: var(--text-muted); text-align: center; margin: -8px 0 16px; }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <a href="/" class="logo">APLUS</a>
    <nav>
      <a href="/">首頁</a>
      <a href="/heroes/" class="on">優秀會員歷程</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="list-view">
    <div class="hhero">
      <div class="tagline">真實歷程</div>
      <h1>優秀會員歷程</h1>
      <p>每一位，都曾是和你一樣的普通人</p>
    </div>
    <div class="fate" id="fate" style="display:none">
      <div class="fava"><img id="fateImg" alt=""></div>
      <p class="fq" id="fateQ"></p>
      <p class="fn" id="fateN"></p>
      <div class="fbtn"><button class="go" onclick="fateGo()">看完整故事</button><button class="again" onclick="fateNext()">🎲 換一個緣分</button></div>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="搜尋姓名或職業，例如：保險、藥局、家庭主婦" />
    </div>
    <!-- 手機預設收合：chips 是導覽，但一整片按鈕會把人擋在名單之外 -->
    <details class="filter" id="filterBox">
      <summary id="filterSum">篩選</summary>
      <p class="flabel">我是⋯</p>
      <div class="chips" id="roleChips"></div>
      <p class="flabel">我卡在⋯</p>
      <div class="chips" id="painChips"></div>
      <p class="flabel">我想看⋯</p>
      <div class="chips" id="rankChips"></div>
    </details>
    <p class="srch-note" id="srchNote"></p>
    <div class="grid" id="grid"></div>
    <button class="more" id="moreBtn" style="display:none" onclick="showMore()">再看 24 位</button>
    <p class="count" id="count"></p>
  </div>

  <div id="detail-view" style="display:none;">
    <div class="topbar">
      <button class="back" onclick="goList()">← 回列表</button>
      <button class="share" id="shareBtn" onclick="shareThis()">🔗 複製這個人的連結</button>
    </div>
    <div class="quote" id="quoteBox"></div>
    <div class="profile" id="profile"></div>
    <div class="exits" id="exits"></div>
  </div>
</div>

<footer>
  <p>© 2026 APLUS 系統 | AI驅動事業教育系統</p>
</footer>

<script>
/* ══ 資料：只讀靜態檔，不讀 Supabase（Randoph 2026-11-06：全用免費額度，要省流量）══
   data/list.json  全員精簡欄位（列表／篩選／搜尋）——由 wiki/_scripts/優秀會員重生.py 產生
   data/p/{f}.json 每人一檔，點開內頁才載
   t/{照片}.jpg    160px 縮圖，滑到才載（loading=lazy）
   🔴 不要在這裡改資料。正本在 wiki 母體，改完跑重生腳本。 */
const PAGE = 24;

/* 篩選詞彙：id 與重生腳本的 ROLES／PAINS 同一組。分類已在腳本算好，這裡只負責顯示。 */
const ROLES = [["home","🏠 家庭主婦"],["boss","🏪 自己當老闆"],["sales","💼 業務・金融"],["teach","📚 老師・教育"],
               ["skill","🔧 技術・勞力"],["office","🏢 上班族"],["retired","🌇 退休・銀髮"]];
const PAINS = [["health","健康亮紅燈"],["money","收入卡住"],["time","沒有時間"],["family","放不下家人"],["future","看不到未來"]];
const RANK = ["AQA","CFC Master","CFC","高峰","12星鑽","9星鑽","7星鑽","5星鑽","3星鑽","1星鑽","星鑽","終身成就","進階成就","成就"];
/* 🔴 對外用語對照（Randoph 2026-09-23）：只改顯示 */
const BADGE_ALIAS = { "成就": "全球分紅" };
/* 獎銜篩選（Randoph 2026-11-14）：按每人「最高獎銜」分 4 組，一人只落一組（MECE）；14 種獎銜不逐一列，免得按鈕擠滿手機 */
const RANK_GROUPS = [["cfc","CFC 以上",["AQA","CFC Master","CFC"]],["peak","高峰",["高峰"]],
                     ["star","星鑽",["12星鑽","9星鑽","7星鑽","5星鑽","3星鑽","1星鑽","星鑽"]],["ach","全球分紅",["終身成就","進階成就","成就"]]];
function rankGroup(p) { const top = (p.b || []).find(b => RANK.includes(b)); const g = top && RANK_GROUPS.find(x => x[2].includes(top)); return g ? g[0] : ""; }

let people = [], redirect = {}, byKey = {}, byName = {};
let activeRole = "", activePain = "", activeRank = "", shown = PAGE, cur = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function tagLabel(id) { const r = ROLES.find(x => x[0] === id); if (r) return r[1].replace(/^\S+\s/, ""); const p = PAINS.find(x => x[0] === id); return p ? p[1] : id; }
function tagKind(id) { return ROLES.some(x => x[0] === id) ? "role" : (PAINS.some(x => x[0] === id) ? "pain" : ""); }
function tierClass(b) { b = b || ""; if (b.includes("CFC")) return "t-cfc"; if (b.includes("高峰")) return "t-peak"; if (b.includes("星鑽")) return "t-star"; if (b.includes("美金")) return "t-money"; return "t-base"; }
function badgeHtml(b) { return b ? `<span class="badge ${tierClass(b)}">${esc(BADGE_ALIAS[b] || b)}</span>` : ""; }
/* 頭部只放兩個：位階最高一個＋收入最高一個；其餘在成就歷程（2026-11-06 蕭妤安 8 個徽章擠滿半屏） */
function topBadges(bs) {
  bs = bs || [];
  const pos = bs.filter(b => !b.includes("美金")), money = bs.filter(b => b.includes("美金"));
  return [pos[0], money[0]].filter(Boolean);
}
function ava(p, img) { return `<div class="ava">${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async">` : esc(p.n[0])}</div>`; }

/* 有故事的人才在瀏覽時出現；只有榮耀線的人只能用搜尋找到（Randoph 2026-11-06） */
function listed(p) { return !!p.s; }

/* 排序（Randoph 2026-11-06）：資料越豐富、越近期有更新的越前面。
   分數 w 由重生腳本算好（豐富度＋新鮮度）；同分才隨機，讓同一級的人輪流露臉。 */
/* ── 緣分卡：只從「有故事＋照片＋金句」的人抽；故事越完整（w 越高）越容易被抽到，不連續抽到同一人 ── */
let fateCur = null;
function fatePool() { return people.filter(p => p.s && p.t && p.q); }
function fatePick() {
  const pool = fatePool().filter(p => p !== fateCur);
  if (!pool.length) return null;
  const tot = pool.reduce((s, p) => s + (p.w || 1), 0);
  let r = Math.random() * tot;
  for (const p of pool) { r -= (p.w || 1); if (r <= 0) return p; }
  return pool[pool.length - 1];
}
function fateShow(p) {
  if (!p) return;
  fateCur = p;
  const box = document.getElementById("fate"), img = document.getElementById("fateImg");
  box.classList.add("swap");
  setTimeout(() => {
    img.src = "t/" + p.t;
    document.getElementById("fateQ").textContent = p.q;
    document.getElementById("fateN").innerHTML = `<b>${esc(p.n)}</b>${esc(p.o || "")}`;
    box.style.display = "grid"; box.classList.remove("swap");
    /* 縮圖先上，再換成 R2 原圖（只載這一張） */
    fetch("data/p/" + p.k + ".json").then(r => r.json()).then(d => { if (fateCur === p && d.ph) { const hi = new Image(); hi.onload = () => { if (fateCur === p) img.src = d.ph; }; hi.src = d.ph; } }).catch(() => {});
  }, box.style.display === "none" ? 0 : 220);
}
function fateNext() { fateShow(fatePick()); }
function fateGo() { if (fateCur) openDetail(fateCur.k); }

function shuffle(arr) {
  arr.forEach(p => p._k = (p.w || 0) + Math.random() * 0.5);
  arr.sort((a, b) => b._k - a._k);
}

function drawChips() {
  const pool = people.filter(listed), roleN = {}, painN = {};
  pool.forEach(p => { roleN[p.r] = (roleN[p.r] || 0) + 1; (p.p || []).forEach(x => painN[x] = (painN[x] || 0) + 1); });
  document.getElementById("roleChips").innerHTML =
    `<button class="${activeRole ? "" : "on"}" onclick="setRole('')">全部 ${pool.length}</button>` +
    ROLES.filter(r => roleN[r[0]]).map(r => `<button class="${r[0] === activeRole ? "on" : ""}" onclick="setRole('${r[0]}')">${r[1]} ${roleN[r[0]]}</button>`).join("") +
    (roleN.other ? `<button class="${activeRole === "other" ? "on" : ""}" onclick="setRole('other')">其他 ${roleN.other}</button>` : "");
  document.getElementById("painChips").innerHTML =
    `<button class="${activePain ? "" : "on"}" onclick="setPain('')">不限</button>` +
    PAINS.filter(x => painN[x[0]]).map(x => `<button class="${x[0] === activePain ? "on" : ""}" onclick="setPain('${x[0]}')">${x[1]} ${painN[x[0]]}</button>`).join("");
  const rankN = {}; pool.forEach(p => { const g = rankGroup(p); if (g) rankN[g] = (rankN[g] || 0) + 1; });
  document.getElementById("rankChips").innerHTML =
    `<button class="${activeRank ? "" : "on"}" onclick="setRank('')">不限</button>` +
    RANK_GROUPS.filter(g => rankN[g[0]]).map(g => `<button class="${g[0] === activeRank ? "on" : ""}" onclick="setRank('${g[0]}')">${g[1]} ${rankN[g[0]]}</button>`).join("");
  const on = [activeRole && tagLabel(activeRole), activePain && tagLabel(activePain), activeRank && RANK_GROUPS.find(g => g[0] === activeRank)[1]].filter(Boolean);
  document.getElementById("filterSum").textContent = on.length ? "篩選：" + on.join(" ＋ ") : "篩選";
}
function setRole(r) { activeRole = activeRole === r ? "" : r; shown = PAGE; drawChips(); renderGrid(); }
function setPain(x) { activePain = activePain === x ? "" : x; shown = PAGE; drawChips(); renderGrid(); }
function setRank(x) { activeRank = activeRank === x ? "" : x; shown = PAGE; drawChips(); renderGrid(); }

function currentRows() {
  const q = document.getElementById("q").value.trim();
  /* 搜尋時查全部人（含只有榮耀線的），沒搜尋時只列有故事的人 */
  let rows = people.filter(p => (q ? true : listed(p)) && (!activeRole || p.r === activeRole) && (!activePain || (p.p || []).includes(activePain)) && (!activeRank || rankGroup(p) === activeRank));
  if (q) {
    const score = p => p.n.includes(q) ? 0 : (p.a || []).some(a => a.includes(q)) ? 1 : (p.o || "").includes(q) ? 2 : (p.q || "").includes(q) ? 3 : 9;
    rows = rows.filter(p => score(p) < 9).sort((a, b) => score(a) - score(b));
  }
  return [rows, q];
}

function renderGrid() {
  const [rows, q] = currentRows();
  const grid = document.getElementById("grid");
  document.getElementById("srchNote").textContent = q ? "" : "以下是有完整故事的夥伴；想找特定的人，直接搜尋姓名";
  if (!rows.length) {
    grid.innerHTML = `<p class="empty" style="grid-column:1/-1;">${q ? "找不到這個名字或職業" : "這個組合目前沒有人，把「我卡在⋯」或「我想看⋯」改成「不限」再試一次"}</p>`;
    document.getElementById("count").textContent = "";
    document.getElementById("moreBtn").style.display = "none";
    return;
  }
  grid.innerHTML = rows.slice(0, shown).map(p => `
    <button class="pcard" onclick="openDetail('${esc(p.k)}')">
      ${ava(p, p.t ? "t/" + p.t : "")}
      <h3>${esc(p.n)}</h3>
      <p class="occ">${esc(p.o || "")}</p>
      ${p.q ? `<p class="q">${esc(p.q)}</p>` : topBadges(p.b).map(badgeHtml).join(" ")}
    </button>`).join("");
  document.getElementById("moreBtn").style.display = rows.length > shown ? "block" : "none";
  document.getElementById("count").textContent = `共 ${rows.length} 位夥伴`;
}
function showMore() { shown += PAGE; renderGrid(); }

function jumpTag(id) {
  const k = tagKind(id);
  if (k === "role") { activeRole = id; activePain = ""; } else if (k === "pain") { activePain = id; activeRole = ""; } else return;
  activeRank = "";
  document.getElementById("q").value = "";
  shown = PAGE; goList(); drawChips(); renderGrid();
  document.getElementById("filterBox").open = true;
  window.scrollTo(0, 0);
}

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (_) {} ta.remove();
}
async function copyTup() {
  const btn = document.getElementById("tupBtn");
  await copyText(document.getElementById("tupbox").textContent);
  btn.textContent = "✓ 已複製，可以直接唸了"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "複製這段介紹詞"; btn.classList.remove("done"); }, 2400);
}
async function shareThis() {
  const btn = document.getElementById("shareBtn"), url = location.href;
  if (navigator.share) { try { await navigator.share({ title: (cur ? cur.n : "") + "｜優秀會員歷程", url }); return; } catch (e) {} }
  await copyText(url);
  btn.textContent = "✓ 連結已複製"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "🔗 複製這個人的連結"; btn.classList.remove("done"); }, 2200);
}

/* ── 網址：#{永久代碼}（2026-11-10）。姓名、本業會變也會同名，代碼發了永不改，QR Code 印出去也不會失效。
      舊網址照樣通：#{姓名}、#{別名}、同名者的 #{檔名}、舊名、舊 #{uuid} 都轉到代碼 ── */
function keyFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return "";
  if (byKey[h]) return h;
  const k = redirect[h] || byName[h];
  if (k && byKey[k]) { history.replaceState({}, "", "#" + k); return k; }
  return "";
}
function openDetail(k) { history.pushState({}, "", "#" + encodeURIComponent(k)); showDetail(k); }
function goList() { history.pushState({}, "", location.pathname); showList(); }
function showList() {
  document.getElementById("detail-view").style.display = "none";
  document.getElementById("list-view").style.display = "block";
}
window.addEventListener("popstate", () => { const k = keyFromHash(); if (k) showDetail(k); else showList(); });

/* expansions（舊版月刊摘要的點開細節）：錨點對得上就變虛線可點，對不上就附在文後 */
function renderStory(text, exs) {
  let html = esc(text); const orphan = [];
  (exs || []).forEach((ex, i) => {
    const a = esc(ex.anchor);
    if (a && html.includes(a)) html = html.replace(a, `<span class="hook ${esc(ex.type)}" onclick="toggleEx(${i})">${a}</span><span class="expand ${esc(ex.type)}" id="ex${i}">${esc(ex.content)}</span>`);
    else if (ex.content) orphan.push(ex);
  });
  if (orphan.length) html += `<div class="orphan">` + orphan.map(ex => `<p class="olab ${esc(ex.type)}">${esc(ex.anchor)}</p><p class="otxt">${esc(ex.content)}</p>`).join("") + `</div>`;
  return html;
}
function toggleEx(i) { const el = document.getElementById("ex" + i); if (el) el.style.display = el.style.display === "block" ? "none" : "block"; }

async function showDetail(k) {
  const p = byKey[k];
  if (!p) { showList(); return; }
  document.getElementById("list-view").style.display = "none";
  document.getElementById("detail-view").style.display = "block";
  window.scrollTo(0, 0);
  document.getElementById("quoteBox").innerHTML = "";
  document.getElementById("exits").innerHTML = "";
  document.getElementById("profile").innerHTML = `<p class="hint">載入中⋯</p>`;
  let d;
  try { d = await (await fetch("data/p/" + p.k + ".json")).json(); }
  catch (e) { document.getElementById("profile").innerHTML = `<p class="hint">載入失敗，請稍後再試</p>`; return; }
  cur = d;
  document.title = d.n + "｜優秀會員歷程｜APLUS 系統";

  /* 第 2 層：一個手機畫面看完——金句、身分、標籤、重點摘要、30 秒介紹 */
  document.getElementById("quoteBox").innerHTML = d.q ? `<blockquote>${esc(d.q)}</blockquote>` : "";
  const isSelf = (d.six || []).length > 0;
  const kind = isSelf ? `<span class="src self">🗣 本人自述</span>` : (d.mag || (d.mag6 || []).length) ? `<span class="src">📰 月刊報導</span>` : "";
  const co = d.co && d.co.name ? ` <span class="src co">👥 與 ${esc(d.co.name)} ${esc(d.co.relation)}共同</span>` : "";
  let html = `
    <div class="phead">
      <div class="prow">
        ${ava(d, d.ph)}
        <div><h2>${esc(d.n)}</h2>${d.o ? `<p class="occ">${esc(d.o)}</p>` : ""}</div>
      </div>
      ${topBadges(p.b).length ? `<div class="pbadges">${topBadges(p.b).map(badgeHtml).join("")}${(p.b || []).length > topBadges(p.b).length ? `<a class="bmore" href="javascript:void(0)" onclick="document.getElementById('tl').scrollIntoView({behavior:'smooth'})">全部 ${(p.b || []).length} 項榮耀 ↓</a>` : ""}</div>` : ""}
      ${kind || co || d.rel ? `<p class="pmeta">${kind}${co}${d.rel ? `<span class="rel">${esc(d.rel)}</span>` : ""}</p>` : ""}
      ${(d.tags || []).length ? `<div class="ptags">${d.tags.map(t => `<button class="ptag" onclick="jumpTag('${esc(t)}')">${esc(tagLabel(t))}</button>`).join("")}</div>` : ""}
    </div>`;
  const hl = d.hl || [];
  if (hl.length || d.tup) {
    html += `<div class="hl">`;
    if (hl.length) html += `<h4>重點摘要</h4><ul>${hl.map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;
    if (d.tup) html += `<div class="${hl.length ? "tupwrap" : ""}"><h4>30 秒這樣介紹他</h4>
        <div class="tupbox" id="tupbox">${esc(d.tup)}</div>
        <button class="copytup" id="tupBtn" onclick="copyTup()">複製這段介紹詞</button></div>`;
    html += `</div>`;
  }

  /* 第 3 層：點了才展開。六拍不顯示編號（Randoph：編號是內部判準，訪客會覺得在讀表格） */
  if (isSelf) {
    html += `<details class="fold"><summary>看他完整的故事（本人自述）</summary><div>
      <div class="story">${d.six.map(b => `<p class="beat">${esc(b)}</p>`).join("")}</div></div></details>`;
  }
  /* 月刊六拍（母體「## 月刊故事」，第三人稱，逐句回月刊原文核對過）。沒有自述時預設展開 */
  if ((d.mag6 || []).length) {
    const coT = "";  /* 夫妻同篇已在頭部小標籤標示，標題不重複（手機會折成兩行） */
    html += `<details class="fold"${isSelf ? "" : " open"}><summary>${isSelf ? "展翅月刊報導" : "完整故事（展翅月刊整理）"}${coT}</summary><div>
      ${isSelf ? `<p class="conote">這是較早的月刊報導，放在這裡當佐證。上面那篇才是他自己現在講的版本。</p>` : ""}
      <div class="story">${d.mag6.map(b => `<p class="beat">${esc(b)}</p>`).join("")}</div></div></details>`;
  }
  if (d.mag) {
    const title = isSelf ? "展翅月刊報導" : (d.co && d.co.name ? `完整故事（與 ${esc(d.co.name)} ${esc(d.co.relation)}共同報導）` : "完整故事（展翅月刊報導）");
    html += `<details class="fold"${isSelf ? "" : " open"}><summary>${title}</summary><div>
      ${d.co && d.co.name ? `<p class="conote">這是一篇<strong>${esc(d.co.relation)}共同報導</strong>，內容同時講 ${esc(d.n)} 與 ${esc(d.co.name)} 兩個人，所以開頭不一定從 ${esc(d.n)} 講起。</p>` : ""}
      ${isSelf ? `<p class="conote">這是較早的月刊報導，放在這裡當佐證。上面那篇才是他自己現在講的版本。</p>` : ""}
      <div class="story">${renderStory(d.mag, d.ex)}</div>
      ${(d.ex || []).length ? `<p class="hint">虛線文字可以點開，看更多細節</p>` : ""}</div></details>`;
  }
  /* 榮耀線：一筆授勳一列；拚搏事蹟掛在該筆底下 */
  const ms = d.ms || [];
  if (ms.length) {
    html += `<p class="sec">成就歷程</p><div class="tl" id="tl">` + ms.map((m, i) => `
      <div class="tli"><div class="tlrail"><div class="dot"></div>${i < ms.length - 1 ? '<div class="rail"></div>' : ""}</div>
        <div class="tlbody"><h4>${esc(BADGE_ALIAS[m.b] || m.b)}</h4>${m.c ? `<p>${esc(m.c)}</p>` : ""}<p>${esc([m.when, m.src].filter(Boolean).join(" · "))}</p></div></div>`).join("") + `</div>`;
  }
  document.getElementById("profile").innerHTML = html;

  /* 第 4 層：頁尾兩個出口（Randoph 2026-11-06 定） */
  const like = (d.tags || []).find(t => tagKind(t) === "pain") || (d.tags || [])[0];
  document.getElementById("exits").innerHTML =
    (like ? `<button class="main" onclick="jumpTag('${esc(like)}')">找像他的人 →</button>` : "") +
    `<button onclick="backToSearch()">回到搜尋</button>`;
}
function backToSearch() {
  activeRole = activePain = activeRank = ""; shown = PAGE;
  document.getElementById("q").value = "";
  goList(); drawChips(); renderGrid(); window.scrollTo(0, 0);
  document.getElementById("q").focus();
}

async function init() {
  try {
    const j = await (await fetch("data/list.json")).json();
    people = j.people; redirect = j.redirect || {};
    people.forEach(p => byKey[p.k] = p);
    /* 姓名 → 代碼：只收唯一的姓名；同名的不猜。別名不蓋掉真名 */
    const cnt = {}; people.forEach(p => cnt[p.n] = (cnt[p.n] || 0) + 1);
    people.forEach(p => { if (cnt[p.n] === 1) byName[p.n] = p.k; });
    people.forEach(p => (p.a || []).forEach(a => { if (!cnt[a] && !byName[a]) byName[a] = p.k; }));
    shuffle(people);
    fateNext();
    if (window.innerWidth >= 768) document.getElementById("filterBox").open = true;
    drawChips(); renderGrid();
    const k = keyFromHash();
    if (k) showDetail(k);
  } catch (e) {
    document.getElementById("grid").innerHTML = `<p class="empty" style="grid-column:1/-1;">資料載入失敗，請稍後再試</p>`;
  }
}
document.getElementById("q").addEventListener("input", () => { shown = PAGE; renderGrid(); });
init();
</script>
</body>
</html>
