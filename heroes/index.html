<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄榜｜A PLUS</title>
<meta name="description" content="每一位英雄，都曾是和你一樣的普通人。看見他們的起心動念與成就歷程。">
<style>
:root{
  --ink:#2c2c2a; --muted:#6b6a64; --faint:#9a988f;
  --bg:#faf9f5; --card:#ffffff; --line:#e7e5dc;
  --gold:#b07a1f; --gold-bg:#faf0dc;
  --teal:#0f6e56; --teal-bg:#e1f5ee;
  --purple:#534ab7; --purple-bg:#eeedfe;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px;}
header.site{text-align:center;padding:28px 0 8px;}
header.site h1{font-size:26px;font-weight:600;letter-spacing:2px;}
header.site p{font-size:14px;color:var(--muted);margin-top:6px;}
.search{display:flex;gap:8px;margin:20px 0 12px;}
.search input{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;background:var(--card);outline:none;}
.search input:focus{border-color:var(--gold);}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer;}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:transform .12s;}
.pcard:active{transform:scale(.97);}
.ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;margin-bottom:10px;background:var(--gold-bg);color:var(--gold);overflow:hidden;}
.ava img{width:100%;height:100%;object-fit:cover;}
.pcard h3{font-size:15px;font-weight:600;}
.pcard .occ{font-size:12px;color:var(--muted);margin:2px 0 8px;min-height:18px;}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold);}
.badge.t-cfc{background:#eeedfe;color:#534ab7;}
.badge.t-peak{background:#e1f5ee;color:#0f6e56;}
.badge.t-star{background:var(--gold-bg);color:var(--gold);}
.badge.t-money{background:#faece7;color:#993c1d;}
.badge.t-base{background:#f1efe8;color:#5f5e5a;}
.mag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:transparent;margin-left:4px;}
.count{font-size:12px;color:var(--faint);margin-top:14px;text-align:center;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:16px;background:none;border:none;}
.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;}
.phead{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.phead .ava{width:60px;height:60px;font-size:22px;margin:0;}
.phead h2{font-size:20px;font-weight:600;}
.phead .occ{font-size:13px;color:var(--muted);margin-top:2px;}
.sec{font-size:13px;color:var(--faint);letter-spacing:2px;margin:22px 0 10px;}
.story{font-size:16px;line-height:2;white-space:pre-wrap;}
.hook{border-bottom:2px dashed;cursor:pointer;}
.hook.health{color:var(--teal);border-color:var(--teal);}
.hook.business{color:var(--purple);border-color:var(--purple);}
.hook.other{color:var(--gold);border-color:var(--gold);}
.expand{border-radius:12px;padding:12px 16px;margin:10px 0;font-size:14px;line-height:1.8;display:none;}
.expand.health{background:var(--teal-bg);color:var(--teal);}
.expand.business{background:var(--purple-bg);color:var(--purple);}
.expand.other{background:var(--gold-bg);color:var(--gold);}
.tl{margin-top:4px;}
.tli{display:flex;gap:14px;}
.tlrail{display:flex;flex-direction:column;align-items:center;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:8px;flex-shrink:0;}
.rail{width:2px;flex:1;background:var(--line);}
.tlbody{padding-bottom:18px;}
.tlbody h4{font-size:15px;font-weight:600;}
.tlbody p{font-size:13px;color:var(--muted);margin-top:2px;}
.empty{text-align:center;color:var(--faint);padding:48px 0;font-size:14px;}
.hint{font-size:12px;color:var(--faint);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>英雄榜</h1>
    <p>每一位英雄，都曾是和你一樣的普通人</p>
  </header>

  <div id="list-view">
    <div class="search"><input type="search" id="q" placeholder="搜尋姓名或職業，例如：保險、藥局、工程師" /></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <p class="count" id="count"></p>
  </div>

  <div id="detail-view" style="display:none;">
    <button class="back" onclick="showList()">← 回英雄榜</button>
    <div class="profile" id="profile"></div>
  </div>
</div>

<script>
const SB_URL = "https://nsgqsopqlkhayuefdout.supabase.co";
const SB_KEY = "sb_publishable_wZFrsu-4WYQfOHota6Yk4w_SQsR56tT";
const HEADERS = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY };
const BADGE_ORDER = ["CFC世界大使","三千萬美金","兩千萬美金","千萬美金","百萬美金","CFC","高峰","星鑽","成就"];

let profiles = [];
let activeBadge = "";

async function api(path) {
  const res = await fetch(SB_URL + "/rest/v1/" + path, { headers: HEADERS });
  if (!res.ok) throw new Error("API " + res.status);
  return res.json();
}

function tierClass(b) {
  b = b || "";
  if (b.includes("CFC")) return "t-cfc";
  if (b.includes("高峰")) return "t-peak";
  if (b.includes("星鑽")) return "t-star";
  if (b.includes("美金")) return "t-money";
  return "t-base";
}

function isMag(p) {
  const m = p.honor_milestones;
  return Array.isArray(m) ? (m[0]?.count || 0) > 0 : false;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

function badgeChips() {
  const badges = profiles.map(p => p.current_badge || "");
  const list = ["", ...BADGE_ORDER.filter(b => badges.some(x => x.includes(b)))];
  document.getElementById("chips").innerHTML = list.map(b =>
    `<button class="${b === activeBadge ? "on" : ""}" onclick="setBadge('${b}')">${b || "全部"}</button>`
  ).join("");
}

function setBadge(b) { activeBadge = b; badgeChips(); renderGrid(); }

function renderGrid() {
  const q = document.getElementById("q").value.trim();
  const rows = profiles.filter(p => {
    const hitQ = !q || (p.name + (p.occupation || "")).includes(q);
    const hitB = !activeBadge || (p.current_badge || "").includes(activeBadge);
    return hitQ && hitB;
  });
  const grid = document.getElementById("grid");
  if (!rows.length) {
    grid.innerHTML = "";
    document.getElementById("count").textContent = "";
    grid.insertAdjacentHTML("beforebegin", "");
    grid.innerHTML = `<p class="empty" style="grid-column:1/-1;">找不到符合的英雄，換個關鍵字試試</p>`;
    return;
  }
  grid.innerHTML = rows.map(p => `
    <div class="pcard" onclick="showDetail('${p.id}')">
      <div class="ava">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(p.name[0])}</div>
      <h3>${esc(p.name)}</h3>
      <p class="occ">${esc(p.occupation || "")}</p>
      <span class="badge ${tierClass(p.current_badge)}">${esc(p.current_badge || "會員")}</span>${isMag(p) ? '<span class="mag">展翅月刊</span>' : ""}
    </div>`).join("");
  document.getElementById("count").textContent = `共 ${rows.length} 位英雄`;
}

function renderStory(p) {
  let html = esc(p.story_base || "");
  (p.expansions || []).forEach((ex, i) => {
    const anchor = esc(ex.anchor);
    if (anchor && html.includes(anchor)) {
      html = html.replace(anchor, `<span class="hook ${esc(ex.type)}" onclick="toggleEx(${i})">${anchor}</span><span id="exslot${i}"></span>`);
    }
  });
  return html;
}

function toggleEx(i) {
  const el = document.getElementById("ex" + i);
  if (el) el.style.display = el.style.display === "block" ? "none" : "block";
}

async function showDetail(id) {
  const p = profiles.find(x => x.id === id);
  if (!p) return;
  history.replaceState(null, "", "#" + id);
  document.getElementById("list-view").style.display = "none";
  document.getElementById("detail-view").style.display = "block";
  window.scrollTo(0, 0);

  let html = `
    <div class="phead">
      <div class="ava">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(p.name[0])}</div>
      <div>
        <h2>${esc(p.name)}</h2>
        <p class="occ">${esc(p.occupation || "")}</p>
      </div>
      <div style="margin-left:auto;text-align:right;">
        <span class="badge ${tierClass(p.current_badge)}">${esc(p.current_badge || "會員")}</span>
        ${isMag(p) ? '<br><span class="mag" style="margin:6px 0 0;">展翅月刊報導</span>' : ""}
      </div>
    </div>`;

  if (p.story_base) {
    html += `<p class="sec">起心動念</p><div class="story" id="storybox">${renderStory(p)}</div>`;
    if ((p.expansions || []).length) html += `<p class="hint">虛線文字可以點開，看更多細節</p>`;
  }
  html += `<p class="sec">成就歷程</p><div class="tl" id="tl"><p class="hint">載入中⋯</p></div>`;
  document.getElementById("profile").innerHTML = html;

  (p.expansions || []).forEach((ex, i) => {
    const slot = document.getElementById("exslot" + i);
    if (!slot) return;
    const box = document.createElement("span");
    box.className = "expand " + ex.type;
    box.id = "ex" + i;
    box.textContent = ex.content;
    slot.after(box);
  });

  try {
    const ms = await api(`honor_milestones?profile_id=eq.${id}&select=badge,achieved_date,content,source_ref&order=achieved_date.desc.nullslast,created_at.desc`);
    const tl = document.getElementById("tl");
    if (!ms.length) { tl.innerHTML = `<p class="hint">歷程整理中</p>`; return; }
    tl.innerHTML = ms.map((m, i) => {
      const meta = [m.achieved_date ? m.achieved_date.slice(0, 7).replace("-", ".") : "", m.source_ref || ""].filter(Boolean).join(" · ");
      const summary = (m.content || "").replace(/（wiki:[^）]*）/g, "").trim();
      return `
      <div class="tli">
        <div class="tlrail"><div class="dot"></div>${i < ms.length - 1 ? '<div class="rail"></div>' : ""}</div>
        <div class="tlbody"><h4>${esc(m.badge)}</h4><p>${esc(summary)}</p>${meta ? `<p>${esc(meta)}</p>` : ""}</div>
      </div>`;
    }).join("");
  } catch (e) {
    document.getElementById("tl").innerHTML = `<p class="hint">歷程載入失敗，請稍後再試</p>`;
  }
}

function showList() {
  history.replaceState(null, "", location.pathname);
  document.getElementById("detail-view").style.display = "none";
  document.getElementById("list-view").style.display = "block";
}

async function init() {
  try {
    profiles = await api("honor_profiles?select=id,name,photo_url,occupation,current_badge,story_base,expansions,honor_milestones(count)&order=name");
    badgeChips();
    renderGrid();
    const hash = location.hash.slice(1);
    if (hash) showDetail(hash);
  } catch (e) {
    document.getElementById("grid").innerHTML = `<p class="empty" style="grid-column:1/-1;">資料載入失敗，請稍後再試</p>`;
  }
}
document.getElementById("q").addEventListener("input", renderGrid);
init();
</script>
</body>
</html>
