<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員註冊 — A Plus 系統</title>
<!--
  舊會員中心（LIFF 2009692859-9mE2Ymmb）。2026-11-12 起註冊表、審核進度、會員卡都搬到首頁右上角，這一頁只負責轉過去。
  留著的原因：官方帳號的「開通會員」「會員卡」按鈕（LINEAI 的 n8n）還指到這個 LIFF，那邊不歸這裡改。
  ?oa=@團隊 會一起帶過去（LIFF 第一次轉進來時參數包在 liff.state 裡，所以兩種都讀）。
-->
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;
  background:#f7f5f0;color:#2d2a24;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:19px;line-height:1.7;text-align:center}
p{margin:0}
a{display:inline-block;min-height:52px;padding:12px 28px;border-radius:8px;background:#b8960c;color:#2d2a24;font-size:19px;font-weight:700;line-height:28px;text-decoration:none}
</style>
</head>
<body>
<p>正在打開會員註冊…</p>
<a id="go" href="https://liff.line.me/2009692859-h2XfVyCT?member=1">沒有自動打開，請按這裡</a>
<script>
(function () {
  var oa = new URLSearchParams(location.search).get('oa');
  if (!oa) {
    var state = new URLSearchParams(location.search).get('liff.state') || '';
    var q = state.indexOf('?');
    if (q >= 0) oa = new URLSearchParams(state.slice(q)).get('oa');
  }
  var url = 'https://liff.line.me/2009692859-h2XfVyCT?member=1' + (oa ? '&oa=' + encodeURIComponent(oa) : '');
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
