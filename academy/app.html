<!DOCTYPE html>
<!--
  環球致富學院 — 學院本體（LIFF + Supabase）
  ⚠️ LIFF_ID 需在 LINE Developers Console 新建一支，Endpoint = https://unpaplus.com.tw/academy/app.html
  資料一律走會員閘道 member-gate（伺服器驗 LINE 身分）；能不能進由 academy.has_access 判斷：VIP1 以上就能進（學院不單獨上鎖，2026-11-10）
  預覽（免 LINE 登入）：app.html#preview
-->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>環球致富學院</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://player.vimeo.com/api/player.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif}
:root{
  --bg:#f7f5f0;--bg2:#ffffff;
  --gold:#b8960c;--gold2:#d4af37;--gold3:#96790a;
  --gold-lt:rgba(184,150,12,.10);
  --card:#ffffff;--border:rgba(0,0,0,0.07);--border-hl:rgba(0,0,0,0.12);
  --txt:#1a1a2e;--txt2:#6b7280;
  --green:#16a34a;--green-bg:rgba(22,163,74,.10);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --yellow:#d97706;--yellow-bg:rgba(217,119,6,.10);
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
body{background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.75;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 30% 8%,rgba(184,150,12,.08) 0%,transparent 52%),
             radial-gradient(ellipse at 72% 92%,rgba(184,150,12,.05) 0%,transparent 42%)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 90px}

.hd{text-align:center;padding:14px 0 18px}
.hd-icon{font-size:38px}
.hd-title{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--gold3),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd-sub{font-size:16px;color:var(--txt2);margin-top:4px}

.screen{display:none}.screen.active{display:block}
.center{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:75vh;text-align:center;padding:30px 20px}
.center.active{display:flex}
.center .big{font-size:54px;margin-bottom:14px}
.center h2{font-size:24px;font-weight:900;margin-bottom:10px}
.center p{font-size:18px;color:var(--txt2);max-width:390px}
.center p b{color:var(--gold3)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:13px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:all .2s}
.card.tap:active{transform:scale(.99)}
.card.tap:hover{border-color:rgba(184,150,12,.25);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card.locked{opacity:.6;background:repeating-linear-gradient(135deg,#fff,#fff 10px,#faf8f2 10px,#faf8f2 20px)}
.card.locked .c-nm{color:var(--txt2)}
.card.locked .c-ct{color:var(--txt2)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-nm{font-size:21px;font-weight:900}
.c-ct{font-size:16px;color:var(--gold3);font-weight:800;white-space:nowrap}
.c-ds{font-size:16px;color:var(--txt2);margin-top:6px}

/* 新手村：進度條＋講師封面牆（封面＝Vimeo 縮圖，滑到才載） */
.vprog{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.vprog .t{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:900}
.vprog .t b{color:var(--gold3);font-size:20px}
.vprog .bar{height:10px;border-radius:6px;background:rgba(184,150,12,.12);margin-top:10px;overflow:hidden}
.vprog .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--gold3));transition:width .4s}
.village{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:700px){.village{grid-template-columns:repeat(3,1fr)}}
.vcard{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.vcard:active{transform:scale(.98)}
.vcard:hover{border-color:rgba(184,150,12,.35);box-shadow:0 6px 18px rgba(0,0,0,.09)}
.vcard .img{position:relative;aspect-ratio:16/9;background:#f1ede2}
.vcard img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .nm{padding:9px 11px 11px;font-size:17px;font-weight:900;line-height:1.35}
.vcard .nm .no{color:var(--gold3);margin-right:5px}
.vcard .nm .du{display:block;font-size:13px;font-weight:700;color:var(--txt2);margin-top:2px}
.vcard .st{display:inline-block;margin-left:6px;padding:1px 8px;font-size:12px;font-weight:900;color:#fff;border-radius:8px;vertical-align:1px}
.vcard .st.done{background:var(--green)}
.vcard .st.half{background:var(--gold3)}
.hw-intro{font-size:16px;color:var(--txt2);line-height:1.7;margin:-2px 0 10px}
#lesson-next{margin-top:18px}
/* 四大類 → 學分 */
.cat{margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.cat .n{font-size:20px;font-weight:900}
.cat .d{font-size:14px;color:var(--txt2)}
.cat .bar{flex:1;height:2px;background:linear-gradient(90deg,var(--gold2),transparent)}
.credit{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;margin-bottom:9px;box-shadow:var(--shadow);
  cursor:pointer;transition:all .2s}
.credit:hover{border-color:rgba(184,150,12,.28);transform:translateX(3px)}
.credit:active{transform:scale(.99)}
.credit .nm{flex:1;font-size:18px;font-weight:800}
.credit .ct{font-size:15px;font-weight:800;color:var(--gold3);white-space:nowrap}
.credit .ct .lk{color:var(--txt2);font-weight:700}
.credit.alllock{opacity:.6;background:repeating-linear-gradient(135deg,#fff,#fff 10px,#faf8f2 10px,#faf8f2 20px)}
.unit-lock{opacity:.55}
.unit-lock .no{background:rgba(0,0,0,.04);border-color:var(--border);color:var(--txt2)}
.sec-title{font-size:16px;color:var(--txt2);font-weight:700;margin:22px 0 10px}

.lrow{display:flex;align-items:center;gap:13px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);transition:all .2s}
.lrow:active{transform:scale(.99)}
.lrow:hover{border-color:rgba(184,150,12,.25);transform:translateX(3px)}
.lrow .no{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--gold-lt);border:1px solid rgba(184,150,12,.28);color:var(--gold3);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lrow .tx{flex:1;font-size:18px;font-weight:700;line-height:1.45}
.lrow .go{font-size:20px;color:var(--txt2)}
.lrow.novideo .no{background:rgba(0,0,0,.04);border-color:var(--border);color:var(--txt2)}

.btn{display:block;width:100%;padding:18px;margin-top:14px;border-radius:15px;border:none;background:linear-gradient(135deg,var(--gold3),var(--gold2));color:#fff;font-size:20px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(184,150,12,.30)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);border:1px solid var(--border-hl);color:var(--txt);box-shadow:var(--shadow);font-size:18px;font-weight:800}
.btn.danger{background:var(--red-bg);border:1px solid rgba(220,38,38,.28);color:var(--red);box-shadow:none;font-size:17px}
.btn:disabled{opacity:.5}


.back{display:inline-flex;align-items:center;gap:7px;font-size:17px;color:var(--gold3);font-weight:800;padding:8px 0;cursor:pointer}

/* 播放器 + 浮水印 */
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px;box-shadow:var(--shadow)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mark{position:absolute;right:10px;bottom:10px;z-index:5;pointer-events:none;font-size:13px;font-weight:700;color:rgba(255,255,255,.45);text-shadow:0 1px 3px rgba(0,0,0,.85);letter-spacing:.5px}
.noplay{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.7);font-size:17px;text-align:center;padding:20px}

.hw{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.hw h3{font-size:19px;font-weight:900;margin-bottom:12px}
.hw ol{padding-left:20px}
.hw li{font-size:18px;color:var(--txt);margin-bottom:12px;line-height:1.65}
.hw .none{font-size:17px;color:var(--txt2)}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:13px 20px;border-radius:12px;font-size:16px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1}
.spin{width:44px;height:44px;border:4px solid rgba(0,0,0,.08);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="screen-loading" class="center active"><div class="spin"></div><p style="margin-top:16px">載入中…</p></div>

<div class="wrap">

  <!-- 不是會員：查不到、VIP0、審核中、被退回都一樣，細節由會員中心講（2026-11-10） -->
  <div id="screen-notmember" class="center">
    <div class="big">🏡</div>
    <h2>新手村開放給綠佳利會員</h2>
    <p>到會員中心完成註冊，<b>通過後這一頁就會直接打開</b>。</p>
    <a class="btn" id="hub-btn" style="max-width:400px;margin-top:20px;text-decoration:none;text-align:center" href="https://liff.line.me/2009692859-9mE2Ymmb">前往會員中心</a>
  </div>

  <!-- 學院首頁：課程列表 -->
  <div id="screen-home" class="screen">
    <div class="hd">
      <div class="hd-icon">🏡</div>
      <div class="hd-title">新手村</div>
      <div class="hd-sub" id="home-sub">歡迎回來</div>
    </div>
    <div class="vprog" id="vprog"></div>
    <div class="village" id="village"><div class="card">載入中…</div></div>
  </div>

  <!-- 課程（廣場 → 課程） -->
  <div id="screen-courses" class="screen">
    <div class="back" onclick="go('home')">← 回廣場</div>
    <div class="hd" style="padding-top:6px">
      <div class="hd-title" style="font-size:23px">📖 學分地圖</div>
      <div class="hd-sub" id="courses-sub"></div>
    </div>
    <div id="course-list"></div>
  </div>

  <!-- 課程 → 課列表 -->
  <div id="screen-course" class="screen">
    <div class="back" onclick="go('courses')">← 回學分地圖</div>
    <div class="hd" style="padding-top:6px">
      <div class="hd-title" id="course-name" style="font-size:23px"></div>
      <div class="hd-sub" id="course-count"></div>
    </div>
    <div id="lesson-list"></div>
  </div>

  <!-- 單課 -->
  <div id="screen-lesson" class="screen">
    <div class="back" id="lesson-back">← 回新手村</div>
    <div class="hd" style="padding:8px 0 14px">
      <div class="hd-title" id="lesson-title" style="font-size:21px;line-height:1.4"></div>
    </div>
    <div class="player" id="player"></div>
    <div class="hw">
      <h3>📝 練習題</h3>
      <div class="hw-intro">這是實戰班的課程作業。你也可以試著做做看，寫好或錄好之後，交給自己的領袖一起討論。</div>
      <div id="homework"></div>
    </div>
    <div id="lesson-next"></div>
  </div>

</div>

<div id="toast"></div>

<script>
// ⚠️ 換成 LINE Developers Console 新建的 LIFF ID（Endpoint = /academy/app.html）
const LIFF_ID = '2009692859-wevHkClh';
const SB_URL  = 'https://nsgqsopqlkhayuefdout.supabase.co';
const HUB_URL = 'https://liff.line.me/2009692859-9mE2Ymmb';   // 會員中心（註冊、審核進度都在那邊）
// 會員閘道：學院的查詢一律交給伺服器，由伺服器拿 LIFF access token 問 LINE 驗明正身後代查（前端傳的 LINE 編號不算）
const GATE = SB_URL + '/functions/v1/member-gate';
async function gate(fn, args){
  try{
    const r = await fetch(GATE, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({access_token: liff.getAccessToken(), action:'academy', fn, args})});
    const d = await r.json();
    return d.ok ? {data: d.data, error: null} : {data: null, error: d.error || 'gate'};
  }catch(e){ return {data: null, error: e}; }
}

let lineUserId = null, ctx = null, curCourse = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = s => s ? Math.round(s/60) + ' 分' : '';

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600);}

function show(id){
  document.querySelectorAll('.screen,.center').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById(id); if(el) el.classList.add('active');
  window.scrollTo(0,0);
}
function go(name){
  const map={home:'screen-home',courses:'screen-courses',course:'screen-course',lesson:'screen-lesson'};
  if(name==='courses') renderCourses();
  show(map[name]||name);
}

// ========== INIT ==========
async function init(){
  try{
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri: window.location.href}); return; }
    const p = await liff.getProfile();
    lineUserId = p.userId;
    await loadContext();
  }catch(e){
    console.error('init error:', e);
    show('screen-notmember');
    document.querySelector('#screen-notmember h2').textContent='開啟失敗';
    document.querySelector('#screen-notmember p').textContent='請從 LINE 開啟這個頁面。若持續失敗，請聯繫團隊負責人。';
    document.getElementById('hub-btn').style.display='none';
  }
}

async function loadContext(){
  const {data, error} = await gate('get_academy_context', {p_line_user_id: lineUserId});
  if(error){ console.error(error); toast('連線失敗，請稍後再試'); return; }
  ctx = data;
  route();
}

function route(){
  if(ctx.access){ renderHome(); return; }
  // 不是會員：學院不分「查不到／VIP0／審核中／被退回」，一律請他去會員中心（帶 ?oa= 進來的一起帶過去）
  const oa = new URLSearchParams(location.search).get('oa');
  if(oa) document.getElementById('hub-btn').href = HUB_URL + '?oa=' + encodeURIComponent(oa);
  show('screen-notmember');
}

// 從會員中心辦完滑回來 → 自動重查
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && lineUserId && document.getElementById('screen-notmember').classList.contains('active')) loadContext();
});

// ========== 學院首頁 ==========
function allCredits(){ return (ctx.categories||[]).flatMap(c => c.credits||[]); }

function renderHome(){
  document.getElementById('home-sub').textContent = ctx.member?.name ? ctx.member.name + '，歡迎回來' : '歡迎回來';
  go('home');
  loadStarter();
}

// ========== 新手村（初階 17 堂，照舊站 01～17）==========
let starter = [];     // [{id,no,title,cover_url,duration_sec,pct,done}]
async function loadStarter(){
  const {data, error} = await gate('get_academy_starter', {});
  if(error || !data?.ok){
    document.getElementById('village').innerHTML = '<div class="card">課程載入失敗，請重新整理</div>';
    return;
  }
  starter = data.lessons || [];
  renderVillage();
}
const pad2 = n => String(n).padStart(2,'0');
function renderVillage(){
  const done = starter.filter(x => x.done).length, total = starter.length;
  document.getElementById('vprog').innerHTML =
    `<div class="t"><span>新手村進度</span><span>已看 <b>${done}</b>／${total}</span></div>
     <div class="bar"><i style="width:${total ? Math.round(done*100/total) : 0}%"></i></div>`;
  document.getElementById('village').innerHTML = starter.map(x => {
    const st = x.done ? '<span class="st done">✓ 已看</span>'
             : x.pct > 0 ? '<span class="st half">看到一半</span>' : '';
    const du = x.duration_sec ? `${Math.max(1, Math.round(x.duration_sec/60))} 分鐘` : '';
    return `<div class="vcard" onclick="openLesson('${x.id}')">
      <div class="img">${x.cover_url ? `<img src="${esc(x.cover_url)}" alt="" loading="lazy">` : ''}</div>
      <div class="nm"><span class="no">${pad2(x.no)}</span>${esc(x.title)}<span class="du">${du}${st}</span></div>
    </div>`;
  }).join('') || '<div class="card">課程準備中</div>';
}

// 看到幾成 → 寫回（只升不降；首播、25/50/75、90 各記一次）
function trackVimeo(iframe, lessonId){
  if(!window.Vimeo || !iframe) return;
  const row = starter.find(x => x.id === lessonId);
  const marks = [1, 25, 50, 75, 90];
  let sent = row?.done ? 90 : (row?.pct || 0);
  const send = pct => {
    sent = pct;
    if(row){ row.pct = Math.max(row.pct||0, pct); if(pct >= 90) row.done = true; }
    gate('log_academy_progress', {p_lesson_id: lessonId, p_pct: pct});
  };
  try{
    const pl = new Vimeo.Player(iframe);
    pl.on('timeupdate', d => {
      const pct = Math.floor((d.percent || 0) * 100);
      const m = marks.filter(k => k <= pct && k > sent).pop();
      if(m) send(m === 90 ? Math.max(90, pct) : m);
    });
    pl.on('ended', () => { if(sent < 100) send(100); });
  }catch(e){ console.warn('vimeo track', e); }
}

// 看完接下一堂（照新手村編號）；最後一堂回新手村
function renderNext(lessonId){
  const el = document.getElementById('lesson-next');
  const i = starter.findIndex(x => x.id === lessonId);
  if(i < 0){ el.innerHTML = ''; return; }
  const nx = starter[i+1];
  el.innerHTML = nx
    ? `<button class="btn" onclick="openLesson('${nx.id}')">下一堂：${pad2(nx.no)} ${esc(nx.title)} →</button>`
    : `<button class="btn sec" onclick="goVillage()">🏡 回新手村</button>`;
}
function goVillage(){ renderVillage(); go('home'); }

// 四大類＝時間軸：底層觀念／見人前／見人時／見人後
const CAT_DESC = {'觀念確信':'我為什麼相信','行前準備':'見人之前','會場運作':'人在面前時','組織運作':'他進來之後'};

function renderCourses(){
  const cr = allCredits();
  document.getElementById('courses-sub').textContent =
    `${cr.length} 個學分 · 開放 ${cr.reduce((s,c)=>s+(c.open_count||0),0)} 單元`;
  document.getElementById('course-list').innerHTML = (ctx.categories||[]).map(cat => {
    const rows = (cat.credits||[]).map(c => {
      const 全鎖 = (c.open_count||0) === 0;
      const 部分 = !全鎖 && (c.unit_count||0) > (c.open_count||0);
      const 右 = 全鎖 ? '<span class="lk">🔒 尚未開放</span>'
                     : `${c.open_count} 單元${部分 ? ` <span class="lk">＋${c.unit_count-c.open_count} 🔒</span>` : ''}`;
      return `<div class="credit ${全鎖?'alllock':''}" onclick="openCourse('${c.id}')">
        <div class="nm">${esc(c.title)}</div><div class="ct">${右}</div></div>`;
    }).join('');
    return `<div class="cat"><span class="n">${esc(cat.name)}</span>
      <span class="d">${CAT_DESC[cat.name]||''}</span><span class="bar"></span></div>${rows}`;
  }).join('') || '<div class="card">課程準備中</div>';
}

function openCourse(id){
  const c = allCredits().find(x => x.id === id);
  if(!c) return;
  curCourse = c;
  document.getElementById('course-name').textContent = c.title;
  document.getElementById('course-count').textContent =
    `${c.open_count} / ${c.unit_count} 單元已開放`;
  document.getElementById('lesson-list').innerHTML = (c.units||[]).map(u =>
    `<div class="lrow ${u.has_video?'':'novideo'} ${u.is_locked?'unit-lock':''}"
       ${u.is_locked?'':`onclick="openLesson('${u.id}')"`}>
       <div class="no">${u.is_locked?'🔒':String(u.seq).padStart(2,'0')}</div>
       <div class="tx">${esc(u.title)}${u.is_locked?'<br><span style="font-size:14px;color:var(--txt2)">尚未開放</span>':''}</div>
       <div class="go">${u.is_locked?'':'›'}</div>
     </div>`).join('');
  go('course');
}

// 課名前面已有編號，左側圓圈也顯示編號 → 去掉重複的 "09."
function stripNo(t){ return String(t).replace(/^\d+\.\s*/, ''); }

// ========== 單課（video_id 只有這裡拿得到）==========
async function openLesson(id){
  const inVillage = starter.some(x => x.id === id);
  document.getElementById('lesson-back').textContent = inVillage ? '← 回新手村' : '← 回課列表';
  document.getElementById('lesson-back').onclick = () => inVillage ? goVillage() : openCourse(curCourse.id);
  document.getElementById('lesson-next').innerHTML = '';
  document.getElementById('player').innerHTML = '<div class="noplay">載入中…</div>';
  document.getElementById('homework').innerHTML = '';
  go('lesson');

  const {data, error} = await gate('get_academy_lesson', {p_line_user_id: lineUserId, p_lesson_id: id});
  if(error || !data?.ok){
    const msg = data?.error === 'course_locked' ? '這門課尚未開放'
              : data?.error === 'no_access'     ? '目前無法觀看，請重新開啟頁面'
              : '無法載入這一課，請重新整理';
    document.getElementById('player').innerHTML = `<div class="noplay">${msg}</div>`;
    return;
  }
  const l = data.lesson;
  const sv = starter.find(x => x.id === l.id);
  document.getElementById('lesson-title').textContent = sv ? pad2(sv.no) + ' ' + l.title : l.title;

  const code = ctx.member?.np_member_code || ctx.member?.name || '';
  if(l.video_id && l.video_platform === 'vimeo'){
    document.getElementById('player').innerHTML =
      `<iframe src="https://player.vimeo.com/video/${encodeURIComponent(l.video_id)}?title=0&byline=0&portrait=0"
         allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
       <div class="mark">${esc(code)}</div>`;
  }else if(l.video_id && l.video_platform === 'youtube'){
    document.getElementById('player').innerHTML =
      `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(l.video_id)}" allowfullscreen></iframe>
       <div class="mark">${esc(code)}</div>`;
  }else{
    document.getElementById('player').innerHTML = '<div class="noplay">這一課沒有影片，可以直接看下方的練習題</div>';
  }

  const hw = Array.isArray(l.homework) ? l.homework : [];
  document.getElementById('homework').innerHTML = hw.length
    ? '<ol>' + hw.map(h => `<li>${esc(stripNo(h))}</li>`).join('') + '</ol>'
    : '<div class="none">這一課沒有指定作業。</div>';
  document.querySelector('#screen-lesson .hw-intro').style.display = hw.length ? '' : 'none';

  // 看過紀錄：Vimeo 播到 9 成算看過；沒有影片的單元點進來就算
  if(l.video_id && l.video_platform === 'vimeo'){
    trackVimeo(document.querySelector('#player iframe'), l.id);
  }else if(!l.video_id && sv && !sv.done){
    sv.pct = 100; sv.done = true;
    gate('log_academy_progress', {p_lesson_id: l.id, p_pct: 100});
  }
  renderNext(l.id);
}

// ========== 預覽模式（免 LINE 登入）==========

  renderHome();
  window.openLesson = (id) => {
    const sv = starter.find(x => x.id === id);
    document.getElementById('lesson-back').textContent = '← 回新手村';
    document.getElementById('lesson-back').onclick = goVillage;
    document.getElementById('lesson-title').textContent = pad2(sv.no) + ' ' + sv.title;
    document.getElementById('player').innerHTML =
      '<div class="noplay">預覽模式不載入影片</div><div class="mark">NP000000</div>';
    document.getElementById('homework').innerHTML =
      '<ol><li>說出3個傳直銷的優勢。【錄音1分鐘內】</li><li>這個單元對我的幫助？【錄音1分鐘內】</li></ol>';
    go('lesson'); renderNext(id);
  };
}

if(isPreview()) previewInit(); else init();
</script>
