<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 實戰班排行榜</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f5f0;--bg2:#ffffff;
  --gold:#b8960c;--gold2:#d4af37;--gold3:#96790a;
  --card:#ffffff;--border:rgba(0,0,0,0.07);
  --txt:#1a1a2e;--txt2:#6b7280;
  --red:#dc2626;--green:#16a34a;--blue:#2563eb;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 0%,rgba(184,150,12,0.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 100%,rgba(184,150,12,0.03) 0%,transparent 50%);
  pointer-events:none;
}
.container{max-width:800px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Header */
.back-btn{display:inline-flex;align-items:center;gap:5px;margin:16px 0 0 4px;padding:8px 16px;background:rgba(255,255,255,.06);border:1px solid var(--gold3);border-radius:20px;color:var(--gold);font-size:14px;font-weight:600;text-decoration:none;transition:.15s;font-family:inherit;cursor:pointer}
.back-btn:active{background:rgba(255,255,255,.12)}
.header{text-align:center;padding:32px 0 16px}
.header h1{
  font-size:28px;font-weight:900;
  background:linear-gradient(135deg,var(--gold3),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.header .subtitle{color:var(--txt2);font-size:14px;margin-top:6px}
.batch-name{
  display:inline-block;margin-top:10px;padding:4px 14px;
  background:rgba(184,150,12,0.08);border:1px solid rgba(184,150,12,0.15);
  border-radius:20px;font-size:13px;color:var(--gold3);
}

/* Week Selector */
.week-selector{
  display:flex;gap:8px;flex-wrap:wrap;padding:16px 0;
}
.week-btn{
  flex:1;min-width:0;padding:10px 6px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--card);color:var(--txt2);
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
  box-shadow:var(--shadow);transition:all .2s;
  white-space:nowrap;text-align:center;
}
.week-btn:hover:not(:disabled){border-color:var(--gold2);color:var(--gold3)}
.week-btn.active{
  background:linear-gradient(135deg,var(--gold3),var(--gold2));
  color:#fff;border-color:var(--gold2);
}
.week-btn:disabled{
  opacity:.4;cursor:not-allowed;background:var(--bg);
}
/* 類型分類列 */
.cat-selector{
  display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px;
}
.cat-btn{
  flex:1;min-width:0;padding:10px 6px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--card);color:var(--txt2);
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
  box-shadow:var(--shadow);transition:all .2s;
  white-space:nowrap;text-align:center;
}
.cat-btn:hover{border-color:var(--gold2);color:var(--gold3)}
.cat-btn.active{
  background:linear-gradient(135deg,var(--gold3),var(--gold2));
  color:#fff;border-color:var(--gold2);
}

/* Section */
.section-title{
  display:flex;align-items:center;gap:8px;
  margin:28px 0 14px;font-size:16px;font-weight:700;color:var(--gold3);
}
.section-title::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(184,150,12,0.2),transparent);
}

/* Award Cards */
.awards-grid{display:flex;flex-direction:column;gap:12px}
.award-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;padding:16px;
  transition:all .3s;box-shadow:var(--shadow);
}
.award-card:hover{
  border-color:rgba(184,150,12,0.15);
  transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
.award-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.award-emoji{font-size:28px}
.award-info{flex:1}
.award-name{font-size:16px;font-weight:900;color:var(--txt)}
.award-desc{font-size:12px;color:var(--txt2);margin-top:2px}

/* Podium */
.podium{display:flex;flex-direction:column;gap:6px}
.podium-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:10px;
  background:rgba(0,0,0,0.01);
}
.podium-row.rank-1{
  background:rgba(184,150,12,0.08);
  border-left:3px solid var(--gold2);
}
.podium-row.rank-2{
  background:rgba(120,120,120,0.06);
  border-left:3px solid #a0a0a0;
}
.podium-row.rank-3{
  background:rgba(180,120,50,0.06);
  border-left:3px solid #cd7f32;
}
.rank-badge{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;flex-shrink:0;
}
.rank-1 .rank-badge{background:var(--gold2);color:#fff}
.rank-2 .rank-badge{background:#a0a0a0;color:#fff}
.rank-3 .rank-badge{background:#cd7f32;color:#fff}
.podium-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg)}
.podium-name{flex:1;font-size:14px;font-weight:700}
.podium-score{
  font-size:14px;font-weight:900;
  color:var(--gold3);white-space:nowrap;
}
.podium-unit{font-size:11px;color:var(--txt2);font-weight:400;margin-left:2px}

/* Empty State */
.empty-state{
  text-align:center;padding:20px;color:var(--txt2);font-size:13px;
  font-style:italic;
}

/* Fun Badge */
.fun-tag{
  display:inline-block;padding:2px 8px;border-radius:8px;
  font-size:10px;font-weight:700;margin-left:6px;
  background:rgba(255,107,107,0.15);color:var(--red);
  vertical-align:middle;
}
.team-tag{
  display:inline-block;padding:2px 8px;border-radius:8px;
  font-size:10px;font-weight:700;margin-left:6px;
  background:rgba(81,207,102,0.15);color:var(--green);
  vertical-align:middle;
}

/* Loading */
.loading{text-align:center;padding:60px 0;color:var(--txt2)}
.loading .spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--gold2);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.footer{text-align:center;padding:40px 0 24px;color:var(--txt2);font-size:11px}

/* Blackout */
.blackout{
  text-align:center;padding:80px 20px;
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.blackout-icon{font-size:80px;margin-bottom:20px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.blackout-title{
  font-size:28px;font-weight:900;
  background:linear-gradient(135deg,var(--gold3),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:12px;
}
.blackout-sub{color:var(--txt2);font-size:15px;line-height:1.8;margin-bottom:30px}
.blackout-countdown{
  display:inline-flex;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:16px 28px;box-shadow:var(--shadow);
}
.countdown-unit{text-align:center}
.countdown-num{
  font-size:36px;font-weight:900;color:var(--gold3);
  font-variant-numeric:tabular-nums;min-width:48px;display:block;
}
.countdown-label{font-size:11px;color:var(--txt2);margin-top:2px}
.blackout-hint{
  margin-top:24px;padding:12px 20px;
  background:rgba(184,150,12,0.08);border-radius:12px;
  color:var(--gold3);font-size:14px;font-weight:700;
  display:inline-block;
}
</style>
</head>

<script>
const sb = supabase.createClient(
  'https://nsgqsopqlkhayuefdout.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y',
  { db: { schema: 'npcombat' } }

// ── 獎項定義（對齊新 DB 欄位）──
const AWARDS = [
  { key:'action_pts', emoji:'🏅', name:'行動王',    desc:'純行動積分（不含締結）',    unit:'分', fun:false },
  // 2026-08-14 開會定案三套統計：實戰班推薦人數（只算新人 001、小金大金同 1 人、分店不算）／
  // 之夜嘉許（推薦新人的締結分，含小金大金倍率）／獎勵活動（新人＋分店全算，見 total）
  { key:'referrals', emoji:'🌱', name:'推薦王',    desc:'推薦新人 001 人數（開分店不算）', unit:'人', fun:false },
  { key:'close_pts', emoji:'🔫', name:'締結王',    desc:'推薦新人的締結分（含小金大金）', unit:'分', fun:false },
  { key:'slots',     emoji:'🎫', name:'獎勵達人',  desc:'達成挑戰門檻名額最多（全期累積）', unit:'位', fun:false, cumulative:true },
  { key:'name_list', emoji:'📋', name:'滿門抄斬',  desc:'狂列名單筆數最多',         unit:'筆', fun:false },
  { key:'meet',      emoji:'🦋', name:'社交蝴蝶',  desc:'認識新友次數最多',         unit:'次', fun:false },
  { key:'invite',    emoji:'🔗', name:'人脈經營',  desc:'拉近關係次數最多',         unit:'次', fun:false },
  { key:'present',   emoji:'💬', name:'談笑風聲',  desc:'溝通本說明次數最多',       unit:'次', fun:false },
  { key:'seminar',   emoji:'🎯', name:'邀約達人',  desc:'邀請說明會次數最多',       unit:'次', fun:false },
  { key:'ghosted',   emoji:'🕊️', name:'和平鴿王', desc:'被放鴿子最多，但不放棄',   unit:'次', fun:true },
  { key:'rejected',  emoji:'🍋', name:'檸檬勇士', desc:'締結未果最多，越挫越勇',   unit:'次', fun:true },
];

let currentBatch = null;
let weeks = [];
let currentWeek = 0;
let currentCat = 'personal'; // personal / team / leader
const VERIFY_FROM = '2026-06-08'; // 證明勾折扣生效日（第三週起）；之前寬限全額
// 教練簡單模式（信任制）：不逐項審核 → 不套 ×0.5 折扣、審核型獎項隱藏
const isSimpleMode = () => currentBatch?.coach_mode === 'simple';
let batchStudents = [];
let coachGroups = {};
let coachInfo = {};
let allLogs = [];
let allCloses = [];
let allBonusRules = [];
let memberToStu = {};

// ── 蓋牌：週日 00:00 → 週日 22:00 ──
function isBlackout() {
  const now = new Date();
  const day = now.getDay(), h = now.getHours();
  if (day === 0 && h < 22) return true;
  return false;
}

function getNextRevealTime() {
  const now = new Date();
  const reveal = new Date(now);
  if (now.getDay() !== 0) reveal.setDate(reveal.getDate() + (7 - now.getDay()));
  reveal.setHours(22, 0, 0, 0);
  return reveal;
}

function showBlackout() {
  document.getElementById('weekSelector').style.display = 'none';
  document.getElementById('catSelector').style.display = 'none';
  const reveal = getNextRevealTime();
  function tick() {
    const diff = reveal - new Date();
    if (diff <= 0) { location.reload(); return; }
    document.getElementById('cd-h').textContent = String(Math.floor(diff / 3600000)).padStart(2, '0');
    document.getElementById('cd-m').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    document.getElementById('cd-s').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
  }
  document.getElementById('content').innerHTML = `
    <div class="blackout">
      <div class="blackout-icon">🃏</div>
      <div class="blackout-title">排行榜已封鎖</div>
      <div class="blackout-sub">本週戰績統計完畢，結果已蓋牌！<br>今晚實戰班之夜將揭曉所有獎項 🏆</div>
      <div class="blackout-countdown">
        <div class="countdown-unit"><span class="countdown-num" id="cd-h">--</span><span class="countdown-label">時</span></div>
        <div class="countdown-unit"><span class="countdown-num" id="cd-m">--</span><span class="countdown-label">分</span></div>
        <div class="countdown-unit"><span class="countdown-num" id="cd-s">--</span><span class="countdown-label">秒</span></div>
      </div>
      <div class="blackout-hint">📍 週日 21:00 Zoom 見！</div>
    </div>`;
  tick();
  setInterval(tick, 1000);
}

// ── Init ──
async function init() {
  // 載入最新班次
  // 當期（is_active）；沒有 active 才退回最新一期。避免預建下一期時排行榜提前跳空
  let { data: batches } = await sb.from('batches').select('*').eq('is_active', true).limit(1);
  if (!batches || !batches.length) {
    ({ data: batches } = await sb.from('batches').select('*').order('id', { ascending: false }).limit(1));
  }
  if (!batches || !batches.length) { showEmpty('尚未建立班次'); return; }
  currentBatch = batches[0];

  document.getElementById('batchName').textContent =
    currentBatch.event_name ? `${currentBatch.name}｜${currentBatch.event_name}` : currentBatch.name;

  if (!currentBatch.start_date || !currentBatch.end_date) { showEmpty('班次日期尚未設定'); return; }

  // 預載教練組別（含姓名、頭像）
  const { data: coachData } = await sb.from('batch_coaches')
    .select('id, member_id, group_name, members_master(name, picture_url)')
    .eq('batch_id', currentBatch.id).eq('status', 'approved');
  coachGroups = {};
  coachInfo = {};
  (coachData || []).forEach(c => {
    if (c.group_name) {
      coachGroups[c.id] = c.group_name;
      coachInfo[c.group_name] = {
        name: c.members_master?.name || '',
        pic: c.members_master?.picture_url || ''
      };
    }
  });

  // 預載學員＋教練（都算參與者）
  const { data: stuData } = await sb.from('batch_students')
    .select('id, member_id, coach_id, sponsor_id, members_master(name, member_code, picture_url)')
    .eq('batch_id', currentBatch.id).eq('status', 'approved');
  batchStudents = (stuData || []).map(s => ({
    id: s.id,
    member_id: s.member_id,
    coach_id: s.coach_id,
    sponsor_id: s.sponsor_id,
    group: coachGroups[s.coach_id] || '未分組',
    name: s.members_master?.name || '未知',
    code: s.members_master?.member_code || '',
    pic: s.members_master?.picture_url || '',
    role: 'student'
  }));
  // 教練也加入排名
  (coachData || []).forEach(c => {
    batchStudents.push({
      id: c.id,
      member_id: c.member_id,
      coach_id: null,
      sponsor_id: null,
      group: c.group_name || '未分組',
      name: c.members_master?.name || '未知',
      code: '',
      pic: c.members_master?.picture_url || '',
      role: 'coach'
    });
  });

  // 建立週次
  const start = new Date(currentBatch.start_date);
  const end = new Date(currentBatch.end_date);
  const today = new Date();
  // 週次對齊週日～週六：第一週從 start_date 到下個週六，之後每週日～週六
  let daysToSat = (6 - start.getDay() + 7) % 7;
  if (daysToSat === 0) daysToSat = 7;
  let firstSatEnd = new Date(start); firstSatEnd.setDate(firstSatEnd.getDate() + daysToSat);
  if (firstSatEnd > end) firstSatEnd = new Date(end);
  weeks.push({ num: 1, start: new Date(start), end: new Date(firstSatEnd) });
  let ws = new Date(firstSatEnd); ws.setDate(ws.getDate() + 1);
  let i = 2;
  while (ws <= end) {
    let we = new Date(ws); we.setDate(we.getDate() + 6);
    if (we > end) we = new Date(end);
    weeks.push({ num: i, start: new Date(ws), end: we });
    ws.setDate(ws.getDate() + 7);
    i++;
  }
  // 最後一週不足 3 天 → 併入前一週
  if (weeks.length > 1) {
    const last = weeks[weeks.length - 1];
    const days = (last.end - last.start) / 86400000;
    if (days < 3) { weeks[weeks.length - 2].end = last.end; weeks.pop(); }
  }

  currentWeek = 0;
  for (let w = 0; w < weeks.length; w++) {
    if (today >= weeks[w].start && today <= weeks[w].end) { currentWeek = w; break; }
    if (today > weeks[w].end) currentWeek = w;
  }

  await reloadData();
  renderWeekBar();
  renderCatBar();
  if (isBlackout()) { showBlackout(); return; }
  loadWeek(currentWeek);
  // 排行榜每小時自動刷新
  setInterval(async () => { await reloadData(); loadWeek(currentWeek); }, 3600000);
}

async function reloadData() {
  const memberIds = batchStudents.map(s => s.member_id);
  memberToStu = {};
  batchStudents.forEach(s => memberToStu[s.member_id] = s.id);

  const { data: logData } = await sb.from('action_logs')
    .select('student_id, log_date, name_list, meet, invite, present, seminar, ghosted, rejected, group_reported, decl_read, proof_checks, coach_checks')
    .eq('batch_id', currentBatch.id);
  allLogs = logData || [];

  const { data: closeData } = await sb.from('closing_records')
    .select('member_id, points, close_date, source, is_new, target_code').in('member_id', memberIds);
  allCloses = closeData || [];

  const { data: bonusData } = await sb.from('bonus_rules')
    .select('*').eq('batch_id', currentBatch.id);
  allBonusRules = bonusData || [];
}

function renderWeekBar() {
  const today = new Date();
  const bar = document.getElementById('weekSelector');
  let html = `<button class="week-btn" onclick="loadWeek(-1)">全期</button>`;
  weeks.forEach((w, i) => {
    const started = today >= w.start;
    const label = `W${w.num}`;
    html += `<button class="week-btn" onclick="loadWeek(${i})" ${started ? '' : 'disabled'}>${label}</button>`;
  });
  bar.innerHTML = html;
}

const CATEGORIES = [
  { key:'personal', label:'👤 個人' },
  { key:'team',     label:'🏰 團隊' },
  { key:'leader',   label:'🏅 領袖' },
];
function renderCatBar() {
  const bar = document.getElementById('catSelector');
  bar.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-btn ${c.key === currentCat ? 'active' : ''}" onclick="setCat('${c.key}')">${c.label}</button>`
  ).join('');
}
function setCat(key) {
  currentCat = key;
  renderCatBar();
  loadWeek(currentWeek);
}
function fmtDate(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtDateISO(d) { return d.toISOString().split('T')[0]; }

// 締結是否計分：admin 補登永遠算；學員自填(daily)要當天證明勾 close=true
function closeCounts(c) {
  // 締結＝真實報件，在 closing_records 裡就計分（不再卡證明勾）
  return true;
}

// 根據日期範圍過濾並彙總
function calcStats(startDate, endDate) {
  const fields = ['name_list','meet','invite','present','seminar','ghosted','rejected'];
  const BASE_PTS = { name_list:1, meet:1, invite:2, present:5, seminar:5, ghosted:1, rejected:1 };
  const students = {};
  batchStudents.forEach(s => {
    students[s.id] = {
      sid: s.id, name: s.name, code: s.code, group: s.group, pic: s.pic,
      meet:0, invite:0, present:0, seminar:0,
      ghosted:0, rejected:0, name_list:0,
      close_pts:0, action_pts:0, total:0, slots:0, referrals:0, branch_pts:0, _refCodes:new Set(),
      supervise:0,
      filled:false, filledItems:0, verifiedItems:0,
      downlinePts:0, downlineCount:0, downlineAvg:0, downlineNames:[]
    };
  });
  const logs = allLogs.filter(l => {
    if (startDate && l.log_date < startDate) return false;
    if (endDate && l.log_date > endDate) return false;
    return true;
  });
  // 組別 → 該組教練的參賽 id（督導分歸給教練）
  const groupCoachSid = {};
  batchStudents.forEach(p => { if (p.role === 'coach' && p.group && p.group !== '未分組') groupCoachSid[p.group] = p.id; });
  logs.forEach(log => {
    const s = students[log.student_id];
    if (!s) return;
    const proof = log.proof_checks || {};
    // 驗證寬限：6/8 前系統未上線、教練沒得勾 → 行動分全額；6/8 起才套證明勾折扣
    const verify = log.log_date >= VERIFY_FROM;
    fields.forEach(f => {
      const val = log[f] || 0;
      s[f] += val;
      const matching = allBonusRules.filter(r => r.action_field === f && log.log_date >= r.start_date && log.log_date <= r.end_date);
      const mult = matching.length ? Math.max(...matching.map(r => r.multiplier)) : 1;
      // 證明勾：有=全分，無=×0.5（僅生效日後）；簡單模式信任制→全額
      const proofMult = isSimpleMode() || !verify || proof[f] ? 1 : 0.5;
      s.action_pts += val * BASE_PTS[f] * mult * proofMult;
    });
    // 🎙️小組回報 +5（生效日後要證明勾；之前學員聲明即給；簡單模式免證明）
    if (log.group_reported && (isSimpleMode() || !verify || proof.group)) s.action_pts += 5;
    // 📖朗讀宣言 +2（學員自己拿）
    if (log.decl_read) s.action_pts += 2;
    // 📋 有填報（任一筆 log 即算填報）
    s.filled = true;
    // ✅ 驗證率素材：填了幾項(value>0) / 其中幾項有證明勾
    fields.forEach(f => {
      if ((log[f] || 0) > 0) { s.filledItems++; if (proof[f]) s.verifiedItems++; }
    });
    // 🎯 督導分：教練勾了幾項，歸給該組教練
    const coachChecks = log.coach_checks || {};
    const checkCount = Object.values(coachChecks).filter(Boolean).length;
    if (checkCount) {
      const coachSid = groupCoachSid[s.group];
      if (coachSid && students[coachSid]) students[coachSid].supervise += checkCount;
    }
  });
  const closes = allCloses.filter(c => {
    if (startDate && c.close_date < startDate) return false;
    if (endDate && c.close_date > endDate) return false;
    return true;
  });
  closes.forEach(c => {
    const sid = memberToStu[c.member_id];
    if (!sid || !students[sid]) return;
    if (!closeCounts(c)) return;
    const st = students[sid];
    if (c.is_new === false) {                       // 自己開分店：只進獎勵活動總分
      st.branch_pts += c.points || 0;
    } else {                                        // 推薦新人（或舊資料無判定）
      st.close_pts += c.points || 0;
      if (c.is_new === true && c.target_code && !st._refCodes.has(c.target_code)) {
        st._refCodes.add(c.target_code); st.referrals += 1;   // 同一新人開小金大金＝1 人
      }
    }
  });
  const arr = Object.values(students);
  arr.forEach(s => {
    s.action_pts = Math.round(s.action_pts); // 折扣可能產生 .5，四捨五入
    s.total = s.action_pts + s.close_pts + s.branch_pts;   // 獎勵活動：新人＋分店全算
  });
  // 👑 領袖王：下線(sponsor)實戰班總分平均，歸給該上線教練 + 收集下線名字
  const sidToSponsor = {};
  batchStudents.forEach(p => { if (p.sponsor_id) sidToSponsor[p.id] = p.sponsor_id; });
  arr.forEach(s => {
    const sponsorId = sidToSponsor[s.sid];
    if (sponsorId && students[sponsorId]) {
      students[sponsorId].downlinePts += s.total;
      students[sponsorId].downlineCount += 1;
      students[sponsorId].downlineNames.push(s.name);
    }
  });
  arr.forEach(s => {
    s.downlineAvg = s.downlineCount ? Math.round(s.downlinePts / s.downlineCount) : 0;
  });
  return { students, arr };
}

// ── 載入週資料（純前端計算） ──
// 該期有沒有獎勵活動（event_name 空 = 公司這期沒辦 → 活動相關榜自動隱藏）
const hasEventNow = () => !!(currentBatch && currentBatch.event_name);

function loadWeek(idx) {
  const hasEvent = hasEventNow();
  if (isBlackout()) { showBlackout(); return; }
  currentWeek = idx;

  const btns = document.querySelectorAll('.week-btn');
  btns.forEach((b, i) => { b.classList.toggle('active', i === idx + 1); });

  // 日期範圍
  let startDate = null, endDate = null;
  if (idx >= 0 && idx < weeks.length) {
    startDate = fmtDateISO(weeks[idx].start);
    endDate = fmtDateISO(weeks[idx].end);
  }

  const { students, arr } = calcStats(startDate, endDate);

  // W2 以後：算進步量（開班到本週底 - 開班到上週底）
  if (idx >= 1) {
    const cumEnd = fmtDateISO(weeks[idx].end);
    const prevEnd = fmtDateISO(weeks[idx - 1].end);
    const { students: cumStudents } = calcStats(null, cumEnd);
    const { students: prevStudents } = calcStats(null, prevEnd);
    const fields = ['name_list','meet','invite','present','seminar','ghosted','rejected','close_pts','action_pts','total','buddies','supervise','referrals','branch_pts'];
    arr.forEach(s => {
      const cum = cumStudents[s.sid];
      const prev = prevStudents[s.sid];
      if (!cum || !prev) return;
      fields.forEach(f => s[f] = Math.max(0, cum[f] - prev[f]));
    });
  }

  // 名額計算（全期，不受週次篩選）
  // 僅在該期有獎勵活動時計算（event_name 空 = 公司沒辦活動 → slots 全 0，相關榜自動隱藏）
  // ⚠️ 月份門檻（4/5/6）是 26 期威斯汀專屬；未來活動月份不同時，此段需連同 batches 門檻欄位一起改
  if (hasEvent) {
    const eb = currentBatch.earlybird_score || 700;
    const sm = currentBatch.single_month_score || 800;
    const cm = currentBatch.cross_month_score || 900;
    const slotsByMember = {};
    allCloses.forEach(c => {
      if (!closeCounts(c)) return; // 同樣套證明勾門檻
      if (!slotsByMember[c.member_id]) slotsByMember[c.member_id] = {};
      const m = parseInt(c.close_date.split('-')[1]);
      slotsByMember[c.member_id][m] = (slotsByMember[c.member_id][m] || 0) + (c.points || 0);
    });
    Object.entries(slotsByMember).forEach(([mid, months]) => {
      const sid = memberToStu[mid];
      if (!sid || !students[sid]) return;
      const apr = months[4] || 0, may = months[5] || 0, jun = months[6] || 0;
      const aprSlots = Math.floor(apr / eb);
      const maySlots = Math.floor(may / sm);
      const junSlots = Math.floor(jun / sm);
      const crossPool = (apr - aprSlots * eb) + (may - maySlots * sm) + (jun - junSlots * sm);
      const crossSlots = Math.floor(crossPool / cm);
      students[sid].slots = aprSlots + maySlots + junSlots + crossSlots;
    });
  }

  // 即使無資料也顯示獎項標題，讓大家知道有哪些可以玩

  // 排名（同分並列，最多顯示前 3 名次）
  const rank = (key) => {
    const sorted = [...arr].sort((a, b) => b[key] - a[key]).filter(s => s[key] > 0);
    const result = [];
    let currentRank = 0, lastVal = null;
    for (const s of sorted) {
      if (s[key] !== lastVal) { currentRank++; lastVal = s[key]; }
      if (currentRank > 3) break;
      result.push({ ...s, rank: currentRank });
    }
    return result;
  };

  // 軍團榮耀：按教練組別統計
  const groups = {};
  arr.forEach(s => {
    if (s.group === '未分組') return;
    if (!groups[s.group]) groups[s.group] = { action: 0, close: 0, hasClose: 0, hasSlot: 0, count: 0, filledCount: 0, filledItems: 0, verifiedItems: 0 };
    groups[s.group].action += s.action_pts;
    groups[s.group].close += s.close_pts;
    if (s.close_pts > 0) groups[s.group].hasClose += 1;
    if (s.slots > 0) groups[s.group].hasSlot += 1;
    if (s.filled) groups[s.group].filledCount += 1;
    groups[s.group].filledItems += s.filledItems;
    groups[s.group].verifiedItems += s.verifiedItems;
    groups[s.group].count += 1;
  });
  // 收集每組組員名稱（排除教練本人，避免重複）
  const groupMembers = {};
  arr.forEach(s => {
    if (s.group === '未分組') return;
    if (!groupMembers[s.group]) groupMembers[s.group] = [];
    if (s.name !== coachInfo[s.group]?.name) groupMembers[s.group].push(s.name);
  });
  const groupArr = Object.entries(groups).map(([name, g]) => ({
    name,
    coachName: coachInfo[name]?.name || '',
    coachPic: coachInfo[name]?.pic || '',
    members: (groupMembers[name] || []).join('、'),
    count: g.count,
    actionAvg: Math.round(g.action / g.count),
    closeAvg: Math.round(g.close / g.count),
    closePct: Math.round(g.hasClose / g.count * 100),
    slotPct: Math.round(g.hasSlot / g.count * 100),
    fillRate: Math.round(g.filledCount / g.count * 100),
    proofRate: g.filledItems ? Math.round(g.verifiedItems / g.filledItems * 100) : 0,
  }));

  // 渲染（依類型分類只顯示選中的榜）
  const periodLabel = idx === -1 ? '整期' : '本週';
  let html = '';

  if (currentCat === 'personal') {
    const isAllPeriod = idx === -1;
    html += `<div class="section-title">⚔️ ${periodLabel}個人戰績</div>`;
    html += '<div class="awards-grid">';
    // 累積型獎項（獎勵達人）只在「全期」顯示，且該期要有獎勵活動才存在
    AWARDS.filter(a => !a.fun && (!a.cumulative || isAllPeriod) && (a.key !== 'slots' || hasEvent))
      .forEach(a => { html += renderAwardCard(a, rank(a.key)); });
    html += '</div>';

    html += `<div class="section-title">😂 ${periodLabel}越挫越勇</div>`;
    html += '<div class="awards-grid">';
    AWARDS.filter(a => a.fun).forEach(a => { html += renderAwardCard(a, rank(a.key)); });
    html += '</div>';
  } else if (currentCat === 'team') {
    html += `<div class="section-title">🏰 ${periodLabel}團隊榮耀（實戰班分組）</div>`;
    html += '<div class="awards-grid">';
    html += renderTeamMetric('⚔️', '最強小隊', '組別平均行動積分', groupArr, 'actionAvg', '分');
    // 成交軍團：有活動的全期看達成門檻比例；否則看成交比例
    if (idx === -1 && hasEvent) {
      html += renderTeamMetric('🏆', '成交軍團', '組內達成挑戰門檻比例', groupArr, 'slotPct', '%');
    } else {
      html += renderTeamMetric('💰', '成交軍團', idx === -1 ? '組內成交比例' : '組內本週成交比例', groupArr, 'closePct', '%');
    }
    html += renderTeamMetric('📋', '全員到齊', '組內填報率最高', groupArr, 'fillRate', '%');
    // 嚴謹軍團靠證明照驗證率，簡單模式不審核 → 隱藏
    if (!isSimpleMode()) html += renderTeamMetric('✅', '嚴謹軍團', '組內證明照驗證率最高', groupArr, 'proofRate', '%');
    html += '</div>';
  } else if (currentCat === 'leader') {
    html += `<div class="section-title">🏅 ${periodLabel}領袖榜（上下線）</div>`;
    html += '<div class="awards-grid">';
    html += renderLeaderKing(rank('downlineAvg'));
    // 督導王靠逐項審核，簡單模式不審核 → 隱藏
    if (!isSimpleMode()) html += renderAwardCard({ key:'supervise', emoji:'🎖️', name:'督導王', desc:'逐項審核學員回報最多', unit:'項' }, rank('supervise'));
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function renderAwardCard(award, top3) {
  const tag = award.fun ? '<span class="fun-tag">趣味獎</span>' : '';
  let podium = '';
  if (top3.length === 0) {
    podium = '<div class="empty-state">虛位以待，等你來搶！</div>';
  } else {
    podium = '<div class="podium">' + top3.map(s => `
      <div class="podium-row rank-${s.rank}">
        <div class="rank-badge">${s.rank}</div>
        ${s.pic ? `<img class="podium-avatar" src="${s.pic}" alt="">` : ''}
        <div class="podium-name">${s.name}</div>
        <div class="podium-score">${s[award.key]}<span class="podium-unit">${award.unit}</span></div>
      </div>`).join('') + '</div>';
  }
  return `
    <div class="award-card">
      <div class="award-header">
        <div class="award-emoji">${award.emoji}</div>
        <div class="award-info">
          <div class="award-name">${award.name}${tag}</div>
          <div class="award-desc">${award.desc}</div>
        </div>
      </div>
      ${podium}
    </div>`;
}

function renderTeamMetric(emoji, name, desc, groups, key, unit) {
  const sorted = [...groups].sort((a, b) => b[key] - a[key]).filter(g => g[key] > 0);
  const top3 = [];
  let currentRank = 0, lastVal = null;
  for (const t of sorted) {
    if (t[key] !== lastVal) { currentRank++; lastVal = t[key]; }
    if (currentRank > 3) break;
    top3.push({ ...t, rank: currentRank });
  }
  let podium = '';
  if (top3.length === 0) {
    podium = '<div class="empty-state">虛位以待，等你來搶！</div>';
  } else {
    podium = '<div class="podium">' + top3.map(t => `
      <div class="podium-row rank-${t.rank}">
        <div class="rank-badge">${t.rank}</div>
        ${t.coachPic ? `<img class="podium-avatar" src="${t.coachPic}" alt="">` : ''}
        <div class="podium-name">${t.coachName} 教練 ${t.name}<div style="font-size:11px;font-weight:400;color:var(--txt2);margin-top:2px">${t.members}</div></div>
        <div class="podium-score">${t[key]}<span class="podium-unit">${unit}</span></div>
      </div>`).join('') + '</div>';
  }
  return `
    <div class="award-card">
      <div class="award-header">
        <div class="award-emoji">${emoji}</div>
        <div class="award-info">
          <div class="award-name">${name}<span class="team-tag">團隊獎</span></div>
          <div class="award-desc">${desc}</div>
        </div>
      </div>
      ${podium}
    </div>`;
}

function renderLeaderKing(top3) {
  let podium;
  if (top3.length === 0) {
    podium = '<div class="empty-state">虛位以待，等你來搶！</div>';
  } else {
    podium = '<div class="podium">' + top3.map(s => `
      <div class="podium-row rank-${s.rank}">
        <div class="rank-badge">${s.rank}</div>
        ${s.pic ? `<img class="podium-avatar" src="${s.pic}" alt="">` : ''}
        <div class="podium-name">${s.name}<div style="font-size:11px;font-weight:400;color:var(--txt2);margin-top:2px">組織夥伴：${s.downlineNames.join('、') || '—'}</div></div>
        <div class="podium-score">${s.downlineAvg}<span class="podium-unit">分</span></div>
      </div>`).join('') + '</div>';
  }
  return `
    <div class="award-card">
      <div class="award-header">
        <div class="award-emoji">👑</div>
        <div class="award-info">
          <div class="award-name">領袖王<span class="team-tag">領袖獎</span></div>
          <div class="award-desc">下線參與實戰班總分平均最高</div>
        </div>
      </div>
      ${podium}
    </div>`;
}

function showEmpty(msg) {
  document.getElementById('content').innerHTML = `<div class="empty-state" style="padding:60px 0">${msg}</div>`;
}

init();
</script>
