<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實戰班主系統管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="units.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  :root {
    --navy:#0a0e27; --navy2:#131836; --navy3:#1c2347;
    --gold:#d4af37; --gold-lt:rgba(212,175,55,.15); --gold-bd:rgba(212,175,55,.25);
    --white:#e8e8e8; --muted:#8a8fa8;
    --green:#4caf82; --green-bg:rgba(76,175,130,.15);
    --red:#e05c5c; --red-bg:rgba(224,92,92,.15);
    --yellow:#f0c040; --yellow-bg:rgba(240,192,64,.15);
    --blue:#5b8def; --blue-bg:rgba(91,141,239,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;padding:16px}
  .wrap{max-width:1000px;margin:0 auto}

  .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;margin-bottom:16px}
  .hd h1{font-size:20px;font-weight:700;color:var(--gold)}
  .hd-right{display:flex;align-items:center;gap:10px}
  .hd select{background:var(--navy3);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:500}
  .btn-ref{background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-ref:hover{background:var(--gold-bd)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .st{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;padding:14px;text-align:center}
  .st-n{font-size:28px;font-weight:700;color:var(--gold)}
  .st-l{font-size:12px;color:var(--muted);margin-top:4px}

  .tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--gold-bd)}
  .tab{background:none;border:none;color:var(--muted);padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:.2s}
  .tab:hover{color:var(--gold)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .panel{display:none}.panel.on{display:block}

  .sec-title{font-size:15px;font-weight:600;color:var(--gold);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--gold-bd);display:flex;justify-content:space-between;align-items:center}
  .sec-title:first-child{margin-top:0}
  .sec-count{font-size:12px;font-weight:400;color:var(--muted)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .search-box{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 12px;color:var(--white);font-size:13px;font-family:inherit;width:220px;transition:.2s}
  .search-box:focus{outline:none;border-color:var(--gold-bd)}
  .search-box::placeholder{color:var(--muted)}
  .toolbar-acts{display:flex;gap:8px;align-items:center}
  .btn-batch{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid;font-family:inherit;transition:.2s}
  .btn-batch-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-batch-ok:hover{background:rgba(76,175,130,.3)}
  .btn-csv{background:var(--blue-bg);color:var(--blue);border-color:rgba(91,141,239,.3)}
  .btn-csv:hover{background:rgba(91,141,239,.3)}

  .card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .card:hover{border-color:var(--gold-bd)}
  .card-left{flex:1;min-width:0}
  .card-name{font-size:15px;font-weight:500}
  .card-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}

  .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500}
  .b-pending{background:var(--yellow-bg);color:var(--yellow)}
  .b-approved{background:var(--green-bg);color:var(--green)}
  .b-rejected{background:var(--red-bg);color:var(--red)}

  .acts{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .btn{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:.2s}
  .btn-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-ok:hover{background:rgba(76,175,130,.3)}
  .btn-no{background:var(--red-bg);color:var(--red);border-color:rgba(224,92,92,.3)}
  .btn-no:hover{background:rgba(224,92,92,.3)}

  .coach-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:10px;transition:.2s;overflow:hidden}
  .coach-card:hover{border-color:var(--gold-bd)}
  .coach-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .coach-arrow{color:var(--muted);font-size:12px;transition:transform .2s;margin-left:8px}
  .coach-card.open .coach-arrow{transform:rotate(180deg)}
  .coach-count{background:var(--gold-lt);color:var(--gold);padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600}
  .coach-count.zero{background:rgba(138,143,168,.12);color:var(--muted)}
  .coach-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .coach-card.open .coach-body{max-height:800px}
  .coach-stu{padding:8px 16px 8px 32px;border-top:1px solid rgba(255,255,255,.04);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .coach-stu-name{color:var(--white)}
  .coach-stu-meta{color:var(--muted);font-size:11px}
  .coach-empty{padding:12px 32px;color:var(--muted);font-size:12px;font-style:italic}
  .btn-reassign{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-reassign:hover{background:rgba(91,141,239,.3)}
  .reassign-sel{background:var(--navy3);border:1px solid var(--gold-bd);border-radius:6px;padding:4px 8px;color:var(--white);font-size:12px;font-family:inherit;margin-right:6px}

  .pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pair-col h3{font-size:14px;color:var(--gold);margin-bottom:10px}
  .pick{padding:10px 12px;margin-bottom:6px;background:var(--navy3);border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.2s}
  .pick:hover{border-color:rgba(212,175,55,.3)}
  .pick.sel{border-color:var(--gold);background:var(--gold-lt)}
  .pick-name{font-size:14px;font-weight:500}
  .pick-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .btn-pair{width:100%;margin-top:12px;padding:10px;background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-pair:hover:not(:disabled){background:var(--gold-bd)}
  .btn-pair:disabled{opacity:.4;cursor:not-allowed}

  .paired-section{margin-top:20px}
  .paired-section h3{font-size:14px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .paired-search{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 10px;color:var(--white);font-size:12px;font-family:inherit;width:180px}
  .paired-search:focus{outline:none;border-color:var(--gold-bd)}
  .paired-search::placeholder{color:var(--muted)}
  .btn-unpair{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unpair:hover{background:rgba(224,92,92,.3)}

  .empty{text-align:center;padding:48px 16px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .empty-text{font-size:14px}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy2);border:1px solid var(--gold-bd);color:var(--gold);padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:999;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .roster-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:.2s}
  .roster-card:hover{border-color:var(--gold-bd)}
  .roster-top{display:flex;justify-content:space-between;align-items:center}
  .roster-info{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  .roster-checks{display:flex;gap:12px;margin-top:6px}
  .roster-check{font-size:12px;cursor:pointer;padding:2px 8px;border-radius:4px;transition:.2s}
  .roster-check:hover{background:var(--navy3)}
  .roster-check .has{color:var(--green)}
  .roster-check .no{color:var(--muted)}
  .btn-edit{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-edit:hover{background:rgba(91,141,239,.3)}
  .edit-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
  .edit-field{display:flex;flex-direction:column;gap:3px}
  .edit-field label{font-size:11px;color:var(--muted)}
  .edit-field input{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;font-family:inherit;width:140px}
  .edit-field input:focus{outline:none;border-color:var(--gold-bd)}
  .btn-save{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-save:hover{background:rgba(76,175,130,.3)}
  .btn-cancel{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(138,143,168,.3);background:transparent;color:var(--muted);font-family:inherit;transition:.2s}
  .btn-cancel:hover{background:rgba(138,143,168,.1)}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:998;display:flex;align-items:center;justify-content:center}
  .modal-box{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto}
  .modal-title{font-size:15px;font-weight:600;color:var(--gold);margin-bottom:12px}
  .modal-body{font-size:13px;color:var(--white);line-height:1.8;white-space:pre-wrap}
  .modal-close{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;margin-right:8px}
  .modal-edit-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit}
  .modal-save-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;margin-right:8px}
  .modal-textarea{width:100%;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;color:var(--white);font-size:13px;font-family:inherit;line-height:1.8;resize:vertical;min-height:150px}
  .modal-textarea:focus{outline:none;border-color:var(--gold-bd)}

  .bonus-form{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;padding:16px;margin-bottom:16px}
  .bonus-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .bonus-field{display:flex;flex-direction:column;gap:4px}
  .bonus-field label{font-size:11px;color:var(--muted)}
  .bonus-field select,.bonus-field input{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;color:var(--white);font-size:13px;font-family:inherit}
  .bonus-field select:focus,.bonus-field input:focus{outline:none;border-color:var(--gold-bd)}
  .btn-add-bonus{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;transition:.2s;align-self:end}
  .btn-add-bonus:hover{background:var(--gold-bd)}
  .bonus-table{width:100%;border-collapse:collapse;margin-top:4px}
  .bonus-table th{text-align:center;font-size:14px;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--gold-bd)}
  .bonus-table td{font-size:15px;padding:12px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
  .bonus-active{color:var(--green)}
  .bonus-expired{color:var(--muted)}
  .bonus-upcoming{color:var(--yellow)}

  .fin-table{width:100%;border-collapse:collapse}
  .fin-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--gold-bd)}
  .fin-table td{font-size:13px;padding:10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
  .fin-confirmed{color:var(--green);font-weight:600}
  .fin-pending{color:var(--yellow)}
  .btn-confirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-confirm:hover{background:rgba(76,175,130,.3)}
  .btn-unconfirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unconfirm:hover{background:rgba(224,92,92,.3)}

  .perm-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .perm-card:hover{border-color:var(--gold-bd)}
  .perm-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .perm-tag{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--gold-lt);color:var(--gold)}
  .perm-tag.off{background:rgba(138,143,168,.1);color:var(--muted);text-decoration:line-through}
  .perm-add-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
  .perm-add-row select{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;color:var(--white);font-size:13px;font-family:inherit}

  /* ── 追蹤分析 ── */
  .track-row{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--muted);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track-red{border-left-color:var(--red)}
  .track-orange{border-left-color:var(--yellow)}
  .track-blue{border-left-color:var(--blue)}
  .track-black{border-left-color:#555}
  .track-name{font-size:14px;font-weight:600;color:var(--white)}
  .track-mid{font-size:12px;color:var(--muted)}
  .track-tag{font-size:12px;font-weight:600;color:var(--gold);margin-left:auto}
  .track-sub{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:4px}
  .track-chips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .track-chip{font-size:12px;color:var(--white);background:var(--navy3);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 9px}
  /* 記點（2026-08-17）：全部用算的，不存欄位；退不退班人工決定 */
  .dm-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
  .dm-tbl th{text-align:right;padding:7px 6px;font-size:11px;color:var(--muted);font-weight:400;border-bottom:1px solid rgba(255,255,255,.08)}
  .dm-tbl th:first-child{text-align:left}
  .dm-tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:var(--white)}
  .dm-tbl td:first-child{text-align:left;font-weight:600}
  .dm-tbl td .c{color:var(--muted);font-weight:400;font-size:11px;margin-left:5px}
  .dm-pt{font-weight:700;font-size:15px}
  .dm-0{color:#4ade80} .dm-1{color:#fbbf24} .dm-3{color:#f87171}
  .dm-pend{color:var(--muted);font-weight:400;font-size:11.5px}
  /* 階段列／子區塊列（2026-08-17 重整） */
  .sub-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .ana-sec{border:1px solid var(--gold-bd);border-radius:14px;padding:14px 16px 18px;margin-bottom:18px;background:rgba(255,255,255,.015)}
  .ana-hd{font-size:16px;font-weight:700;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gold-bd);display:flex;justify-content:space-between;align-items:baseline}
  .ana-hd span{font-size:11.5px;font-weight:400;color:var(--muted)}
  .sub-anchor{padding:6px 14px;border-radius:18px;background:var(--navy2);border:1px solid rgba(255,255,255,.07);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .sub-anchor:hover{color:var(--gold);border-color:var(--gold-bd)}
  /* 開班前檢查清單 */
  .ck{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:10px;background:var(--navy2);border-left:3px solid var(--muted);margin-bottom:8px}
  .ck.ok{border-left-color:#22a05a} .ck.warn{border-left-color:#e0a020} .ck.bad{border-left-color:#d9534f}
  .ck-ico{font-size:17px;line-height:1.3;flex-shrink:0}
  .ck-b{flex:1}
  .ck-t{font-size:14px;font-weight:600;color:var(--white)}
  .ck-d{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:3px}
  .ck-d b{color:#f87171}
  .ck-sum{padding:14px 16px;border-radius:12px;font-size:14px;font-weight:700;margin-bottom:14px;text-align:center}
  .ck-sum.go{background:rgba(34,160,90,.14);color:#4ade80}
  .ck-sum.no{background:rgba(217,83,79,.14);color:#f87171}
  /* 作業矩陣（2026-08-14） */
  .hwm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hwm{border-collapse:separate;border-spacing:2px;font-size:11px}
  .hwm th{color:var(--muted);font-weight:400;padding:3px 2px;text-align:center;white-space:nowrap}
  .hwm th.nm,.hwm td.nm{text-align:left;position:sticky;left:0;background:var(--navy);z-index:1;padding-right:8px;white-space:nowrap}
  .hwm td.nm{color:var(--white);font-weight:600;font-size:12px}
  .hwm td.nm .c{color:var(--muted);font-weight:400;font-size:10px;margin-left:4px}
  .hwm-c{width:26px;height:24px;border-radius:5px;text-align:center;font-weight:700;color:#fff;font-size:10px}
  .hwm-c.full{background:#22a05a} .hwm-c.part{background:#e0a020} .hwm-c.none{background:#d9534f} .hwm-c.na{background:rgba(255,255,255,.07)} .hwm-c.lock{background:transparent}
  .hwm-sum{padding:8px 4px;font-size:12px;color:var(--white)}
  .hwm-sum b{color:#f87171}
  /* 教練回報總覽（simple 模式，2026-08-13） */
  .cov-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .cov-tbl th{text-align:right;padding:8px 6px;font-size:11px;color:var(--muted);font-weight:400;border-bottom:1px solid rgba(255,255,255,.08)}
  .cov-tbl th:first-child{text-align:left}
  .cov-tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:var(--white)}
  .cov-tbl td:first-child{text-align:left;font-weight:600}
  .cov-pct{font-weight:700}

<body>
<div class="wrap">
  <div class="hd">
    <h1>實戰班主系統管理</h1>
    <div class="hd-right">
      <select id="selBatch"></select>
      <button class="btn-ref" onclick="load()">重整</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="now">📊 分析</button>
    <button class="tab" data-t="roster">👥 名冊</button>
    <button class="tab" data-t="coach">🎓 教練</button>
    <button class="tab" data-t="setup">⚙️ 設定</button>
    <button class="tab" data-t="perm">🔐 權限</button>
  </div>

  <!-- 📊 分析：固定四節，不再多一層階段導覽（2026-08-17 第 4 次改版）
       開班前檢查清單 → 移入 ⚙️設定（它檢查的就是設定有沒有做完）
       開班後結案報表 → 變成第 ⑤ 節，只在該期 end_date 已過時自動出現 -->
  <div class="panel on" id="p-now">
    <div id="nowArea" class="loading">載入中…</div>
  </div>

  <!-- 👥 名冊：同一個學員的審核／分組／上線／繳費合在一頁（原本要跑三個 Tab） -->
  <div class="panel" id="p-roster">
    <div class="sub-bar" id="rosterBar"></div>
    <div id="reviewArea"></div>
    <div id="pairArea"></div>
    <div id="financeArea"></div>
  </div>

  <div class="panel" id="p-coach"><div id="orgArea" class="loading">載入中…</div></div>
  <div class="panel" id="p-setup"><div id="setupArea" class="loading">載入中…</div><div id="bonusArea"></div></div>
  <div class="panel" id="p-perm"><div id="permArea" class="loading">載入中…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const sb = window.supabase.createClient(
  'https://nsgqsopqlkhayuefdout.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y',
  { db: { schema: 'npcombat' } }
);

const LIFF_ID = '2009692859-DepTDosN';
let bid = null, students = [], coaches = [], bonusRules = [], adminUsers = [], todayLogs = [], yesterdayLogs = [], allLogs = [], selS = null, selC = null, searchReview = '';
let allBatches = [], engRows = [], hwRows = [];   // hwRows = homework_checks（作業檢核）   // engRows = coach_engagement（simple 模式的教練標記）
let myAllowedTabs = [];
let isReadonly = false;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function init() {
  // ── LIFF 門禁 ──
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      // 防跳轉迴圈：若剛從 LINE 登入回來(網址帶 code)卻仍未登入 = 瀏覽器擋 cookie，停下來給提示，別再跳
      if (new URLSearchParams(location.search).has('code')) {
        document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🔁</div><div class="empty-text">登入無法完成，通常是瀏覽器擋了 Cookie。<br><br>請改用以下方式：<br>① 直接在 <b>LINE App 內</b>開啟此頁<br>② 或用 Chrome（非無痕）、關閉「封鎖第三方 Cookie」<br><br>連結：liff.line.me/2009692859-DepTDosN</div></div>';
        return;
      }
      liff.login({ redirectUri: location.origin + location.pathname });
      return;
    }
    const profile = await liff.getProfile();

    const { data: member } = await sb.from('members_master').select('id, name')
      .eq('line_user_id', profile.userId).single();
    if (!member) { document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🚫</div><div class="empty-text">查無會員資料</div></div>'; return; }

    const { data: admin } = await sb.from('admin_users').select('allowed_tabs')
      .eq('member_id', member.id).single();
    if (admin) {
      // 舊 allowed_tabs（dashboard/track/review/org/pairing/bonus/finance/perm）→ 新五 Tab 對映，
      // 免得改版後既有管理員被鎖在外面（2026-08-17 重整）
      const OLD2NEW = { dashboard:'now', track:'now', review:'roster', pairing:'roster',
                        finance:'roster', org:'coach', bonus:'setup', perm:'perm' };
      const raw = admin.allowed_tabs || [];
      myAllowedTabs = [...new Set(raw.map(t => OLD2NEW[t] || t))];
      isReadonly = false;
    } else {
      // 非管理員 → 檢查是否為教練 → 唯讀模式
      const { data: coachCheck } = await sb.from('batch_coaches').select('id')
        .eq('member_id', member.id).limit(1);
      if (!coachCheck?.length) { document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">無管理權限</div></div>'; return; }
      myAllowedTabs = ['now','roster','coach','setup'];   // 教練唯讀：看得到現況與名冊，設定唯讀、無權限管理
      isReadonly = true;
    }

    // 隱藏無權限的 Tab
    document.querySelectorAll('.tab').forEach(btn => {
      const t = btn.dataset.t;
      if (!myAllowedTabs.includes(t)) {
        btn.style.display = 'none';
        document.getElementById('p-' + t).style.display = 'none';
      }
    });
    // 確保預設顯示第一個有權限的 Tab
    const firstTab = document.querySelector('.tab[style=""]') || document.querySelector('.tab:not([style*="none"])');
    if (firstTab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
      firstTab.classList.add('on');
      document.getElementById('p-' + firstTab.dataset.t).classList.add('on');
    }
  } catch (e) {
    if (e.message && e.message.includes('revoked')) { localStorage.clear(); location.reload(); return; }
    document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">登入失敗：' + e.message + '</div></div>';
    return;
  }

  // ── 原始初始化 ──
  const { data: batches } = await sb.from('batches').select('*').order('id', { ascending: false });
  const sel = document.getElementById('selBatch');
  sel.innerHTML = (batches || []).map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  // 預設選當期（is_active），沒有才退回最新一期。下拉可自由切換看歷屆
  allBatches = batches || [];
  if (batches?.length) {
    const active = batches.find(b => b.is_active);
    bid = (active || batches[0]).id;
    sel.value = bid;
  }
  sel.addEventListener('change', e => { bid = Number(e.target.value); load(); });
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('p-' + btn.dataset.t).classList.add('on');
    });
  });
  await load();
  // 資訊版自動刷新：每 60 秒，僅在資訊版 Tab 顯示時才重拉
  setInterval(() => {
    const dp = document.getElementById('p-dashboard');
    if (dp && dp.classList.contains('on')) load();
  }, 60000);
}

async function load() {
  const { data: s } = await sb.from('batch_students')
    .select('id, member_id, coach_id, sponsor_id, phone, registered, group_name, introduction, name_list, transfer_code, status, payment_confirmed, payment_date, created_at, members_master(name, member_code), sponsor:batch_coaches!sponsor_id(members_master(name))')
    .eq('batch_id', bid);
  students = s || [];
  const { data: c } = await sb.from('batch_coaches')
    .select('id, member_id, phone, rank, cfc, group_name, status, created_at, members_master(name, member_code)')
    .eq('batch_id', bid);
  coaches = c || [];
  const { data: br } = await sb.from('bonus_rules')
    .select('*').eq('batch_id', bid).order('start_date');
  bonusRules = br || [];
  const { data: au } = await sb.from('admin_users')
    .select('*, members_master(name, member_code)');
  adminUsers = au || [];
  // 昨日＋今日回報（action_logs），用本地時區
  const today = localDateStr(new Date());
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const { data: recentLogs } = await sb.from('action_logs')
    .select('*').eq('batch_id', bid).gte('log_date', yesterday).lte('log_date', today);
  todayLogs = (recentLogs || []).filter(l => l.log_date === today);
  yesterdayLogs = (recentLogs || []).filter(l => l.log_date === yesterday);
  // 全期 logs（追蹤分析用）
  const { data: full } = await sb.from('action_logs')
    .select('student_id, log_date, name_list, meet, invite, present, seminar, ghosted, rejected, confirmed, proof_checks')
    .eq('batch_id', bid);
  allLogs = full || [];
  // 教練標記（simple 模式）：教練回報總覽用
  const { data: eng } = await sb.from('coach_engagement')
    .select('coach_id, student_id, log_date, homework, homework_replied, created_at')
    .eq('batch_id', bid);
  engRows = eng || [];
  const { data: hw } = await sb.from('homework_checks')
    .select('student_id, unit_no, done, total, coach_id').eq('batch_id', bid);
  hwRows = hw || [];
  render();
}

// 「昨日」在星期一會指向星期日——那天不排作業、不要求 LINE，整頁會全 0。
// 日報一律看「上一個上課日」＝今天之前最近的平日（週一～週五）。
function lastClassDay() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  for (let i = 0; i < 7; i++) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) return localDateStr(d);
    d.setDate(d.getDate() - 1);
  }
  return localDateStr(d);
}
const WDAY = ['日','一','二','三','四','五','六'];
function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const ACTION_LABELS = { name_list:'狂列名單', meet:'認識新友', invite:'拉近關係', present:'溝通本說明', seminar:'邀請說明會', ghosted:'被放鴿子', rejected:'締結未果' };
const GROUPS = ['第一組','第二組','第三組','第四組','第五組','第六組','第七組','第八組','第九組','第十組','第十一組','第十二組','第十三組','第十四組'];
const RANK_OPTIONS = ['成就','星鑽','高峰','CFC'];
const CFC_OPTIONS = ['顏麗玉、游天貴','李芊嬅','張隆熙','林甘霖、楊牧潔','蔡依儒、尤竣億','林姍嬅、凌翊迅','楊敬豪、林珊合'];

// ── Helpers ──
const nm = r => r.members_master?.name || '（未知）';
const mc = r => { const c = r.members_master?.member_code; return c ? `（${c}）` : ''; };
const sp = r => r.sponsor?.members_master?.name || '';
const nl = v => { if (!v) return ''; if (Array.isArray(v)) return v.join('、'); return String(v); };
const bdg = s => {
  const m = { pending:['b-pending','待審核'], approved:['b-approved','已批准'], rejected:['b-rejected','已拒絕'] };
  const [cls,txt] = m[s]||['',s]; return `<span class="badge ${cls}">${txt}</span>`;
};
const approvedCoaches = () => coaches.filter(c => c.status === 'approved');
const sponsorStudents = cid => students.filter(s => s.sponsor_id === cid && s.status === 'approved');
const pairedStudents  = cid => students.filter(s => s.coach_id === cid && s.status === 'approved');

function matchSearch(item) {
  if (!searchReview) return true;
  const t = searchReview.toLowerCase();
  return (nm(item)+mc(item)+(item.phone||'')).toLowerCase().includes(t);
}

function render() {
  renderNow();                                   // 🎯 現在（依階段自動）
  renderReview(); renderPairing(); renderFinance();   // 👥 名冊（三段同頁）
  renderOrg();                                   // 🎓 教練
  renderSetup(); renderBonus();                  // ⚙️ 設定
  renderPerm();                                  // 🔐 權限
  renderRosterBar();
}

// 名冊頁的三段快速跳轉（審核／分組／繳費原本是三個 Tab）
function renderRosterBar() {
  const bar = document.getElementById('rosterBar');
  if (bar) bar.innerHTML = ['審核','分組配對','繳費'].map((t, i) =>
    `<a class="sub-anchor" onclick="document.querySelectorAll('#p-roster>div')[${i+1}].scrollIntoView({behavior:'smooth'})">${t}</a>`).join('');
}

// ⚙️ 設定：班期欄位一覽（唯讀顯示，改值仍走 Supabase；先讓人看得到全貌）
function renderSetup() {
  const b = allBatches.find(x => x.id === bid);
  const el = document.getElementById('setupArea');
  if (!el) return;
  if (!b) { el.innerHTML = '<div class="empty"><div class="empty-text">請先選擇班期</div></div>'; return; }
  const row = (k, v, note) => `<div class="ck ${v ? 'ok' : 'warn'}"><div class="ck-ico">${v ? '✅' : '🟡'}</div><div class="ck-b"><div class="ck-t">${k}　<span style="color:var(--gold)">${v || '（未設）'}</span></div>${note ? `<div class="ck-d">${note}</div>` : ''}</div></div>`;
  let h = phaseBefore();   // 開班前檢查清單：它檢查的就是「設定有沒有做完」，同一件事放同一頁
  h += `<div class="sec-title"><span>⚙️ 班期設定</span><span class="sec-count">${b.name}</span></div>`;
  h += row('期間', b.start_date && b.end_date ? `${b.start_date} ～ ${b.end_date}` : '', '倒數、週次、階段判定都看這個');
  h += row('學習週 study_start / study_end', b.study_start && b.study_end ? `${b.study_start} ～ ${b.study_end}` : '', '⚠️ 課表共四處副本，改這裡也要改 units.js／course.html／brochure.html');
  h += row('行動開放日 action_open_date', b.action_open_date, 'NULL＝不鎖，開班第一天就能填七大行動與小組回報心得');
  h += row('教練模式 coach_mode', b.coach_mode, 'simple＝信任制一鍵勾（27 期起）／full＝逐項審核（26 期）');
  h += row('獎勵活動 event_name', b.event_name, '留空＝無活動，相關 UI 自動隱藏');
  h += row('當期 is_active', b.is_active ? '🟢 是' : '否', '唯一索引擋雙開；學員端 8 個檔都讀它，班期中途不可切換');
  h += row('開放報名 registration_open', b.registration_open ? '🟢 開放中' : '關閉', '與 is_active 分開——可在前一期還在跑時就開放下一期報名');
  return el.innerHTML = h;
}

// ── 教練回報總覽（只在 simple 模式顯示；full 模式的 26 期沿用下方原有區塊）──
// 定義（2026-08-13 與 Randoph 定案）：教練要做兩件事——標「學員交了」＋標「自己回了」。
//   看了 ＝ homework 有值（true 或 false，代表教練有進來做判斷）／分母＝組員數 × 應標天數
//   交件 ＝ homework=true　　　　　　　　　　　　　　　／分母＝看了（沒看過的不算漏交）
//   已回 ＝ homework_replied=true　　　　　　　　　　　／分母＝交件（學員沒交，教練不可能回）
//   組員填報 ＝ 組員自己在 daily 填過的人數／組員數（唯一不經過教練的客觀資料）
// 應標天數＝開班日到今天的平日數（週六日不排作業，不該算漏標）。不綁 study_end，
// 因為未來啟動班／行動班會同時存在，用期間切換是錯的框架。
function renderCoachOverview(realStudents, logsByStu) {
  const batch = allBatches.find(b => b.id === bid);
  if (!batch || (batch.coach_mode || 'simple') !== 'simple') return '';

  const today = localDateStr(new Date());
  let markDays = 0;
  for (let d = new Date(batch.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) markDays++;
  }

  const stuByCoach = {};
  realStudents.forEach(s => { if (s.coach_id) (stuByCoach[s.coach_id] = stuByCoach[s.coach_id] || []).push(s); });

  const rows = coaches.filter(c => (stuByCoach[c.id] || []).length).map(c => {
    const stu = stuByCoach[c.id];
    const mine = engRows.filter(r => r.coach_id === c.id);
    const looked  = mine.filter(r => r.homework !== null && r.homework !== undefined).length;
    const handed  = mine.filter(r => r.homework === true).length;
    const replied = mine.filter(r => r.homework_replied === true).length;
    const filled  = stu.filter(s => (logsByStu[s.id] || []).length > 0).length;
    return { name: nm(c), n: stu.length, due: stu.length * markDays, looked, handed, replied, filled };
  });
  if (!rows.length) return '';
  rows.sort((a, b) => (b.looked / (b.due || 1)) - (a.looked / (a.due || 1)));

  const pct = (a, b) => b ? Math.round(a / b * 100) : null;
  const cls = p => p === null ? 'cov-d' : p >= 70 ? 'cov-g' : p >= 40 ? 'cov-y' : 'cov-r';
  const cell = (a, b) => {
    const p = pct(a, b);
    return `<td><span class="cov-pct ${cls(p)}">${p === null ? '—' : p + '%'}</span><br><span class="cov-sub">${a}/${b}</span></td>`;
  };

  const zero = rows.filter(r => r.looked === 0);
  let h = `<div class="sec-title"><span>📋 教練回報總覽</span><span class="sec-count">應標天數 ${markDays} 天（平日）</span></div>`;
  h += `<div class="cov-note">
    <b>看了</b>＝教練有進來判斷（分母：組員×應標天數）　<b>交件</b>＝看過的裡面學員真的交了（分母：看了）
    <b>已回</b>＝交了的裡面教練回了（分母：交件）<br>
    ⚠️ <b>「看了 0%」不代表學員沒交，代表教練沒進來標。</b>學員實際狀況看最右欄「組員填報」，那一欄不經過教練。
  </div>`;
  h += `<table class="cov-tbl"><tr><th>教練</th><th>看了</th><th>交件</th><th>已回</th><th>組員填報</th></tr>`;
  rows.forEach(r => {
    h += `<tr><td>${r.name}<br><span class="cov-sub">${r.n} 位組員</span></td>
      ${cell(r.looked, r.due)}${cell(r.handed, r.looked)}${cell(r.replied, r.handed)}
      <td><span class="cov-pct ${cls(pct(r.filled, r.n))}">${r.filled}/${r.n}</span><br><span class="cov-sub">有填過</span></td></tr>`;
  });
  h += `</table>`;
  if (zero.length) h += `<div class="cov-note" style="border-left-color:#f87171;margin-top:10px">
    🔴 <b>完全沒進來標記：${zero.map(r => r.name).join('、')}</b>
    這幾組的「交件」看不出來，但「組員填報」那欄仍然有效。</div>`;
  return h;
}

// ── 全班作業矩陣（2026-08-14）：資料來自教練在 coach-review「📋 作業」的檢核（homework_checks）
//   格子：全繳／部分／沒繳／未檢核（教練沒點過，不代表沒交）；未來單元空白
//   用途：記點退班（未交作業記 1 點）的依據；缺件排行讓管理者知道該催誰、該催哪位教練去檢核
function renderHwMatrix(realStudents, coachById) {
  if (typeof UNITS === 'undefined' || !realStudents.length) return '';
  const today = localDateStr(new Date());
  const taught = new Set();
  Object.entries(SCHEDULE || {}).forEach(([d, arr]) => { if (d <= today) arr.forEach(n => taught.add(n)); });
  const map = {}; hwRows.forEach(r => map[r.student_id + '|' + r.unit_no] = r);
  const st = (sid, u) => { const r = map[sid + '|' + u]; if (!r) return 'na'; if (r.total > 0 && r.done >= r.total) return 'full'; return r.done > 0 ? 'part' : 'none'; };

  const rows = realStudents.map(s => {
    let full = 0, part = 0, none = 0, na = 0;
    UNITS.forEach(u => { if (!taught.has(u.no)) return; const k = st(s.id, u.no); if (k === 'full') full++; else if (k === 'part') part++; else if (k === 'none') none++; else na++; });
    return { s, full, part, none, na, missing: part + none };
  }).sort((a, b) => (b.missing - a.missing) || (b.na - a.na));

  const taughtN = taught.size;
  const checkedAll = rows.filter(r => r.na === 0).length;
  const zeroChecked = rows.filter(r => r.na === taughtN).length;

  let h = `<div class="sec-title"><span>📋 全班作業檢核矩陣</span><span class="sec-count">已上 ${taughtN} 單元 · 教練檢核完 ${checkedAll}/${rows.length} 人</span></div>`;
  h += `<div class="cov-note">綠=全繳　橘=部分（數字=已交/題數）　紅=沒繳　灰=<b>教練還沒檢核（不代表沒交）</b>　空=尚未上到<br>
    排序：缺件多的在前。⚠️ 有 <b>${zeroChecked} 人</b>整排全灰＝教練完全沒檢核，先催教練不是催學員。</div>`;
  h += `<div class="hwm-wrap"><table class="hwm"><tr><th class="nm">學員</th>`;
  UNITS.forEach(u => h += `<th title="${u.n}">${u.no}</th>`);
  h += `<th>缺</th></tr>`;
  rows.forEach(r => {
    h += `<tr><td class="nm">${nm(r.s)}<span class="c">${coachById[r.s.coach_id] || ''}</span></td>`;
    UNITS.forEach(u => {
      if (!taught.has(u.no)) { h += `<td class="hwm-c lock"></td>`; return; }
      const k = st(r.s.id, u.no); const rec = map[r.s.id + '|' + u.no];
      const t = k === 'full' ? '✓' : k === 'part' ? `${rec.done}/${rec.total}` : k === 'none' ? '✕' : '';
      h += `<td class="hwm-c ${k}" title="U${u.no} ${u.n}">${t}</td>`;
    });
    h += `<td class="hwm-sum">${r.missing ? `<b>${r.missing}</b>` : '0'}${r.na ? `<span style="color:var(--muted)">（未檢 ${r.na}）</span>` : ''}</td></tr>`;
  });
  h += `</table></div>`;
  return h;
}

function renderTrack(target) {
  const el = target || document.getElementById('p-track');
  if (!el) return;
  const today = localDateStr(new Date());
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const dayDiff = (d1, d2) => Math.round((new Date(d1) - new Date(d2)) / 86400000);
  const actScore = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);

  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const approved = students.filter(s => s.status === 'approved');
  const realStudents = approved.filter(s => !coachMemberIds.has(s.member_id));

  const logsByStu = {};
  allLogs.forEach(l => { (logsByStu[l.student_id] = logsByStu[l.student_id] || []).push(l); });

  // 🔴 連續沒填（≥2 天或從未）
  const silent = [];
  realStudents.forEach(s => {
    const ls = logsByStu[s.id] || [];
    const coachName = coachById[s.coach_id] || '未配對';
    if (!ls.length) { silent.push({ name: nm(s), coach: coachName, gap: 999, txt: '從未填寫' }); return; }
    const last = ls.map(l => l.log_date).sort().reverse()[0];
    const gap = dayDiff(today, last);
    if (gap >= 2) silent.push({ name: nm(s), coach: coachName, gap, txt: gap + ' 天沒填' });
  });
  silent.sort((a, b) => b.gap - a.gap);

  // 待審分兩種：今日必審（昨天填，今天是deadline）vs 已失職（跨日改不了）
  // 「有沒有處理」依模式判定：full＝confirmed（26期逐項審核）；simple＝coach_engagement 有標記
  // （27期起教練的動作寫在那張表，confirmed 永遠 false——2026-08-13 前這裡只看 confirmed，
  //   把每個填報的學員都列成未審：該亮的沒亮、不該亮的全亮）
  const isSimple = ((allBatches.find(b => b.id === bid) || {}).coach_mode || 'simple') === 'simple';
  const engMarked = new Set(engRows.filter(r => r.homework !== null && r.homework !== undefined)
                                   .map(r => r.student_id + '|' + r.log_date));
  const handled = l => isSimple ? engMarked.has(l.student_id + '|' + l.log_date) : l.confirmed;
  const dueByCoach = {};    // 🟠 log_date === 昨天 → Set(學員名)
  const failedByCoach = {}; // ⚫ log_date < 昨天 → {學員名: 漏審次數}
  allLogs.forEach(l => {
    if (handled(l) || l.log_date >= today) return; // 今天填的明天才處理，跳過
    if (actScore(l) === 0) return;
    const s = approved.find(x => x.id === l.student_id);
    if (!s || coachMemberIds.has(s.member_id)) return;
    const coachName = coachById[s.coach_id] || '未配對';
    if (l.log_date === yesterday) {
      (dueByCoach[coachName] = dueByCoach[coachName] || new Set()).add(nm(s));
    } else {
      if (!failedByCoach[coachName]) failedByCoach[coachName] = {};
      failedByCoach[coachName][nm(s)] = (failedByCoach[coachName][nm(s)] || 0) + 1;
    }
  });
  const due = Object.entries(dueByCoach).map(([coach, set]) => ({ coach, items: [...set] }))
    .sort((a, b) => b.items.length - a.items.length);
  // 失職：每位教練列學員+漏審次數，按該教練總漏審數排序
  const failed = Object.entries(failedByCoach).map(([coach, stuMap]) => {
    const stus = Object.entries(stuMap).map(([name, cnt]) => ({ name, cnt })).sort((a, b) => b.cnt - a.cnt);
    const total = stus.reduce((a, x) => a + x.cnt, 0);
    return { coach, stus, total };
  }).sort((a, b) => b.total - a.total);

  // 📉 本週至今 vs 上週同期（同樣天數，公平比較，因為本週還沒結束）
  const d = new Date(today);
  const offset = d.getDay(); // 距離本週日幾天（0=週日）
  const thisSun = new Date(d); thisSun.setDate(d.getDate() - offset);
  const lastSun = new Date(thisSun); lastSun.setDate(thisSun.getDate() - 7);
  const lastSame = new Date(lastSun); lastSame.setDate(lastSun.getDate() + offset); // 上週對應星期幾
  const tSun = localDateStr(thisSun), lSun = localDateStr(lastSun), lSame = localDateStr(lastSame);
  const drop = [];
  realStudents.forEach(s => {
    const ls = logsByStu[s.id] || [];
    const thisW = ls.filter(l => l.log_date >= tSun && l.log_date <= today).reduce((a, l) => a + actScore(l), 0);
    const lastW = ls.filter(l => l.log_date >= lSun && l.log_date <= lSame).reduce((a, l) => a + actScore(l), 0);
    if (lastW >= 10 && thisW < lastW * 0.5) {
      drop.push({ name: nm(s), coach: coachById[s.coach_id] || '未配對', lastW, thisW });
    }
  });
  drop.sort((a, b) => (b.lastW - b.thisW) - (a.lastW - a.thisW));

  // ── 渲染 ──
  let h = '';
  h += `<div class="sec-title"><span>🔴 連續沒填（教練快關心）</span><span class="sec-count">${silent.length} 人</span></div>`;
  if (!silent.length) h += `<div class="dash-empty">太棒了，沒人失聯 🎉</div>`;
  else h += '<div>' + silent.map(x =>
    `<div class="track-row track-red"><span class="track-name">${x.name}</span><span class="track-mid">教練：${x.coach}</span><span class="track-tag">${x.txt}</span></div>`
  ).join('') + '</div>';

  const vb = isSimple ? '標' : '審';   // simple 模式教練的動作是「標記」不是「審核」
  h += `<div class="sec-title"><span>🟠 今日必${vb}（昨天填，今天是 deadline）</span><span class="sec-count">${due.length} 位教練</span></div>`;
  if (!due.length) h += `<div class="dash-empty">今天該${vb}的都${vb}完了 👍</div>`;
  else h += '<div>' + due.map(x =>
    `<div class="track-row track-orange">
      <span class="track-name">教練：${x.coach}</span>
      <span class="track-tag">${x.items.length} 筆待${vb}</span>
      <div class="track-chips">${x.items.map(i => `<span class="track-chip">${i}</span>`).join('')}</div>
    </div>`
  ).join('') + '</div>';

  h += `<div class="sec-title"><span>⚫ 未${vb}天數（跨日未${vb}，改不了了）</span><span class="sec-count">${failed.length} 位教練</span></div>`;
  if (!failed.length) h += `<div class="dash-empty">沒有漏${vb}記錄 ✨</div>`;
  else h += '<div>' + failed.map(x =>
    `<div class="track-row track-black">
      <span class="track-name">教練：${x.coach}</span>
      <span class="track-tag">共 ${x.total} 天未${vb}</span>
      <div class="track-stulist">${x.stus.map(st =>
        `<div class="track-stu"><span>${st.name}</span><span class="track-dots">${'🔴'.repeat(st.cnt)}<b>未${vb} ${st.cnt} 天</b></span></div>`
      ).join('')}</div>
    </div>`
  ).join('') + '</div>';

  h += `<div class="sec-title"><span>📉 本週至今 vs 上週同期下滑</span><span class="sec-count">${drop.length} 人</span></div>`;
  if (!drop.length) h += `<div class="dash-empty">沒有明顯退步 💪</div>`;
  else h += '<div>' + drop.map(x =>
    `<div class="track-row track-blue"><span class="track-name">${x.name}</span><span class="track-mid">教練：${x.coach}</span><span class="track-tag">${x.lastW} → ${x.thisW} 分</span></div>`
  ).join('') + '</div>';

  if (target) el.insertAdjacentHTML('beforeend', h); else el.innerHTML = h;
}

// 該期是否已結業（決定要不要出 ⑤ 結案報表）
function batchEnded() {
  const b = allBatches.find(x => x.id === bid);
  return !!(b && b.end_date && localDateStr(new Date()) > b.end_date);
}

function renderNow() { renderAnalysis(document.getElementById('nowArea')); }

// ── 記點（2026-08-17 定案）──────────────────────────────
//   兩套規則、兩種性質，不是雙軌而是兩個尺度：
//     小組回報＝防怠惰（每天的節奏）：學員當天 22:00 貼、教練隔天 22:00 前回
//     課程作業＝防落後（總完成度）：17 堂課上完前補齊即可
//   全部用算的、不存欄位；退不退班人工決定，儀表板只負責讓它看得見。
//   ⚠️ 灰格（教練沒檢核）一律記在教練頭上，不記學員——
//      否則「不檢核」會變成保護學員的手段，混的教練帶出的組反而最漂亮。
function calcDemerits() {
  const b = allBatches.find(x => x.id === bid) || {};
  const today = localDateStr(new Date());
  const stu = students.filter(s => s.status === 'approved' && s.coach_id);
  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));

  // 應標日：開班日到今天的平日（週六日不排作業）
  const days = [];
  if (b.start_date) {
    for (let d = new Date(b.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
      const w = d.getDay(); if (w >= 1 && w <= 5) days.push(localDateStr(d));
    }
  }
  // 教練隔天 22:00 前要回 → 只計已過期限的日子
  const dueDays = days.filter(d => { const x = new Date(d + 'T22:00:00'); x.setDate(x.getDate() + 1); return x <= new Date(); });

  const engBy = {};   // student|date -> row
  engRows.forEach(r => engBy[r.student_id + '|' + r.log_date] = r);
  const late = r => {
    if (!r || !r.created_at) return false;
    const dl = new Date(r.log_date + 'T22:00:00'); dl.setDate(dl.getDate() + 1);
    return new Date(r.created_at) > dl;     // created_at 已驗證為首次寫入，upsert 不覆蓋
  };

  // 作業：已上過的單元
  const taught = new Set();
  if (typeof SCHEDULE !== 'undefined')
    Object.entries(SCHEDULE).forEach(([d, arr]) => { if (d <= today) arr.forEach(n => taught.add(n)); });
  const hwBy = {}; hwRows.forEach(r => hwBy[r.student_id + '|' + r.unit_no] = r);
  const graceOn = b.hw_grace_until && today <= b.hw_grace_until;   // 寬限期內只提醒不計點

  const stuRows = stu.map(s => {
    let miss = 0;                                   // 小組回報：教練標「沒交」的天數
    dueDays.forEach(d => { const r = engBy[s.id + '|' + d]; if (r && r.homework === false) miss++; });
    let hwMiss = 0;                                 // 作業：已檢核且未完成的單元
    taught.forEach(u => { const r = hwBy[s.id + '|' + u]; if (r && r.done < r.total) hwMiss++; });
    return { name: nm(s), coach: coachById[s.coach_id] || '未配對', miss, hwMiss,
             pts: miss + (graceOn ? 0 : hwMiss), pend: graceOn ? hwMiss : 0 };
  }).filter(r => r.pts > 0 || r.pend > 0).sort((a, b2) => (b2.pts - a.pts) || (b2.pend - a.pend));

  const coachRows = coaches.filter(c => stu.some(s => s.coach_id === c.id)).map(c => {
    const mine = stu.filter(s => s.coach_id === c.id);
    let noMark = 0, lateMark = 0;
    dueDays.forEach(d => {
      const rows = mine.map(s => engBy[s.id + '|' + d]).filter(Boolean);
      if (!rows.length) { noMark++; return; }                  // 那天完全沒進來 → 1 點
      if (rows.every(late)) lateMark++;                        // 那天標的全部逾時 → 1 點
    });
    let hwNo = 0;
    mine.forEach(s => taught.forEach(u => { if (!hwBy[s.id + '|' + u]) hwNo++; }));
    return { name: nm(c), n: mine.length, noMark, lateMark, hwNo,
             pts: noMark + lateMark };
  }).filter(r => r.pts > 0 || r.hwNo > 0).sort((a, b2) => (b2.pts - a.pts) || (b2.hwNo - a.hwNo));

  return { stuRows, coachRows, dueDays, taughtN: taught.size, graceOn, grace: b.hw_grace_until };
}

    🔴 <b>教練沒檢核的格子記在教練頭上，不記學員</b>——否則不檢核會變成保護學員的手段。<br>

//   ① 昨日回報即時報：昨天發生什麼（單日快照）

//   ③ 作業追蹤彙整：17 單元 × 學員的完成矩陣（累積）
//   ④ 狀態排序：需要注意的人與組（排行）
//   Randoph：不要把日報、整體報全部混在一起——混了就分不出「昨天沒事」和「整期都沒事」。
const ANA = [
  { k:'daily',  t:'① 昨日回報即時報', d:() => { const r = lastClassDay(); return `單日快照 · ${r.slice(5).replace('-','/')}（週${WDAY[new Date(r+'T00:00:00').getDay()]}）`; } },
  { k:'groups', t:'② 整體組別回報率', d:() => `開班至今累積 · 平日 ${weekdaysSoFar()} 天` },
  { k:'hw',     t:'③ 作業追蹤彙整',   d:'17 單元累積' },

];
// ⑤ 只在該期已結業時併進來——沒結業就不存在，不佔位、也不用切換
const anaSections = () => batchEnded()
  ? ANA.concat([{ k:'after', t:'⑤ 結案報表', d:'全期封存' }])
  : ANA;
// 開班日到今天的平日數（週一～週五）＝ 累積率的分母基準
function weekdaysSoFar() {
  const b = allBatches.find(x => x.id === bid) || {};

  if (b.start_date)
    for (let d = new Date(b.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
      const w = d.getDay(); if (w >= 1 && w <= 5) n++;
    }
  return n;
}

// ── 開班前：全綠才能開班 ──────────────────────────────
function phaseBefore() {
  const b = allBatches.find(x => x.id === bid) || {};
  const appr = students.filter(s => s.status === 'approved');
  const coachMids = new Set(coaches.filter(c => c.status === 'approved').map(c => c.member_id));
  const stu = appr.filter(s => s.coach_id);                       // 真學員
  const coachAsStu = appr.filter(s => !s.coach_id);               // 教練的學員身分
  const apprCoaches = coaches.filter(c => c.status === 'approved');
  const ck = [];
  const add = (lvl, t, d) => ck.push({ lvl, t, d });

  // 1) 教練是否都有學員身分（27 期踩過：漏掉 → 教練六天存不了回報）
  const noIdentity = apprCoaches.filter(c => !coachAsStu.some(s => s.member_id === c.member_id));
  add(noIdentity.length ? 'bad' : 'ok', '教練的學員身分',
    noIdentity.length ? `<b>${noIdentity.length} 位教練沒有 batch_students 紀錄</b>：${noIdentity.map(nm).join('、')}<br>→ 他們的「儲存我的回報」會是灰的，開班就存不了。見 wiki「開新班期檢查清單」第 1 步`
      : `${apprCoaches.length} 位教練都有`);

  // 2) 學員分組
  const noGroup = stu.filter(s => !s.coach_id);
  const pending = students.filter(s => s.status === 'pending');
  add(pending.length ? 'warn' : 'ok', '報名審核',
    pending.length ? `<b>${pending.length} 人待審</b>，到「名冊」處理` : `已批准 ${appr.length} 人（含教練身分 ${coachAsStu.length}）`);
  add('ok', '學員分組', `${stu.length} 位學員已分組`);

  // 3) 上線
  const noSp = stu.filter(s => !s.sponsor_id);
  add(noSp.length ? 'warn' : 'ok', '上線（sponsor）',
    noSp.length ? `${noSp.length} 人未設上線：${noSp.slice(0,6).map(nm).join('、')}${noSp.length>6?'…':''}` : '全部已設');

  // 4) 教練組別
  const noGrp = apprCoaches.filter(c => !c.group_name);
  add(noGrp.length ? 'warn' : 'ok', '教練組別',
    noGrp.length ? `${noGrp.length} 位未設組別：${noGrp.map(nm).join('、')}（不帶組者屬正常）` : '全部已設');

  // 5) 繳費（排除教練——教練不用繳，算進去只會製造雜訊）
  const unpaid = stu.filter(s => !s.payment_confirmed);
  add(unpaid.length ? 'warn' : 'ok', '繳費確認（不含教練）',
    unpaid.length ? `<b>${unpaid.length} 位學員未確認</b>：${unpaid.slice(0,6).map(nm).join('、')}${unpaid.length>6?'…':''}` : `${stu.length} 位學員全部確認`);

  // 6) DB 設定
  const miss = [];
  if (!b.start_date) miss.push('start_date');
  if (!b.end_date) miss.push('end_date');
  if (!b.study_start) miss.push('study_start');
  if (!b.study_end) miss.push('study_end');
  if (!b.coach_mode) miss.push('coach_mode');
  add(miss.length ? 'bad' : 'ok', '班期設定',
    miss.length ? `<b>缺：${miss.join('、')}</b>`
      : `${b.start_date} ～ ${b.end_date}｜學習 ${b.study_start}～${b.study_end}｜${b.coach_mode}｜行動開放 ${b.action_open_date || '不鎖'}｜活動「${b.event_name || '無'}」`);

  // 7) 課表對齊（units.js 的 SCHEDULE 首日 vs 班期）——27/28 期都踩過
  let sd = null, ed = null;
  if (typeof SCHEDULE !== 'undefined') { const ks = Object.keys(SCHEDULE).sort(); sd = ks[0]; ed = ks[ks.length-1]; }
  const okSched = sd && b.study_start && sd === b.study_start && ed === b.study_end;
  add(okSched ? 'ok' : 'bad', '課表四處對齊',
    !sd ? 'units.js 未載入'
      : okSched ? `units.js ${sd} ～ ${ed}，與 study_start/end 一致`
      : `<b>不一致</b>：units.js 排到 ${sd} ～ ${ed}，DB study 是 ${b.study_start} ～ ${b.study_end}<br>→ 課表共四處副本（units.js／course.html 的 PLAN＋靜態表／brochure.html），要一起改`);

  // 8) 報名開關
  add('ok', '報名狀態', b.registration_open ? '🟢 開放中——新報名會寫進這一期' : '🔴 關閉');

  const bad = ck.filter(c => c.lvl === 'bad').length, warn = ck.filter(c => c.lvl === 'warn').length;
  let h = `<div class="ck-sum ${bad ? 'no' : 'go'}">${bad ? `🔴 有 ${bad} 項必須處理才能開班` : warn ? `🟡 可以開班，但有 ${warn} 項建議先確認` : '🟢 全部就緒，可以開班'}</div>`;
  h += `<div class="sec-title"><span>📋 開班前檢查清單</span><span class="sec-count">${b.name || ''}</span></div>`;
  const ICO = { ok:'✅', warn:'🟡', bad:'🔴' };
  ck.forEach(c => h += `<div class="ck ${c.lvl}"><div class="ck-ico">${ICO[c.lvl]}</div><div class="ck-b"><div class="ck-t">${c.t}</div><div class="ck-d">${c.d}</div></div></div>`);
  return h;
}

// ── 開班後：結案報表 ──────────────────────────────
function phaseAfter() {
  const b = allBatches.find(x => x.id === bid) || {};
  const coachMids = new Set(coaches.map(c => c.member_id));
  const stu = students.filter(s => s.status === 'approved' && s.coach_id);
  const byStu = {}; allLogs.forEach(l => (byStu[l.student_id] = byStu[l.student_id] || []).push(l));
  const act = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);
  const talk = l => (l.present||0)+(l.seminar||0);

  // 分診四群（沿用 26 期結案的漏斗判定，見 [[26期結案反思]]）
  let g1=0,g2=0,g3=0,g4=0;
  const closeByMid = {};
  stu.forEach(s => {
    const ls = byStu[s.id] || [];
    const hits = ls.reduce((a,l)=>a+act(l),0);
    const talks = ls.reduce((a,l)=>a+talk(l),0);
    const closes = 0; // 締結需另查，這裡以行動漏斗為主
    if (!hits) g1++; else if (!talks) g2++; else g3++;
  });
  const filled = stu.filter(s => (byStu[s.id]||[]).length).length;
  const hwDone = new Set(hwRows.filter(r => r.total>0 && r.done>=r.total).map(r => r.student_id)).size;
  const certDone = stu.filter(s => s.cert_comment).length;

  let h = `<div class="sec-title"><span>📊 結案報表</span><span class="sec-count">${b.name||''}　${b.start_date}～${b.end_date}</span></div>`;
  h += `<div class="dash-progress">
    <div class="dash-prog-card"><div class="dash-prog-n">${filled} / ${stu.length}</div><div class="dash-prog-l">曾填報學員</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${allLogs.length}</div><div class="dash-prog-l">回報總筆數</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${certDone} / ${stu.length}</div><div class="dash-prog-l">證書評語已寫</div></div>
  </div>`;
  h += `<div class="cov-note">分診（依 [[26期結案反思]] 的漏斗，順序不可顛倒）：<br>
    ① 整期沒出手 <b>${g1}</b> 人　② 有出手沒進到溝通 <b>${g2}</b> 人　③ 溝通過 <b>${g3}</b> 人<br>
    ⚠️ ③ 裡面「溝通過但零締結」才是最該救的那群——他們通常比 ② 更努力。溝通場次是締結的真門檻。</div>`;
  h += `<div class="sec-title"><span>✅ 結案待辦</span></div>`;
  const todo = [
    [certDone >= stu.length, `結業證書評語：已寫 ${certDone}／${stu.length}`],
    [hwRows.length > 0, `作業檢核紀錄：${hwRows.length} 筆（0 筆代表教練整期沒用過）`],
    [!b.is_active, `封存：把 is_active 切給下一期（目前${b.is_active ? '🔴 仍是當期' : '已封存'}）`],
    [false, `全期數據寫進 wiki 結案反思，並更新 [[資料架構規劃]]`],
  ];
  todo.forEach(([ok, t]) => h += `<div class="ck ${ok?'ok':'warn'}"><div class="ck-ico">${ok?'✅':'🟡'}</div><div class="ck-b"><div class="ck-t">${t}</div></div></div>`);
  return h;
}

function renderDashboard(target, part) {
  const today = localDateStr(new Date());
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const approvedStudents = students.filter(s => s.status === 'approved');
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const realStudents = approvedStudents.filter(s => !coachMemberIds.has(s.member_id));
  const coachStudents = approvedStudents.filter(s => coachMemberIds.has(s.member_id));

  const todayMap = {};
  todayLogs.forEach(l => { todayMap[l.student_id] = l; });
  // 日報基準日＝上一個上課日（不是字面上的昨天，見 lastClassDay()）
  const refDay = lastClassDay();
  const refWd  = WDAY[new Date(refDay + 'T00:00:00').getDay()];
  const yesterdayMap = {};
  allLogs.filter(l => l.log_date === refDay).forEach(l => { yesterdayMap[l.student_id] = l; });

  const totalReal = realStudents.length;
  const totalCoach = coachStudents.length;
  const totalAll = approvedStudents.length;

  function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }

  // 「教練有沒有處理」依模式：full＝confirmed／simple＝coach_engagement 有標記
  // （27期起 confirmed 永遠 false——之前這三張卡的「教練確認率」因此永遠 0%）
  const dashSimple = ((allBatches.find(b => b.id === bid) || {}).coach_mode || 'simple') === 'simple';
  const dashMarked = new Set(engRows.filter(r => r.homework !== null && r.homework !== undefined)
                                    .map(r => r.student_id + '|' + r.log_date));
  const dashHandled = (s, date, log) => dashSimple ? dashMarked.has(s.id + '|' + date) : !!log?.confirmed;

  // 昨日統計
  const yStuFill = realStudents.filter(s => yesterdayMap[s.id]).length;
  const yCoachFill = coachStudents.filter(s => yesterdayMap[s.id]).length;
  const yConfirmed = approvedStudents.filter(s => dashHandled(s, refDay, yesterdayMap[s.id])).length;

  // 今日統計
  const tStuFill = realStudents.filter(s => todayMap[s.id]).length;
  const tCoachFill = coachStudents.filter(s => todayMap[s.id]).length;
  const tConfirmed = approvedStudents.filter(s => dashHandled(s, today, todayMap[s.id])).length;

  let h = '';

  function progCards(stuFill, stuTotal, coachFill, coachTotal, confirmed, filledTotal) {
    const sp = pct(stuFill, stuTotal), cp = pct(coachFill, coachTotal), ap = pct(confirmed, filledTotal);
    return `<div class="dash-progress">
      <div class="dash-prog-card">
        <div class="dash-prog-n">${stuFill} / ${stuTotal}</div>
        <div class="dash-prog-l">學員填報率 ${sp}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${sp}%"></div></div>
      </div>
      <div class="dash-prog-card">
        <div class="dash-prog-n">${coachFill} / ${coachTotal}</div>
        <div class="dash-prog-l">教練填報率 ${cp}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${cp}%"></div></div>
      </div>
      <div class="dash-prog-card">
        <div class="dash-prog-n">${confirmed} / ${filledTotal}</div>
        <div class="dash-prog-l">教練${dashSimple ? '標記' : '確認'}率 ${ap}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${ap}%"></div></div>
      </div>
    </div>`;
  }

  // ── ① 日報的分組展開：跟 ② 同一種形狀（組→學員），但只看 refDay 這一天 ──
  //    Randoph 定案 2026-08-17：日報與整體統計上下分離。日報回答「昨天誰沒做、今天去催誰」，
  //    處理完就結束；整體統計回答「整期誰跟不上」，那才是記點與退班的依據。
  function dailyGroups() {
    const ac = approvedCoaches();
    const gs = {};
    ac.forEach(c => { gs[c.id] = { coach: c, students: [] }; });
    approvedStudents.forEach(s => { if (s.coach_id && gs[s.coach_id]) gs[s.coach_id].students.push(s); });
    const engDay = engRows.filter(r => r.log_date === refDay);
    const engOf  = sid => engDay.find(r => r.student_id === sid) || {};
    const rows = Object.values(gs).filter(g => g.students.length).map(g => {
      const t = g.students.length;
      const fill = g.students.filter(s => yesterdayMap[s.id]).length;
      const sent = g.students.filter(s => engOf(s.id).homework === true).length;
      const rep  = g.students.filter(s => engOf(s.id).homework_replied === true).length;
      const selfRec = g.coach ? coachStudents.find(s => s.member_id === g.coach.member_id) : null;
      return { g, t, fill, sent, rep, self: selfRec ? !!yesterdayMap[selfRec.id] : null,
               miss: (t - fill) + (t - sent) + (t - rep) };
    }).sort((a, b) => b.miss - a.miss);            // 問題最多的組排最上面
    if (!rows.length) return '';
    const blk = (label, n, t) => {
      const p = t ? Math.round(n / t * 100) : 0;
      const c = p === 100 ? 'dash-perfect' : p >= 50 ? 'dash-warn' : p > 0 ? 'dash-danger' : 'dash-zero';
      return `<span class="stu-b ${c}">${label} <span class="dash-pct">${n}</span><i>/${t}</i></span>`;
    };
    const flag = (v, yes, no, na) => v === true
      ? `<span class="stu-b dash-perfect">${yes}</span>`
      : v === false ? `<span class="stu-b dash-zero">${no}</span>`
                    : `<span class="stu-b stu-na" title="教練還沒進來標記">${na}</span>`;
    let out = `<div class="cov-note">這一節只看 <b>${refDay}（週${refWd}）</b>一天，處理完就結束——
      要看整期累積請往下到 <b>② 整體組別回報率</b>。<b>問題最多的組排在最上面。</b><br>
      ⚠️ 學員當天 22:00 前貼、教練隔天 22:00 前回；「未標」＝教練還沒進來看，不是學員沒交。</div>`;
    rows.forEach(r => {
      out += `<div class="dash-coach-row">
        <div class="dash-coach-hd" onclick="this.parentElement.classList.toggle('open')">
          <div class="dash-coach-left">
            <span class="card-name">${r.g.coach ? nm(r.g.coach) : '未配對教練'}</span>
            ${r.g.coach?.group_name ? `<span style="color:var(--gold);font-size:11px">${r.g.coach.group_name}</span>` : ''}
            <span class="dash-self">教練本人${r.self === null ? '－' : (r.self ? '✅' : '❌')}</span>
          </div>
          <div class="dash-coach-stats">
            ${blk('行動紀錄', r.fill, r.t)}
            ${blk('LINE繳交', r.sent, r.t)}
            <span class="dash-sep">教練</span>
            ${blk('回覆', r.rep, r.t)}
          </div>
          <span class="coach-arrow">▼</span>
        </div>
        <div class="coach-body">
          ${r.g.students.map(s => {
            const log = yesterdayMap[s.id];
            const e = engOf(s.id);
            const pts = log ? (log.name_list||0)+(log.meet||0)+(log.invite||0)*2+(log.present||0)*5+(log.seminar||0)*5+(log.ghosted||0)+(log.rejected||0) : 0;
            return `<div class="dash-stu-row">
              <span>${nm(s)}${mc(s)}</span>
              <div class="dash-stu-status">
                ${log ? `<span class="stu-b dash-perfect">✍️ 已填<i>${pts} 分</i></span>` : `<span class="stu-b dash-zero">✍️ 未填</span>`}
                ${flag(e.homework === true ? true : (e.homework === false ? false : null), '📤 交了', '📤 沒交', '📤 未標')}
                <span class="dash-sep">教練</span>
                ${flag(e.homework_replied === true ? true : (e.homework_replied === false ? false : null), '↩️ 回了', '↩️ 沒回', '↩️ 未標')}
                <span class="stu-arrow-gap"></span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    return out;
  }

  // 教練標記率的分母＝真學員數（教練要標全部組員，不是只標有填 daily 的）

  // ── 電池能量條（今日 LIVE）──
  const batteryPct = pct(tStuFill, totalReal);
  if (part !== 'groups') {
  h += `<div class="battery">
    <div class="battery-fill" style="width:${batteryPct}%"></div>
    <div class="battery-text">今日填報 LIVE ${batteryPct}%（${tStuFill}/${totalReal}）</div>
  </div>`;

  // ── 昨日進度 ──
  h += `<div class="sec-title"><span>📊 上一個上課日回報</span><span class="sec-count">${refDay.replace(/-/g,' / ')}（週${refWd}）</span></div>`;
  h += progCards(yStuFill, totalReal, yCoachFill, totalCoach, yConfirmed, totalReal);
  h += dailyGroups();
  }   // ← 關閉 if (part !== 'groups')：② 整體組別回報率 不需要電池與昨日三卡

  // ── 教練回報總覽 ──
  if (!totalAll) {
    h += `<div class="dash-empty">尚無已批准學員</div>`;
  } else {
    const ac = approvedCoaches();
    const groups = {};
    ac.forEach(c => { groups[c.id] = { coach: c, students: [] }; });
    groups['_none'] = { coach: null, students: [] };
    approvedStudents.forEach(s => {
      const gid = s.coach_id && groups[s.coach_id] ? s.coach_id : '_none';
      groups[gid].students.push(s);
    });

    // 依組別排序，未配對教練放最後
    const sorted = Object.values(groups).filter(g => g.students.length && g.coach).sort((a, b) => {
      const ga = a.coach.group_name || '';
      const gb = b.coach.group_name || '';
      const ia = GROUPS.indexOf(ga);
      const ib = GROUPS.indexOf(gb);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });

    const dashVb = dashSimple ? '標記' : '確認';

    // 拆點：daily 只要上面的電池＋昨日三卡；groups 只要下面的累積矩陣。
    // 必須留在 else 區塊內，因為下面用到 sorted / groups / dashVb。
    if (part === 'daily') { if (target) target.insertAdjacentHTML('beforeend', h); return; }
    h = '';
    h += `<div class="cov-note">這張表看的是<b>學員完成度</b>，教練只是分組方式。<b>四欄都是開班至今的累積率</b>（不是單日）。<br>
      前三欄＝<b>學員做到多少</b>（作業／行動紀錄／在 LINE 繳交）｜最後一欄＝<b>教練有沒有回</b><br>
      分母：作業＝已上單元×組員數，其餘＝平日數×組員數（週末不排作業也不要求 LINE，不計入分母）。<br>
      ⚠️ 作業與 LINE 兩欄由教練標記產生：教練沒進來就會是 0，那是<b>沒人看</b>不是沒人做——
      「行動紀錄」是學員自己填的，不受教練影響，可以當對照。</div>`;

    sorted.forEach(g => {
      const cName = g.coach ? nm(g.coach) : '未配對教練';
      const grpName = g.coach?.group_name || '';
      const total = g.students.length;

      // 單日訊號（教練本人有沒有填、每天一顆點）已移到 ① 日報——這一節純累積。

      // 四個獨立訊號（2026-08-17 定案）——各自的分母都是組員數，互不干擾。
      // 未來開行動組（無作業）也不會衝突：study_start 為 NULL 就自動不顯示「作業」。
      //   作業      homework_checks 完成單元／教練檢核產生
      //   行動紀錄  action_logs／**學員自己在 daily 填，唯一不經過教練的訊號**
      //   LINE繳交  coach_engagement.homework=true／教練代標（學員貼賴群）
      //   LINE回覆  coach_engagement.homework_replied=true／教練標自己回了
      // ⚠️ 後三者都是教練產生：教練沒進來就全變 0，那是「沒人看」不是「沒人做」。
      // 四欄統一為「開班至今的累積完成率」（2026-08-17 修）。
      // 原本作業是累積、其餘三欄只算昨天一天 → 尺度不一致；而昨天是週日（不排作業、教練不標），
      // 三欄全 0% 看起來像狀況差，實際那天本來就沒事。用單一代表日整張表都會誤導。
      // 分母一律「平日數 × 組員數」（週末不排作業也不要求 LINE，不計入分母）。
      const bRow = allBatches.find(x => x.id === bid) || {};
      let wd = 0;
      if (bRow.start_date)
        for (let d = new Date(bRow.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
          const w = d.getDay(); if (w >= 1 && w <= 5) wd++;
        }
      const sids = new Set(g.students.map(s => s.id));
      const isWd = ds => { const w = new Date(ds + 'T00:00:00').getDay(); return w >= 1 && w <= 5; };
      const yF    = allLogs.filter(l => sids.has(l.student_id) && isWd(l.log_date)).length;
      const ySent = engRows.filter(r => sids.has(r.student_id) && r.homework === true && isWd(r.log_date)).length;
      const yRep  = engRows.filter(r => sids.has(r.student_id) && r.homework_replied === true && isWd(r.log_date)).length;
      const denom = wd * total;
      const hwFull = g.students.reduce((a, s) => a + hwRows.filter(r => r.student_id === s.id && r.total > 0 && r.done >= r.total).length, 0);
      const hasCourse = !!(allBatches.find(x => x.id === bid) || {}).study_start;   // 行動組無課表
      // 作業要用「完成率」才能跟其他欄並排比較：已上單元 × 組員數 當分母
      let taughtN = 0;
      if (typeof SCHEDULE !== 'undefined')
        Object.entries(SCHEDULE).forEach(([d, arr]) => { if (d <= today) taughtN += arr.length; });
      const hwPct = pct(hwFull, taughtN * total);

      const stuAct = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);
      const yFillPctC = pct(yF, denom), yConfPctC = pct(ySent, denom);
      const yRepPctC = pct(yRep, denom);
      function lvl(p) { return p === 100 ? 'dash-perfect' : p >= 80 ? 'dash-pass' : p >= 50 ? 'dash-warn' : p > 0 ? 'dash-danger' : 'dash-zero'; }

      const allDone = yFillPctC === 100 && yConfPctC === 100 && yRepPctC === 100;
      h += `<div class="dash-coach-row${allDone ? ' dash-complete' : ''}">
        <div class="dash-coach-hd" onclick="this.parentElement.classList.toggle('open')">
          <div class="dash-coach-left">
            <span class="card-name">${cName}</span>
            ${grpName ? `<span style="color:var(--gold);font-size:11px">${grpName}</span>` : ''}
          </div>
          <div class="dash-coach-stats">
            ${hasCourse ? `<span class="dash-day-block ${lvl(hwPct)}">作業 <span class="dash-pct">${hwPct}%</span></span>` : ''}
            <span class="dash-day-block ${lvl(yFillPctC)}">行動紀錄 <span class="dash-pct">${yFillPctC}%</span></span>
            <span class="dash-day-block ${lvl(yConfPctC)}">LINE繳交 <span class="dash-pct">${yConfPctC}%</span></span>
            <span class="dash-sep">教練</span>
            <span class="dash-day-block ${lvl(yRepPctC)}">回覆 <span class="dash-pct">${yRepPctC}%</span></span>
          </div>
          <span class="coach-arrow">▼</span>
        </div>
        <div class="coach-body">
          ${g.students.map(s => {
            // 學員列＝表頭四欄的個人版，全部累積（原本只顯示昨天一天，在累積區塊裡是混尺度）
            const sHwFull = hwRows.filter(r => r.student_id === s.id && r.total > 0 && r.done >= r.total).length;
            const sHwPct  = pct(sHwFull, taughtN);
            const sLogs   = allLogs.filter(l => l.student_id === s.id && isWd(l.log_date));
            const sPts    = sLogs.reduce((a, l) => a + stuAct(l), 0);
            const sEng    = engRows.filter(r => r.student_id === s.id && isWd(r.log_date));
            const sSent   = sEng.filter(r => r.homework === true).length;
            const sRep    = sEng.filter(r => r.homework_replied === true).length;
            const sJudged = sEng.filter(r => r.homework !== null && r.homework !== undefined).length;
            // 繳交／回覆是教練「點」出來的，只有點過才有數字 → 沒點就是未標，不是 0%
            const mark = (icon, n, label) => sJudged
              ? `<span class="stu-b ${lvl(pct(n, wd))}">${icon} <span class="dash-pct">${n}</span><i>/${wd} 天</i></span>`
              : `<span class="stu-b stu-na" title="教練還沒進來標記，不代表學員沒做">⬜ 未標</span>`;
            return `<div class="dash-stu-row">
              <span>${nm(s)}${mc(s)}</span>
              <div class="dash-stu-status">
                ${hasCourse ? `<span class="stu-b ${lvl(sHwPct)}" title="全繳單元數／已上單元數">作業 <span class="dash-pct">${sHwPct}%</span><i>${sHwFull}/${taughtN}</i></span>` : ''}
                ${sLogs.length
                  ? `<span class="stu-b ${lvl(pct(sLogs.length, wd))}" title="有填天數／平日數 · 累積行動分數">✍️ <span class="dash-pct">${sLogs.length}</span><i>/${wd} 天 · ${sPts} 分</i></span>`
                  : `<span class="stu-b stu-na">✍️ 未填</span>`}
                ${mark('📤', sSent)}
                <span class="dash-sep">教練</span>
                ${mark('↩️', sRep)}
                <span class="stu-arrow-gap"></span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }
  if (target) target.insertAdjacentHTML('beforeend', h);
  else { const d = document.getElementById('p-dashboard'); if (d) d.innerHTML = h; }
}

function renderReview() {
  const pendingC = coaches.filter(c => c.status === 'pending').length;
  const pendingS = students.filter(s => s.status === 'pending').length;
  const approvedS = students.filter(s => s.status === 'approved').length;
  const totalC = approvedCoaches().length;

  const pCoaches  = coaches.filter(c => c.status === 'pending' && matchSearch(c));
  const apCoaches = coaches.filter(c => c.status === 'pending');
  const pStudents = students.filter(s => s.status === 'pending' && matchSearch(s));
  const apStudents= students.filter(s => s.status === 'pending');

  let h = `<div class="stats">
    <div class="st"><div class="st-n">${pendingC}</div><div class="st-l">教練待審</div></div>
    <div class="st"><div class="st-n">${pendingS}</div><div class="st-l">學員待審</div></div>
    <div class="st"><div class="st-n">${approvedS}</div><div class="st-l">已批准學員</div></div>
    <div class="st"><div class="st-n">${totalC}</div><div class="st-l">教練</div></div>
  </div>`;

  // 教練審核
  h += `<div class="sec-title"><span>教練審核</span><span class="sec-count">${apCoaches.length} 待審</span></div>`;
  h += pCoaches.length
    ? pCoaches.map(c => `
      <div class="card">
        <div class="card-left">
          <div class="card-name">${nm(c)}${mc(c)}</div>
          <div class="card-meta">電話：${c.phone||'—'} ｜ 資格：${c.rank||'—'} ｜ CFC：${c.cfc||'—'}</div>
        </div>
        <div class="acts">${bdg(c.status)}
          ${isReadonly ? '' : `<button class="btn btn-ok" onclick="approveCoach('${c.id}')">批准</button>
          <button class="btn btn-no" onclick="rejectCoach('${c.id}')">拒絕</button>`}
        </div>
      </div>`).join('')
    : `<div class="empty" style="padding:24px"><div class="empty-icon">✓</div><div class="empty-text">${apCoaches.length?'無符合搜尋的結果':'無待審核教練'}</div></div>`;

  // 學員審核
  h += `<div class="sec-title"><span>學員審核</span><span class="sec-count">${apStudents.length} 待審</span></div>`;
  if (!isReadonly && apStudents.length > 1) h += `<div style="margin-bottom:10px"><button class="btn-batch btn-batch-ok" onclick="approveAllStudents()">全部批准學員（${apStudents.length}）</button></div>`;
  h += pStudents.length
    ? pStudents.map(s => `
      <div class="card">
        <div class="card-left">
          <div class="card-name">${nm(s)}${mc(s)}</div>
          <div class="card-meta">電話：${s.phone||'—'} ｜ 組別：${s.group_name||'—'} ｜ 匯款末5碼：${s.transfer_code||'—'}${sp(s)?' ｜ 上線：'+sp(s):''}</div>
          ${s.name_list?`<div class="card-meta">名單：${nl(s.name_list)}</div>`:''}
          ${s.introduction?`<div class="card-meta">自我定位：${s.introduction}</div>`:''}
        </div>
        <div class="acts">${bdg(s.status)}
          ${isReadonly ? '' : `<button class="btn btn-ok" onclick="approveStudent('${s.id}')">批准</button>
          <button class="btn btn-no" onclick="rejectStudent('${s.id}')">拒絕</button>`}
        </div>
      </div>`).join('')
    : `<div class="empty" style="padding:24px"><div class="empty-icon">✓</div><div class="empty-text">${apStudents.length?'無符合搜尋的結果':'無待審核學員'}</div></div>`;

  // ── 已批准名冊（原名冊 Tab 併入）──
  h += renderRosterSection();

  document.getElementById('reviewArea').innerHTML = h;
}

let rosterSearch = '', rosterFilter = 'all';

function renderRosterSection() {
  const ac = approvedCoaches();
  let sList = students.filter(s => s.status === 'approved');
  if (rosterFilter === 'no-coach') sList = sList.filter(s => !s.coach_id);
  if (rosterFilter === 'no-phone') sList = sList.filter(s => !s.phone);
  let cList = ac;
  if (rosterSearch) {
    const t = rosterSearch.toLowerCase();
    sList = sList.filter(s => (nm(s)+mc(s)+(s.phone||'')+(s.group_name||'')).toLowerCase().includes(t));
    cList = cList.filter(c => (nm(c)+mc(c)+(c.phone||'')+(c.rank||'')).toLowerCase().includes(t));
  }
  if (rosterFilter === 'no-phone') cList = cList.filter(c => !c.phone);
  const totalS = students.filter(s => s.status === 'approved').length;

  let h = `<div class="sec-title" style="margin-top:28px;padding-top:20px;border-top:2px solid var(--gold-bd)"><span>📋 已批准名冊</span><span class="sec-count">${totalS} 學員 / ${ac.length} 教練</span></div>`;


  if (rosterFilter !== 'no-coach') {
    h += `<div class="sec-title"><span>教練</span><span class="sec-count">${cList.length} 人</span></div>`;
    if (cList.length) {
      cList.sort((a,b) => {
        const ga = a.group_name || '', gb = b.group_name || '';
        const ia = GROUPS.indexOf(ga), ib = GROUPS.indexOf(gb);
        const gi = (ia===-1?99:ia) - (ib===-1?99:ib);
        return gi !== 0 ? gi : nm(a).localeCompare(nm(b),'zh-TW');
      });
      cList.forEach(c => {
        h += `
        <div class="roster-card" id="rc-c-${c.id}">
          <div class="roster-top">
            <div>
              <div class="card-name">${nm(c)}${mc(c)}</div>
              <div class="roster-info">電話：${c.phone||'—'} ｜ 資格：${c.rank||'—'} ｜ CFC：${c.cfc||'—'}</div>
              <div class="roster-info" style="margin-top:4px;display:flex;align-items:center;gap:6px"><span>組別：</span>${isReadonly
                ? `<span style="font-size:12px">${c.group_name||'未分組'}</span>`
                : `<select class="reassign-sel" style="font-size:12px;padding:3px 8px;text-align:left" onchange="setCoachGroup('${c.id}',this.value)"><option value="">未分組</option>${GROUPS.map(g => `<option value="${g}"${c.group_name===g?' selected':''}>${g}</option>`).join('')}</select>`}<span>｜ 學員 ${pairedStudents(c.id).length} 名</span></div>
            </div>
            ${isReadonly ? '' : `<div style="display:flex;gap:6px">
              <button class="btn-edit" onclick="showEditCoach('${c.id}')">編輯</button>
              <button class="btn-edit" style="background:rgba(220,38,38,.15);color:#f87171" onclick="deleteCoach('${c.id}','${nm(c).replace(/'/g,"\\'")}')">刪除</button>
            </div>`}
          </div>
          <div id="edit-c-${c.id}"></div>
        </div>`;
      });
    } else {
      h += `<div class="empty" style="padding:20px"><div class="empty-text">無符合條件的教練</div></div>`;
    }
  }

  h += `<div class="sec-title"><span>學員</span><span class="sec-count">${sList.length} / ${totalS} 人</span></div>`;
  if (sList.length) {
    sList.forEach(s => {
      const coachObj = s.coach_id ? coaches.find(c => c.id === s.coach_id) : null;
      const coachName = coachObj ? nm(coachObj) : '未配對';
      const hasList = s.name_list && (Array.isArray(s.name_list) ? s.name_list.length > 0 : String(s.name_list).trim());
      const hasIntro = s.introduction && String(s.introduction).trim();
      h += `
      <div class="roster-card" id="rc-${s.id}">
        <div class="roster-top">
          <div>
            <div class="card-name">${nm(s)}${mc(s)}</div>

function showDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const title = field === 'name_list' ? '名單' : '自我定位';
  let content = '';
  if (field === 'name_list') {
    const v = s.name_list;
    content = !v ? '（無資料）' : Array.isArray(v) ? v.join('、') : String(v);
  } else {
    content = s.introduction || '（無資料）';
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal-box">
    <div class="modal-title">${nm(s)} — ${title}</div>
    <div class="modal-body" id="modal-content-${sid}">${content.replace(/</g,'&lt;')}</div>
    <div id="modal-actions-${sid}">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">關閉</button>
      ${isReadonly ? '' : `<button class="modal-edit-btn" onclick="editDetail('${sid}','${field}')">編輯</button>`}
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function editDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const contentEl = document.getElementById('modal-content-' + sid);
  const actionsEl = document.getElementById('modal-actions-' + sid);
  let val = '';
  if (field === 'name_list') {
    const v = s.name_list;
    val = !v ? '' : Array.isArray(v) ? v.join('\n') : String(v);
  } else {
    val = s.introduction || '';
  }
  const hint = field === 'name_list' ? '一行一個名字' : '';
  contentEl.innerHTML = `<textarea class="modal-textarea" id="modal-edit-val-${sid}">${val.replace(/</g,'&lt;')}</textarea>${hint ? '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+hint+'</div>' : ''}`;
  actionsEl.innerHTML = `<button class="modal-save-btn" onclick="saveDetail('${sid}','${field}')">儲存</button><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">取消</button>`;
}

async function saveDetail(sid, field) {
  const val = document.getElementById('modal-edit-val-' + sid).value.trim();
  let update = {};
  if (field === 'name_list') {
    update.name_list = val ? val.split('\n').map(s => s.trim()).filter(Boolean) : [];
  } else {
    update.introduction = val;
  }
  const { error } = await sb.from('batch_students').update(update).eq('id', sid);
  if (error) return alert('儲存失敗：' + error.message);
  document.querySelector('.modal-overlay')?.remove();
  toast('已更新'); await load();
}

    return `
    <div class="coach-card org-card" data-orgnames="${nm(c)} ${myStu.map(s=>nm(s)).join(' ')}">
