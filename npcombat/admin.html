// 該期是否已結業（決定要不要出 ⑤ 結案報表）
function batchEnded() {
  const b = allBatches.find(x => x.id === bid);
  return !!(b && b.end_date && localDateStr(new Date()) > b.end_date);
}

function renderNow() { anaPainted.clear(); renderAnalysis(document.getElementById('nowArea')); }

// ── 記點（2026-08-17 定案）──────────────────────────────
//   兩套規則、兩種性質，不是雙軌而是兩個尺度：
//     小組回報＝防怠惰（每天的節奏）：學員當天 22:00 貼、教練隔天 22:00 前回
//     課程作業＝防落後（總完成度）：17 堂課上完前補齊即可
//   全部用算的、不存欄位；退不退班人工決定，儀表板只負責讓它看得見。
//   ⚠️ 灰格（教練沒檢核）一律記在教練頭上，不記學員——
//      否則「不檢核」會變成保護學員的手段，混的教練帶出的組反而最漂亮。
function calcDemerits() {
  const b = allBatches.find(x => x.id === bid) || {};
  const today = localDateStr(new Date());
  const stu = students.filter(s => s.status === 'approved' && s.coach_id);
  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));

  // 應標日：開班日到今天的平日（週六日不排作業）
  const days = [];
  if (b.start_date) {
    for (let d = new Date(b.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
      const w = d.getDay(); if (w >= 1 && w <= 5) days.push(localDateStr(d));
    }
  }
  // 🔴 兩條死線（2026-08-17 Randoph 定案）
  //    學員：當天 22:00 貼。過了就是「沒交」——事後補交不改這一天的紀錄，
  //          否則 22:00 只是建議、遲交零成本，紀律就歸零。補交要被看見的地方是
  //          homework_checks（作業總完成度，本來就不壓日期）。
  //    教練：隔天 12:00 前處理完（標記＋該回的回完）。訂 12:00 的理由是班主下午要能
  //          追蹤賴群，而 12:00 後畫面上每一格都必須有明確歸屬，不必自己去翻群組。
  //          實測 27 期：80.5% 的標記本來就在 12:00 前完成，這條線是達得到的。
  const COACH_DL = 'T12:00:00';
  const dueDays = days.filter(d => { const x = new Date(d + COACH_DL); x.setDate(x.getDate() + 1); return x <= new Date(); });
  const subFrom = b.submit_from || b.start_date;
  const subDays = dueDays.filter(d => d >= subFrom);          // 送出制生效後的日子才算

  // 補交筆數：學員看 subject='student'（誰被補），教練看 subject='coach'（自己補說明）
  const mkStu = {}, mkCoach = {};
  makeupRows.forEach(r => {
    if (r.subject === 'student' && r.student_id) mkStu[r.student_id] = (mkStu[r.student_id] || 0) + 1;
    if (r.subject === 'coach') mkCoach[r.coach_id] = (mkCoach[r.coach_id] || 0) + 1;
  });

  const engBy = {};   // student|date -> row
  engRows.forEach(r => engBy[r.student_id + '|' + r.log_date] = r);
  // 舊的 late()（用 created_at 推斷教練有沒有及時處理）已由 coach_submits 取代——
  // 送出是教練主動宣告，不必再從標記時間反推。

  const unitDate = {};
  Object.entries(SCHEDULE || {}).forEach(([d, arr]) => arr.forEach(n => { unitDate[n] = d; }));
  const logBy = {}; allLogs.forEach(l => { logBy[l.student_id + '|' + l.log_date] = l; });

  // 作業：已上過的單元
  const taught = new Set();
  if (typeof SCHEDULE !== 'undefined')
    Object.entries(SCHEDULE).forEach(([d, arr]) => { if (d <= today) arr.forEach(n => taught.add(n)); });
  const hwBy = {}; hwRows.forEach(r => hwBy[r.student_id + '|' + r.unit_no] = r);
  const graceOn = b.hw_grace_until && today <= b.hw_grace_until;   // 寬限期內只提醒不計點

  const stuRows = stu.map(s => {
    let miss = 0;                                   // 小組回報：教練標「沒交」的天數
    dueDays.forEach(d => { const r = engBy[s.id + '|' + d]; if (r && r.homework === false) miss++; });
    // 🔴 2026-08-19 Randoph 決定：教練沒檢核就當學員沒交。
    //    「退不退班是我們人工說的算，就是要誇張的數字，逼教練去填寫。」
    //    我提過的代價他已知並確認：39 人全部受影響、滿 3 點從 2 人變 11 人、
    //    三位現行 0 點的學員（楊姷妃／陳畇驊／王喬語）會變 15 點，
    //    而他們的教練（錢威達／張憶文）正是記點最高的兩位。
    //    ⚠️ 所以 hwUng 要單獨帶出來——退班既然是人工判斷，就必須分得出
    //       「真的沒交」與「教練沒檢核」，否則班主自己也判不了。
    let hwMiss = 0, hwUng = 0, hwSaid = 0;
    taught.forEach(u => {
      const r = hwBy[s.id + '|' + u];
      if (!r) {
        // 🔴 2026-08-19：教練沒檢核時，先看學員有沒有自己勾「已在小組回報」。
        //    有自述就不算他沒交——那是唯一不經過教練的證據，責任回到教練身上。
        const d = unitDate[u];
        const lg = d ? logBy[s.id + '|' + d] : null;
        if (lg && lg.group_reported) { hwSaid++; return; }
        hwUng++; hwMiss++; return;                   // 兩條線都沒有 → 算沒交（催教練）
      }
      if (r.done < r.total) hwMiss++;                // 檢核過但沒寫完 → 真的沒交
    });
    return { name: nm(s), coach: coachById[s.coach_id] || '未配對', miss, hwMiss, hwUng, hwSaid,
             made: mkStu[s.id] || 0,
             pts: miss + (graceOn ? 0 : hwMiss), pend: graceOn ? hwMiss : 0 };
  }).filter(r => r.pts > 0 || r.pend > 0 || r.made > 0 || r.hwSaid > 0)
    .sort((a, b2) => (b2.pts - a.pts) || (b2.pend - a.pend));

  const coachRows = coaches.filter(c => stu.some(s => s.coach_id === c.id)).map(c => {
    const mine = stu.filter(s => s.coach_id === c.id);
    // 🔴 2026-08-19 Randoph 定案：判準收斂成「有沒有在隔天 12:00 前送出」。
    //    「教練送出後，代表有人沒繳就是學員的問題」——送出是教練主動宣告責任轉移，
    //    比系統從 created_at 推斷「他到底做了沒」明確得多。
    //    沒送出 → 逾時未送出，1 點
    //    送出了但當下還有「已交未回」→ 那是他自己按下去時承認的欠帳，1 點
    const subBy = {};
    submitRows.forEach(r => { subBy[r.coach_id + '|' + r.log_date] = r; });
    let noSubmit = 0, lateSubmit = 0, oweReply = 0;
    // 🔴 送出制的起算日：這個按鈕 8/19 才上線，之前的日子教練不可能按。
    //    追溯計點會讓 14 位教練一律 12 點，最認真的那位（原本 1 點）也變 12 點——
    //    數字失去鑑別力就等於沒有記點。batches.submit_from 為 NULL 才從開班日算。
    subDays.forEach(d => {
      const sr = subBy[c.id + '|' + d];
      if (!sr) { noSubmit++; return; }                       // 到期限都沒送出
      const dl = new Date(d + COACH_DL); dl.setDate(dl.getDate() + 1);
      if (new Date(sr.submitted_at) > dl) { lateSubmit++; return; }   // 送出時已超過 12:00
      if (sr.unreplied > 0) oweReply++;                      // 準時送出，但自己承認還有人沒回
    });

    let hwNo = 0;
    mine.forEach(s => taught.forEach(u => { if (!hwBy[s.id + '|' + u]) hwNo++; }));
    return { name: nm(c), n: mine.length, noSubmit, lateSubmit, oweReply, hwNo,
             made: mkCoach[c.id] || 0,
             pts: noSubmit + lateSubmit + oweReply };
  }).filter(r => r.pts > 0 || r.hwNo > 0 || r.made > 0).sort((a, b2) => (b2.pts - a.pts) || (b2.hwNo - a.hwNo));

  return { stuRows, coachRows, dueDays, subDays, subFrom, taughtN: taught.size, graceOn, grace: b.hw_grace_until };
}

function renderDemerits(target) {
  const { stuRows, coachRows, dueDays, subDays, subFrom, taughtN, graceOn, grace } = calcDemerits();
  const cls = p => p >= 3 ? 'dm-3' : p >= 1 ? 'dm-1' : 'dm-0';
  let h = `<div class="sec-title"><span>⚠️ 記點（自動計算，不寫入資料庫）</span><span class="sec-count">已過期限 ${dueDays.length} 天 · 已上 ${taughtN} 單元</span></div>`;
  h += `<div class="cov-note">
    <b>小組回報</b>＝防怠惰：學員當天 <b>22:00</b> 貼（賴群不糾結分秒）、
    <b>教練隔天 12:00 前處理完並按「送出」</b>（沒送出才計點）<br>
    📌 學員<b>補繳</b>（教練送出後才貼）教練<b>不必急著回</b>，有空到一覽表修正即可。<br>
    🟡 <b>送出制自 ${subFrom} 起算</b>（已計 ${subDays.length} 天）——那個按鈕之前不存在，
    追溯計點會讓每位教練都一樣難看，反而看不出誰認真。<br>
    ⚠️ 系統記的是<b>教練自己標的</b>，不是賴群的真實情況——<b>12:00 後到賴群抽查</b>才是驗證，
    那也是這條線訂在中午的用意。<br>
    <b>課程作業</b>＝防落後：17 堂課上完前補齊即可${grace ? `　🟡 <b>本期寬限至 ${grace}</b>：在那之前顯示「將計」，<b>${grace} 之後自動變成實際點數</b>` : ''}<br>
    🔴 <b>教練沒檢核的格子＝當作學員沒交</b>（2026-08-19 改）——目的是讓數字難看到教練不得不填。<br>
    　所以「作業未完成」會標<b>（含未檢 N）</b>：那 N 格是教練沒檢核造成的，<b>不是學員的錯</b>。
    　<b>退班人工決定時請先看這個括號</b>——括號幾乎等於總數的人，要處理的是他的教練。<br>
    🟡 <b>但學員若自己在 daily 勾了「已在小組回報」，那一格就不算他沒交</b>（顯示「自述待查 N 已免計」）——
    　那是唯一不經過教練的證據，責任回到教練身上。<br>
    退不退班由人決定，系統只負責讓它看得見。<br>
    🔁 <b>「已補」＝逾期後有沒有到補交區留下說明。補交不減點</b>——點數記「當時有沒有做到」，
    已補記「事後有沒有補救」。<b>兩欄一起看才分得出態度</b>：<br>
    　點多＋已補多＝忙但負責，要幫他　｜　<b>點多＋已補 0＝態度問題，要談的是這些人</b></div>`;

  h += `<div class="sec-title"><span>👤 學員</span><span class="sec-count">${stuRows.length} 人有點數</span></div>`;
  if (!stuRows.length) h += `<div class="dash-empty">目前沒有人被記點 🎉</div>`;
  else {
    h += `<table class="dm-tbl"><tr><th>學員</th><th>小組沒交</th><th>作業未完成</th><th>合計</th><th>已補</th></tr>`;
    stuRows.forEach(r => h += `<tr><td>${r.name}<span class="c">${r.coach}</span></td>
      <td>${r.miss || '—'}</td>
      <td>${r.hwMiss || '—'}${r.hwUng ? `<span class="dm-pend">（含未檢 ${r.hwUng}）</span>` : ''}${
        r.hwSaid ? `<span class="dm-will">（自述待查 ${r.hwSaid} 已免計）</span>` : ''}${
        r.pend ? '<span class="dm-pend">（寬限中）</span>' : ''}</td>
      <td><span class="dm-pt ${cls(r.pts)}">${r.pts}</span>${r.pend ? `<span class="dm-will"> +${r.pend} 將計</span>` : ''}</td>
      <td>${r.made ? `<span class="dm-made">${r.made}</span>` : '<span class="dm-none">0</span>'}</td></tr>`);
    h += `</table><div class="cov-note" style="margin-top:0">滿 <b>3 點</b>依規則可退班——但請先看是不是教練沒檢核造成的。</div>`;
  }

  h += `<div class="sec-title"><span>🎓 教練</span><span class="sec-count">${coachRows.length} 位有點數</span></div>`;
  if (!coachRows.length) h += `<div class="dash-empty">教練全部準時 👏</div>`;
  else {
    h += `<table class="dm-tbl"><tr><th>教練</th><th>沒送出</th><th>逾時送出</th><th>送出時欠回</th><th>作業未檢核</th><th>合計</th><th>已補</th></tr>`;
    coachRows.forEach(r => h += `<tr><td>${r.name}<span class="c">${r.n} 位組員</span></td>
      <td>${r.noSubmit || '—'}</td><td>${r.lateSubmit || '—'}</td><td>${r.oweReply || '—'}</td>
      <td>${r.hwNo ? r.hwNo + ' 格' : '—'}</td>
      <td><span class="dm-pt ${cls(r.pts)}">${r.pts}</span></td>
      <td>${r.made ? `<span class="dm-made">${r.made}</span>` : '<span class="dm-none">0</span>'}</td></tr>`);
    h += `</table><div class="cov-note" style="margin-top:0">教練的點以「天」計，三種原因<b>互斥</b>，一天最多 1 點：<br>
      <b>沒送出</b>＝到隔天 12:00 都沒按送出　<b>逾時送出</b>＝送出時已過 12:00　
      <b>送出時欠回</b>＝準時送出，但他自己按下去時承認還有人「已交未回」<br>
      🔴 <b>送出＝教練宣告「我今天看完了，名單就是這樣」</b>，那一刻責任轉到學員身上；
      沒送出就一直算在教練頭上。教練可以早上 10:00 送完就去忙自己的事。<br>
      作業未檢核以「格」計（單元×組員），不併入教練點數；但<b>同一格已計入該組學員的點數</b>——
      學員會來問你為什麼被記點，這就是要你去檢核的壓力來源。</div>`;
  }
  // 補交原因分布：看的是「大家為什麼補」，不是個人
  if (makeupRows.length) {
    const LBL = { forgot:'忘記', sick:'生病', busy_work:'工作忙', family:'家庭因素',
                  missed_notice:'沒看到通知', late_post:'學員很晚才貼', other:'其他' };
    const cnt = {};
    makeupRows.forEach(r => {
      const k = (r.subject === 'coach' ? '教練·' : '學員·') + (LBL[r.reason_code] || r.reason_code);
      cnt[k] = (cnt[k] || 0) + 1;
    });
    const items = Object.entries(cnt).sort((a, b2) => b2[1] - a[1]);
    h += `<div class="sec-title"><span>🔁 補交原因分布</span><span class="sec-count">共 ${makeupRows.length} 筆</span></div>`;
    h += `<div class="cov-note">原因用選單填寫就是為了這張表——自由填寫統計不出來。<br>
      若「學員很晚才貼」佔多數，那要調整的是學員的 22:00，不是教練的 12:00。</div>`;
    h += `<table class="dm-tbl"><tr><th>原因</th><th>筆數</th></tr>` +
         items.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + `</table>`;
  }
  target.insertAdjacentHTML('beforeend', h);
}

// ── 開班中＝分析頁：四節各自獨立，時間尺度不混（2026-08-17 定案）──────────
//   ① 昨日回報即時報：昨天發生什麼（單日快照）
//   ② 整體組別回報率：開班到現在各環節進度（累積率）
//   ③ 作業追蹤彙整：17 單元 × 學員的完成矩陣（累積）
//   ④ 狀態排序：需要注意的人與組（排行）
//   Randoph：不要把日報、整體報全部混在一起——混了就分不出「昨天沒事」和「整期都沒事」。
// 🔴 2026-08-20 改成「真的分頁」，不再是錨點捲動。
//    Randoph：「分析你是用錨點跑到下面，當我想要看別的時候又要往上滑上去」——
//    四節加起來 139KB，用捲動找就是難讀。點一下切換，各看各的。
//    順序照他講的：當日回報 → 一覽表（作業／行動各自獨立）→ 學員和教練狀況。
//    作業與行動分兩頁的理由：那本來就是兩件事，而且行動週開始後作業表就固定不動了
//    （17 單元上完，只剩追補交），每天在動的是行動表。
const ANA = [
  { k:'daily', t:'📅 當日回報', only:null,
    d:() => { const t = localDateStr(new Date()), r = lastWeekday();
      const w = ds => WDAY[new Date(ds + 'T00:00:00').getDay()];
      return `上方＝今天 ${t.slice(5).replace('-','/')}（週${w(t)}）進行中 · 下方＝${r.slice(5).replace('-','/')}（週${w(r)}）已結算`; },
    render: el => renderDashboard(el, 'daily') },

  { k:'hw', t:'📋 作業一覽表', only:'study',
    d:() => `日期 × 學員 · 已上 ${(() => { let n = 0; const t = localDateStr(new Date());
      Object.entries(SCHEDULE || {}).forEach(([d, a]) => { if (d <= t) n += a.length; }); return n; })()} 單元`,
    render: el => renderHwSection(el, 'study') },

  { k:'act', t:'🏃 行動一覽表', only:null,
    d:() => {
      const b = batchRow();
      let from = actionStartDate();
      if (b.study_end) { const d = new Date(b.study_end + 'T00:00:00'); d.setDate(d.getDate() + 1); from = localDateStr(d); }
      return `日期 × 學員 · 行動週 ${from || '—'} 起`;
    },
    render: el => renderHwSection(el, 'action') },

  { k:'status', t:'📊 學員與教練狀況', only:null,
    d:() => {
      // 兩個分母不一樣就兩個都寫出來——只寫一個，另一欄就變成看不出尺度的數字
      const w = weekdaysSoFar(), a = actionWeekdays();
      return a === w ? `開班至今累積 · 平日 ${w} 天` : `累積 · 作業與 LINE ${w} 天 · 行動 ${a} 天`;
    },
    render: el => { renderDashboard(el, 'groups'); renderCoverageSection(el); renderDemerits(el); renderTrack(el); } },
];
// ⑤ 只在該期已結業時併進來——沒結業就不存在，不佔位、也不用切換
const anaSections = () => {
  const list = ANA.filter(a => !a.only || a.only === batchKind());
  return batchEnded() ? list.concat([{ k:'after', t:'📦 結案報表', d:'全期封存',
                                       render: el => { el.innerHTML = phaseAfter(); } }]) : list;
};
// ── 班型：所有「這一期有沒有作業／行動從哪天算」的判斷都從這裡推導 ──────────
//    學習班 study：study_start 有值＝前段上課、後段行動（27 期）
//    行動班 action：study_start NULL＝一開始就一直行動（26 期那種）
//    以後加第三種班型也只改這一區，不要在各處各判一次。
// 🔴 教練「處理完成」的定義（2026-08-17，Randoph 發現的邏輯漏洞）
//    「學員沒有繳，教練就沒辦法回，所以有看沒辦法回也是一種回」。
//    只算 homework_replied===true 的話，教練會因為「學員沒交」而被扣分——
//    他明明進來看了、也判斷了，那天該做的就做完了。
//    ⚠️ 放寬的是分子，分母維持「組員數 × 天數」固定不變；
//       絕不可以改成用交件數當分母，那又回到「怠惰的人自己決定自己的成績」。
//    也不要讓教練在學員沒交時去點「已回」——那會把「沒東西可回」和「真的回了」
//    壓成同一個值，以後就查不出「交了但沒回」這種真怠惰（coach-review 已擋）。
const coachDone = r => !!r && r.homework !== null && r.homework !== undefined
  && (r.homework === false || r.homework_replied === true);

function batchRow() { return allBatches.find(x => x.id === bid) || {}; }
function batchKind() { return batchRow().study_start ? 'study' : 'action'; }
function hasHomework() { return batchKind() === 'study'; }

// 🔴 行動紀錄的起算日＝行動開放日，不是開班日。
//    學習班在 action_open_date 之前，七大行動是鎖住的（三層防護：CSS 灰掉＋移除 onclick＋函式內 return），
//    把那幾天算進分母＝罰學員沒做我們不讓他做的事。實測 27 期：19% → 30%。
//    行動班 action_open_date 為 NULL → 自動退回 start_date，同一條規則兩種班都對。
function actionStartDate() { const b = batchRow(); return b.action_open_date || b.start_date; }

// 某日到今天的平日數（週一～週五）＝ 累積率的分母基準
function weekdaysFrom(from) {
  if (!from) return 0;
  const today = localDateStr(new Date());
  let n = 0;
  for (let d = new Date(from + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
    const w = d.getDay(); if (w >= 1 && w <= 5) n++;
  }
  return n;
}
function weekdaysSoFar()  { return weekdaysFrom(batchRow().start_date); }   // 作業／LINE：開班第一天就要求
function actionWeekdays() { return weekdaysFrom(actionStartDate()); }       // 行動紀錄：行動開放後才要求
let anaTab = 'daily';          // 記住當前子分頁，重繪不跳回第一頁
function renderAnalysis(el) {
  const list = anaSections();
  if (!list.some(a => a.k === anaTab)) anaTab = list[0].k;      // 換期別可能少了某頁
  el.innerHTML = `<div class="sub-bar">` + list.map(a =>
    `<button class="sub-tab ${a.k === anaTab ? 'on' : ''}" onclick="setAnaTab('${a.k}')">${a.t}</button>`
  ).join('') + `</div>` + list.map(a =>
    `<div class="ana-sec" id="ana-${a.k}" style="display:${a.k === anaTab ? '' : 'none'}">
       <div class="ana-hd">${a.t}<span>${typeof a.d === 'function' ? a.d() : a.d}</span></div>
       <div id="ana-body-${a.k}"></div></div>`
  ).join('');
  paintAnaTab(anaTab);
}
// lazy render：切到才畫。省掉「四節一次全渲染」——首次載入本來要多畫 3 頁。
const anaPainted = new Set();
function paintAnaTab(k) {
  if (anaPainted.has(k)) return;
  const sec = anaSections().find(a => a.k === k);
  const body = document.getElementById('ana-body-' + k);
  if (!sec || !body) return;
  sec.render(body);
  anaPainted.add(k);
}
function setAnaTab(k) {
  anaTab = k;
  anaSections().forEach(a => {
    const sec = document.getElementById('ana-' + a.k);
    if (sec) sec.style.display = a.k === k ? '' : 'none';
  });
  document.querySelectorAll('.sub-bar .sub-tab').forEach(b =>
    b.classList.toggle('on', b.textContent === (anaSections().find(a => a.k === k) || {}).t));
  paintAnaTab(k);
  window.scrollTo({ top: 0, behavior: 'smooth' });        // 切頁一律回到頂端
}

// ② 的下半：教練回報總覽（看了／交件／已回／組員填報）
//    原本掛在 renderTrack（④）裡，但它是「開班至今累積率」，跟 ② 同一時間尺度，所以歸 ②。
function renderCoverageSection(target) {
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const realStudents = students.filter(s => s.status === 'approved' && !coachMemberIds.has(s.member_id));
  const logsByStu = {};
  allLogs.forEach(l => { (logsByStu[l.student_id] = logsByStu[l.student_id] || []).push(l); });
  target.insertAdjacentHTML('beforeend', renderCoachOverview(realStudents, logsByStu));
}

// ③ 作業追蹤彙整（原本掛在 renderTrack 裡，拆出來獨立一節）
// 點學員名字彈出「教練／領袖」——兩欄常駐太吃寬度，但責任歸屬又必須查得到
function showWho(ev, td) {
  ev.stopPropagation();
  let box = document.getElementById('whoPop');
  if (!box) { box = document.createElement('div'); box.id = 'whoPop'; box.className = 'who-pop'; document.body.appendChild(box); }
  const d = td.dataset;
  box.innerHTML = `<b>${d.n}</b><div>教練　${d.c}</div><div>領袖　${d.s}</div>`;
  const r = td.getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = Math.min(r.left + window.scrollX, window.innerWidth - box.offsetWidth - 12) + 'px';
  box.style.top  = (r.bottom + window.scrollY + 4) + 'px';
}
document.addEventListener('click', () => {
  const b = document.getElementById('whoPop');
  if (b) b.style.display = 'none';
});

function renderHwSection(target, scope) {
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const realStudents = students.filter(s => s.status === 'approved' && !coachMemberIds.has(s.member_id));
  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));
  target.insertAdjacentHTML('beforeend', renderHwMatrix(realStudents, coachById, scope) ||
    `<div class="dash-empty">${scope === 'action'
      ? '行動週還沒開始（學習週結束的隔天起算，看 batches.study_end）'
      : '尚無可顯示的日期'}</div>`);
}

// ── 開班前：全綠才能開班 ──────────────────────────────
function phaseBefore() {
  const b = allBatches.find(x => x.id === bid) || {};
  const appr = students.filter(s => s.status === 'approved');
  const coachMids = new Set(coaches.filter(c => c.status === 'approved').map(c => c.member_id));
  const stu = appr.filter(s => s.coach_id);                       // 真學員
  const coachAsStu = appr.filter(s => !s.coach_id);               // 教練的學員身分
  const apprCoaches = coaches.filter(c => c.status === 'approved');
  const ck = [];
  const add = (lvl, t, d) => ck.push({ lvl, t, d });

  // 1) 教練是否都有學員身分（27 期踩過：漏掉 → 教練六天存不了回報）
  const noIdentity = apprCoaches.filter(c => !coachAsStu.some(s => s.member_id === c.member_id));
  add(noIdentity.length ? 'bad' : 'ok', '教練的學員身分',
    noIdentity.length ? `<b>${noIdentity.length} 位教練沒有 batch_students 紀錄</b>：${noIdentity.map(nm).join('、')}<br>→ 他們的「儲存我的回報」會是灰的，開班就存不了。見 wiki「開新班期檢查清單」第 1 步`
      : `${apprCoaches.length} 位教練都有`);

  // 2) 學員分組
  const noGroup = stu.filter(s => !s.coach_id);
  const pending = students.filter(s => s.status === 'pending');
  add(pending.length ? 'warn' : 'ok', '報名審核',
    pending.length ? `<b>${pending.length} 人待審</b>，到「名冊」處理` : `已批准 ${appr.length} 人（含教練身分 ${coachAsStu.length}）`);
  add('ok', '學員分組', `${stu.length} 位學員已分組`);

  // 3) 上線
  const noSp = stu.filter(s => !s.sponsor_id);
  add(noSp.length ? 'warn' : 'ok', '上線（sponsor）',
    noSp.length ? `${noSp.length} 人未設上線：${noSp.slice(0,6).map(nm).join('、')}${noSp.length>6?'…':''}` : '全部已設');

  // 4) 教練組別
  const noGrp = apprCoaches.filter(c => !c.group_name);
  add(noGrp.length ? 'warn' : 'ok', '教練組別',
    noGrp.length ? `${noGrp.length} 位未設組別：${noGrp.map(nm).join('、')}（不帶組者屬正常）` : '全部已設');

  // 5) 繳費（排除教練——教練不用繳，算進去只會製造雜訊）
  const unpaid = stu.filter(s => !s.payment_confirmed);
  add(unpaid.length ? 'warn' : 'ok', '繳費確認（不含教練）',
    unpaid.length ? `<b>${unpaid.length} 位學員未確認</b>：${unpaid.slice(0,6).map(nm).join('、')}${unpaid.length>6?'…':''}` : `${stu.length} 位學員全部確認`);

  // 6) DB 設定
  const miss = [];
  if (!b.start_date) miss.push('start_date');
  if (!b.end_date) miss.push('end_date');
  if (!b.study_start) miss.push('study_start');
  if (!b.study_end) miss.push('study_end');
  if (!b.coach_mode) miss.push('coach_mode');
  add(miss.length ? 'bad' : 'ok', '班期設定',
    miss.length ? `<b>缺：${miss.join('、')}</b>`
      : `${b.start_date} ～ ${b.end_date}｜學習 ${b.study_start}～${b.study_end}｜${b.coach_mode}｜行動開放 ${b.action_open_date || '不鎖'}｜活動「${b.event_name || '無'}」`);

  // 7) 課表對齊（units.js 的 SCHEDULE 首日 vs 班期）——27/28 期都踩過
  let sd = null, ed = null;
  if (typeof SCHEDULE !== 'undefined') { const ks = Object.keys(SCHEDULE).sort(); sd = ks[0]; ed = ks[ks.length-1]; }
  const okSched = sd && b.study_start && sd === b.study_start && ed === b.study_end;
  add(okSched ? 'ok' : 'bad', '課表四處對齊',
    !sd ? 'units.js 未載入'
      : okSched ? `units.js ${sd} ～ ${ed}，與 study_start/end 一致`
      : `<b>不一致</b>：units.js 排到 ${sd} ～ ${ed}，DB study 是 ${b.study_start} ～ ${b.study_end}<br>→ 課表共四處副本（units.js／course.html 的 PLAN＋靜態表／brochure.html），要一起改`);

  // 8) 報名開關
  add('ok', '報名狀態', b.registration_open ? '🟢 開放中——新報名會寫進這一期' : '🔴 關閉');

  const bad = ck.filter(c => c.lvl === 'bad').length, warn = ck.filter(c => c.lvl === 'warn').length;
  let h = `<div class="ck-sum ${bad ? 'no' : 'go'}">${bad ? `🔴 有 ${bad} 項必須處理才能開班` : warn ? `🟡 可以開班，但有 ${warn} 項建議先確認` : '🟢 全部就緒，可以開班'}</div>`;
  h += `<div class="sec-title"><span>📋 開班前檢查清單</span><span class="sec-count">${b.name || ''}</span></div>`;
  const ICO = { ok:'✅', warn:'🟡', bad:'🔴' };
  ck.forEach(c => h += `<div class="ck ${c.lvl}"><div class="ck-ico">${ICO[c.lvl]}</div><div class="ck-b"><div class="ck-t">${c.t}</div><div class="ck-d">${c.d}</div></div></div>`);
  return h;
}

// ── 開班後：結案報表 ──────────────────────────────
function phaseAfter() {
  const b = allBatches.find(x => x.id === bid) || {};
  const coachMids = new Set(coaches.map(c => c.member_id));
  const stu = students.filter(s => s.status === 'approved' && s.coach_id);
  const byStu = {}; allLogs.forEach(l => (byStu[l.student_id] = byStu[l.student_id] || []).push(l));
  const act = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);
  const talk = l => (l.present||0)+(l.seminar||0);

  // 分診四群（沿用 26 期結案的漏斗判定，見 [[26期結案反思]]）
  let g1=0,g2=0,g3=0,g4=0;
  const closeByMid = {};
  stu.forEach(s => {
    const ls = byStu[s.id] || [];
    const hits = ls.reduce((a,l)=>a+act(l),0);
    const talks = ls.reduce((a,l)=>a+talk(l),0);
    const closes = 0; // 締結需另查，這裡以行動漏斗為主
    if (!hits) g1++; else if (!talks) g2++; else g3++;
  });
  const filled = stu.filter(s => (byStu[s.id]||[]).length).length;
  const hwDone = new Set(hwRows.filter(r => r.total>0 && r.done>=r.total).map(r => r.student_id)).size;
  const certDone = stu.filter(s => s.cert_comment).length;

  let h = `<div class="sec-title"><span>📊 結案報表</span><span class="sec-count">${b.name||''}　${b.start_date}～${b.end_date}</span></div>`;
  h += `<div class="dash-progress">
    <div class="dash-prog-card"><div class="dash-prog-n">${filled} / ${stu.length}</div><div class="dash-prog-l">曾填報學員</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${allLogs.length}</div><div class="dash-prog-l">回報總筆數</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${certDone} / ${stu.length}</div><div class="dash-prog-l">證書評語已寫</div></div>
  </div>`;
  h += `<div class="cov-note">分診（依 [[26期結案反思]] 的漏斗，順序不可顛倒）：<br>
    ① 整期沒出手 <b>${g1}</b> 人　② 有出手沒進到溝通 <b>${g2}</b> 人　③ 溝通過 <b>${g3}</b> 人<br>
    ⚠️ ③ 裡面「溝通過但零締結」才是最該救的那群——他們通常比 ② 更努力。溝通場次是締結的真門檻。</div>`;
  h += `<div class="sec-title"><span>✅ 結案待辦</span></div>`;
  const todo = [
    [certDone >= stu.length, `結業證書評語：已寫 ${certDone}／${stu.length}`],
    [hwRows.length > 0, `作業檢核紀錄：${hwRows.length} 筆（0 筆代表教練整期沒用過）`],
    [!b.is_active, `封存：把 is_active 切給下一期（目前${b.is_active ? '🔴 仍是當期' : '已封存'}）`],
    [false, `全期數據寫進 wiki 結案反思，並更新 [[資料架構規劃]]`],
  ];
  todo.forEach(([ok, t]) => h += `<div class="ck ${ok?'ok':'warn'}"><div class="ck-ico">${ok?'✅':'🟡'}</div><div class="ck-b"><div class="ck-t">${t}</div></div></div>`);
  return h;
}

function renderDashboard(target, part) {
  const today = localDateStr(new Date());
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const approvedStudents = students.filter(s => s.status === 'approved');
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const realStudents = approvedStudents.filter(s => !coachMemberIds.has(s.member_id));
  const coachStudents = approvedStudents.filter(s => coachMemberIds.has(s.member_id));

  const todayMap = {};
  todayLogs.forEach(l => { todayMap[l.student_id] = l; });
  // 日報基準日＝上一個上課日（不是字面上的昨天，見 lastWeekday()）
  const refDay = lastWeekday();
  const refWd  = WDAY[new Date(refDay + 'T00:00:00').getDay()];
  const yesterdayMap = {};
  allLogs.filter(l => l.log_date === refDay).forEach(l => { yesterdayMap[l.student_id] = l; });

  const totalReal = realStudents.length;
  const totalCoach = coachStudents.length;
  const totalAll = approvedStudents.length;

  function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }

  // 「教練有沒有處理」依模式：full＝confirmed／simple＝coach_engagement 有標記
  // （27期起 confirmed 永遠 false——之前這三張卡的「教練確認率」因此永遠 0%）
  const dashSimple = ((allBatches.find(b => b.id === bid) || {}).coach_mode || 'simple') === 'simple';
  const dashMarked = new Set(engRows.filter(r => r.homework !== null && r.homework !== undefined)
                                    .map(r => r.student_id + '|' + r.log_date));
  const dashHandled = (s, date, log) => dashSimple ? dashMarked.has(s.id + '|' + date) : !!log?.confirmed;

  // 昨日統計
  const yStuFill = realStudents.filter(s => yesterdayMap[s.id]).length;
  const yCoachFill = coachStudents.filter(s => yesterdayMap[s.id]).length;
  const yConfirmed = approvedStudents.filter(s => dashHandled(s, refDay, yesterdayMap[s.id])).length;

  // 今日統計
  const tStuFill = realStudents.filter(s => todayMap[s.id]).length;
  const tCoachFill = coachStudents.filter(s => todayMap[s.id]).length;
  const tConfirmed = approvedStudents.filter(s => dashHandled(s, today, todayMap[s.id])).length;

  let h = '';

  function progCards(stuFill, stuTotal, coachFill, coachTotal, confirmed, filledTotal) {
    const sp = pct(stuFill, stuTotal), cp = pct(coachFill, coachTotal), ap = pct(confirmed, filledTotal);
    return `<div class="dash-progress">
      <div class="dash-prog-card">
        <div class="dash-prog-n">${stuFill} / ${stuTotal}</div>
        <div class="dash-prog-l">學員填報率 ${sp}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${sp}%"></div></div>
      </div>
      <div class="dash-prog-card">
        <div class="dash-prog-n">${coachFill} / ${coachTotal}</div>
        <div class="dash-prog-l">教練填報率 ${cp}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${cp}%"></div></div>
      </div>
      <div class="dash-prog-card">
        <div class="dash-prog-n">${confirmed} / ${filledTotal}</div>
        <div class="dash-prog-l">教練${dashSimple ? '標記' : '確認'}率 ${ap}%</div>
        <div class="dash-prog-bar"><div class="dash-prog-fill" style="width:${ap}%"></div></div>
      </div>
    </div>`;
  }

  // ── ① 日報的分組展開：跟 ② 同一種形狀（組→學員），但只看 refDay 這一天 ──
  //    Randoph 定案 2026-08-17：日報與整體統計上下分離。日報回答「昨天誰沒做、今天去催誰」，
  //    處理完就結束；整體統計回答「整期誰跟不上」，那才是記點與退班的依據。
  function dailyGroups() {
    const ac = approvedCoaches();
    const gs = {};
    ac.forEach(c => { gs[c.id] = { coach: c, students: [] }; });
    approvedStudents.forEach(s => { if (s.coach_id && gs[s.coach_id]) gs[s.coach_id].students.push(s); });
    // 12:00 過了嗎？過了之後「未標」就不是「還沒輪到」，而是「教練沒進來看」
    const coachDl = new Date(refDay + 'T12:00:00'); coachDl.setDate(coachDl.getDate() + 1);
    const overdue = new Date() > coachDl;
    const engDay = engRows.filter(r => r.log_date === refDay);
    const engOf  = sid => engDay.find(r => r.student_id === sid) || {};
    const rows = Object.values(gs).filter(g => g.students.length).map(g => {
      const t = g.students.length;
      const fill = g.students.filter(s => yesterdayMap[s.id]).length;
      const sent = g.students.filter(s => engOf(s.id).homework === true).length;
      const rep  = g.students.filter(s => coachDone(engOf(s.id))).length;
      const selfRec = g.coach ? coachStudents.find(s => s.member_id === g.coach.member_id) : null;
      return { g, t, fill, sent, rep, self: selfRec ? !!yesterdayMap[selfRec.id] : null,
               miss: (t - fill) + (t - sent) + (t - rep) };
    }).sort((a, b) => b.miss - a.miss);            // 問題最多的組排最上面
    if (!rows.length) return '';
    const blk = (label, n, t) => {
      const p = t ? Math.round(n / t * 100) : 0;
      const c = p === 100 ? 'dash-perfect' : p >= 50 ? 'dash-warn' : p > 0 ? 'dash-danger' : 'dash-zero';
      return `<span class="stu-b ${c}">${label} <span class="dash-pct">${n}</span><i>/${t}</i></span>`;
    };
    // 未標記的格子：期限內＝還沒輪到（灰）；期限後＝教練沒進來看（紅，責任歸教練）
    const naBlk = txt => overdue
      ? `<span class="stu-b dash-zero" title="隔天 12:00 已過，教練還沒進來標——這一格歸教練">⚠️ 教練沒看</span>`
      : `<span class="stu-b stu-na" title="教練還沒進來標記（隔天 12:00 前）">${txt}</span>`;
    const flag = (v, yes, no, na) => v === true
      ? `<span class="stu-b dash-perfect">${yes}</span>`
      : v === false ? `<span class="stu-b dash-zero">${no}</span>`
                    : naBlk(na);
    let out = `<div class="cov-note">這一節只看 <b>${refDay}（週${refWd}）</b>一天，處理完就結束——
      要看整期累積請往下到 <b>② 整體組別回報率</b>。<b>問題最多的組排在最上面。</b><br>
      ⚠️ <b>兩條死線</b>：學員當天 <b>22:00</b> 前貼${hasHomework() ? '作業' : '行動心得'}；
      教練<b>隔天 12:00</b> 前處理完（標記＋該回的回完）。<br>
      🔴 12:00 過後空白格顯示<b>「⚠️ 教練沒看」</b>——責任歸教練，不必再去翻賴群分辨。
      學員沒交時顯示<b>「✅ 無需回」</b>——沒東西可回也算教練處理完，不扣他。<br>
      📌 事後補交<b>不會改掉這一天的紀錄</b>（那衡量的是當天的節奏）；補交要看的是
      <b>③ 作業追蹤彙整</b>的總完成度，那邊不壓日期、隨時可補。</div>`;
    rows.forEach(r => {
      out += `<div class="dash-coach-row">
        <div class="dash-coach-hd" onclick="this.parentElement.classList.toggle('open')">
          <div class="dash-coach-left">
            <span class="card-name">${r.g.coach ? nm(r.g.coach) : '未配對教練'}</span>
            ${r.g.coach?.group_name ? `<span style="color:var(--gold);font-size:11px">${r.g.coach.group_name}</span>` : ''}
            <span class="dash-self">教練本人${r.self === null ? '－' : (r.self ? '✅' : '❌')}</span>
          </div>
          <div class="dash-coach-stats">
            ${blk('行動紀錄', r.fill, r.t)}
            ${blk('LINE繳交', r.sent, r.t)}
            ${blk('LINE回覆', r.rep, r.t)}
          </div>
          <span class="coach-arrow">▼</span>
        </div>
        <div class="coach-body">
          ${r.g.students.map(s => {
            const log = yesterdayMap[s.id];
            const e = engOf(s.id);
            const pts = log ? (log.name_list||0)+(log.meet||0)+(log.invite||0)*2+(log.present||0)*5+(log.seminar||0)*5+(log.ghosted||0)+(log.rejected||0) : 0;
            return `<div class="dash-stu-row">
              <span>${nm(s)}${mc(s)}</span>
              <div class="dash-stu-status">
                ${log ? `<span class="stu-b dash-perfect">✍️ 已填<i>${pts} 分</i></span>` : `<span class="stu-b dash-zero">✍️ 未填</span>`}
                ${flag(e.homework === true ? true : (e.homework === false ? false : null), '📤 交了', '📤 沒交', '📤 未標')}
                ${e.homework === false
                    ? `<span class="stu-b dash-perfect" title="學員沒交，教練沒東西可回——標了就算處理完">✅ 無需回</span>`
                    : e.homework === true
                      ? (e.homework_replied === true
                          ? `<span class="stu-b dash-perfect">↩️ 回了</span>`
                          : `<span class="stu-b dash-zero">↩️ 沒回</span>`)
                      : naBlk('↩️ 未標')}
                <span class="stu-arrow-gap"></span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    return out;
  }

  // 教練標記率的分母＝真學員數（教練要標全部組員，不是只標有填 daily 的）

  // ── 電池能量條（今日 LIVE）──
  const batteryPct = pct(tStuFill, totalReal);
  if (part !== 'groups') {
  h += `<div class="battery">
    <div class="battery-fill" style="width:${batteryPct}%"></div>
    <div class="battery-text">今天 ${today.slice(5).replace('-','/')}（週${WDAY[new Date(today+'T00:00:00').getDay()]}）進行中 ${batteryPct}%（${tStuFill}/${totalReal}）</div>
  </div>`;

  // ── 昨日進度 ──
  h += `<div class="sec-title"><span>📊 ${refDayLabel()}回報</span><span class="sec-count">${refDay.replace(/-/g,' / ')}（週${refWd}）</span></div>`;
  h += progCards(yStuFill, totalReal, yCoachFill, totalCoach, yConfirmed, totalReal);
  h += dailyGroups();
  }   // ← 關閉 if (part !== 'groups')：② 整體組別回報率 不需要電池與昨日三卡

  // ── 教練回報總覽 ──
  if (!totalAll) {
    h += `<div class="dash-empty">尚無已批准學員</div>`;
  } else {
    const ac = approvedCoaches();
    const groups = {};
    ac.forEach(c => { groups[c.id] = { coach: c, students: [] }; });
    groups['_none'] = { coach: null, students: [] };
    approvedStudents.forEach(s => {
      const gid = s.coach_id && groups[s.coach_id] ? s.coach_id : '_none';
      groups[gid].students.push(s);
    });

    // 依組別排序，未配對教練放最後
    const sorted = Object.values(groups).filter(g => g.students.length && g.coach).sort((a, b) => {
      const ga = a.coach.group_name || '';
      const gb = b.coach.group_name || '';
      const ia = GROUPS.indexOf(ga);
      const ib = GROUPS.indexOf(gb);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });

    const dashVb = dashSimple ? '標記' : '確認';

    // 拆點：daily 只要上面的電池＋昨日三卡；groups 只要下面的累積矩陣。
    // 必須留在 else 區塊內，因為下面用到 sorted / groups / dashVb。
    if (part === 'daily') { if (target) target.insertAdjacentHTML('beforeend', h); return; }
    h = '';
    const hw2 = hasHomework();
    h += `<div class="cov-note">這張表看的是<b>學員完成度</b>，教練只是分組方式。<b>每一欄都是開班至今的累積率</b>（不是單日）。<br>
      ${hw2 ? '前三欄' : '前兩欄'}＝<b>學員做到多少</b>（${hw2 ? '作業／' : ''}行動紀錄／在 LINE 繳交）｜最後一欄＝<b>教練有沒有回</b><br>
      分母：${hw2 ? '作業＝已上單元×組員數；' : ''}<b>行動紀錄＝行動開放日（${actionStartDate() || '—'}）起的平日數</b>×組員數；
      LINE 兩欄＝開班日起的平日數×組員數。週末不排${hw2 ? '作業' : '進度'}也不要求 LINE，不計入分母。<br>
      ⚠️ ${hw2 ? '作業與 LINE 三欄' : 'LINE 兩欄'}由教練標記產生：教練沒進來就會是 0，那是<b>沒人看</b>不是沒人做——
      「行動紀錄」是學員自己填的，不受教練影響，可以當對照。<br>
      🔴 <b>LINE回覆的分子＝已回 ＋ 標了「沒交」</b>：學員沒交，教練沒東西可回，
      那天標了就算處理完，不該因為學員沒交而扣教練。<b>沒回</b>只算「學員交了、教練沒回」。</div>`;

    sorted.forEach(g => {
      const cName = g.coach ? nm(g.coach) : '未配對教練';
      const grpName = g.coach?.group_name || '';
      const total = g.students.length;

      // 單日訊號（教練本人有沒有填、每天一顆點）已移到 ① 日報——這一節純累積。

      // 四個獨立訊號（2026-08-17 定案）——各自的分母都是組員數，互不干擾。
      // 未來開行動組（無作業）也不會衝突：study_start 為 NULL 就自動不顯示「作業」。
      //   作業      homework_checks 完成單元／教練檢核產生
      //   行動紀錄  action_logs／**學員自己在 daily 填，唯一不經過教練的訊號**
      //   LINE繳交  coach_engagement.homework=true／教練代標（學員貼賴群）
      //   LINE回覆  coach_engagement.homework_replied=true／教練標自己回了
      // ⚠️ 後三者都是教練產生：教練沒進來就全變 0，那是「沒人看」不是「沒人做」。
      // 四欄統一為「開班至今的累積完成率」（2026-08-17 修）。
      // 原本作業是累積、其餘三欄只算昨天一天 → 尺度不一致；而昨天是週日（不排作業、教練不標），
      // 三欄全 0% 看起來像狀況差，實際那天本來就沒事。用單一代表日整張表都會誤導。
      // 分母一律「平日數 × 組員數」（週末不排作業也不要求 LINE，不計入分母）。
      const bRow = allBatches.find(x => x.id === bid) || {};
      let wd = 0;
      if (bRow.start_date)
        for (let d = new Date(bRow.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
          const w = d.getDay(); if (w >= 1 && w <= 5) wd++;
        }
      const sids = new Set(g.students.map(s => s.id));
      const isWd = ds => { const w = new Date(ds + 'T00:00:00').getDay(); return w >= 1 && w <= 5; };
      const aStart = actionStartDate(), awd = actionWeekdays();
      // 行動紀錄的分子分母都要從行動開放日起算，否則學習週會把率稀釋掉
      const yF    = allLogs.filter(l => sids.has(l.student_id) && isWd(l.log_date) && l.log_date >= aStart).length;
      const ySent = engRows.filter(r => sids.has(r.student_id) && r.homework === true && isWd(r.log_date)).length;
      const yRep  = engRows.filter(r => sids.has(r.student_id) && isWd(r.log_date) && coachDone(r)).length;
      const denom = wd * total;
      const hwFull = g.students.reduce((a, s) => a + hwRows.filter(r => r.student_id === s.id && r.total > 0 && r.done >= r.total).length, 0);
      const hasCourse = hasHomework();   // 行動班無課表 → 作業欄整欄不出現
      // 作業要用「完成率」才能跟其他欄並排比較：已上單元 × 組員數 當分母
      let taughtN = 0;
      if (typeof SCHEDULE !== 'undefined')
        Object.entries(SCHEDULE).forEach(([d, arr]) => { if (d <= today) taughtN += arr.length; });
      const hwPct = pct(hwFull, taughtN * total);

      const stuAct = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);
      const yFillPctC = pct(yF, awd * total), yConfPctC = pct(ySent, denom);
      const yRepPctC = pct(yRep, denom);
      function lvl(p) { return p === 100 ? 'dash-perfect' : p >= 80 ? 'dash-pass' : p >= 50 ? 'dash-warn' : p > 0 ? 'dash-danger' : 'dash-zero'; }

      const allDone = yFillPctC === 100 && yConfPctC === 100 && yRepPctC === 100;
      h += `<div class="dash-coach-row${allDone ? ' dash-complete' : ''}">
        <div class="dash-coach-hd" onclick="this.parentElement.classList.toggle('open')">
          <div class="dash-coach-left">
            <span class="card-name">${cName}</span>
            ${grpName ? `<span style="color:var(--gold);font-size:11px">${grpName}</span>` : ''}
          </div>
          <div class="dash-coach-stats">
            ${hasCourse ? `<span class="dash-day-block ${lvl(hwPct)}">作業 <span class="dash-pct">${hwPct}%</span></span>` : ''}
            <span class="dash-day-block ${lvl(yFillPctC)}">行動紀錄 <span class="dash-pct">${yFillPctC}%</span></span>
            <span class="dash-day-block ${lvl(yConfPctC)}">LINE繳交 <span class="dash-pct">${yConfPctC}%</span></span>
            <span class="dash-day-block ${lvl(yRepPctC)}">LINE回覆 <span class="dash-pct">${yRepPctC}%</span></span>
          </div>
          <span class="coach-arrow">▼</span>
        </div>
        <div class="coach-body">
          ${g.students.map(s => {
            // 學員列＝表頭四欄的個人版，全部累積（原本只顯示昨天一天，在累積區塊裡是混尺度）
            const sHwFull = hwRows.filter(r => r.student_id === s.id && r.total > 0 && r.done >= r.total).length;
            const sHwPct  = pct(sHwFull, taughtN);
            const sLogs   = allLogs.filter(l => l.student_id === s.id && isWd(l.log_date) && l.log_date >= aStart);
            const sPts    = sLogs.reduce((a, l) => a + stuAct(l), 0);
            const sEng    = engRows.filter(r => r.student_id === s.id && isWd(r.log_date));
            const sSent   = sEng.filter(r => r.homework === true).length;
            const sRep    = sEng.filter(coachDone).length;
            const sJudged = sEng.filter(r => r.homework !== null && r.homework !== undefined).length;
            // 繳交／回覆是教練「點」出來的，只有點過才有數字 → 沒點就是未標，不是 0%
            const mark = (icon, n, label) => sJudged
              ? `<span class="stu-b ${lvl(pct(n, wd))}">${icon} <span class="dash-pct">${n}</span><i>/${wd} 天</i></span>`
              : `<span class="stu-b stu-na" title="教練還沒進來標記，不代表學員沒做">⬜ 未標</span>`;
            return `<div class="dash-stu-row">
              <span>${nm(s)}${mc(s)}</span>
              <div class="dash-stu-status">
                ${hasCourse ? `<span class="stu-b ${lvl(sHwPct)}" title="全繳單元數／已上單元數">作業 <span class="dash-pct">${sHwPct}%</span><i>${sHwFull}/${taughtN}</i></span>` : ''}
                ${sLogs.length
                  ? `<span class="stu-b ${lvl(pct(sLogs.length, awd))}" title="有填天數／行動開放後的平日數 · 累積行動分數">✍️ <span class="dash-pct">${sLogs.length}</span><i>/${awd} 天 · ${sPts} 分</i></span>`
                  : `<span class="stu-b stu-na">✍️ 未填</span>`}
                ${mark('📤', sSent)}
                ${mark('↩️', sRep)}
                <span class="stu-arrow-gap"></span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }
  if (target) target.insertAdjacentHTML('beforeend', h);
  else { const d = document.getElementById('p-dashboard'); if (d) d.innerHTML = h; }
}

// Tab 1: 審核名冊

function renderReview() {
  const pendingC = coaches.filter(c => c.status === 'pending').length;
  const pendingS = students.filter(s => s.status === 'pending').length;
  const approvedS = students.filter(s => s.status === 'approved').length;
  const totalC = approvedCoaches().length;

  const pCoaches  = coaches.filter(c => c.status === 'pending' && matchSearch(c));
  const apCoaches = coaches.filter(c => c.status === 'pending');
  const pStudents = students.filter(s => s.status === 'pending' && matchSearch(s));
  const apStudents= students.filter(s => s.status === 'pending');

  let h = `<div class="stats">
    <div class="st"><div class="st-n">${pendingC}</div><div class="st-l">教練待審</div></div>
    <div class="st"><div class="st-n">${pendingS}</div><div class="st-l">學員待審</div></div>
    <div class="st"><div class="st-n">${approvedS}</div><div class="st-l">已批准學員</div></div>
    <div class="st"><div class="st-n">${totalC}</div><div class="st-l">教練</div></div>
  </div>`;

  // 教練審核
  h += `<div class="sec-title"><span>教練審核</span><span class="sec-count">${apCoaches.length} 待審</span></div>`;
  h += pCoaches.length
    ? pCoaches.map(c => `
      <div class="card">
        <div class="card-left">
          <div class="card-name">${nm(c)}${mc(c)}</div>
          <div class="card-meta">電話：${c.phone||'—'} ｜ 資格：${c.rank||'—'} ｜ CFC：${c.cfc||'—'}</div>
        </div>
        <div class="acts">${bdg(c.status)}
          ${isReadonly ? '' : `<button class="btn btn-ok" onclick="approveCoach('${c.id}')">批准</button>
          <button class="btn btn-no" onclick="rejectCoach('${c.id}')">拒絕</button>`}
        </div>
      </div>`).join('')
    : `<div class="empty" style="padding:24px"><div class="empty-icon">✓</div><div class="empty-text">${apCoaches.length?'無符合搜尋的結果':'無待審核教練'}</div></div>`;

  // 學員審核
  h += `<div class="sec-title"><span>學員審核</span><span class="sec-count">${apStudents.length} 待審</span></div>`;
  if (!isReadonly && apStudents.length > 1) h += `<div style="margin-bottom:10px"><button class="btn-batch btn-batch-ok" onclick="approveAllStudents()">全部批准學員（${apStudents.length}）</button></div>`;
  h += pStudents.length
    ? pStudents.map(s => `
      <div class="card">
        <div class="card-left">
          <div class="card-name">${nm(s)}${mc(s)}</div>
          <div class="card-meta">電話：${s.phone||'—'} ｜ 組別：${s.group_name||'—'} ｜ 匯款末5碼：${s.transfer_code||'—'}${sp(s)?' ｜ 上線：'+sp(s):''}</div>
          ${s.name_list?`<div class="card-meta">名單：${nl(s.name_list)}</div>`:''}
          ${s.introduction?`<div class="card-meta">自我定位：${s.introduction}</div>`:''}
        </div>
        <div class="acts">${bdg(s.status)}
          ${isReadonly ? '' : `<button class="btn btn-ok" onclick="approveStudent('${s.id}')">批准</button>
          <button class="btn btn-no" onclick="rejectStudent('${s.id}')">拒絕</button>`}
        </div>
      </div>`).join('')
    : `<div class="empty" style="padding:24px"><div class="empty-icon">✓</div><div class="empty-text">${apStudents.length?'無符合搜尋的結果':'無待審核學員'}</div></div>`;

  // ── 已批准名冊（原名冊 Tab 併入）──
  h += renderRosterSection();

  document.getElementById('reviewArea').innerHTML = h;
}

let rosterSearch = '', rosterFilter = 'all';

function renderRosterSection() {
  const ac = approvedCoaches();
  let sList = students.filter(s => s.status === 'approved');
  if (rosterFilter === 'no-coach') sList = sList.filter(s => !s.coach_id);
  if (rosterFilter === 'no-phone') sList = sList.filter(s => !s.phone);
  let cList = ac;
  if (rosterSearch) {
    const t = rosterSearch.toLowerCase();
    sList = sList.filter(s => (nm(s)+mc(s)+(s.phone||'')+(s.group_name||'')).toLowerCase().includes(t));
    cList = cList.filter(c => (nm(c)+mc(c)+(c.phone||'')+(c.rank||'')).toLowerCase().includes(t));
  }
  if (rosterFilter === 'no-phone') cList = cList.filter(c => !c.phone);
  const totalS = students.filter(s => s.status === 'approved').length;

  let h = `<div class="sec-title" style="margin-top:28px;padding-top:20px;border-top:2px solid var(--gold-bd)"><span>📋 已批准名冊</span><span class="sec-count">${totalS} 學員 / ${ac.length} 教練</span></div>`;


  if (rosterFilter !== 'no-coach') {
    h += `<div class="sec-title"><span>教練</span><span class="sec-count">${cList.length} 人</span></div>`;
    if (cList.length) {
      cList.sort((a,b) => {
        const ga = a.group_name || '', gb = b.group_name || '';
        const ia = GROUPS.indexOf(ga), ib = GROUPS.indexOf(gb);
        const gi = (ia===-1?99:ia) - (ib===-1?99:ib);
        return gi !== 0 ? gi : nm(a).localeCompare(nm(b),'zh-TW');
      });
      cList.forEach(c => {
        h += `
        <div class="roster-card" id="rc-c-${c.id}">
          <div class="roster-top">
            <div>
              <div class="card-name">${nm(c)}${mc(c)}</div>
              <div class="roster-info">電話：${c.phone||'—'} ｜ 資格：${c.rank||'—'} ｜ CFC：${c.cfc||'—'}</div>
              <div class="roster-info" style="margin-top:4px;display:flex;align-items:center;gap:6px"><span>組別：</span>${isReadonly
                ? `<span style="font-size:12px">${c.group_name||'未分組'}</span>`
                : `<select class="reassign-sel" style="font-size:12px;padding:3px 8px;text-align:left" onchange="setCoachGroup('${c.id}',this.value)"><option value="">未分組</option>${GROUPS.map(g => `<option value="${g}"${c.group_name===g?' selected':''}>${g}</option>`).join('')}</select>`}<span>｜ 學員 ${pairedStudents(c.id).length} 名</span></div>
            </div>
            ${isReadonly ? '' : `<div style="display:flex;gap:6px">
              <button class="btn-edit" onclick="showEditCoach('${c.id}')">編輯</button>
              <button class="btn-edit" style="background:rgba(220,38,38,.15);color:#f87171" onclick="deleteCoach('${c.id}','${nm(c).replace(/'/g,"\\'")}')">刪除</button>
            </div>`}
          </div>
          <div id="edit-c-${c.id}"></div>
        </div>`;
      });
    } else {
      h += `<div class="empty" style="padding:20px"><div class="empty-text">無符合條件的教練</div></div>`;
    }
  }

  h += `<div class="sec-title"><span>學員</span><span class="sec-count">${sList.length} / ${totalS} 人</span></div>`;
  if (sList.length) {
    sList.forEach(s => {
      const coachObj = s.coach_id ? coaches.find(c => c.id === s.coach_id) : null;
      const coachName = coachObj ? nm(coachObj) : '未配對';
      const hasList = s.name_list && (Array.isArray(s.name_list) ? s.name_list.length > 0 : String(s.name_list).trim());
      const hasIntro = s.introduction && String(s.introduction).trim();
      h += `
      <div class="roster-card" id="rc-${s.id}">
        <div class="roster-top">
          <div>
            <div class="card-name">${nm(s)}${mc(s)}</div>
            <div class="roster-info">電話：${s.phone||'—'} ｜ 組別：${s.group_name||'—'} ｜ 教練：${coachName}</div>
            <div class="roster-checks">
              <span class="roster-check" onclick="showDetail('${s.id}','name_list')"><span class="${hasList?'has':'no'}">${hasList?'✓':'✗'}</span> 名單</span>
              <span class="roster-check" onclick="showDetail('${s.id}','introduction')"><span class="${hasIntro?'has':'no'}">${hasIntro?'✓':'✗'}</span> 自我定位</span>
            </div>
          </div>
          ${isReadonly ? '' : `<div style="display:flex;gap:6px">
            <button class="btn-edit" onclick="showEdit('${s.id}')">編輯</button>
            <button class="btn-edit" style="background:rgba(220,38,38,.15);color:#f87171" onclick="deleteStudent('${s.id}','${nm(s).replace(/'/g,"\\'")}')">刪除</button>
          </div>`}
        </div>
        <div id="edit-${s.id}"></div>
      </div>`;
    });
  } else {
    h += `<div class="empty" style="padding:20px"><div class="empty-text">無符合條件的學員</div></div>`;
  }
  return h;
}

function showEditCoach(cid) {
  const c = coaches.find(x => x.id === cid);
  if (!c) return;
  const el = document.getElementById('edit-c-' + cid);
  const rankOpts = RANK_OPTIONS.map(r => `<option value="${r}"${c.rank===r?' selected':''}>${r}</option>`).join('');
  const cfcOpts = CFC_OPTIONS.map(f => `<option value="${f}"${c.cfc===f?' selected':''}>${f}</option>`).join('');
  el.innerHTML = `<div class="edit-row">
    <div class="edit-field"><label>電話</label><input id="ec-phone-${cid}" value="${c.phone||''}"></div>
    <div class="edit-field"><label>資格</label><select id="ec-rank-${cid}" style="background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;font-family:inherit"><option value="">—</option>${rankOpts}</select></div>
    <div class="edit-field"><label>CFC</label><select id="ec-cfc-${cid}" style="background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;font-family:inherit"><option value="">—</option>${cfcOpts}</select></div>
    <button class="btn-save" onclick="saveEditCoach('${cid}')">儲存</button>
    <button class="btn-cancel" onclick="renderReview()">取消</button>
  </div>`;
}

async function saveEditCoach(cid) {
  const phone = document.getElementById('ec-phone-' + cid).value.trim();
  const rank = document.getElementById('ec-rank-' + cid).value.trim();
  const cfc = document.getElementById('ec-cfc-' + cid).value.trim();
  const { error } = await sb.from('batch_coaches').update({ phone, rank, cfc }).eq('id', cid);
  if (error) return alert('儲存失敗：' + error.message);
  toast('教練資料已更新'); await load();
}


async function deleteCoach(cid, cname) {
  if (!confirm(`確認刪除教練「${cname}」？\n（不會刪除會員資料，只移除教練身份）`)) return;
  const { error } = await sb.from('batch_coaches').delete().eq('id', cid);
  if (error) return alert('刪除失敗：' + error.message);
  toast('教練已刪除'); await load();
}

async function deleteStudent(sid, sname) {
  if (!confirm(`確認刪除學員「${sname}」？\n（只移除學員資格，會員資料不受影響，對方可重新登入報名）`)) return;
  const { error } = await sb.from('batch_students').delete().eq('id', sid);
  if (error) return alert('刪除失敗：' + error.message);
  toast('學員已刪除'); await load();
}

function showEdit(sid) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const el = document.getElementById('edit-' + sid);
  el.innerHTML = `<div class="edit-row">
    <div class="edit-field"><label>電話</label><input id="ef-phone-${sid}" value="${s.phone||''}"></div>
    <div class="edit-field"><label>組別</label><input id="ef-group-${sid}" value="${s.group_name||''}"></div>
    <button class="btn-save" onclick="saveEdit('${sid}')">儲存</button>
    <button class="btn-cancel" onclick="renderReview()">取消</button>
  </div>`;
}

async function saveEdit(sid) {
  const phone = document.getElementById('ef-phone-' + sid).value.trim();
  const group_name = document.getElementById('ef-group-' + sid).value.trim();
  const { error } = await sb.from('batch_students').update({ phone, group_name }).eq('id', sid);
  if (error) return alert('儲存失敗：' + error.message);
  toast('資料已更新'); await load();
}

function showDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const title = field === 'name_list' ? '名單' : '自我定位';
  let content = '';
  if (field === 'name_list') {
    const v = s.name_list;
    content = !v ? '（無資料）' : Array.isArray(v) ? v.join('、') : String(v);
  } else {
    content = s.introduction || '（無資料）';
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal-box">
    <div class="modal-title">${nm(s)} — ${title}</div>
    <div class="modal-body" id="modal-content-${sid}">${content.replace(/</g,'&lt;')}</div>
    <div id="modal-actions-${sid}">
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">關閉</button>
      ${isReadonly ? '' : `<button class="modal-edit-btn" onclick="editDetail('${sid}','${field}')">編輯</button>`}
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function editDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const contentEl = document.getElementById('modal-content-' + sid);
  const actionsEl = document.getElementById('modal-actions-' + sid);
  let val = '';
  if (field === 'name_list') {
    const v = s.name_list;
    val = !v ? '' : Array.isArray(v) ? v.join('\n') : String(v);
  } else {
    val = s.introduction || '';
  }
  const hint = field === 'name_list' ? '一行一個名字' : '';
  contentEl.innerHTML = `<textarea class="modal-textarea" id="modal-edit-val-${sid}">${val.replace(/</g,'&lt;')}</textarea>${hint ? '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+hint+'</div>' : ''}`;
  actionsEl.innerHTML = `<button class="modal-save-btn" onclick="saveDetail('${sid}','${field}')">儲存</button><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">取消</button>`;
}

async function saveDetail(sid, field) {
  const val = document.getElementById('modal-edit-val-' + sid).value.trim();
  let update = {};
  if (field === 'name_list') {
    update.name_list = val ? val.split('\n').map(s => s.trim()).filter(Boolean) : [];
  } else {
    update.introduction = val;
  }
  const { error } = await sb.from('batch_students').update(update).eq('id', sid);
  if (error) return alert('儲存失敗：' + error.message);
  document.querySelector('.modal-overlay')?.remove();
  toast('已更新'); await load();
}

// Tab 3: 教練組織（sponsor_id 歸類）

function renderOrg() {
  const ac = approvedCoaches();
  if (!ac.length) {
    document.getElementById('orgArea').innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">此班次尚無已批准教練</div></div>';
    return;
  }
  const noSponsor = students.filter(s => !s.sponsor_id && s.status === 'approved');

  let h = `<div class="toolbar"><input class="search-box" placeholder="搜尋教練或學員…" oninput="filterOrg(this.value)"></div>`;
  h += ac.map(c => {
    const myStu = sponsorStudents(c.id);
    const cnt = myStu.length;
    return `
    <div class="coach-card org-card" data-orgnames="${nm(c)} ${myStu.map(s=>nm(s)).join(' ')}">
      <div class="coach-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="card-left">
          <div class="card-name">${nm(c)}${mc(c)}</div>
          <div class="card-meta">電話：${c.phone||'—'} ｜ 資格：${c.rank||'—'} ｜ CFC：${c.cfc||'—'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="coach-count${cnt?'':' zero'}">${cnt} 名學員</span>
          <span class="coach-arrow">▼</span>
        </div>
      </div>
      <div class="coach-body">
        ${cnt ? myStu.map(s => `
          <div class="coach-stu"><div>
            <span class="coach-stu-name">${nm(s)}${mc(s)}</span>
            <span class="coach-stu-meta"> ｜ ${s.group_name||'—'} ｜ ${s.phone||'—'}</span>
          </div><div id="reassign-${s.id}">${reassignBtn(s)}</div></div>`).join('')
        : '<div class="coach-empty">尚無報名學員</div>'}
      </div>
    </div>`;

function renderPairing() {
  const ac = approvedCoaches();
  // 教練 member_id 集合，用於過濾身兼學員的教練
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const realStudents = students.filter(s => s.status === 'approved' && !coachMemberIds.has(s.member_id));
  const unpaired = realStudents.filter(s => !s.coach_id);
  const paired   = realStudents.filter(s => s.coach_id);
  selS = null; selC = null;

  let h = '';

  // ── 已配對（按組別排序）── 放最上面
  if (paired.length) {
    const pairGroups = {};
    paired.forEach(s => {
      const cid = s.coach_id;
      if (!pairGroups[cid]) pairGroups[cid] = { coach: coaches.find(c => c.id === cid), students: [] };
      pairGroups[cid].students.push(s);
    });
    const sortedGroups = Object.values(pairGroups).sort((a, b) => {
      const ga = a.coach?.group_name || '';
      const gb = b.coach?.group_name || '';
      const ia = GROUPS.indexOf(ga);
      const ib = GROUPS.indexOf(gb);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    h += `<div class="paired-section"><h3 style="cursor:pointer" onclick="var b=document.getElementById('pairedGroups');b.style.display=b.style.display==='none'?'':'none';this.querySelector('.coach-arrow').classList.toggle('open')">
        <span>已配對（${paired.length}）<span class="coach-arrow" style="font-size:12px;color:var(--muted);transition:transform .2s;display:inline-block">▼</span></span>
        <input class="paired-search" placeholder="搜尋學員或教練…" oninput="event.stopPropagation();filterPaired(this.value)">
      </h3><div id="pairedGroups" style="display:none">
      ${sortedGroups.map(g => {
        const cN = g.coach ? nm(g.coach) : '（未知）';
        const cC = g.coach ? mc(g.coach) : '';
        const grp = g.coach?.group_name || '未分組';
        return `
        <div class="coach-card paired-card" data-pnames="${cN} ${g.students.map(s=>nm(s)).join(' ')}">
          <div class="coach-header" onclick="this.parentElement.classList.toggle('open')">
            <div><span class="card-name">${cN}${cC}</span><span style="color:var(--gold);font-size:12px;margin-left:6px">${grp}</span></div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="coach-count">${g.students.length} 名</span>
              <span class="coach-arrow">▼</span>
            </div>
          </div>
          <div class="coach-body">
            ${g.students.map(s => `
            <div class="coach-stu">
              <div><span class="coach-stu-name">${nm(s)}${mc(s)}</span>
              <span class="coach-stu-meta"> ｜ ${s.group_name||'—'} ｜ ${s.phone||'—'}</span></div>
              ${isReadonly ? '' : `<button class="btn-unpair" onclick="unpair('${s.id}','${nm(s)}')">解除</button>`}
            </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
      </div></div>`;
  }

  // ── 待配對 ──
  if (!isReadonly) {
    h += `<div class="sec-title" style="margin-top:24px"><span>配對操作</span></div>`;
    if (unpaired.length) {
      h += `<div class="pair-grid">
        <div class="pair-col">
          <h3>待配對學員（${unpaired.length}）</h3>
          ${unpaired.map(s => `
            <div class="pick" data-sid="${s.id}" onclick="pickS('${s.id}')">
              <div class="pick-name">${nm(s)}</div>
              <div class="pick-meta">${s.group_name||'—'} ｜ ${s.phone||'—'}${sp(s)?' ｜ 上線：'+sp(s):''}</div>
            </div>`).join('')}
        </div>
        <div class="pair-col">
          <h3>教練（${ac.length}）</h3>
          ${ac.map(c => `
            <div class="pick" data-cid="${c.id}" onclick="pickC('${c.id}')">
              <div class="pick-name">${nm(c)}${c.group_name?' <span style="color:var(--muted);font-size:11px">'+c.group_name+'</span>':''}</div>
              <div class="pick-meta">${c.rank||'—'} ｜ 目前 ${pairedStudents(c.id).length} 名</div>
            </div>`).join('')}
          <button class="btn-pair" id="btnPair" disabled onclick="doPair()">請選擇學員和教練</button>
        </div>
      </div>`;
    } else {
      h += `<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">${realStudents.length?'所有學員皆已配對':'無待配對學員'}</div></div>`;
    }
  }

  // 教練組別已移至審核名冊的教練卡片
  document.getElementById('pairArea').innerHTML = h;
}

function filterPaired(t) {
  t = t.toLowerCase();
  document.querySelectorAll('.paired-card').forEach(el => {
    el.style.display = (el.dataset.pnames||'').toLowerCase().includes(t) ? '' : 'none';
  });
}

function pickS(id) { selS = id; document.querySelectorAll('[data-sid]').forEach(e => e.classList.toggle('sel', e.dataset.sid===id)); updBtn(); }

function renderBonus() {
  const today = localDateStr(new Date());
  const actionOpts = Object.entries(ACTION_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');

  let h = '';
  if (!isReadonly) {
    h += `<div class="bonus-form">
      <div class="sec-title" style="margin-top:0"><span>新增加權規則</span></div>
      <div class="bonus-row">
        <div class="bonus-field"><label>項目</label><select id="br_action">${actionOpts}</select></div>
        <div class="bonus-field"><label>倍率</label><input id="br_multi" type="number" min="1.5" max="10" step="0.5" value="2" style="width:70px"></div>
        <div class="bonus-field"><label>開始日期</label><input id="br_start" type="date"></div>
        <div class="bonus-field"><label>結束日期</label><input id="br_end" type="date"></div>
        <button class="btn-add-bonus" onclick="addBonus()">新增</button>
      </div>
    </div>`;
  }

  h += `<div class="sec-title"><span>目前規則</span><span class="sec-count">${bonusRules.length} 筆</span></div>`;
  if (bonusRules.length) {
    h += `<table class="bonus-table"><thead><tr><th>項目</th><th>倍率</th><th>期間</th><th>狀態</th>${isReadonly ? '' : '<th></th>'}</tr></thead><tbody>`;
    bonusRules.forEach(r => {
      let st, cls;
      if (today > r.end_date) { st = '已結束'; cls = 'bonus-expired'; }
      else if (today < r.start_date) { st = '未開始'; cls = 'bonus-upcoming'; }
      else { st = '生效中'; cls = 'bonus-active'; }
      h += `<tr>
        <td>${ACTION_LABELS[r.action_field]||r.action_field}</td>
        <td style="color:var(--gold);font-weight:600">×${r.multiplier}</td>
        <td>${r.start_date} ~ ${r.end_date}</td>
        <td><span class="${cls}">${st}</span></td>
        ${isReadonly ? '' : `<td><button class="btn btn-no" onclick="delBonus(${r.id})">刪除</button></td>`}
      </tr>`;
    });
    h += `</tbody></table>`;
  } else {
    h += `<div class="empty"><div class="empty-icon">⚡</div><div class="empty-text">尚無加權規則</div></div>`;
  }
  document.getElementById('bonusArea').innerHTML = h;
}

async function addBonus() {
  const action = document.getElementById('br_action').value;
  const multiplier = parseFloat(document.getElementById('br_multi').value);
  const start_date = document.getElementById('br_start').value;
  const end_date = document.getElementById('br_end').value;
  if (!start_date || !end_date) return alert('請選擇起訖日期');
  if (end_date < start_date) return alert('結束日期不可早於開始日期');
  if (isNaN(multiplier) || multiplier < 1) return alert('倍率至少為 1');
  const { error } = await sb.from('bonus_rules').insert({ batch_id: bid, action_field: action, multiplier, start_date, end_date });
  if (error) return alert('新增失敗：' + error.message);
  toast('加權規則已新增'); await load();
}

async function delBonus(id) {
  if (!confirm('確認刪除此加權規則？')) return;
  const { error } = await sb.from('bonus_rules').delete().eq('id', id);
  if (error) return alert('刪除失敗：' + error.message);
  toast('加權規則已刪除'); await load();
}

        }</td>
      </tr>`;
    });

const ALL_TABS = [

    </select></div>
    <button class="btn-add-bonus" onclick="addAdmin()">新增</button>
  </div>`;

  h += `<div class="sec-title"><span>管理員清單</span><span class="sec-count">${adminUsers.length} 人</span></div>`;

  if (!adminUsers.length) {
    h += `<div class="empty"><div class="empty-icon">🔐</div><div class="empty-text">尚無管理員</div></div>`;
  } else {
    adminUsers.forEach(a => {
      const tabs = a.allowed_tabs || [];
      h += `<div class="perm-card">
        <div>
          <div class="card-name">${a.members_master?.name||'（未知）'}${a.members_master?.member_code ? '（'+a.members_master.member_code+'）' : ''}</div>
          <div class="perm-tags">
            ${ALL_TABS.map(t => `<span class="perm-tag ${tabs.includes(t.key)?'':'off'}" style="cursor:pointer" onclick="toggleTab(${a.id},'${t.key}',${!tabs.includes(t.key)})">${t.label}</span>`).join('')}

async function addAdmin() {
  const memberId = document.getElementById('perm-member').value;
  if (!memberId) return alert('請選擇教練');
  const existing = adminUsers.find(a => a.member_id === memberId);
  if (existing) return alert('此人已是管理員');
  const allKeys = ALL_TABS.map(t => t.key);
  const { error } = await sb.from('admin_users').insert({ member_id: memberId, allowed_tabs: allKeys });
  if (error) return alert('新增失敗：' + error.message);
  toast('管理員已新增'); await load();
}

async function toggleTab(adminId, tabKey, enable) {
  const admin = adminUsers.find(a => a.id === adminId);
  if (!admin) return;
  let tabs = [...(admin.allowed_tabs || [])];
  if (enable && !tabs.includes(tabKey)) tabs.push(tabKey);
  if (!enable) tabs = tabs.filter(t => t !== tabKey);
  const { error } = await sb.from('admin_users').update({ allowed_tabs: tabs }).eq('id', adminId);
  if (error) return alert('更新失敗：' + error.message);
  toast('權限已更新'); await load();
}

async function removeAdmin(adminId) {
  if (!confirm('確認移除此管理員？')) return;
  const { error } = await sb.from('admin_users').delete().eq('id', adminId);
  if (error) return alert('移除失敗：' + error.message);
  toast('管理員已移除'); await load();
}


init();

// 🔴 版本標記（2026-08-21）：有人回報「看不到新功能」時第一件事就是看這裡。
//    document.lastModified 反映**實際載入到那台裝置的版本**，不是伺服器上的——快取沒更新一眼看得出來。
(function () {
  const el = document.getElementById('verTag');
  if (!el) return;
  const d = new Date(document.lastModified), p = n => String(n).padStart(2, '0');
  el.textContent = `版本 ${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
})();
</script>
