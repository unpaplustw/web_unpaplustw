<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實戰班主系統管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="units.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  :root {
    --navy:#0a0e27; --navy2:#131836; --navy3:#1c2347;
    --gold:#d4af37; --gold-lt:rgba(212,175,55,.15); --gold-bd:rgba(212,175,55,.25);
    --white:#e8e8e8; --muted:#8a8fa8;
    --green:#4caf82; --green-bg:rgba(76,175,130,.15);
    --red:#e05c5c; --red-bg:rgba(224,92,92,.15);
    --yellow:#f0c040; --yellow-bg:rgba(240,192,64,.15);
    --blue:#5b8def; --blue-bg:rgba(91,141,239,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;padding:16px}
  .wrap{max-width:1000px;margin:0 auto}

  .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;margin-bottom:16px}
  .hd h1{font-size:20px;font-weight:700;color:var(--gold)}
  .hd-right{display:flex;align-items:center;gap:10px}
  .hd select{background:var(--navy3);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:500}
  .btn-ref{background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-ref:hover{background:var(--gold-bd)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .st{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;padding:14px;text-align:center}
  .st-n{font-size:28px;font-weight:700;color:var(--gold)}
  .st-l{font-size:12px;color:var(--muted);margin-top:4px}

  .tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--gold-bd)}
  .tab{background:none;border:none;color:var(--muted);padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:.2s}
  .tab:hover{color:var(--gold)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .panel{display:none}.panel.on{display:block}

  .sec-title{font-size:15px;font-weight:600;color:var(--gold);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--gold-bd);display:flex;justify-content:space-between;align-items:center}
  .sec-title:first-child{margin-top:0}
  .sec-count{font-size:12px;font-weight:400;color:var(--muted)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .search-box{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 12px;color:var(--white);font-size:13px;font-family:inherit;width:220px;transition:.2s}
  .search-box:focus{outline:none;border-color:var(--gold-bd)}
  .search-box::placeholder{color:var(--muted)}
  .toolbar-acts{display:flex;gap:8px;align-items:center}
  .btn-batch{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid;font-family:inherit;transition:.2s}
  .btn-batch-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-batch-ok:hover{background:rgba(76,175,130,.3)}
  .btn-csv{background:var(--blue-bg);color:var(--blue);border-color:rgba(91,141,239,.3)}
  .btn-csv:hover{background:rgba(91,141,239,.3)}

  .card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .card:hover{border-color:var(--gold-bd)}
  .card-left{flex:1;min-width:0}
  .card-name{font-size:15px;font-weight:500}
  .card-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}

  .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500}
  .b-pending{background:var(--yellow-bg);color:var(--yellow)}
  .b-approved{background:var(--green-bg);color:var(--green)}
  .b-rejected{background:var(--red-bg);color:var(--red)}

  .acts{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .btn{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:.2s}
  .btn-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-ok:hover{background:rgba(76,175,130,.3)}
  .btn-no{background:var(--red-bg);color:var(--red);border-color:rgba(224,92,92,.3)}
  .btn-no:hover{background:rgba(224,92,92,.3)}

  .coach-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:10px;transition:.2s;overflow:hidden}
  .coach-card:hover{border-color:var(--gold-bd)}
  .coach-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .coach-arrow{color:var(--muted);font-size:12px;transition:transform .2s;margin-left:8px}
  .coach-card.open .coach-arrow{transform:rotate(180deg)}
  .coach-count{background:var(--gold-lt);color:var(--gold);padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600}
  .coach-count.zero{background:rgba(138,143,168,.12);color:var(--muted)}
  .coach-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .coach-card.open .coach-body{max-height:800px}
  .coach-stu{padding:8px 16px 8px 32px;border-top:1px solid rgba(255,255,255,.04);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .coach-stu-name{color:var(--white)}
  .coach-stu-meta{color:var(--muted);font-size:11px}
  .coach-empty{padding:12px 32px;color:var(--muted);font-size:12px;font-style:italic}
  .btn-reassign{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-reassign:hover{background:rgba(91,141,239,.3)}
  .reassign-sel{background:var(--navy3);border:1px solid var(--gold-bd);border-radius:6px;padding:4px 8px;color:var(--white);font-size:12px;font-family:inherit;margin-right:6px}

  .pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pair-col h3{font-size:14px;color:var(--gold);margin-bottom:10px}
  .pick{padding:10px 12px;margin-bottom:6px;background:var(--navy3);border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.2s}
  .pick:hover{border-color:rgba(212,175,55,.3)}
  .pick.sel{border-color:var(--gold);background:var(--gold-lt)}
  .pick-name{font-size:14px;font-weight:500}
  .pick-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .btn-pair{width:100%;margin-top:12px;padding:10px;background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-pair:hover:not(:disabled){background:var(--gold-bd)}
  .btn-pair:disabled{opacity:.4;cursor:not-allowed}

  .paired-section{margin-top:20px}
  .paired-section h3{font-size:14px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .paired-search{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 10px;color:var(--white);font-size:12px;font-family:inherit;width:180px}
  .paired-search:focus{outline:none;border-color:var(--gold-bd)}
  .paired-search::placeholder{color:var(--muted)}
  .btn-unpair{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unpair:hover{background:rgba(224,92,92,.3)}

  .empty{text-align:center;padding:48px 16px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .empty-text{font-size:14px}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy2);border:1px solid var(--gold-bd);color:var(--gold);padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:999;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .roster-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:.2s}
  .roster-card:hover{border-color:var(--gold-bd)}
  .roster-top{display:flex;justify-content:space-between;align-items:center}
  .roster-info{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  .roster-checks{display:flex;gap:12px;margin-top:6px}
  .roster-check{font-size:12px;cursor:pointer;padding:2px 8px;border-radius:4px;transition:.2s}
  .roster-check:hover{background:var(--navy3)}
  .roster-check .has{color:var(--green)}
  .roster-check .no{color:var(--muted)}
  .btn-edit{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-edit:hover{background:rgba(91,141,239,.3)}
  .edit-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
  .edit-field{display:flex;flex-direction:column;gap:3px}
  .edit-field label{font-size:11px;color:var(--muted)}
  .edit-field input{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;font-family:inherit;width:140px}
  .edit-field input:focus{outline:none;border-color:var(--gold-bd)}
  .btn-save{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-save:hover{background:rgba(76,175,130,.3)}
  .btn-cancel{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(138,143,168,.3);background:transparent;color:var(--muted);font-family:inherit;transition:.2s}
  .btn-cancel:hover{background:rgba(138,143,168,.1)}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:998;display:flex;align-items:center;justify-content:center}
  .modal-box{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto}
  .modal-title{font-size:15px;font-weight:600;color:var(--gold);margin-bottom:12px}
  .modal-body{font-size:13px;color:var(--white);line-height:1.8;white-space:pre-wrap}
  .modal-close{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;margin-right:8px}
  .modal-edit-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit}
  .modal-save-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;margin-right:8px}
  .modal-textarea{width:100%;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;color:var(--white);font-size:13px;font-family:inherit;line-height:1.8;resize:vertical;min-height:150px}
  .modal-textarea:focus{outline:none;border-color:var(--gold-bd)}

  .bonus-form{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:10px;padding:16px;margin-bottom:16px}
  .bonus-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .bonus-field{display:flex;flex-direction:column;gap:4px}
  .bonus-field label{font-size:11px;color:var(--muted)}
  .bonus-field select,.bonus-field input{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;color:var(--white);font-size:13px;font-family:inherit}
  .bonus-field select:focus,.bonus-field input:focus{outline:none;border-color:var(--gold-bd)}
  .btn-add-bonus{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;transition:.2s;align-self:end}
  .btn-add-bonus:hover{background:var(--gold-bd)}
  .bonus-table{width:100%;border-collapse:collapse;margin-top:4px}
  .bonus-table th{text-align:center;font-size:14px;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--gold-bd)}
  .bonus-table td{font-size:15px;padding:12px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
  .bonus-active{color:var(--green)}
  .bonus-expired{color:var(--muted)}
  .bonus-upcoming{color:var(--yellow)}

  .fin-table{width:100%;border-collapse:collapse}
  .fin-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--gold-bd)}
  .fin-table td{font-size:13px;padding:10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
  .fin-confirmed{color:var(--green);font-weight:600}
  .fin-pending{color:var(--yellow)}
  .btn-confirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-confirm:hover{background:rgba(76,175,130,.3)}
  .btn-unconfirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unconfirm:hover{background:rgba(224,92,92,.3)}

  .perm-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .perm-card:hover{border-color:var(--gold-bd)}
  .perm-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .perm-tag{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--gold-lt);color:var(--gold)}
  .perm-tag.off{background:rgba(138,143,168,.1);color:var(--muted);text-decoration:line-through}
  .perm-add-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
  .perm-add-row select{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;color:var(--white);font-size:13px;font-family:inherit}

  /* ── 追蹤分析 ── */
  .track-row{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--muted);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .track-red{border-left-color:var(--red)}
  .track-orange{border-left-color:var(--yellow)}
  .track-blue{border-left-color:var(--blue)}
  .track-black{border-left-color:#555}
  .track-name{font-size:14px;font-weight:600;color:var(--white)}
  .track-mid{font-size:12px;color:var(--muted)}
  .track-tag{font-size:12px;font-weight:600;color:var(--gold);margin-left:auto}
  .track-sub{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:4px}
  .track-chips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .track-chip{font-size:12px;color:var(--white);background:var(--navy3);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 9px}
  /* 記點（2026-08-17）：全部用算的，不存欄位；退不退班人工決定 */
  .dm-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
  .dm-tbl th{text-align:right;padding:7px 6px;font-size:11px;color:var(--muted);font-weight:400;border-bottom:1px solid rgba(255,255,255,.08)}
  .dm-tbl th:first-child{text-align:left}
  .dm-tbl td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);color:var(--white)}
  .dm-tbl td:first-child{text-align:left;font-weight:600}
  .dm-tbl td .c{color:var(--muted);font-weight:400;font-size:11px;margin-left:5px}
  .dm-pt{font-weight:700;font-size:15px}
  .dm-0{color:#4ade80} .dm-1{color:#fbbf24} .dm-3{color:#f87171}
  .dm-pend{color:var(--muted);font-weight:400;font-size:11.5px}
  .dm-made{display:inline-block;min-width:22px;padding:2px 7px;border-radius:5px;background:var(--green-bg);color:var(--green);font-weight:700;font-size:12px}
  .dm-none{color:var(--muted);font-size:12px}
  /* 寬限期內的點數要看得見才有嚇阻力——原本是小灰字，等於白做 */
  .dm-will{color:var(--yellow);font-weight:700;font-size:13px}
  /* 階段列／子區塊列（2026-08-17 重整） */
  .sub-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .sub-tab{padding:9px 16px;border-radius:20px;border:1px solid var(--gold-bd);background:var(--navy2);color:var(--muted);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .sub-tab.on{background:var(--gold-lt);color:var(--gold);border-color:var(--gold)}
  .ana-sec{border:1px solid var(--gold-bd);border-radius:14px;padding:14px 16px 18px;margin-bottom:18px;background:rgba(255,255,255,.015)}
  .ana-hd{font-size:16px;font-weight:700;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gold-bd);display:flex;justify-content:space-between;align-items:baseline}
  .ana-hd span{font-size:11.5px;font-weight:400;color:var(--muted)}
  .sub-anchor{padding:6px 14px;border-radius:18px;background:var(--navy2);border:1px solid rgba(255,255,255,.07);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .sub-anchor:hover{color:var(--gold);border-color:var(--gold-bd)}
  /* 開班前檢查清單 */
  .ck{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:10px;background:var(--navy2);border-left:3px solid var(--muted);margin-bottom:8px}
  .ck.ok{border-left-color:#22a05a} .ck.warn{border-left-color:#e0a020} .ck.bad{border-left-color:#d9534f}
  .ck-ico{font-size:17px;line-height:1.3;flex-shrink:0}
  .ck-b{flex:1}
  .ck-t{font-size:14px;font-weight:600;color:var(--white)}
  .ck-d{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:3px}
  .ck-d b{color:#f87171}
  .ck-sum{padding:14px 16px;border-radius:12px;font-size:14px;font-weight:700;margin-bottom:14px;text-align:center}
  .ck-sum.go{background:rgba(34,160,90,.14);color:#4ade80}
  .ck-sum.no{background:rgba(217,83,79,.14);color:#f87171}
  /* 作業矩陣（2026-08-14） */
  .hwm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hwm{border-collapse:separate;border-spacing:2px;font-size:11px}
  .hwm th{color:var(--muted);font-weight:400;padding:3px 2px;text-align:center;white-space:nowrap;font-size:10px;line-height:1.35}
  .hwm .hwm-u{color:var(--gold);font-size:8.5px}
  /* LINE 標記連動來的格子：綠底加白點，提醒還沒逐題檢核 */
  .hwm-c.soft{background:#1d8049;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
  .hwm th.nm,.hwm td.nm{text-align:left;position:sticky;left:0;background:var(--navy);z-index:1;padding-right:8px;white-space:nowrap}
  .hwm td.nm{color:var(--white);font-weight:600;font-size:12px}

<script>

// 「昨日」在星期一會指向星期日——那天不排作業、不要求 LINE，整頁會全 0。
// 日報一律看今天之前最近的平日（週一～週五）。行動班沒有「上課日」，所以函式名用平日。
function lastWeekday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  for (let i = 0; i < 7; i++) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) return localDateStr(d);
    d.setDate(d.getDate() - 1);
  }
  return localDateStr(d);
}
const WDAY = ['日','一','二','三','四','五','六'];

const refDayLabel = () => ((SCHEDULE || {})[lastWeekday()] || []).length ? '上一個上課日' : '上一個平日';
function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const ACTION_LABELS = { name_list:'狂列名單', meet:'認識新友', invite:'邀約見面', present:'溝通本說明', seminar:'邀請說明會', ghosted:'被放鴿子', rejected:'締結未果' };

const RANK_OPTIONS = ['成就','星鑽','高峰','CFC'];
const CFC_OPTIONS = ['顏麗玉、游天貴','李芊嬅','張隆熙','林甘霖、楊牧潔','蔡依儒、尤竣億','林姍嬅、凌翊迅','楊敬豪、林珊合'];

// ── Helpers ──
const nm = r => r.members_master?.name || '（未知）';
const mc = r => { const c = r.members_master?.member_code; return c ? `（${c}）` : ''; };
const sp = r => r.sponsor?.members_master?.name || '';
const nl = v => { if (!v) return ''; if (Array.isArray(v)) return v.join('、'); return String(v); };
const bdg = s => {
  const m = { pending:['b-pending','待審核'], approved:['b-approved','已批准'], rejected:['b-rejected','已拒絕'] };
  const [cls,txt] = m[s]||['',s]; return `<span class="badge ${cls}">${txt}</span>`;
};
const approvedCoaches = () => coaches.filter(c => c.status === 'approved');
const sponsorStudents = cid => students.filter(s => s.sponsor_id === cid && s.status === 'approved');
const pairedStudents  = cid => students.filter(s => s.coach_id === cid && s.status === 'approved');

function matchSearch(item) {
  if (!searchReview) return true;
  const t = searchReview.toLowerCase();
  return (nm(item)+mc(item)+(item.phone||'')).toLowerCase().includes(t);
}

// 🔴 2026-08-20：頂層 Tab 改 lazy render。
//    原本每次 load() 都把五個 Tab 全部渲染再用 CSS 藏起來——
//    實測 👥名冊 175KB／🎓教練 29KB，而它們是**開班前密集用、開班後幾乎不碰**的靜態資料，
//    你每天打開是要看分析，卻每次都陪著畫它們。
//    改成切到才畫：首次載入只畫「分析」一個 Tab。
const TAB_RENDER = {
  now:    () => renderNow(),
  roster: () => { renderReview(); renderPairing(); renderFinance(); renderRosterBar(); },
  coach:  () => renderOrg(),
  setup:  () => { renderSetup(); renderBonus(); },
  perm:   () => renderPerm(),
};
const tabPainted = new Set();
function paintTab(t) {
  if (tabPainted.has(t) || !TAB_RENDER[t]) return;
  TAB_RENDER[t]();
  tabPainted.add(t);
}
function render() {
  tabPainted.clear();                                   // 資料重載 → 已畫的都過期了
  const cur = document.querySelector('.tab.on');
  paintTab(cur ? cur.dataset.t : 'now');                // 只畫當前這一個
}

// 名冊頁的三段快速跳轉（審核／分組／繳費原本是三個 Tab）
function renderRosterBar() {
  const bar = document.getElementById('rosterBar');
  if (bar) bar.innerHTML = ['審核','分組配對','繳費'].map((t, i) =>
    `<a class="sub-anchor" onclick="document.querySelectorAll('#p-roster>div')[${i+1}].scrollIntoView({behavior:'smooth'})">${t}</a>`).join('');
}

// ⚙️ 設定：班期欄位一覽（唯讀顯示，改值仍走 Supabase；先讓人看得到全貌）
function renderSetup() {
  const b = allBatches.find(x => x.id === bid);
  const el = document.getElementById('setupArea');
  if (!el) return;
  if (!b) { el.innerHTML = '<div class="empty"><div class="empty-text">請先選擇班期</div></div>'; return; }
  const row = (k, v, note) => `<div class="ck ${v ? 'ok' : 'warn'}"><div class="ck-ico">${v ? '✅' : '🟡'}</div><div class="ck-b"><div class="ck-t">${k}　<span style="color:var(--gold)">${v || '（未設）'}</span></div>${note ? `<div class="ck-d">${note}</div>` : ''}</div></div>`;
  let h = phaseBefore();   // 開班前檢查清單：它檢查的就是「設定有沒有做完」，同一件事放同一頁
  h += `<div class="sec-title"><span>⚙️ 班期設定</span><span class="sec-count">${b.name}</span></div>`;
  h += row('期間', b.start_date && b.end_date ? `${b.start_date} ～ ${b.end_date}` : '', '倒數、週次、階段判定都看這個');
  h += row('學習週 study_start / study_end', b.study_start && b.study_end ? `${b.study_start} ～ ${b.study_end}` : '', '⚠️ 課表共四處副本，改這裡也要改 units.js／course.html／brochure.html');
  h += row('行動開放日 action_open_date', b.action_open_date, 'NULL＝不鎖，開班第一天就能填七大行動與小組回報心得');
  h += row('教練模式 coach_mode', b.coach_mode, 'simple＝信任制一鍵勾（27 期起）／full＝逐項審核（26 期）');
  h += row('獎勵活動 event_name', b.event_name, '留空＝無活動，相關 UI 自動隱藏');
  h += row('當期 is_active', b.is_active ? '🟢 是' : '否', '唯一索引擋雙開；學員端 8 個檔都讀它，班期中途不可切換');
  h += row('開放報名 registration_open', b.registration_open ? '🟢 開放中' : '關閉', '與 is_active 分開——可在前一期還在跑時就開放下一期報名');
  return el.innerHTML = h;
}

// ── 教練回報總覽（只在 simple 模式顯示；full 模式的 26 期沿用下方原有區塊）──
// 定義（2026-08-13 與 Randoph 定案）：教練要做兩件事——標「學員交了」＋標「自己回了」。
//   看了 ＝ homework 有值（true 或 false，代表教練有進來做判斷）／分母＝組員數 × 應標天數
//   交件 ＝ homework=true　　　　　　　　　　　　　　　／分母＝看了（沒看過的不算漏交）
//   已回 ＝ homework_replied=true　　　　　　　　　　　／分母＝交件（學員沒交，教練不可能回）
//   組員填報 ＝ 組員自己在 daily 填過的人數／組員數（唯一不經過教練的客觀資料）
// 應標天數＝開班日到今天的平日數（週六日不排作業，不該算漏標）。不綁 study_end，
// 因為未來啟動班／行動班會同時存在，用期間切換是錯的框架。
function renderCoachOverview(realStudents, logsByStu) {
  const batch = allBatches.find(b => b.id === bid);
  if (!batch || (batch.coach_mode || 'simple') !== 'simple') return '';

  const today = localDateStr(new Date());
  let markDays = 0;
  for (let d = new Date(batch.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) markDays++;
  }

  const stuByCoach = {};
  realStudents.forEach(s => { if (s.coach_id) (stuByCoach[s.coach_id] = stuByCoach[s.coach_id] || []).push(s); });

  const rows = coaches.filter(c => (stuByCoach[c.id] || []).length).map(c => {
    const stu = stuByCoach[c.id];
    const mine = engRows.filter(r => r.coach_id === c.id);
    const looked  = mine.filter(r => r.homework !== null && r.homework !== undefined).length;
    const handed  = mine.filter(r => r.homework === true).length;
    const replied = mine.filter(r => r.homework_replied === true).length;
    const filled  = stu.filter(s => (logsByStu[s.id] || []).length > 0).length;
    return { name: nm(c), n: stu.length, due: stu.length * markDays, looked, handed, replied, filled };
  });
  if (!rows.length) return '';
  rows.sort((a, b) => (b.looked / (b.due || 1)) - (a.looked / (a.due || 1)));

  const pct = (a, b) => b ? Math.round(a / b * 100) : null;
  const cls = p => p === null ? 'cov-d' : p >= 70 ? 'cov-g' : p >= 40 ? 'cov-y' : 'cov-r';
  const cell = (a, b) => {
    const p = pct(a, b);
    return `<td><span class="cov-pct ${cls(p)}">${p === null ? '—' : p + '%'}</span><br><span class="cov-sub">${a}/${b}</span></td>`;
  };

  const zero = rows.filter(r => r.looked === 0);
  let h = `<div class="sec-title"><span>📋 教練回報總覽</span><span class="sec-count">應標天數 ${markDays} 天（平日）</span></div>`;
  h += `<div class="cov-note">
    <b>看了</b>＝教練有進來判斷（分母：組員×應標天數）　<b>交件</b>＝看過的裡面學員真的交了（分母：看了）
    <b>已回</b>＝交了的裡面教練回了（分母：交件）<br>
    ⚠️ <b>「看了 0%」不代表學員沒交，代表教練沒進來標。</b>學員實際狀況看最右欄「組員填報」，那一欄不經過教練。
  </div>`;
  h += `<table class="cov-tbl"><tr><th>教練</th><th>看了</th><th>交件</th><th>已回</th><th>組員填報</th></tr>`;
  rows.forEach(r => {
    h += `<tr><td>${r.name}<br><span class="cov-sub">${r.n} 位組員</span></td>
      ${cell(r.looked, r.due)}${cell(r.handed, r.looked)}${cell(r.replied, r.handed)}
      <td><span class="cov-pct ${cls(pct(r.filled, r.n))}">${r.filled}/${r.n}</span><br><span class="cov-sub">有填過</span></td></tr>`;
  });
  h += `</table>`;
  if (zero.length) h += `<div class="cov-note" style="border-left-color:#f87171;margin-top:10px">
    🔴 <b>完全沒進來標記：${zero.map(r => r.name).join('、')}</b>
    這幾組的「交件」看不出來，但「組員填報」那欄仍然有效。</div>`;
  return h;
}

// ── 全班作業矩陣（2026-08-14）：資料來自教練在 coach-review「📋 作業」的檢核（homework_checks）
//   格子：全繳／部分／沒繳／未檢核（教練沒點過，不代表沒交）；未來單元空白
//   用途：記點退班（未交作業記 1 點）的依據；缺件排行讓管理者知道該催誰、該催哪位教練去檢核
// scope：'study'＝只看作業（有排單元的日子）／'action'＝只看行動（行動開放後的日子）
//   兩張表分開的理由是 Randoph 的閱讀動線，不是資料——同一天可能兩件事都要做（27 期 8/10～8/20 重疊），
//   所以同一天會同時出現在兩張表，各自只顯示自己那件事。
function renderHwMatrix(realStudents, coachById, scope) {
  if (typeof UNITS === 'undefined' || !realStudents.length) return '';
  const today = localDateStr(new Date());

  // ══════════════════════════════════════════════════════════
  // 一覽表改成「日期 × 學員」（2026-08-19 Randoph 定案）
  //   Randoph：「LINE 已回已繳就能連動到一覽表，而一覽表就能看出補交的概念，
  //   從一覽表點擊就一定是補交，這樣更並線邏輯思維。」
  //   橫軸用日期而不是單元，學習班行動班才共用同一張表：
  //   學習週的日期底下標單元號，行動週就只有日期。
  //
  //   🔴 連動用「顯示時推導」，不寫任何一筆 homework_checks。
  //      若教練標「已交」就自動寫成「全繳」，那筆假資料會蓋掉真相——
  //      學員可能缺兩題，缺件清單就再也抓不到題號。
  //      同一條原則：能推導的就不要儲存。
  //   優先序：逐題紀錄 > LINE 標記 > 逾期未做 > 期限內
  // ══════════════════════════════════════════════════════════
  const dayUnits = {};                       // 日期 → 該日單元陣列
  Object.entries(SCHEDULE || {}).forEach(([d, arr]) => { dayUnits[d] = arr.slice(); });

  const b = batchRow();
  const actStart0 = actionStartDate();
  // 🔴 行動「一覽表」的起點 ≠ 行動「計算」的起點（Randoph 2026-08-20）
  //    計算用 actionStartDate()（＝action_open_date 8/10）——四環節分母、記點都照舊，這裡不動。
  //    但一覽表要從**行動週**才列（study_end 隔天 8/21）：
  //    8/10～8/20 行動雖然開放了，學員的主任務仍是作業，列進行動表只會讓它難看且不公平。
  //    行動班沒有 study_end → 自動退回 actionStartDate()，同一條規則兩種班都對。
  const actViewFrom = (() => {
    if (!b.study_end) return actStart0;
    const d = new Date(b.study_end + 'T00:00:00'); d.setDate(d.getDate() + 1);
    return localDateStr(d);
  })();
  const days = [];                           // 開班日到今天的平日，再依 scope 過濾
  if (b.start_date)
    for (let d = new Date(b.start_date + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
      const w = d.getDay();
      if (w < 1 || w > 5) continue;
      const ds = localDateStr(d);
      if (scope === 'study'  && !(dayUnits[ds] || []).length) continue;   // 沒排單元的日子不進作業表
      if (scope === 'action' && actViewFrom && ds < actViewFrom) continue;  // 行動週之前不進行動表
      days.push(ds);
    }
  if (!days.length) return '';

  const hwBy  = {}; hwRows.forEach(r => hwBy[r.student_id + '|' + r.unit_no] = r);
  const engBy = {}; engRows.forEach(r => engBy[r.student_id + '|' + r.log_date] = r);
  const logBy = {}; allLogs.forEach(l => logBy[l.student_id + '|' + l.log_date] = l);

  // 該日的死線＝隔天 12:00（跟小組回報同一條線）
  const dayOverdue = ds => {
    const dl = new Date(ds + 'T12:00:00'); dl.setDate(dl.getDate() + 1);
    return new Date() > dl;
  };
  const actStart = actionStartDate();
  // full 模式（26 期那種）教練是勾 action_logs.confirmed，不是 coach_engagement；
  // 不分開判會把歷史班期的教練動作全部誤判成「沒做」
  const simpleMode = (batchRow().coach_mode || 'simple') === 'simple';

  // 一格的狀態：回傳 { k, txt, why }
  //   k: full / part / none / said（學員自述待查）/ nax（逾期未做）/ na（期限內）/ lock
  //
  //   🔴 兩條線交叉驗證（2026-08-19 Randoph：「LINE 群交和繳不應該只有一條」）
  //      學員說「我貼了」＝ action_logs.group_reported（全期唯一不經過教練的自述）
  //      教練說「他貼了」＝ coach_engagement.homework
  //      兩條都要看：只有學員說 → 不是紅叉，是「待教練查」，責任在教練。
  function cellOf(sid, ds) {
    const units = dayUnits[ds];
    const eng   = engBy[sid + '|' + ds];
    const log   = logBy[sid + '|' + ds];
    const said  = !!(log && log.group_reported);        // 學員自己勾了「我在小組回報了」
    const over  = dayOverdue(ds);

    if (scope !== 'action' && units && units.length) {
      // ① 逐題紀錄最優先（唯一能講出「缺第幾題」的來源）
      const recs = units.map(u => hwBy[sid + '|' + u]).filter(Boolean);
      if (recs.length === units.length) {
        const done = recs.reduce((a, r) => a + (r.done || 0), 0);
        const tot  = recs.reduce((a, r) => a + (r.total || 0), 0);
        if (tot > 0 && done >= tot) return { k:'full', txt:'✓', why:'逐題檢核：全繳' };
        if (done > 0) return { k:'part', txt:`${done}/${tot}`, why:'逐題檢核：部分繳' };
        return { k:'none', txt:'✕', why:'逐題檢核：沒繳' };
      }
      // ② 教練標了什麼（連動）
      if (eng && eng.homework === true)
        return { k:'full', txt:'✓', why:'LINE 標已交（未逐題檢核）', soft:true };
      if (eng && eng.homework === false)
        return { k:'none', txt:'✕', why:'LINE 標沒交' };
      // ③ 教練沒標，但學員自己說貼了 → 責任在教練，不是學員沒交
      if (said)
        return { k:'said', txt:'待', why:'學員自己勾了「已在小組回報」，教練還沒查證 → 不算學員沒交' };
      // ④ 兩條線都沒有
      return over ? { k:'nax', txt:'✕', why:'教練逾時未處理 → 等同沒繳' }
                  : { k:'na',  txt:'',  why:'還在期限內' };
    }

    // 行動：看學員有沒有填 daily ＋ 小組心得（scope='action' 時即使那天有單元也走這條）
    if (actStart && ds < actStart) return { k:'lock', txt:'', why:'行動尚未開放' };
    if (!simpleMode) {
      if (log) return log.confirmed ? { k:'full', txt:'✓', why:'學員已填＋教練已確認（full 模式）' }
                                    : { k:'part', txt:'·', why:'學員已填，教練未確認（full 模式）' };
      return over ? { k:'nax', txt:'✕', why:'學員未填、教練未確認' }
                  : { k:'na',  txt:'',  why:'還在期限內' };
    }
    // 🔴 行動週是「兩件事」（Randoph 2026-08-19）：
    //    ① 行動回報＝學員在 daily 填七大行動（action_logs 有紀錄，不經過教練）
    //    ② LINE 回報行動心得＝學員貼群組（學員自述 group_reported 或教練標 homework）
    //    兩件都做＝✓；只做一件＝「半」；都沒做才是紅叉。
    const acted = !!log;                                        // ① 有填行動回報
    const posted = said || (eng && eng.homework === true);       // ② 有貼心得（任一條線說有）
    if (eng && eng.homework === false && !acted)
      return { k:'none', txt:'✕', why:'教練標沒交，學員也沒填行動回報' };
    if (acted && posted)
      return { k:'full', txt:'✓',
               why:`行動回報 ✓　心得 ✓（${said ? '學員自述' : ''}${said && eng && eng.homework === true ? '＋' : ''}${eng && eng.homework === true ? '教練已標' : ''}）` };
    if (acted)  return { k:'part', txt:'半', why:'只有行動回報，小組心得沒有紀錄' };
    if (posted) return { k:'part', txt:'半', why:`只有小組心得（${said ? '學員自述' : '教練已標'}），沒填行動回報` };
    return over ? { k:'nax', txt:'✕', why:'行動回報與小組心得都沒有紀錄' }
                : { k:'na',  txt:'',  why:'還在期限內' };
  }

  const rows = realStudents.map(s => {
    let full = 0, part = 0, none = 0, na = 0, nax = 0, soft = 0, said = 0;
    days.forEach(ds => {
      const c = cellOf(s.id, ds);
      if (c.k === 'lock') return;
      if (c.k === 'full') { full++; if (c.soft) soft++; }
      else if (c.k === 'part') part++;
      else if (c.k === 'none') none++;
      else if (c.k === 'said') said++;      // 學員自述待查：不算缺件，責任在教練
      else if (c.k === 'nax') nax++;
      else na++;
    });
    return { s, full, part, none, na, nax, soft, said, missing: part + none + nax };
  }).sort((a, b2) => (b2.missing - a.missing) || (b2.said - a.said) || (b2.na - a.na));

  const overdueCells = rows.reduce((a, r) => a + r.nax, 0);
  const softCells    = rows.reduce((a, r) => a + r.soft, 0);
  const saidCells    = rows.reduce((a, r) => a + r.said, 0);
  const zeroDone     = rows.filter(r => (r.na + r.nax) === days.length).length;
  const wd = ds => '日一二三四五六'[new Date(ds + 'T00:00:00').getDay()];

  const isAct = scope === 'action';
  // 分頁標題已經寫過表名，內層只放統計（同一個雙標題的坑之前在「②／各組完成度」踩過一次）
  let h = `<div class="sec-title"><span>${overdueCells
      ? `<b style="color:#d9534f">⚠️ 教練逾時未處理 ${overdueCells} 格</b>` : '✅ 沒有逾時未處理的格子'}</span><span class="sec-count">${
    days.length} 個${isAct ? '行動日' : '上課日'} · ${realStudents.length} 位學員</span></div>`;
  h += `<div class="cov-note">
    ${isAct ? '這張只看<b>行動</b>：行動回報（學員自己填）＋小組心得。作業請看「📋 作業一覽表」。'
            : '這張只看<b>作業</b>：橫軸是上課日，底下標該日單元號。行動請看「🏃 行動一覽表」。'}<br>
    綠✓=完成　橘=部分／教練未回　<b>紅✕=沒交</b>（含教練逾時未處理）　灰=還在期限內　空=未開放<br>
    🔴 <b>教練在 LINE 標「已交」會直接連動到這張表</b>——目前有 <b>${softCells} 格</b>是這樣來的
    （綠底加白點，表示還沒逐題檢核）。<b>每格的死線＝隔天 12:00</b>，過了還沒處理就是紅叉、等同沒繳。<br>
    🟡 <b>「待」＝學員自己勾了「已在小組回報」，但教練還沒查證</b>——目前 <b>${saidCells} 格</b>，
    <b>這些不算學員沒交</b>，責任在教練。這是唯一不經過教練的學員自述（daily 的小組回報勾）。<br>
    ${isAct ? '一格看<b>兩件事</b>：行動回報＋小組心得。兩件都做＝✓，只做一件＝「半」。<br>' : ''}
    👤 <b>點學員名字</b>可看他的教練與領袖（兩欄常駐太吃寬度，收起來讓給日期）。<br>
    滑過任何一格都看得到它是怎麼判定的${zeroDone ? `。⚠️ 有 <b>${zeroDone} 人</b>整排都沒被處理——那要找的是教練` : ''}。</div>`;
  // 教練／領袖收進學員名字（Randoph：寬度有限）——hover 有 title、點一下彈出小卡，
  // 省下約 120px 給日期欄。名字帶點狀底線提示可點。
  h += `<div class="hwm-wrap"><table class="hwm"><tr>
    <th class="nm nm1">學員</th>`;
  days.forEach(ds => {
    const us = dayUnits[ds];
    const tag = scope === 'action' ? '行動' : (us ? 'U' + us.join('·') : '行動');
    h += `<th title="${ds}（週${wd(ds)}）· ${tag}">${
      ds.slice(5).replace('-', '/')}<br><span class="hwm-u">${tag}</span></th>`;
  });
  h += `<th>缺</th></tr>`;
  rows.forEach(r => {
    const cN = coachById[r.s.coach_id] || '—', sN = coachById[r.s.sponsor_id] || '—';
    h += `<tr><td class="nm nm1 who" data-n="${nm(r.s)}" data-c="${cN}" data-s="${sN}"
             onclick="showWho(event,this)" title="教練 ${cN}｜領袖 ${sN}">${nm(r.s)}</td>`;
    days.forEach(ds => {
      const c = cellOf(r.s.id, ds);
      h += `<td class="hwm-c ${c.k}${c.soft ? ' soft' : ''}" title="${ds}（週${wd(ds)}）｜${c.why}">${c.txt}</td>`;
    });
    const note = [r.nax ? `逾時 ${r.nax}` : '', r.said ? `自述待查 ${r.said}` : '',
                  r.na ? `待處理 ${r.na}` : ''].filter(Boolean).join(' · ');
    h += `<td class="hwm-sum">${r.missing ? `<b>${r.missing}</b>` : '0'}${
      note ? `<span style="color:var(--muted)">（${note}）</span>` : ''}</td></tr>`;
  });
  h += `</table></div>`;
  return h;
}
function renderTrack(target) {
  const el = target || document.getElementById('p-track');
  if (!el) return;
  const today = localDateStr(new Date());
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const dayDiff = (d1, d2) => Math.round((new Date(d1) - new Date(d2)) / 86400000);
  const actScore = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0);

  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  const approved = students.filter(s => s.status === 'approved');
  const realStudents = approved.filter(s => !coachMemberIds.has(s.member_id));

  const logsByStu = {};
  allLogs.forEach(l => { (logsByStu[l.student_id] = logsByStu[l.student_id] || []).push(l); });

  // 🔴 連續沒填（≥2 天或從未）
  const silent = [];
  realStudents.forEach(s => {
    const ls = logsByStu[s.id] || [];
    const coachName = coachById[s.coach_id] || '未配對';
    if (!ls.length) { silent.push({ name: nm(s), coach: coachName, gap: 999, txt: '從未填寫' }); return; }
    const last = ls.map(l => l.log_date).sort().reverse()[0];
    const gap = dayDiff(today, last);
    if (gap >= 2) silent.push({ name: nm(s), coach: coachName, gap, txt: gap + ' 天沒填' });
  });
  silent.sort((a, b) => b.gap - a.gap);

  // 待審分兩種：今日必審（昨天填，今天是deadline）vs 已失職（跨日改不了）
  // 「有沒有處理」依模式判定：full＝confirmed（26期逐項審核）；simple＝coach_engagement 有標記
  // （27期起教練的動作寫在那張表，confirmed 永遠 false——2026-08-13 前這裡只看 confirmed，
  //   把每個填報的學員都列成未審：該亮的沒亮、不該亮的全亮）
  const isSimple = ((allBatches.find(b => b.id === bid) || {}).coach_mode || 'simple') === 'simple';
  const engMarked = new Set(engRows.filter(r => r.homework !== null && r.homework !== undefined)
                                   .map(r => r.student_id + '|' + r.log_date));
  const handled = l => isSimple ? engMarked.has(l.student_id + '|' + l.log_date) : l.confirmed;
  const dueByCoach = {};    // 🟠 log_date === 昨天 → Set(學員名)
  const failedByCoach = {}; // ⚫ log_date < 昨天 → {學員名: 漏審次數}
  allLogs.forEach(l => {
    if (handled(l) || l.log_date >= today) return; // 今天填的明天才處理，跳過
    if (actScore(l) === 0) return;
    const s = approved.find(x => x.id === l.student_id);
    if (!s || coachMemberIds.has(s.member_id)) return;
    const coachName = coachById[s.coach_id] || '未配對';
    if (l.log_date === yesterday) {
      (dueByCoach[coachName] = dueByCoach[coachName] || new Set()).add(nm(s));
    } else {
      if (!failedByCoach[coachName]) failedByCoach[coachName] = {};
      failedByCoach[coachName][nm(s)] = (failedByCoach[coachName][nm(s)] || 0) + 1;
    }
  });
  const due = Object.entries(dueByCoach).map(([coach, set]) => ({ coach, items: [...set] }))
    .sort((a, b) => b.items.length - a.items.length);
  // 失職：每位教練列學員+漏審次數，按該教練總漏審數排序
  const failed = Object.entries(failedByCoach).map(([coach, stuMap]) => {
    const stus = Object.entries(stuMap).map(([name, cnt]) => ({ name, cnt })).sort((a, b) => b.cnt - a.cnt);
    const total = stus.reduce((a, x) => a + x.cnt, 0);
    return { coach, stus, total };
  }).sort((a, b) => b.total - a.total);

  // 📉 本週至今 vs 上週同期（同樣天數，公平比較，因為本週還沒結束）
  const d = new Date(today);
  const offset = d.getDay(); // 距離本週日幾天（0=週日）
  const thisSun = new Date(d); thisSun.setDate(d.getDate() - offset);
  const lastSun = new Date(thisSun); lastSun.setDate(thisSun.getDate() - 7);
  const lastSame = new Date(lastSun); lastSame.setDate(lastSun.getDate() + offset); // 上週對應星期幾
  const tSun = localDateStr(thisSun), lSun = localDateStr(lastSun), lSame = localDateStr(lastSame);
  const drop = [];
  realStudents.forEach(s => {
    const ls = logsByStu[s.id] || [];
    const thisW = ls.filter(l => l.log_date >= tSun && l.log_date <= today).reduce((a, l) => a + actScore(l), 0);
    const lastW = ls.filter(l => l.log_date >= lSun && l.log_date <= lSame).reduce((a, l) => a + actScore(l), 0);
    if (lastW >= 10 && thisW < lastW * 0.5) {
      drop.push({ name: nm(s), coach: coachById[s.coach_id] || '未配對', lastW, thisW });
    }
  });
  drop.sort((a, b) => (b.lastW - b.thisW) - (a.lastW - a.thisW));

  // ── 渲染 ──
  let h = '';
  h += `<div class="sec-title"><span>🔴 連續沒填（教練快關心）</span><span class="sec-count">${silent.length} 人</span></div>`;
  if (!silent.length) h += `<div class="dash-empty">太棒了，沒人失聯 🎉</div>`;
  else h += '<div>' + silent.map(x =>
    `<div class="track-row track-red"><span class="track-name">${x.name}</span><span class="track-mid">教練：${x.coach}</span><span class="track-tag">${x.txt}</span></div>`
  ).join('') + '</div>';

  const vb = isSimple ? '標' : '審';   // simple 模式教練的動作是「標記」不是「審核」
  h += `<div class="sec-title"><span>🟠 今日必${vb}（昨天填，今天是 deadline）</span><span class="sec-count">${due.length} 位教練</span></div>`;
  if (!due.length) h += `<div class="dash-empty">今天該${vb}的都${vb}完了 👍</div>`;
  else h += '<div>' + due.map(x =>
    `<div class="track-row track-orange">
      <span class="track-name">教練：${x.coach}</span>
      <span class="track-tag">${x.items.length} 筆待${vb}</span>
      <div class="track-chips">${x.items.map(i => `<span class="track-chip">${i}</span>`).join('')}</div>
    </div>`
  ).join('') + '</div>';

  h += `<div class="sec-title"><span>⚫ 未${vb}天數（跨日未${vb}，改不了了）</span><span class="sec-count">${failed.length} 位教練</span></div>`;
  if (!failed.length) h += `<div class="dash-empty">沒有漏${vb}記錄 ✨</div>`;
  else h += '<div>' + failed.map(x =>
    `<div class="track-row track-black">
      <span class="track-name">教練：${x.coach}</span>
      <span class="track-tag">共 ${x.total} 天未${vb}</span>
      <div class="track-stulist">${x.stus.map(st =>
        `<div class="track-stu"><span>${st.name}</span><span class="track-dots">${'🔴'.repeat(st.cnt)}<b>未${vb} ${st.cnt} 天</b></span></div>`
      ).join('')}</div>
    </div>`
  ).join('') + '</div>';

  h += `<div class="sec-title"><span>📉 本週至今 vs 上週同期下滑</span><span class="sec-count">${drop.length} 人</span></div>`;
  if (!drop.length) h += `<div class="dash-empty">沒有明顯退步 💪</div>`;
  else h += '<div>' + drop.map(x =>
    `<div class="track-row track-blue"><span class="track-name">${x.name}</span><span class="track-mid">教練：${x.coach}</span><span class="track-tag">${x.lastW} → ${x.thisW} 分</span></div>`
  ).join('') + '</div>';

  if (target) el.insertAdjacentHTML('beforeend', h); else el.innerHTML = h;
}

// 🎯 現在：依 batches 日期自動判斷階段（可手動覆蓋），2026-08-17 重整
