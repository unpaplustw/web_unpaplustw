<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>實戰班主系統管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="units.js"></script>
<script src="consts.js"></script>
<script src="score.js?v=20261112"></script>
<script src="commit.js?v=20261115"></script>
<script src="coachcard.js?v=20261119"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  :root {
    --navy:#0a0e27; --navy2:#131836; --navy3:#1c2347;
    --gold:#d4af37; --gold-lt:rgba(212,175,55,.15); --gold-bd:rgba(212,175,55,.25);
    --white:#e8e8e8; --muted:#8a8fa8;
    --green:#4caf82; --green-bg:rgba(76,175,130,.15);
    --red:#e05c5c; --red-bg:rgba(224,92,92,.15);
    --yellow:#f0c040; --yellow-bg:rgba(240,192,64,.15);
    --blue:#5b8def; --blue-bg:rgba(91,141,239,.15);
    /* 🌈 科技霓虹（2026-09-12）：只當背景光暈與邊緣線，不碰文字色——admin 是工具，可讀性優先 */
    --neon-cyan:#22d3ee; --neon-violet:#8b5cf6; --neon-pink:#f472b6;
    --glass:rgba(19,24,54,.72); --glass-bd:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;color:var(--white);min-height:100vh;padding:16px;
    background:var(--navy);position:relative;overflow-x:hidden}
  /* 背景光暈獨立一層：fixed 不隨捲動、pointer-events:none 不吃點擊、放在最底 */
  body::before{content:"";position:fixed;inset:-20% -10%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(38% 45% at 12% 8%,  rgba(34,211,238,.20), transparent 70%),
      radial-gradient(42% 50% at 88% 14%, rgba(139,92,246,.22), transparent 70%),
      radial-gradient(50% 40% at 50% 102%,rgba(244,114,182,.14), transparent 72%),
      radial-gradient(35% 30% at 78% 62%, rgba(212,175,55,.12),  transparent 70%);
    filter:blur(10px)}
  /* 細網格：給「科技感」一點結構，不然純漸層會像化妝品廣告 */
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(120% 90% at 50% 0%,#000 35%,transparent 78%);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 35%,transparent 78%)}
  @media (prefers-reduced-motion:reduce){body::before{filter:none}}
  .wrap{max-width:1000px;margin:0 auto}

  .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(135deg,rgba(19,24,54,.86),rgba(28,35,71,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);border:1px solid var(--gold-bd);border-radius:10px;margin-bottom:16px}
  .hd h1{font-size:20px;font-weight:700;background:linear-gradient(100deg,var(--neon-cyan),var(--gold) 55%,var(--neon-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hd-right{display:flex;align-items:center;gap:10px}
  .hd select{background:var(--navy3);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:500}
  .btn-ref{background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-ref:hover{background:var(--gold-bd)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .st{background:var(--glass);border:1px solid var(--gold-bd);border-radius:10px;padding:14px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .st-n{font-size:28px;font-weight:700;color:var(--gold)}
  .st-l{font-size:12px;color:var(--muted);margin-top:4px}

  .tabs{display:flex;margin-bottom:16px;position:relative;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--neon-cyan),var(--neon-violet),var(--gold)) 1}
  .tab{background:none;border:none;color:var(--muted);padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:.2s}
  .tab:hover{color:var(--gold)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold);text-shadow:0 0 14px rgba(212,175,55,.45)}
  .panel{display:none}.panel.on{display:block}

  .sec-title{font-size:15px;font-weight:600;color:var(--gold);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--gold-bd);display:flex;justify-content:space-between;align-items:center}
  .sec-title:first-child{margin-top:0}
  .sec-count{font-size:12px;font-weight:400;color:var(--muted)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .search-box{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 12px;color:var(--white);font-size:13px;font-family:inherit;width:220px;transition:.2s}
  .search-box:focus{outline:none;border-color:var(--gold-bd)}
  .search-box::placeholder{color:var(--muted)}
  .toolbar-acts{display:flex;gap:8px;align-items:center}
  .btn-batch{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid;font-family:inherit;transition:.2s}
  .btn-batch-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-batch-ok:hover{background:rgba(76,175,130,.3)}
  .btn-csv{background:var(--blue-bg);color:var(--blue);border-color:rgba(91,141,239,.3)}
  .btn-csv:hover{background:rgba(91,141,239,.3)}

  .card{background:var(--glass);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .card:hover{border-color:var(--gold-bd)}
  .card-left{flex:1;min-width:0}
  .card-name{font-size:15px;font-weight:500}
  .card-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}

  .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:500}
  .b-pending{background:var(--yellow-bg);color:var(--yellow)}
  .b-approved{background:var(--green-bg);color:var(--green)}
  .b-rejected{background:var(--red-bg);color:var(--red)}

  .acts{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .btn{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:.2s}
  .btn-ok{background:var(--green-bg);color:var(--green);border-color:rgba(76,175,130,.3)}
  .btn-ok:hover{background:rgba(76,175,130,.3)}
  .btn-no{background:var(--red-bg);color:var(--red);border-color:rgba(224,92,92,.3)}
  .btn-no:hover{background:rgba(224,92,92,.3)}

  .coach-card{background:var(--glass);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:10px;transition:.2s;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .coach-card:hover{border-color:var(--gold-bd)}
  .coach-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .coach-arrow{color:var(--muted);font-size:12px;transition:transform .2s;margin-left:8px}
  .coach-card.open .coach-arrow{transform:rotate(180deg)}
  .coach-count{background:var(--gold-lt);color:var(--gold);padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600}
  .coach-count.zero{background:rgba(138,143,168,.12);color:var(--muted)}
  .coach-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .coach-card.open .coach-body{max-height:2000px}   /* 引路樹一位上線可能帶十幾位，800px 會裁掉 */
  .coach-stu{padding:8px 16px 8px 32px;border-top:1px solid rgba(255,255,255,.04);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .coach-stu-name{color:var(--white)}
  .coach-stu-meta{color:var(--muted);font-size:11px}
  .coach-empty{padding:12px 32px;color:var(--muted);font-size:12px;font-style:italic}
  .btn-reassign{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-reassign:hover{background:rgba(91,141,239,.3)}
  .reassign-sel{background:var(--navy3);border:1px solid var(--gold-bd);border-radius:6px;padding:4px 8px;color:var(--white);font-size:12px;font-family:inherit;margin-right:6px}

  .pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pair-col h3{font-size:14px;color:var(--gold);margin-bottom:10px}
  .pick{padding:10px 12px;margin-bottom:6px;background:var(--navy3);border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.2s}
  .pick:hover{border-color:rgba(212,175,55,.3)}
  .pick.sel{border-color:var(--gold);background:var(--gold-lt)}
  .pick-name{font-size:14px;font-weight:500}
  .pick-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .btn-pair{width:100%;margin-top:12px;padding:10px;background:var(--gold-lt);color:var(--gold);border:1px solid var(--gold-bd);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-pair:hover:not(:disabled){background:var(--gold-bd)}
  .btn-pair:disabled{opacity:.4;cursor:not-allowed}

  .paired-section{margin-top:20px}
  .paired-section h3{font-size:14px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .paired-search{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 10px;color:var(--white);font-size:12px;font-family:inherit;width:180px}
  .paired-search:focus{outline:none;border-color:var(--gold-bd)}
  .paired-search::placeholder{color:var(--muted)}
  .btn-unpair{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unpair:hover{background:rgba(224,92,92,.3)}

  .empty{text-align:center;padding:48px 16px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px}
  .empty-text{font-size:14px}
  /* 🔴 原本 .loading 帶 text-align:center，而容器渲染完沒人把 class 拿掉 →
     整個 Tab 的文字都被繼承成居中（2026-09-12 在檢查頁與權限頁看到）。
     現在居中交給 .loading-box，渲染時整個被 innerHTML 換掉，不可能殘留。 */
  .loading-box{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy2);border:1px solid var(--gold-bd);color:var(--gold);padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:999;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .roster-card{background:var(--glass);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .roster-card:hover{border-color:var(--gold-bd)}
  .roster-top{display:flex;justify-content:space-between;align-items:center}
  .roster-info{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  .roster-checks{display:flex;gap:12px;margin-top:6px}
  .roster-check{font-size:12px;cursor:pointer;padding:2px 8px;border-radius:4px;transition:.2s}
  .roster-check:hover{background:var(--navy3)}
  .roster-check .has{color:var(--green)}
  .roster-check .no{color:var(--muted)}
  /* 🚪 已退班（2026-08-25）：整張卡淡化，一眼分得出誰還在跑 */
  .roster-card.gone{opacity:.55}
    padding:3px 9px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .roster-card.gone .card-name::after{content:' 🚪 已退班';font-size:11px;color:#f87171;font-weight:400}
  .btn-edit{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit;transition:.2s}
  .btn-edit:hover{background:rgba(91,141,239,.3)}
  .edit-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:end}
  .edit-field{display:flex;flex-direction:column;gap:3px}
  .edit-field label{font-size:11px;color:var(--muted)}
  .edit-field input{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;font-family:inherit;width:140px}
  .edit-field input:focus{outline:none;border-color:var(--gold-bd)}
  .btn-save{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-save:hover{background:rgba(76,175,130,.3)}
  .btn-cancel{padding:6px 14px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(138,143,168,.3);background:transparent;color:var(--muted);font-family:inherit;transition:.2s}
  .btn-cancel:hover{background:rgba(138,143,168,.1)}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:998;display:flex;align-items:center;justify-content:center}
  .modal-box{background:var(--navy2);border:1px solid var(--gold-bd);border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto}
  /* 👤 管理卡（2026-11-13）：名冊每一列的「管理」跳出來的那張 */
  .pc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:990;display:flex;align-items:center;justify-content:center}
  .pc-box{width:460px;max-width:92vw;max-height:90vh;overflow-y:auto;background:var(--navy2);border:1px solid var(--gold-bd);border-radius:16px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .pc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}  .pc-name{font-size:20px;font-weight:800;color:var(--white)}  .pc-name small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .pc-sub{font-size:13px;color:var(--gold);margin-top:3px}  .pc-x{color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}  .pc-x:hover{color:var(--white)}
  .pc-commit{display:flex;align-items:center;gap:10px;min-height:30px;margin:6px 0 8px;font-size:13px;color:var(--muted)}
  .pc-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}  .pc-row>span{color:var(--muted);font-size:13px}  .pc-row>div{font-size:14px;color:var(--white)}
  .pc-note{font-size:12px;color:var(--muted);margin-top:4px}  .pc-a{color:var(--gold);font-size:13px;text-decoration:underline;cursor:pointer;margin-right:12px}  .pc-a.dim{color:var(--muted);font-size:12px}
  .pc-foot{display:flex;gap:10px;margin-top:16px;align-items:center}  .pc-foot .btn-save{flex:1;padding:11px;font-size:15px}  .pc-foot .btn-edit{padding:11px 16px;font-size:14px}  .pc-foot .btn-edit.del{padding:11px 12px;font-size:12px;background:rgba(220,38,38,.12);color:#f87171}
  .modal-title{font-size:15px;font-weight:600;color:var(--gold);margin-bottom:12px}
  .modal-body{font-size:13px;color:var(--white);line-height:1.8;white-space:pre-wrap}
  .modal-close{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;margin-right:8px}
  .modal-edit-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(91,141,239,.3);background:var(--blue-bg);color:var(--blue);font-family:inherit}
  .modal-save-btn{margin-top:14px;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;margin-right:8px}
  .modal-textarea{width:100%;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;color:var(--white);font-size:13px;font-family:inherit;line-height:1.8;resize:vertical;min-height:150px}
  .modal-textarea:focus{outline:none;border-color:var(--gold-bd)}

  .fin-table{width:100%;border-collapse:collapse}
  .fin-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--gold-bd)}
  .fin-table td{font-size:13px;padding:10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
  .fin-confirmed{color:var(--green);font-weight:600}
  .fin-pending{color:var(--yellow)}
  .btn-confirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(76,175,130,.3);background:var(--green-bg);color:var(--green);font-family:inherit;transition:.2s}
  .btn-confirm:hover{background:rgba(76,175,130,.3)}
  .btn-unconfirm{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(224,92,92,.3);background:var(--red-bg);color:var(--red);font-family:inherit;transition:.2s}
  .btn-unconfirm:hover{background:rgba(224,92,92,.3)}

  .perm-card{background:var(--glass);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;transition:.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .perm-card:hover{border-color:var(--gold-bd)}
  .perm-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .perm-tag{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--gold-lt);color:var(--gold)}
  .perm-tag.off{background:rgba(138,143,168,.1);color:var(--muted);text-decoration:line-through}
  .perm-add-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
  .perm-add-row select{background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;color:var(--white);font-size:13px;font-family:inherit}
  .btn-add{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--gold-bd);background:var(--gold-lt);color:var(--gold);font-family:inherit;transition:.2s;align-self:end}
  .btn-add:hover{background:var(--gold-bd)}

  /* ── 追蹤分析 ── */
  /* 📅 今天（2026-11-13；11-15 只剩要處理的事）*/
  .td-item{background:var(--glass);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--muted);border-radius:8px;padding:14px 16px;margin-bottom:10px}  .td-item.r{border-left-color:var(--red)}  .td-item.y{border-left-color:var(--yellow)}  .td-item.b{border-left-color:var(--blue)}
  .td-t{font-size:16px;font-weight:700;color:var(--white)}  .td-t small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:10px}  .td-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .td-chip{font-size:13px;color:var(--white);background:var(--navy3);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:4px 10px}  .td-chip i{font-style:normal;opacity:.65;margin-left:6px}  .td-chip.more{cursor:pointer;opacity:.75}
  .td-ok{padding:12px 16px;border-radius:12px;background:rgba(61,154,95,.12);color:#7fd39a;font-size:14px;margin-bottom:14px}
  /* 🎓 教練卡（2026-11-13 各組狀況卡 → 2026-11-15 教練頁）：上緣顏色＝狀態 */

//    於是拿舊授權碼配不上密鑰 → 「code_verifier does not match」，停在錯誤畫面不再自救。
function reloginClean() {
  try { if (window.liff && liff.logout) liff.logout(); } catch (_) {}
  try { Object.keys(localStorage).filter(k => /^LIFF/i.test(k)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
  const u = new URL(location.href);
  ['code','state','liffClientId','liffRedirectUri','liff.state','error','error_description']
    .forEach(k => u.searchParams.delete(k));
  location.replace(u.pathname + (u.search === '?' ? '' : u.search) + u.hash);
}

async function init() {
  // ── LIFF 門禁 ──
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      // 防跳轉迴圈：若剛從 LINE 登入回來(網址帶 code)卻仍未登入 = 瀏覽器擋 cookie，停下來給提示，別再跳
      if (new URLSearchParams(location.search).has('code')) {
        document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🔁</div><div class="empty-text">登入無法完成，通常是瀏覽器擋了 Cookie。<br><br>請改用以下方式：<br>① 直接在 <b>LINE App 內</b>開啟此頁<br>② 或用 Chrome（非無痕）、關閉「封鎖第三方 Cookie」<br><br>連結：liff.line.me/2009692859-DepTDosN</div></div>';
        return;
      }
      liff.login({ redirectUri: location.origin + location.pathname });
      return;
    }
    const profile = await liff.getProfile();
    sessionStorage.removeItem('liffRetried');   // 登入成功，下次憑證過期還能再自動重登一次

    const { data: member } = await sb.from('members_master').select('id, name')
      .eq('line_user_id', profile.userId).single();
    if (!member) { document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🚫</div><div class="empty-text">查無會員資料</div></div>'; return; }

    const { data: admin } = await sb.from('admin_users').select('allowed_tabs')
      .eq('member_id', member.id).single();
    if (admin) {
      myAllowedTabs = normTabs(admin.allowed_tabs);
      isReadonly = false;
    } else {
      // 非管理員 → 檢查是否為教練 → 唯讀模式
      const { data: coachCheck } = await sb.from('batch_coaches').select('id')
        .eq('member_id', member.id).limit(1);
      if (!coachCheck?.length) { document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">無管理權限</div></div>'; return; }
      myAllowedTabs = ['now','roster'];   // 教練唯讀：只給固定的（分析＋名冊）；🩺檢查 全是會改資料的操作
      isReadonly = true;
    }

    // 隱藏無權限的 Tab
    document.querySelectorAll('.tab').forEach(btn => {
      const t = btn.dataset.t;
      if (!myAllowedTabs.includes(t)) {
        btn.style.display = 'none';
        document.getElementById('p-' + t).style.display = 'none';
      }
    });
    // 確保預設顯示第一個有權限的 Tab
    const firstTab = document.querySelector('.tab[style=""]') || document.querySelector('.tab:not([style*="none"])');
    if (firstTab) showTab(firstTab.dataset.t);
  } catch (e) {
    // 🔴 2026-09-23：憑證類錯誤一律乾淨重登，且用 sessionStorage 擋成「只自動重試一次」
    //    （原本只認 revoked、又沒有擋迴圈，一旦持續失敗就會一直重整）。
    const msg = (e && e.message) || String(e);
    if (/revoked|expired|access.?token|invalid.*token|unauthorized|401|code_verifier|invalid_grant/i.test(msg)
        && !sessionStorage.getItem('liffRetried')) {
      sessionStorage.setItem('liffRetried', '1');
      reloginClean(); return;
    }
    document.querySelector('.wrap').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">登入失敗：' + msg + '<br><br>請把分頁關掉，<b>回 LINE 聊天室重新點連結</b>。<br>還是不行請截這個畫面給總教練。</div></div>';
    return;
  }

  // ── 原始初始化 ──
  // 🔴 已歸檔的期別不進下拉：活動層已清空，點進去只會看到空的名冊與 0 筆資料，
  //    真正的資料在 wiki 的「{N}期原始數據.md」與名人堂。（2026-09-02 Randoph：「26期選單可以刪掉」）
  const { data: allB } = await sb.from('batches').select('*').order('id', { ascending: false });
  const batches = (allB || []).filter(b => !b.archived_at);
  const sel = document.getElementById('selBatch');
  sel.innerHTML = (batches || []).map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  // 預設選當期（is_active），沒有才退回最新一期。下拉可自由切換看歷屆
  allBatches = batches || [];
  if (batches?.length) {
    const active = batches.find(b => b.is_active);
    bid = (active || batches[0]).id;
    sel.value = bid;
  }
  sel.addEventListener('change', e => { bid = Number(e.target.value); load(); });
  document.querySelectorAll('.tab').forEach(btn =>
    btn.addEventListener('click', () => showTab(btn.dataset.t)));
  await load();
  // 資訊版自動刷新：每 60 秒，僅在資訊版 Tab 顯示時才重拉
  setInterval(() => {
    const dp = document.getElementById('p-now');    // 舊版是 p-dashboard，改版後這顆一直沒觸發
    if (dp && dp.classList.contains('on')) load();
  }, 60000);
}

function lastWeekday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  for (let i = 0; i < 7; i++) {
    const w = d.getDay();
    if (w >= 1 && w <= 5) return localDateStr(d);
    d.setDate(d.getDate() - 1);
  }
  return localDateStr(d);
}

const refDayLabel = () => ((SCHEDULE || {})[lastWeekday()] || []).length ? '上一個上課日' : '上一個平日';

// 🔴 2026-08-20：頂層 Tab 改 lazy render。
//    原本每次 load() 都把五個 Tab 全部渲染再用 CSS 藏起來——
//    實測 👥名冊 175KB／🎓教練 29KB，而它們是**開班前密集用、開班後幾乎不碰**的靜態資料，
//    你每天打開是要看分析，卻每次都陪著畫它們。
//    改成切到才畫：首次載入只畫「分析」一個 Tab。
const TAB_RENDER = {
  now:    () => renderNow(),
  roster: () => { renderRoster(); renderOrg(); renderRosterBar(); },
  check:  () => { renderChecklist(); renderReview(); renderPairing();
                  renderFinance(); renderCheckBar(); },

};
// 切 Tab 抽成函式：檢查清單要能跨頁跳（「上線未設」在名冊頁，清單在檢查頁）
function showTab(t, scrollTo) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  const panel = document.getElementById('p-' + t);
  if (panel) panel.classList.add('on');
  paintTab(t);                                        // 切到才畫
  const el = scrollTo && document.getElementById(scrollTo);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}
// 檢查清單那些「去處理」連結都走這裡
function jump(tab, id) { showTab(tab, id); }

const tabPainted = new Set();
function paintTab(t) {
  if (tabPainted.has(t) || !TAB_RENDER[t]) return;
  TAB_RENDER[t]();
  tabPainted.add(t);
}
function render() {
  tabPainted.clear();                                   // 資料重載 → 已畫的都過期了
  const cur = document.querySelector('.tab.on');
  paintTab(cur ? cur.dataset.t : 'now');                // 只畫當前這一個
}

//   所以同一天會同時出現在兩張表，各自只顯示自己那件事。
function renderHwMatrix(realStudents, coachById, scope) {
  // ⚠️ 組別在 batch_coaches.group_name（第一組～第十四組），
  //    不是 batch_students.group_name——那裡 54 人全都是「啟動班」，是班別不是組別。
  const groupByCoach = {}; coaches.forEach(c => groupByCoach[c.id] = c.group_name || '');
  if (typeof UNITS === 'undefined' || !realStudents.length) return '';
  const today = localDateStr(new Date());
  // 🔴 2026-09-15 班別掛在組上（28 期起）：作業表只列學習組；行動表每人從自己那組的行動起算日開始
  //    學習組＝study_end 後第一個週一（9/28）／行動組、精英組＝action_open_date（9/14）
  // 2026-11-08 回應一覽表：全部學員都列（學習組不再等到學習期結束）
  if (!realStudents.length) return '';
  const isLearnStu = {}; realStudents.forEach(s => isLearnStu[s.id] = stuIsLearn(s));

  // ══════════════════════════════════════════════════════════
  // 一覽表改成「日期 × 學員」（2026-08-19 Randoph 定案）
  //   Randoph：「LINE 已回已繳就能連動到一覽表，而一覽表就能看出補交的概念，
  //   從一覽表點擊就一定是補交，這樣更並線邏輯思維。」
  //   橫軸用日期而不是單元，學習班行動班才共用同一張表：
  //   學習週的日期底下標單元號，行動週就只有日期。
  //
  //   🔴 連動用「顯示時推導」，不寫任何一筆 homework_checks。
  //      若教練標「已交」就自動寫成「全繳」，那筆假資料會蓋掉真相——
  //      學員可能缺兩題，缺件清單就再也抓不到題號。
  //      同一條原則：能推導的就不要儲存。
  //   優先序：逐題紀錄 > LINE 標記 > 逾期未做 > 期限內
  // ══════════════════════════════════════════════════════════
  const dayUnits = {};                       // 日期 → 該日單元陣列
  Object.entries(SCHEDULE || {}).forEach(([d, arr]) => { dayUnits[d] = arr.slice(); });

  const b = batchRow();
  const actStart0 = actionStartDate();
  // 🔴 行動「一覽表」的起點 ≠ 行動「計算」的起點（Randoph 2026-08-20）
  //    計算用 actionStartDate()（＝action_open_date 8/10）——四環節分母、記點都照舊，這裡不動。
  //    8/10～8/20 行動雖然開放了，學員的主任務仍是作業，列進行動表只會讓它難看且不公平。
  //    行動班沒有 study_end → 自動退回 actionStartDate()，同一條規則兩種班都對。
  //
  //    🔴 2026-08-25 Randoph 更正：行動週從 **study_end 之後的第一個週一** 起算，
  //    不是「隔天」。27 期 8/20（四）上完課，8/21（五）只有 9 人填、8/22–23 是週末，
  //    8/24（一）才真正啟動（教練標記 12→19 人）。用「隔天」會把 8/21 列進表，
  //    那天沒填的 30 人平白多一筆缺件。28 期同理（10/2 週五 → 10/5 週一）。
  // 回應一覽表：開班日到今天每一天都列；學習組週末格子顯示「不用回報」
  // 🔴 2026-09-20：行動天天都做，一覽表含週末（2026-08-30 定）；作業只有排課日，本來就靠 dayUnits 過濾。
  //    原本一律跳過週六日 → 9/19（六）的 24 筆教練標記在 admin 完全看不到。
  const days = [];
  if (b.start_date)
    // 2026-11-08：從開始回報那天列起（開班典禮當天沒有要回報），同教練專區
    for (let d = new Date((b.submit_from || b.action_open_date || b.start_date) + 'T00:00:00'); localDateStr(d) <= today; d.setDate(d.getDate() + 1)) {
      const ds = localDateStr(d), w = d.getDay();
      days.push(ds);
    }

  if (!days.length) return '';

  const hwBy  = {}; hwRows.forEach(r => hwBy[r.student_id + '|' + r.unit_no] = r);
  const engBy = {}; engRows.forEach(r => engBy[r.student_id + '|' + r.log_date] = r);
  // 🔴 2026-11-12 Randoph：教練已按送出、這格沒標＝學員沒交（送出時就寫「沒標到的就算學員沒繳」），不是教練未回報
  const subSet = new Set(submitRows.map(r => r.coach_id + '|' + r.log_date)), coachIdOf = {};
  students.forEach(s => { coachIdOf[s.id] = s.coach_id; });
  const logBy = {}; allLogs.forEach(l => logBy[l.student_id + '|' + l.log_date] = l);
  mkSet = new Set(makeupRows.filter(r => r.subject === 'student').map(r => r.student_id + '|' + r.log_date));
  // 學員遲交＝行動紀錄最後修改時間晚於當天 22:00（台北）。作業沒有學員的時間戳，只有教練標記，所以作業表不判遲交。
  const lateSet = new Set(allLogs.filter(l => {
    if (!l.updated_at) return false;
    const t = new Date(l.updated_at);
    const tp = new Date(t.getTime() + (t.getTimezoneOffset() + 480) * 60000);   // 轉台北時間
    return localDateStr(tp) > l.log_date || tp.getHours() >= 22;
  }).map(l => l.student_id + '|' + l.log_date));

  // 該日的死線＝隔天 12:00（跟小組回報同一條線）
  const dayOverdue = ds => {
    const dl = new Date(ds + 'T12:00:00'); dl.setDate(dl.getDate() + 1);
    return new Date() > dl;
  };
  const actStart = actionStartDate();
  // full 模式（26 期那種）教練是勾 action_logs.confirmed，不是 coach_engagement；
  // 不分開判會把歷史班期的教練動作全部誤判成「沒做」
  const simpleMode = (batchRow().coach_mode || 'simple') === 'simple';

  // 一格的狀態：回傳 { k, txt, why }
  //   k: full / part / none / nax（逾期未做）/ na（期限內）/ lock
  //
  //   🔴 2026-09-13：學員自述（daily「我已經小組回報」勾）拿掉，現在只看教練標記。
  //      原本 2026-08-19 的「兩條線交叉驗證」（學員自述＋教練標）已廢止。
  function cellOf(sid, ds) {
    const learn = isLearnStu[sid], wdn = new Date(ds + 'T00:00:00').getDay();
    if (learn && (wdn < 1 || wdn > 5)) return { k:'lock', txt:'', why:'學習組週末不用回報' };
    const units = learn ? dayUnits[ds] : null;   // 只有學習組的排課日是作業格
    const eng   = engBy[sid + '|' + ds];
    const log   = logBy[sid + '|' + ds];
    const over  = dayOverdue(ds);

    if (units && units.length) {
      // ① 逐題紀錄最優先（唯一能講出「缺第幾題」的來源）
      const recs = units.map(u => hwBy[sid + '|' + u]).filter(Boolean);
      if (recs.length === units.length) {
        const done = recs.reduce((a, r) => a + (r.done || 0), 0);
        const tot  = recs.reduce((a, r) => a + (r.total || 0), 0);
        if (tot > 0 && done >= tot) return { k:'full', txt:'✓', why:'逐題檢核：全繳', hw:true };
        if (done > 0) return { k:'part', txt:`${done}/${tot}`, why:'逐題檢核：部分繳', hw:true };
        return { k:'none', txt:'✕', why:'逐題檢核：沒繳', hw:true };
      }
      // ② 教練標了什麼（連動）
      if (eng && eng.homework === true)
        return { k:'full', txt:'✓', why:'LINE 標已交（未逐題檢核）', soft:true, hw:true };
      if (eng && eng.homework === false)
        return { k:'none', txt:'✕', why:'LINE 標沒交', hw:true };
      // ③ 教練沒標
      if (subSet.has(coachIdOf[sid] + '|' + ds)) return { k:'none', txt:'✕', why:'教練已送出、沒標這位＝學員沒交', hw:true };
      return over ? { k:'unk', txt:'？', why:'教練還沒回報，學員交了沒不知道' }
                  : { k:'na',  txt:'',  why:'還在期限內' };
    }

    // 心得格：看學員有沒有填 daily ＋ 小組心得（行動三組天天、學習組排課日以外）
    if (actStart && ds < actStart) return { k:'lock', txt:'', why:'行動尚未開放' };
    if (!simpleMode) {
      if (log) return log.confirmed ? { k:'full', txt:'✓', why:'學員已填＋教練已確認（full 模式）' }
                                    : { k:'part', txt:'·', why:'學員已填，教練未確認（full 模式）' };
      return over ? { k:'nax', txt:'✕', why:'學員未填、教練未確認' }
                  : { k:'na',  txt:'',  why:'還在期限內' };
    }
    // 🔴 行動週是「兩件事」（Randoph 2026-08-19）：
    //    ① 行動回報＝學員在 daily 填七大行動（action_logs 有紀錄，不經過教練）
    //    ② LINE 回報行動心得＝學員貼群組（教練標 homework）
    //    兩件都做＝✓；只做一件＝「半」；都沒做才是紅叉。
    const acted = !!log;                                        // ① 有填行動回報
    const posted = !!(eng && eng.homework === true);             // ② 教練標了有貼心得
    if (eng && eng.homework === false && !acted)
      return { k:'none', txt:'✕', why:'教練標沒交，學員也沒填行動回報' };
    if (acted && posted)
      return { k:'full', txt:'✓',
               why:'行動回報 ✓　心得 ✓（教練已標）' };
    if (acted)  return { k:'part', txt:'填', why:'只有填行動紀錄，心得沒貼（或教練沒標）' };   // 2026-09-17：「半」看不懂，改寫出有做的那件
    if (posted) return { k:'part', txt:'貼', why:'只有貼心得，沒填行動紀錄' };
    return over ? { k:'nax', txt:'✕', why:'行動回報與小組心得都沒有紀錄' }
                : { k:'na',  txt:'',  why:'還在期限內' };
  }

  const rows = realStudents.map(s => {
    let full = 0, part = 0, none = 0, na = 0, nax = 0, soft = 0, unk = 0;
    days.forEach(ds => {
      const c = cellOf(s.id, ds);
      if (c.k === 'lock') return;
      if (c.k === 'full') { full++; if (c.soft) soft++; }
      else if (c.k === 'part') part++;
      else if (c.k === 'none') none++;
      else if (c.k === 'nax') nax++;
      else if (c.k === 'unk') unk++;
      else na++;
    });
    return { s, full, part, none, na, nax, soft, unk, missing: part + none + nax };
  }).sort((a, b2) => (groupNo(a.s) - groupNo(b2.s)) || (b2.missing - a.missing) || (b2.na - a.na));

  const overdueCells = rows.reduce((a, r) => a + r.unk, 0);
  const zeroDone     = rows.filter(r => (r.na + r.nax + r.unk) === days.length).length;
  const wd = ds => '日一二三四五六'[new Date(ds + 'T00:00:00').getDay()];

  // 2026-11-08 回應一覽表：作業格與心得格混在同一張
  // 分頁標題已經寫過表名，內層只放統計（同一個雙標題的坑之前在「②／各組完成度」踩過一次）
  let h = `<div class="sec-title"><span>${overdueCells
      ? `<b style="color:#d9534f">⚠️ 教練還沒回報 ${overdueCells} 格（狀況不明）</b>` : '✅ 每一格教練都回報了'}</span><span class="sec-count">${
    days.length} 天 · ${realStudents.length} 位學員</span></div>`;
  h += `<div class="cov-note">
    ${[['full','✓','準時交了'],['part','6/8','作業只交一部分'],['part','填','只填行動紀錄、心得沒貼'],['part','貼','只貼心得、行動紀錄沒填'],['none','✕','沒交'],['full late','遲','學員 22:00 後才填'],['full mk','補','教練結案後才補標'],['unk','？','教練還沒回報'],['na','','還沒到期／未開放']].map(x => `<span class="hwm-lg"><i class="hwm-c ${x[0]}">${x[1]}</i>${x[2]}</span>`).join('')}<br>
    ✏️ <b>點格子可改</b>（只有總教練）｜👤 ${isReadonly ? '點學員名字看教練與領袖' : '點學員或教練名字 → 管理卡（資料、換組、退班都在那）'}｜滑過格子看判定理由${
      zeroDone ? `<br>⚠️ <b>${zeroDone} 人</b>整排都沒被處理——要找的是教練` : ''}</div>`;
  // 教練／領袖收進學員名字（Randoph：寬度有限）——hover 有 title、點一下彈出小卡，
  // 省下約 120px 給日期欄。名字帶點狀底線提示可點。
  h += `<div class="hwm-wrap"><table class="hwm"><tr>
    <th class="nm nm1">學員</th>`;
  days.forEach(ds => {
    const us = dayUnits[ds];
    const tag = us ? 'U' + us.join('·') : '心得';   // 排課日：學習組看作業、行動三組照樣看心得
    h += `<th title="${ds}（週${wd(ds)}）· ${tag}">${
      ds.slice(5).replace('-', '/')}<br><span class="hwm-u">${tag}</span></th>`;
  });
  h += `<th>缺</th></tr>`;
  let lastG = null;
  rows.forEach(r => {
    const gNow = groupByCoach[r.s.coach_id] || '未分組';
    if (gNow !== lastG) {          // 依組別分段：每組一列標題（組別・教練），找教練算帳最快
      lastG = gNow;
      h += `<tr class="hwm-gh"><td class="nm nm1">${gNow}</td><td colspan="${days.length + 1}">${
        whoC(r.s.coach_id, coachById[r.s.coach_id] || '未配對')} 教練</td></tr>`;
    }
    const cN = coachById[r.s.coach_id] || '—', sN = coachById[r.s.sponsor_id] || '—';
    const gFull = groupByCoach[r.s.coach_id] || '';
    h += `<tr><td class="nm nm1 who" data-n="${nm(r.s)}" data-c="${cN}" data-s="${sN}" 
             data-g="${gFull || '未分組'}"
             onclick="${isReadonly ? 'showWho(event,this)' : `event.stopPropagation();openStu('${r.s.id}')`}" title="教練 ${cN}｜領袖 ${sN}">${nm(r.s)}</td>`;
    days.forEach(ds => {
      const c = cellOf(r.s.id, ds);
      const mk = c.k === 'full' && mkSet.has(r.s.id + '|' + ds);
      const late = !c.hw && c.k === 'full' && !mk && lateSet.has(r.s.id + '|' + ds);   // 遲交只看心得格（作業沒有學員的時間戳）
      const canEdit = !isReadonly && c.k !== 'lock';
      h += `<td class="hwm-c ${c.k}${c.soft ? ' soft' : ''}${mk ? ' mk' : ''}${late ? ' late' : ''}${canEdit ? ' editable' : ''}"${
        canEdit ? ` onclick="openCellEdit(event,this,'${r.s.id}','${ds}','${scope}')"` : ''} title="${ds}（週${wd(ds)}）｜${c.why}${mk ? '｜教練結案後才補標' : ''}${late ? '｜學員 22:00 後才填' : ''}${canEdit ? '｜點一下可改' : ''}">${mk ? '補' : late ? '遲' : c.txt}</td>`;
    });
    const note = [r.unk ? `教練未回報 ${r.unk}` : '', r.na ? `待處理 ${r.na}` : ''].filter(Boolean).join(' · ');
    h += `<td class="hwm-sum">${r.missing ? `<b>${r.missing}</b>` : '0'}${
      note ? `<span style="color:var(--muted)">（${note}）</span>` : ''}</td></tr>`;
  });
  h += `</table></div>`;
  return h;
}

// 🎓 教練頁（2026-11-15）：一位教練一張卡
//   上半「他帶的組」＝教練自己該做的事：**完成度**圓環＋送出／回覆／檢核三條小橫條、每天送出小格、組員標籤。
//   下半「他的組織」＝選他當負責上線的學員（終身組＝他那組的學員，同教練頁 🌱組織 的規則）：推薦新人、組織締結、報件待他審、下線 3 個 ✕。
//   不帶組但有下線的人（總教練、總培訓師）也有卡，只有下半，排最後。
//   🔴 圓環、顏色、排序都看同一個完成度（Randoph：「百分比應該呼應關注的排序，不然全部都是紅色也怪怪的」）——
//      原本圓環＝回覆率、顏色＝「2 天沒送出就紅」、排序跟顏色，三樣各走各的，15 張有 12 張紅、分不出誰最該找。
// ════════════════════════════════════════════
function renderCoachPage(el) {
  el.innerHTML = '<div class="loading-box">整理中…</div>';
  paintCoachPage(el).catch(e => { el.innerHTML = `<div class="empty"><div class="empty-text">教練頁整理失敗：${e.message}</div></div>`; });
}
async function paintCoachPage(el) {
  const real = realStudentList().filter(s => !s.dropped_at);
  let cm = {}, closes = [], reads = [];
  try { cm = await loadCommit(sb, bid, real.filter(s => s.coach_id).map(s => s.id)); } catch (e) {}
  if (bid) {
    try { const r = await sb.from('closing_records').select('member_id, is_new, is_org, target_code, verified').eq('batch_id', bid); closes = r.data || []; } catch (e) {}
    try { const r = await sb.from('coach_status_reads').select('coach_id, read_date, read_at').eq('batch_id', bid).order('read_at', { ascending: false }); reads = r.data || []; } catch (e) {}
  }
  const ctx = ccCtx({ cm, closes }), env = ccEnv(ctx), cards = ccCards(ctx, env);
  // 📖 已讀（2026-11-19）：教練每天第一次進教練專區要先看「我的狀況」按「我知道了」，按的時間記在 coach_status_reads
  const rd = ccReadDate(new Date()), last = {}; reads.forEach(r => { if (!last[r.coach_id]) last[r.coach_id] = r; });
  const hm = ts => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const readTag = x => { if (!x.g) return ''; const r = reads.find(y => y.coach_id === x.c.id && y.read_date === rd) || last[x.c.id];   // 當天有讀就算已讀
    return r && r.read_date === rd ? `<span class="gc-read">📖 今天 ${hm(r.read_at).split(' ')[1]} 已讀</span>` : `<span class="gc-read no">📖 今天還沒看${r ? `（上次 ${hm(r.read_at)}）` : ''}</span>`; };
  const n = k => cards.filter(x => x.lvl === k).length, pill = (k, txt) => n(k) ? `<span class="gc-pill ${k}">${n(k)} 位 ${txt}</span>` : '';
  const card = (x, i) => ccCardHtml(x, ctx, env, { nameS: whoS, nameC: whoC, copyIdx: i, read: readTag(x) });
  coachData = { cards, card, head: `<div class="gc-sum">${pill('r', '要找他談')}${pill('y', '還有要補的')}${pill('g', '正常')}</div>` };
  drawCoachPage(el);
}

//   選了只顯示那一位的卡；選擇記在 coachPick，後台每 60 秒自動刷新重畫後照樣停在那一位。選「全部」回到完成度排序。

function setStuSort(k) { stuSort = k; const el = document.getElementById('ana-body-stu'); if (el && stuData) drawStuPage(el); }
function drawStuPage(el) {
  const { gs, cm } = stuData, today = localDateStr(new Date()), yest = yestStr(), logDays = logDaysMap();
  const OFF = 'rgba(255,255,255,.07)', HAND = { ok: '#22a05a', x: '#d9534f', warn: '#fb923c', na: OFF }, lv = r => r == null ? 'var(--muted)' : r >= .8 ? '#4ade80' : r >= .5 ? '#facc15' : '#f87171';
  const taught = typeof SCHEDULE === 'undefined' ? [] : Object.entries(SCHEDULE).filter(([d]) => d <= today).sort().flatMap(([, arr]) => arr);
  const hwBy = {}; hwRows.forEach(r => { hwBy[r.student_id + '|' + r.unit_no] = r; });
  const ptsOf = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0)+(l.attended||0)*2+namePts(l);
  const ptsBy = {}; allLogs.forEach(l => { ptsBy[l.student_id] = (ptsBy[l.student_id] || 0) + ptsOf(l); });

    const f = stuActFrom(s); let two = [], ico = '⚡';
    if (f && f <= yest) { const has = logDays[s.id] || new Set();
      for (let d = new Date(f + 'T00:00:00'); localDateStr(d) <= yest; d.setDate(d.getDate() + 1)) { const ds = localDateStr(d), on = has.has(ds); two.push({ col: on ? '#e9c46a' : OFF, t: `${ds.slice(5).replace('-', '/')}｜${on ? '有填行動回報' : '沒填'}`, ok: on }); } }
    else if (g.hasCourse) { ico = '📚'; two = taught.map(u => { const r = hwBy[s.id + '|' + u], full = r && r.total > 0 && r.done >= r.total, part = r && r.done > 0;
      return { col: full ? '#3b82f6' : part ? '#e0a020' : OFF, t: `第 ${u} 單元｜${full ? '全繳' : part ? `${r.done}/${r.total}` : '還沒檢核到'}`, ok: !!full }; }); }
    const hl = hand.filter(k => k.ok).length, tl = two.filter(k => k.ok).length, parts = [hand.length ? hl / hand.length : null, two.length ? tl / two.length : null].filter(v => v != null);
    return { g, s, c, hand, hl, two, tl, ico, pts: ptsBy[s.id] || 0, energy: parts.length ? parts.reduce((a, v) => a + v, 0) / parts.length : 1 };
  }));
  if (stuSort === 'energy') rows.sort((a, z) => a.energy - z.energy || z.c.x - a.c.x);
  else if (stuSort === 'x') rows.sort((a, z) => z.c.x - a.c.x || z.c.warn - a.c.warn || a.energy - z.energy);
  const btn = (k, t) => `<button class="sub-tab${stuSort === k ? ' on' : ''}" style="padding:5px 14px;font-size:12.5px" onclick="setStuSort('${k}')">${t}</button>`;
  let h = `<div class="cov-note"><b>自己的承諾</b>：五格，跟學員自己看到的一樣（✕ 沒交、❗ 等教練確認）｜<b>📤 交件能量</b>：一格一天，綠＝有交、紅＝沒交、橘＝等教練確認｜<b>⚡ 行動能量</b>：一格一天，亮＝那天有填行動回報`
    + `｜<b>📚 作業</b>（學習組上課週）：一格一個單元，藍＝全繳、橘＝交一部分｜滑過格子看是哪一天｜名字點了開管理卡</div>`
    + `<div class="st-sort"><span>排序</span>${btn('group', '依組別')}${btn('energy', '能量低的在前')}${btn('x', '✕ 多的在前')}</div>`

    h += `<tr><td class="nm">${whoS(r.s.id, nm(r.s))}${stuSort === 'group' ? '' : `<span class="c">${r.g.c.group_name || ''}</span>`}</td>`
      + `<td><div class="st-five">${commitBoxes(r.c, 19)}</div></td><td class="l">${batt(r.hand, r.hl)}</td><td class="l">${r.two.length ? r.ico + ' ' : ''}${batt(r.two, r.tl)}</td>`
      + `<td class="pts" style="color:${r.pts ? 'var(--gold)' : 'var(--muted)'}">${r.pts || '—'}</td></tr>`;

async function paintToday(el) {
  const now = new Date(), yest = localDateStr(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
  const b = batchRow(), from = b.submit_from || b.start_date, md = ds => +ds.slice(5, 7) + '/' + +ds.slice(8);
  const real = realStudentList().filter(s => !s.dropped_at && s.coach_id);
  const ac = approvedCoaches().filter(c => real.some(s => s.coach_id === c.id));          // 有帶組的教練
  const sub = new Set(submitRows.map(r => r.coach_id + '|' + r.log_date));
  const yOver = (() => { const dl = new Date(yest + 'T12:00:00'); dl.setDate(dl.getDate() + 1); return now > dl; })();
  const wkday = ds => { const w = new Date(ds + 'T00:00:00').getDay(); return w >= 1 && w <= 5; };
  const need = (c, ds) => !!from && ds >= from && (!b.end_date || ds <= b.end_date) && (wkday(ds) || !(!c.track || c.track === 'learn'));   // 學習組週末不用送出

  // ✕／❗＋待審報件
  let cm = {}, pv = 0;

  if (bid) try { const r = await sb.from('closing_records').select('id', { count: 'exact', head: true }).eq('batch_id', bid).is('verified', null); pv = r.count || 0; } catch (e) {}

  const noSub = ac.map(c => ({ c, n: coachDays(c).filter(d => d.k === 'none').length })).filter(x => x.n).sort((a, z) => z.n - a.n);   // 開班至今累積沒送出的天數（同教練卡的小格）
  const pend = yOver ? [] : ac.filter(c => need(c, yest) && !sub.has(c.id + '|' + yest));   // 昨天的、今天中午前還來得及
  const x3 = real.filter(s => (cm[s.id] || {}).x >= 3).sort((a, z) => cm[z.id].x - cm[a.id].x);
  const warnBy = {}; real.forEach(s => { const w = (cm[s.id] || {}).warn || 0; if (w) warnBy[s.coach_id] = (warnBy[s.coach_id] || 0) + w; });

  const more = (arr, f, n) => arr.length <= n ? arr.map(f).join('') : arr.slice(0, n).map(f).join('')
    + `<span class="td-chip more" onclick="this.nextElementSibling.style.display='contents';this.remove()">…還有 ${arr.length - n} 位 ▾</span><span style="display:none">${arr.slice(n).map(f).join('')}</span>`;
  const item = (cls, ico, title, note, chips) => `<div class="td-item ${cls}"><div class="td-t">${ico} ${title}${note ? `<small>${note}</small>` : ''}</div>${chips ? `<div class="td-chips">${chips}</div>` : ''}</div>`;

  const items = [];
  if (noSub.length) items.push(item('r', '🎓', `${noSub.length} 位教練有回報沒送出`, '開班至今累積的天數；過了隔天中午還沒按送出', more(noSub, x => chip(whoC(x.c.id, nm(x.c)), `${x.c.group_name ? x.c.group_name + '・' : ''}${x.n} 天`), 14)));
  if (x3.length)    items.push(item('r', '⭐', `${x3.length} 位學員已經 3 個 ✕`, '到了退班線，要不要退由你們決定', more(x3, s => chip(whoS(s.id, nm(s)), `✕ ${cm[s.id].x}`), 12)));
  if (pend.length)  items.push(item('y', '⏰', `今天中午 12:00 前，還有 ${pend.length} 位教練沒送出昨天（${md(yest)}）的回報`, '過了中午就算沒送出', more(pend, c => chip(whoC(c.id, nm(c)), c.group_name || ''), 14)));
  if (warnC.length) items.push(item('y', '❗', `${warnC.length} 位教練有格子還沒確認，學員頁面顯示驚嘆號`, '沒送出，或標了已交但沒逐題檢核；補上就恢復星星', more(warnC, c => chip(whoC(c.id, nm(c)), `${warnBy[c.id]} 格`), 12)));

}

//    「學員沒有繳，教練就沒辦法回，所以有看沒辦法回也是一種回」。
//    只算 homework_replied===true 的話，教練會因為「學員沒交」而被扣分——
//    他明明進來看了、也判斷了，那天該做的就做完了。
//    ⚠️ 放寬的是分子，分母維持「組員數 × 天數」固定不變；
//       絕不可以改成用交件數當分母，那又回到「怠惰的人自己決定自己的成績」。
//    也不要讓教練在學員沒交時去點「已回」——那會把「沒東西可回」和「真的回了」
//    壓成同一個值，以後就查不出「交了但沒回」這種真怠惰（coach-review 已擋）。
const coachDone = r => !!r && r.homework !== null && r.homework !== undefined
  && (r.homework === false || r.homework_replied === true);

function batchRow() { return allBatches.find(x => x.id === bid) || {}; }
function batchKind() { return batchRow().study_start ? 'study' : 'action'; }
function hasHomework() { return batchKind() === 'study'; }
// 28 期起班別掛在「組」上（batch_coaches.track）：null／learn＝學習組，其餘直接行動
// 組別排序用：「第十三組」→ 13（未分組排最後）
const CH_NUM = { 一:1, 二:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10 };
function groupNo(s) {
  const c = coaches.find(x => x.id === s.coach_id);
  const g = (c && c.group_name) || '';
  const m = g.match(/第(.+)組/); if (!m) return 999;
  const t = m[1];
  if (t.length === 1) return CH_NUM[t] || 999;
  if (t[0] === '十') return 10 + (CH_NUM[t[1]] || 0);
  return CH_NUM[t[0]] ? CH_NUM[t[0]] * 10 + (CH_NUM[t[2]] || 0) : 999;
}

function stuIsLearn(s) { const c = coaches.find(x => x.id === s.coach_id); return !c || !c.track || c.track === 'learn'; }
// 學習組的行動一覽表起點：study_end 之後第一個週一（2026-08-25 Randoph 定）
function learnActFrom() {
  const b = batchRow();
  if (!b.study_end) return actionStartDate();
  const d = new Date(b.study_end + 'T00:00:00');
  do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 1);
  return localDateStr(d);
}
function stuActFrom(s) { return stuIsLearn(s) ? learnActFrom() : actionStartDate(); }

// 🔴 行動紀錄的起算日＝行動開放日，不是開班日。
//    學習班在 action_open_date 之前，七大行動是鎖住的（三層防護：CSS 灰掉＋移除 onclick＋函式內 return），
//    把那幾天算進分母＝罰學員沒做我們不讓他做的事。實測 27 期：19% → 30%。
//    行動班 action_open_date 為 NULL → 自動退回 start_date，同一條規則兩種班都對。
function actionStartDate() { const b = batchRow(); return b.action_open_date || b.start_date; }

let anaTab = 'daily';          // 記住當前子分頁，重繪不跳回第一頁
function renderAnalysis(el) {
  const list = anaSections();
  if (!list.some(a => a.k === anaTab)) anaTab = list[0].k;      // 換期別可能少了某頁
  el.innerHTML = `<div class="sub-bar">` + list.map(a =>
    `<button class="sub-tab ${a.k === anaTab ? 'on' : ''}" onclick="setAnaTab('${a.k}')">${a.t}</button>`
  ).join('') + `</div>` + list.map(a =>
    `<div class="ana-sec" id="ana-${a.k}" style="display:${a.k === anaTab ? '' : 'none'}">
       <div class="ana-hd">${a.t}<span>${typeof a.d === 'function' ? a.d() : a.d}</span></div>
       <div id="ana-body-${a.k}"></div></div>`
  ).join('');
  paintAnaTab(anaTab);
}
// lazy render：切到才畫。省掉「四節一次全渲染」——首次載入本來要多畫 3 頁。
const anaPainted = new Set();
function paintAnaTab(k) {
  if (anaPainted.has(k)) return;
  const sec = anaSections().find(a => a.k === k);
  const body = document.getElementById('ana-body-' + k);
  if (!sec || !body) return;
  sec.render(body);
  anaPainted.add(k);
}
function setAnaTab(k) {
  anaTab = k;
  anaSections().forEach(a => {
    const sec = document.getElementById('ana-' + a.k);
    if (sec) sec.style.display = a.k === k ? '' : 'none';
  });
  document.querySelectorAll('.sub-bar .sub-tab').forEach(b =>
    b.classList.toggle('on', b.textContent === (anaSections().find(a => a.k === k) || {}).t));
  paintAnaTab(k);
  window.scrollTo({ top: 0, behavior: 'smooth' });        // 切頁一律回到頂端
}

// 點學員名字彈出「教練／領袖」——兩欄常駐太吃寬度，但責任歸屬又必須查得到
function showWho(ev, td) {

// ── 總教練直接改格子（2026-09-16 Randoph：每次都要進 code 改太不方便）──
//    改的是 coach_engagement.homework——跟教練在自己頁面標的是同一筆，兩邊立刻一致。
//    🔴 不寫 homework_checks：那是逐題紀錄，總教練沒逐題看過，寫進去會蓋掉真相。
let cellEdit = null;
function openCellEdit(ev, td, sid, ds, scope) {
  ev.stopPropagation();
  const units = (scope === 'action' || !stuIsLearn(students.find(x => x.id === sid) || {})) ? [] : ((SCHEDULE || {})[ds] || []);
  cellEdit = { sid, ds, units };
  let box = document.getElementById('cellPop');
  if (!box) { box = document.createElement('div'); box.id = 'cellPop'; box.className = 'cell-pop'; document.body.appendChild(box); }
  const s = students.find(x => x.id === sid) || {};
  const src = units.length ? `U${units.join('·')} 逐題檢核` : '教練標記';
  const e = engRows.find(r => r.student_id === sid && r.log_date === ds) || {};
  const now = e.homework === true ? ('已交・' + (e.homework_replied ? '已回' : '還沒回'))
            : e.homework === false ? '沒交' : '未回報';
  const isMk = mkSet.has(sid + '|' + ds);
  box.innerHTML = `<b>${nm(s)}　${ds.slice(5).replace('-','/')}　<span style="color:var(--muted);font-weight:400">改的是：${src}</span></b>
    <div style="font-size:12px;color:var(--muted);margin:-2px 0 4px">目前：${now}${isMk ? '（紫「補」＝教練結案後才標的）' : ''}</div>`
    + (isMk ? `<button onclick="clearMakeup()">🕊️ 取消補標，改回準時（變綠）</button>` : '')
    + `<button onclick="setCellHw(true, true)">✅ 已交＋💬 已回</button>
    <button onclick="setCellHw(true, false)">✅ 已交（教練還沒回）</button>
    <button onclick="setCellHw(false)">❌ 沒交</button>
    <button onclick="setCellHw(null)">↩️ 清掉（回到未回報）</button>`;
  const r = td.getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = Math.min(r.left + window.scrollX, window.innerWidth - box.offsetWidth - 12) + 'px';
  box.style.top  = (r.bottom + window.scrollY + 4) + 'px';
}
// 補交標記打錯了就能拿掉（2026-09-16 Randoph：教練手機出問題，學員其實準時交）
async function clearMakeup() {
  if (!cellEdit) return;
  const { sid, ds } = cellEdit;
  const box = document.getElementById('cellPop'); if (box) box.style.display = 'none';
  const { error } = await sb.from('makeup_records').delete()
    .eq('batch_id', bid).eq('student_id', sid).eq('log_date', ds).eq('subject', 'student');
  if (error) { alert('刪不掉：' + error.message); return; }
  makeupRows = makeupRows.filter(r => !(r.student_id === sid && r.log_date === ds && r.subject === 'student'));
  renderNow();
  const s2 = students.find(x => x.id === sid) || {};
  toast(`${nm(s2)} ${ds.slice(5).replace('-','/')} 補標紀錄已取消，改回準時`);
}

// 🔴 2026-09-16：一定要改「決定這一格的那條線」，否則點了畫面不動。
//    作業格的優先序是 ①逐題紀錄 ②教練標記——有排單元就直接寫逐題，只寫教練標記會被①蓋住（高瑜均實例）。
async function setCellHw(val, replied) {
  // 2026-09-17：原本只改「已交」，教練的「已回」救不回來（教練手機壞掉時兩個都標不了）
  if (!cellEdit) return;
  const { sid, ds, units } = cellEdit;
  const stu = students.find(x => x.id === sid);
  if (!stu || !stu.coach_id) { alert('這位學員還沒配對教練，無法標記'); return; }
  const box = document.getElementById('cellPop'); if (box) box.style.display = 'none';

  if (units.length) {                      // 作業格：寫逐題紀錄
    for (const uno of units) {
      const u = (typeof UNITS !== 'undefined') && UNITS.find(x => x.no === uno);
      if (!u) continue;
      const total = u.hw.length;
      if (val === null) {                  // 清掉＝刪掉逐題紀錄，回到未檢核
        await sb.from('homework_checks').delete()
          .eq('batch_id', bid).eq('student_id', sid).eq('unit_no', uno);
        hwRows = hwRows.filter(r => !(r.student_id === sid && r.unit_no === uno));
        continue;
      }
      const items = {}; u.hw.forEach((_, i2) => items[String(i2 + 1)] = !!val);
      const done = val ? total : 0;
      const { error } = await sb.from('homework_checks').upsert({
        batch_id: bid, student_id: sid, coach_id: stu.coach_id, unit_no: uno,
        items, done, total, updated_at: new Date().toISOString()
      }, { onConflict: 'batch_id,student_id,unit_no' });
      if (error) { alert('儲存失敗：' + error.message); return; }
      const hit = hwRows.find(r => r.student_id === sid && r.unit_no === uno);
      if (hit) { hit.done = done; hit.total = total; }
      else hwRows.push({ student_id: sid, unit_no: uno, done, total, coach_id: stu.coach_id });
    }
  }
  // 教練標記那條線一起對齊（行動格只有這一條）
  const { error } = await sb.from('coach_engagement').upsert({
    batch_id: bid, coach_id: stu.coach_id, student_id: sid, log_date: ds, homework: val,
    homework_replied: val === true ? !!replied : null      // 沒交／清掉時「已回」一併清掉，避免「沒交卻已回」
  }, { onConflict: 'batch_id,student_id,log_date' });
  if (error) { alert('儲存失敗：' + error.message); return; }
  const hit = engRows.find(r => r.student_id === sid && r.log_date === ds);
  const rep = val === true ? !!replied : null;
  if (hit) { hit.homework = val; hit.homework_replied = rep; }
  else engRows.push({ coach_id: stu.coach_id, student_id: sid, log_date: ds, homework: val, homework_replied: rep });

  renderNow();      // 重畫分析分頁，四張表一起跟上
  // 2026-09-20：顏色常常不會變（綠→綠、紫→紫），沒有回饋就像沒反應 → 明確說改成什麼
  toast(`${nm(stu)} ${ds.slice(5).replace('-','/')} 已改成「${val === null ? '未回報' : val ? (replied ? '已交・已回' : '已交・還沒回') : '沒交'}」`);
}

function renderHwSection(target, scope) {
  const coachMemberIds = new Set(coaches.map(c => c.member_id).filter(Boolean));
  // 🔴 2026-09-24 Randoph：一覽表不列退班者。退班只寫 dropped_at、status 維持 approved，
  //    所以這裡要自己濾——否則人走了，格子還會一路長出「灰？」與「紅✕」畫到結業日
  //    （記點早就凍結在退班當下，但畫面上看起來像個缺件越堆越高的人）。
  //    ⚠️ 歷史沒有刪掉：歸隊（dropped_at 設回 null）他就整列回來，結案報表也另外撈全部的人。
  const realStudents = students.filter(s => s.status === 'approved' && !s.dropped_at && !coachMemberIds.has(s.member_id));
  const coachById = {}; coaches.forEach(c => coachById[c.id] = nm(c));
  target.insertAdjacentHTML('beforeend', renderHwMatrix(realStudents, coachById, scope) ||
    `<div class="dash-empty">還沒有可顯示的日子（開班日 ${batchRow().start_date || '未設定'}）</div>`);
}

// ── 開班前：全綠才能開班 ──────────────────────────────
function phaseBefore() {
  const b = allBatches.find(x => x.id === bid) || {};
  const appr = students.filter(s => s.status === 'approved');
  const apprCoaches = coaches.filter(c => c.status === 'approved');
  // 🔴 真學員＝排除「教練自己的那一筆 batch_students」，判斷依據是 member_id 在教練名單裡，
  //    **不是** coach_id 為空。用 coach_id 判會把「還沒分組的真學員」誤算成教練身分
  //    （2026-09-12 殷鈺寒就被算成「含教練身分 1」）。
  const coachMids = new Set(apprCoaches.map(c => c.member_id).filter(Boolean));
  const stu = appr.filter(s => !coachMids.has(s.member_id));      // 真學員（含未分組）
  const coachAsStu = appr.filter(s => coachMids.has(s.member_id)); // 教練的學員身分
  const paired = stu.filter(s => s.coach_id);
  const coachById = {}; apprCoaches.forEach(c => coachById[c.id] = c);

  const ck = [];
  // go = ['哪個 Tab','要捲到的元素 id']——清單當目錄用，紅的點下去直接到該處理的那一段
  const add = (lvl, t, d, go) => ck.push({ lvl, t, d, go });
  const few = (arr, n = 6) => arr.slice(0, n).map(nm).join('、') + (arr.length > n ? '…' : '');

  // ① 人數：原本是清單上方四格數字，2026-09-12 Randoph「歸入清單顯示即可」
  const withGrp = apprCoaches.filter(c => c.group_name).length;
  add('ok', '人數',
    `教練 <b>${apprCoaches.length}</b> 位（${withGrp} 位帶組、${apprCoaches.length - withGrp} 位不帶組）`
    + ` ｜ 學員 <b>${stu.length}</b> 位（已配對 ${paired.length}）`
    + `<br><span style="color:var(--muted)">教練另有 ${coachAsStu.length} 筆學員身分，是給他們自己填回報用的，不算學員</span>`);

  // ② 報名審核
  const pendC = coaches.filter(c => c.status === 'pending');
  const pendS = students.filter(s => s.status === 'pending');
  const pend = pendC.length + pendS.length;
  add(pend ? 'warn' : 'ok', '報名審核',
    pend ? `<b>${pend} 人待審</b>：教練 ${pendC.length}、學員 ${pendS.length}`
         : '沒有待審的人', ['check','reviewArea']);

  // ③ 教練的學員身分（27 期踩過：漏掉 → 教練六天存不了回報）
  const noIdentity = apprCoaches.filter(c => !coachAsStu.some(s => s.member_id === c.member_id));
  add(noIdentity.length ? 'bad' : 'ok', '教練的學員身分',
    noIdentity.length ? `<b>${noIdentity.length} 位教練沒有 batch_students 紀錄</b>：${few(noIdentity, 99)}<br>→ 他們的「儲存我的回報」會是灰的，開班就存不了。見 wiki「開新班期檢查清單」第 1 步`
      : `${apprCoaches.length} 位教練都有`);

  // ④ 學員分組——原本寫死 'ok'，就算有人沒分組也是綠的（2026-09-12 修）
  const noCoach = stu.filter(s => !s.coach_id);
  add(noCoach.length ? 'bad' : 'ok', '學員分組',
    noCoach.length ? `<b>${noCoach.length} 位還沒分組</b>：${few(noCoach)}<br>→ 沒有教練＝沒人標他的作業，記點會全部落在他身上`
      : `${paired.length} 位全部分組完成`, ['check','pairArea']);

  // ⑤ 班別相符（新增 2026-09-12）：學員 track 必須等於他那一組的 track。
  //    不符的話系統會發錯東西——行動組的人收到作業、學習組的人沒課表。
  const badTrack = paired.filter(s => {
    const c = coachById[s.coach_id];
    return c && (s.track || 'learn') !== (c.track || 'learn');
  });
  add(badTrack.length ? 'bad' : 'ok', '班別相符',
    badTrack.length ? `<b>${badTrack.length} 位的班別跟他那一組不一樣</b>：`
        + badTrack.slice(0,6).map(s => `${nm(s)}（${trackName(s.track)} → ${coachById[s.coach_id].group_name||'?'} 是${trackName(coachById[s.coach_id].track)}）`).join('、')
        + `<br>→ 系統靠組的 track 決定發作業還是發行動，不符就會發錯`
      : '每位學員的班別都跟他那一組相同', ['roster','rosterArea']);

  // ⑥ 交叉配對（新增 2026-09-12）：教練不能帶自己的下線。硬規則，原本完全沒在檢查。
  const selfPair = paired.filter(s => s.sponsor_id && s.sponsor_id === s.coach_id);
  add(selfPair.length ? 'bad' : 'ok', '交叉配對（教練不帶自己下線）',
    selfPair.length ? `<b>${selfPair.length} 位被配給自己的上線</b>：${few(selfPair)}`
      : '沒有人被配給自己的上線', ['roster','rosterArea']);

  // ⑦ 精英組席次：29 期沒有精英組，2026-10-23 拿掉

  // ⑧ 上線
  const noSp = stu.filter(s => !s.sponsor_id && s.track !== 'lifetime');   // 終身組（高峰）不用引路人，2026-11-06
  add(noSp.length ? 'warn' : 'ok', '上線',
    noSp.length ? `${noSp.length} 人未設上線：${few(noSp)}` : '全部已設', ['roster','orgArea']);

  // ⑨ 教練組別
  // 2026-11-08 Randoph：總教練、總培訓師本來就不帶組 → 沒組別又沒組員＝不帶組（正常）；有組員卻沒組別才警示
  const noGrpAll = apprCoaches.filter(c => !c.group_name);
  const noGrp = noGrpAll.filter(c => paired.some(s => s.coach_id === c.id));
  const noLead = noGrpAll.filter(c => !noGrp.includes(c));
  add(noGrp.length ? 'warn' : 'ok', '教練組別',
    noGrp.length ? `<b>${noGrp.length} 位有組員卻沒設組別</b>：${few(noGrp, 99)}`
      : `全部已設${noLead.length ? `（不帶組：${few(noLead, 99)}）` : ''}`, noGrp.length ? ['roster','rosterArea'] : null);

  // ⑩ 繳費（排除教練——教練不用繳，算進去只會製造雜訊）
  const unpaid = stu.filter(s => !s.payment_confirmed);
  add(unpaid.length ? 'warn' : 'ok', '繳費確認（不含教練）',
    unpaid.length ? `<b>${unpaid.length} 位學員未確認</b>：${few(unpaid)}` : `${stu.length} 位學員全部確認`, ['check','financeArea']);

  // ⑪ DB 設定
  const md = s => s ? `${+s.slice(5,7)}/${+s.slice(8,10)}` : '—';
  const miss = [];
  if (!b.start_date || !b.end_date) miss.push('開班／結業日');
  if (!b.study_start || !b.study_end) miss.push('學習組上課期間');
  if (!b.coach_mode) miss.push('教練模式');
  add(miss.length ? 'bad' : 'ok', '班期設定',
    miss.length ? `<b>缺：${miss.join('、')}</b>`
      : `${md(b.start_date)} 開班～${md(b.end_date)} 結業｜學習組上課 ${md(b.study_start)}～${md(b.study_end)}｜行動 ${b.action_open_date ? md(b.action_open_date) + ' 開放' : '不鎖'}｜教練${b.coach_mode === 'full' ? '逐項審核' : '只勾有交／沒交'}`);

  // ⑫ 課表對齊（units.js 的 SCHEDULE 首末日 vs 班期）——27/28 期都踩過
  let sd = null, ed = null;
  if (typeof SCHEDULE !== 'undefined') { const ks = Object.keys(SCHEDULE).sort(); sd = ks[0]; ed = ks[ks.length-1]; }
  const okSched = sd && b.study_start && sd === b.study_start && ed === b.study_end;
  add(okSched ? 'ok' : 'bad', '課表日期',
    !sd ? '課表檔沒載入，重新整理一次'
      : okSched ? `課表 ${md(sd)}～${md(ed)}，跟學習組上課期間一致`
      : `<b>對不上</b>：課表排 ${md(sd)}～${md(ed)}，學習組上課期間是 ${md(b.study_start)}～${md(b.study_end)}<br>→ 請 Claude 改課表（共四個地方）`);

  // ⑬ 報名開關——原本不管開或關都是綠的（2026-09-12 修）：
  //    開班前沒開＝招不到人；開班後還開著＝新報名會混進正在跑的這一期。
  const today = localDateStr(new Date());
  const started = b.start_date && today >= b.start_date;
  add(b.registration_open === !started ? 'ok' : 'warn', '報名狀態',
    b.registration_open
      ? (started ? '<b>🟢 還開著，但已經開班了</b><br>→ 新報名會混進這一期，通常該關了'
                 : '🟢 開放中——新報名會寫進這一期')
      : (started ? '已關閉（開班後就該關）'
                 : `<b>🔴 關閉中，但還沒開班</b>（${b.start_date || '未設'}）<br>→ 報名頁現在收不到人`),
    null);

  const bad = ck.filter(c => c.lvl === 'bad').length, warn = ck.filter(c => c.lvl === 'warn').length;
  let h = `<div class="ck-sum ${bad ? 'no' : 'go'}">${bad ? `🔴 有 ${bad} 項必須處理才能開班` : warn ? `🟡 可以開班，但有 ${warn} 項建議先確認` : '🟢 全部就緒，可以開班'}</div>`;
  h += `<div class="sec-title"><span>📋 開班前檢查清單</span><span class="sec-count">${b.name || ''}　${ck.length} 項</span></div>`;
  const ICO = { ok:'✅', warn:'🟡', bad:'🔴' };
  // 2026-11-08 Randoph：完成的折疊，只攤開有警示的
  const ckRow = c => `<div class="ck ${c.lvl}"><div class="ck-ico">${ICO[c.lvl]}</div>` +
    `<div class="ck-b"><div class="ck-t">${c.t}</div><div class="ck-d">${c.d}</div></div>` +
    (c.go ? `<button class="ck-go" onclick="jump('${c.go[0]}','${c.go[1]}')">去處理 →</button>` : '') +
    `</div>`;
  ck.filter(c => c.lvl !== 'ok').forEach(c => h += ckRow(c));
  const oks = ck.filter(c => c.lvl === 'ok');
  if (oks.length) h += `<details class="ck-done"><summary>✅ 已完成 ${oks.length} 項（點開看）</summary>${oks.map(ckRow).join('')}</details>`;
  return h;
}


// ── 開班後：結案報表 ──────────────────────────────
function phaseAfter() {
  const b = allBatches.find(x => x.id === bid) || {};
  const coachMids = new Set(coaches.map(c => c.member_id));
  const stu = students.filter(s => s.status === 'approved' && s.coach_id);
  const byStu = {}; allLogs.forEach(l => (byStu[l.student_id] = byStu[l.student_id] || []).push(l));
  const act = l => (l.name_list||0)+(l.meet||0)+(l.invite||0)*2+(l.present||0)*5+(l.seminar||0)*5+(l.ghosted||0)+(l.rejected||0)+(l.attended||0)*2+namePts(l);
  const talk = l => (l.present||0)+(l.seminar||0);

  // 分診四群（沿用 26 期結案的漏斗判定，見 [[26期結案反思]]）
  let g1=0,g2=0,g3=0,g4=0;
  const closeByMid = {};
  stu.forEach(s => {
    const ls = byStu[s.id] || [];
    const hits = ls.reduce((a,l)=>a+act(l),0);
    const talks = ls.reduce((a,l)=>a+talk(l),0);
    const closes = 0; // 締結需另查，這裡以行動漏斗為主
    if (!hits) g1++; else if (!talks) g2++; else g3++;
  });
  const filled = stu.filter(s => (byStu[s.id]||[]).length).length;
  const hwDone = new Set(hwRows.filter(r => r.total>0 && r.done>=r.total).map(r => r.student_id)).size;
  const certDone = stu.filter(s => s.cert_comment).length;

  let h = `<div class="sec-title"><span>📊 結案報表</span><span class="sec-count">${b.name||''}　${b.start_date}～${b.end_date}</span></div>`;
  h += `<div class="dash-progress">
    <div class="dash-prog-card"><div class="dash-prog-n">${filled} / ${stu.length}</div><div class="dash-prog-l">曾填報學員</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${allLogs.length}</div><div class="dash-prog-l">回報總筆數</div></div>
    <div class="dash-prog-card"><div class="dash-prog-n">${certDone} / ${stu.length}</div><div class="dash-prog-l">證書評語已寫</div></div>
  </div>`;
  h += `<div class="cov-note">分診（依 [[26期結案反思]] 的漏斗，順序不可顛倒）：<br>
    ① 整期沒出手 <b>${g1}</b> 人　② 有出手沒進到溝通 <b>${g2}</b> 人　③ 溝通過 <b>${g3}</b> 人<br>
    ⚠️ ③ 裡面「溝通過但零締結」才是最該救的那群——他們通常比 ② 更努力。溝通場次是締結的真門檻。</div>`;
  // 🚪 退班報表（2026-08-25）：下一期開班前拿來看「什麼時候最容易掉人」
  const goneList = stu.filter(x => x.dropped_at)
    .map(x => ({ name: nm(x), d: x.dropped_at, coach: coachById[x.coach_id] || '未配對' }))
    .sort((a, c) => a.d.localeCompare(c.d));
  const wkOf = d => Math.floor((new Date(d + 'T00:00:00') - new Date(b.start_date + 'T00:00:00')) / 604800000) + 1;
  h += `<div class="sec-title"><span>🚪 退班</span><span class="sec-count">${goneList.length} 人</span></div>`;
  if (!goneList.length) h += `<div class="dash-empty">這一期沒有人退班 🎉</div>`;
  else {
    h += `<table class="dm-tbl"><tr><th>退班日</th><th>第幾週</th><th>學員</th><th>教練</th></tr>`;
    goneList.forEach(g => h += `<tr><td>${g.d.slice(5).replace('-','/')}</td><td>第 ${wkOf(g.d)} 週</td>
      <td>${g.name}</td><td>${g.coach}</td></tr>`);
    h += `</table><div class="cov-note" style="margin-top:0">
      看的是<b>時間點</b>不是名單：集中在同一週＝那一週的內容或節奏有問題；分散＝個別狀況。<br>
      退班者的點數已凍結在退班當下，上面的記點表不會再累加。</div>`;
  }
  h += `<div class="sec-title"><span>✅ 結案待辦</span></div>`;
  const todo = [
    [certDone >= stu.length, `結業證書評語：已寫 ${certDone}／${stu.length}`],
    [hwRows.length > 0, `作業檢核紀錄：${hwRows.length} 筆（0 筆代表教練整期沒用過）`],
    [!b.is_active, `封存：把 is_active 切給下一期（目前${b.is_active ? '🔴 仍是當期' : '已封存'}）`],
    [false, `全期數據寫進 wiki 結案反思，並更新 [[資料架構規劃]]`],
  ];
  todo.forEach(([ok, t]) => h += `<div class="ck ${ok?'ok':'warn'}"><div class="ck-ico">${ok?'✅':'🟡'}</div><div class="ck-b"><div class="ck-t">${t}</div></div></div>`);
  return h;
}

// 👥 名冊：兩棵樹。管理員每一列有「✏️ 管理」（2026-11-13 起，見 openStu／openCoach）；教練唯讀模式看得到這一頁但沒有按鈕。
//   2026-09-12 Randoph：「上面是教練+學員（點開來看得到），下面是上線+下線」
//   原本是三個平鋪清單（16 張教練卡＋69 張學員卡＋組織圖），學員卡那段最長，
//   而且**混進 16 筆教練自己的學員身分**（coach_id 為 null，顯示成「未配對／未分組」）——
//   合成樹之後每個人只出現在他該在的位置，那 16 筆自然就不會冒出來。
//   要改資料一律去 🩺檢查，這裡一個 select 一個寫入鈕都沒有。
let rosterSearch = '';

// 真學員＝排除教練自己的那一筆 batch_students（見 開新班期檢查清單）
function realStudentList() {
  const coachMids = new Set(coaches.map(c => c.member_id).filter(Boolean));
  return students.filter(s => s.status === 'approved' && !coachMids.has(s.member_id));
}

// 一列組員／下線（唯讀）
function stuRow(s, meta) {
  const gone = !!s.dropped_at;
  return `<div class="coach-stu" data-find="${nm(s)} ${mc(s)}">
    <div><span class="coach-stu-name"${gone?' style="opacity:.55"':''}>${nm(s)}${mc(s)}</span>
      <span class="coach-stu-meta"> ｜ ${meta}${s.created_at?` ｜ 報名 ${regTime(s.created_at)}`:''}${
        gone?` ｜ <b style="color:#f87171">退班 ${s.dropped_at}</b>`:''}</span></div>
    ${isReadonly ? '' : `<button class="btn-edit" style="flex:0 0 auto;white-space:nowrap" onclick="openStu('${s.id}')">✏️ 管理</button>`}

}

// 一張可展開的卡（2026-11-13 起每一列有「✏️ 管理」→ 管理卡；教練唯讀模式不畫按鈕）
function treeCard(title, sub, tag, rows, count, zero, btn) {   // btn：標頭右邊的按鈕（教練的「管理」）
  return `<div class="coach-card" data-find="${title}">
    <div class="coach-header" onclick="this.parentElement.classList.toggle('open')">
      <div class="card-left">
        <div class="card-name">${title}${tag||''}</div>
        ${sub ? `<div class="card-meta">${sub}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${btn || ''}
        <span class="coach-count${zero?' zero':''}">${count}</span>
        <span class="coach-arrow">▼</span>
      </div>
    </div>
    <div class="coach-body">${rows || '<div class="coach-empty">尚無資料</div>'}</div>
  </div>`;
}

function renderRoster() {
  const el = document.getElementById('rosterArea');
  if (!el) return;
  const ac = approvedCoaches();
  const stu = realStudentList();
  // 組內依報名時間（2026-09-10 Randoph：「排序必須是報名時間」——先報先排）
  const byTime = (a, b) => (a.created_at || '').localeCompare(b.created_at || '');
  const byCoach = {};
  stu.forEach(s => { if (s.coach_id) (byCoach[s.coach_id] = byCoach[s.coach_id] || []).push(s); });

  let h = `<div class="toolbar">
    <input class="search-box" placeholder="搜尋姓名或編號，兩棵樹一起找…" value="${rosterSearch}"
           oninput="rosterSearch=this.value;filterRoster(this.value)">
  </div>`;
  h += `<div class="sec-title"><span>🎓 分組（教練 → 組員）</span>`
     + `<span class="sec-count">${ac.length} 組 / ${stu.length} 位學員</span></div>`;

  // 🔴 2026-11-06 依班別分段（Randoph：「學員名單用組別分」）——學／初／進／終各一段，段內先教練組、再該班尚未分組的學員。
  //    教練的班別：batch_coaches.track 有填就用；沒填看他組員多數在哪班；都沒有 → 列最後「還沒有組員的教練」
  const coachCard = c => {
    const my = (byCoach[c.id] || []).sort(byTime);
    return treeCard(
      `${c.group_name || '未分組'}　${nm(c)}${mc(c)}`,
      `目標 ${c.goal_close ? c.goal_close + ' 件' : '未填'} ｜ 榮譽資格 ${c.rank||'—'} ｜ 直屬 CFC ${c.cfc||'—'}`,
      trackTag(c.track),                       // 🔴 吃字串不是物件——傳物件會印出 undefined
      my.map(s => stuRow(s, `上線 ${sp(s)||'—'}`)).join(''),
      `${my.length} 名`, !my.length, coachBtn(c));
  };
  const coachTrack = c => {
    if (c.track) return c.track;
    const cnt = {};
    (byCoach[c.id] || []).forEach(s => { cnt[s.track] = (cnt[s.track] || 0) + 1; });
    return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '';
  };
  const order = [...Object.keys(TRACKS), ...Object.keys(TRACKS_OLD)];
  const keys = [...new Set([...order, ...stu.map(s => s.track || '')])]
    .filter(k => k && (stu.some(s => s.track === k) || ac.some(c => coachTrack(c) === k)));
  if (stu.some(s => !s.track)) keys.push('');
  keys.forEach(k => {
    const tStu = stu.filter(s => (s.track || '') === k);
    const tCoach = ac.filter(c => coachTrack(c) === k);
    const noCoach = tStu.filter(s => !s.coach_id).sort(byTime);
    h += `<div class="sec-title" style="margin-top:22px"><span>${k ? (TRACK_TAG[k] || '').split(' ')[0] + ' ' + trackLabel(k) : '❔ 沒有班別'}</span>`
       + `<span class="sec-count">${tCoach.length ? tCoach.length + ' 組 / ' : ''}${tStu.length} 位學員${
           noCoach.length ? `（未分組 ${noCoach.length}）` : ''}</span></div>`;
    h += tCoach.map(coachCard).join('');
    if (noCoach.length) h += treeCard(`⚠️ ${k ? trackLabel(k) : ''}尚未分組`, '點「✏️ 管理」指定教練；人多時到 🩺檢查 批次配對', '',
      noCoach.map(s => stuRow(s, `上線 ${sp(s)||'—'}`)).join(''), `${noCoach.length} 名`, true);
  });
  const idle = ac.filter(c => !coachTrack(c));
  if (idle.length) {
    h += `<div class="sec-title" style="margin-top:22px"><span>🧑‍🏫 還沒有組員的教練</span>`
       + `<span class="sec-count">${idle.length} 位</span></div>`;
    h += idle.map(coachCard).join('');
  }

  el.innerHTML = h;
}


async function deleteCoach(cid, cname) {
  if (!confirm(`確認刪除教練「${cname}」？\n（不會刪除會員資料，只移除教練身份）`)) return;
  const { error } = await sb.from('batch_coaches').delete().eq('id', cid);
  if (error) return alert('刪除失敗：' + error.message);
  toast('教練已刪除'); await load();
}

// 🚪 退班＝凍結，不是移除（2026-08-25 Randoph）
//   status 維持 approved（那是白名單，一改所有查詢都會漏），只寫 dropped_at。
//   效果：教練組員頁不再顯示、送出不被卡、學員端鎖住；一覽表與所有歷史資料完整保留。
//   可隨時「歸隊」還原——這也是不用 status 的另一個理由：復原只要清一個欄位。
async function dropStudent(sid, sname) {
  if (!confirm(`確認讓「${sname}」退班？\n\n`
    + `・資料完整保留，一覽表照樣看得到\n`
    + `・教練的組員頁不會再出現他，送出也不會被卡住\n`
    + `・他打開回報頁會看到「已暫停本期」\n\n`
    + `隨時可以按「歸隊」還原。`)) return;
  const t = new Date();
  const today = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  const { error } = await sb.from('batch_students').update({ dropped_at: today }).eq('id', sid);
  if (error) return alert('退班失敗：' + error.message);
  toast(`${sname} 已退班（${today}）`); await load();
}

async function undropStudent(sid, sname) {
  if (!confirm(`確認讓「${sname}」歸隊？\n\n他會重新出現在教練的組員頁，也能再填寫回報。`)) return;
  const { error } = await sb.from('batch_students').update({ dropped_at: null }).eq('id', sid);
  if (error) return alert('歸隊失敗：' + error.message);
  toast(`${sname} 已歸隊`); await load();
}

async function deleteStudent(sid, sname) {

function showDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const title = field === 'name_list' ? '名單' : '自我定位';
  let content = '';
  if (field === 'name_list') {
    const v = s.name_list;
    content = !v ? '（無資料）' : Array.isArray(v) ? v.join('、') : String(v);
  } else {
    content = s.introduction || '（無資料）';
  }
  const overlay = document.createElement('div');

    <div class="modal-title">${nm(s)} — ${title}</div>
    <div class="modal-body" id="modal-content-${sid}">${content.replace(/</g,'&lt;')}</div>
    <div id="modal-actions-${sid}">

      ${isReadonly ? '' : `<button class="modal-edit-btn" onclick="editDetail('${sid}','${field}')">編輯</button>`}
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function editDetail(sid, field) {
  const s = students.find(x => x.id === sid);
  if (!s) return;
  const contentEl = document.getElementById('modal-content-' + sid);
  const actionsEl = document.getElementById('modal-actions-' + sid);
  let val = '';
  if (field === 'name_list') {
    const v = s.name_list;
    val = !v ? '' : Array.isArray(v) ? v.join('\n') : String(v);
  } else {
    val = s.introduction || '';
  }
  const hint = field === 'name_list' ? '一行一個名字' : '';
  contentEl.innerHTML = `<textarea class="modal-textarea" id="modal-edit-val-${sid}">${val.replace(/</g,'&lt;')}</textarea>${hint ? '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+hint+'</div>' : ''}`;
  actionsEl.innerHTML = `<button class="modal-save-btn" onclick="saveDetail('${sid}','${field}')">儲存</button><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">取消</button>`;

async function saveDetail(sid, field) {
  const val = document.getElementById('modal-edit-val-' + sid).value.trim();
  let update = {};
  if (field === 'name_list') {
    update.name_list = val ? val.split('\n').map(s => s.trim()).filter(Boolean) : [];
  } else {
    update.introduction = val;
  }
  const { error } = await sb.from('batch_students').update(update).eq('id', sid);
  if (error) return alert('儲存失敗：' + error.message);
  document.querySelector('.modal-overlay')?.remove();
  toast('已更新'); await load();
}

// 👥 名冊的第二棵樹：引路（上線 → 下線）。每一列同樣有「✏️ 管理」，上線在管理卡裡改。
function renderOrg() {
  const el = document.getElementById('orgArea');
  if (!el) return;
  const ac = approvedCoaches();
  if (!ac.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">此班次尚無已批准教練</div></div>'; return; }
  const stu = realStudentList();
  const byTime = (a, b) => (a.created_at || '').localeCompare(b.created_at || '');
  const coachOf = s => { const c = coaches.find(x => x.id === s.coach_id); return c ? (c.group_name || nm(c)) : '未分組'; };

  let h = `<div class="sec-title" style="margin-top:24px"><span>🚩 引路（上線 → 下線）</span>`
        + `<span class="sec-count">誰把誰帶進來的</span></div>`;
  h += ac.map(c => {
    const my = stu.filter(s => s.sponsor_id === c.id).sort(byTime);
    return treeCard(`${nm(c)}${mc(c)}`, `電話 ${c.phone||'—'} ｜ 資格 ${c.rank||'—'}`, '',
      my.map(s => stuRow(s, coachOf(s))).join(''), `${my.length} 名`, !my.length, coachBtn(c));
  }).join('');

  // 終身組（高峰）不用引路人：單獨列一張，不算「未指定」（2026-11-06）
  const life = stu.filter(s => !s.sponsor_id && s.track === 'lifetime').sort(byTime);
  if (life.length) h += treeCard('👑 終身行動組（不需引路人）', '高峰以上自己報名，不計入引路', '',
    life.map(s => stuRow(s, coachOf(s))).join(''), `${life.length} 名`, true);
  const noSp = stu.filter(s => !s.sponsor_id && s.track !== 'lifetime').sort(byTime);
  if (noSp.length) h += treeCard('⚠️ 未指定上線', '點「✏️ 管理」設定負責上線', '',
    noSp.map(s => stuRow(s, coachOf(s))).join(''), `${noSp.length} 名`, true);

  el.innerHTML = h;
}

// 一個搜尋框過濾兩棵樹；🔴 命中在收起來的卡裡面，所以要自動展開

function filterRoster(t) {
  t = (t || '').trim().toLowerCase();
  ['rosterArea', 'orgArea'].forEach(id => {
    const box = document.getElementById(id);
    if (!box) return;
    box.querySelectorAll('.coach-card').forEach(card => {
      if (!t) { card.style.display = ''; card.classList.remove('open'); return; }
      const hitSelf = (card.dataset.find || '').toLowerCase().includes(t);
      let hitKid = false;
      card.querySelectorAll('.coach-stu').forEach(row => {
        const hit = (row.dataset.find || '').toLowerCase().includes(t);
        row.style.display = (hitSelf || hit) ? '' : 'none';
        if (hit) hitKid = true;
      });
      card.style.display = (hitSelf || hitKid) ? '' : 'none';
      card.classList.toggle('open', hitKid);          // 命中組員 → 展開讓人看到
    });
  });
}

async function saveStu(sid) {
  const s = students.find(x => x.id === sid); if (!s) return;
  const v = id => document.getElementById(id).value.trim(), up = {};
  const set = (k, nv) => { if ((s[k] || null) !== (nv || null)) up[k] = nv || null; };
  set('phone', v('pc-phone')); set('track', v('pc-track')); set('coach_id', v('pc-coach')); set('sponsor_id', v('pc-sponsor'));
  if (!Object.keys(up).length) { closeCard(); return toast('沒有變更'); }

    const to = coaches.find(x => x.id === up.coach_id), from = coaches.find(x => x.id === s.coach_id);
    if (!confirm(`確認把「${nm(s)}」從 ${from ? nm(from) + '（' + (from.group_name || '未分組') + '）' : '原本的組'} `
      + (to ? `換到 ${nm(to)}（${to.group_name || '未分組'}）？` : '改成「尚未分組」？'))) return;

  const { error } = await sb.from('batch_students').update(up).eq('id', sid);
  if (error) return alert('儲存失敗：' + error.message);
  closeCard(); toast(`${nm(s)} 的資料已更新`); await load();
}
