<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教練介面展示｜實戰班</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --gold:#b8960c; --gold-lt:#f5ecd5;
  --text:#2d2a24; --muted:#8c8577; --border:#e8e2d6;
  --green:#4a9e6f; --green-bg:#eaf5ef;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
.demo-note{background:#fff8e1;border-bottom:1px solid var(--gold);padding:10px 16px;font-size:12.5px;line-height:1.6;color:#7a6408;text-align:center}
.hd{background:var(--card);padding:18px 20px 14px;border-bottom:1px solid var(--border);text-align:center}
.hd-name{font-size:20px;font-weight:700;color:var(--gold)}
.hd-date{font-size:14px;color:var(--muted);margin-top:4px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:14px 6px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.daysel{display:flex;gap:8px;padding:12px 16px}
.daybtn{flex:1;padding:11px;border:2px solid var(--border);background:var(--card);border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.daybtn.on{border-color:var(--gold);background:var(--gold-lt);color:var(--gold)}
.panel{background:var(--card);margin:0 12px 14px;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.panel-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}
.panel-hd span:first-child{font-size:15px;font-weight:700;color:var(--gold)}
.panel-hd span:last-child{font-size:14px;color:var(--muted)}
.hint{padding:10px 16px;font-size:13px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--border)}
.hint b{color:var(--gold)}
.row{border-bottom:1px solid var(--border)}
.row-main{display:flex;align-items:center;gap:9px;padding:13px 14px}
.variant{display:flex;gap:8px;padding:12px 12px 0}
.vbtn{flex:1;padding:10px 6px;border:2px solid var(--border);background:var(--card);border-radius:10px;font-size:13.5px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.vbtn.on{border-color:var(--gold);background:var(--gold-lt);color:var(--gold)}
.nm{flex:1;font-size:16px;font-weight:600;min-width:52px}
.nm.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.nm .caret{color:var(--gold);font-weight:400;margin-left:5px;opacity:.65}
.nm .nofill{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.look{flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--gold-lt);border:1px solid rgba(184,150,12,.3);padding:5px 10px;border-radius:14px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.look.none{color:var(--muted);background:transparent;border-color:transparent;font-weight:400;cursor:default}
.btns{flex-shrink:0;display:flex;gap:5px}
.b{padding:8px 12px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:13.5px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s}
.b.stu.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.b.coach.on{background:var(--gold-lt);border-color:var(--gold);color:var(--gold)}
.detail{display:none;padding:0 14px 14px}
.detail.open{display:block}
.detail-in{background:var(--bg);border-radius:11px;padding:12px 14px}
.detail-t{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.ditem{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ditem span:last-child{font-weight:900;color:var(--gold)}
.ditem.z span:last-child{color:#c9c2b4}
.dclose{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.dclose span:last-child{color:var(--green)}
.total{padding:14px 16px;text-align:center;font-size:14px;font-weight:700;color:var(--gold);background:var(--gold-lt)}
.ft{text-align:center;padding:22px 16px 30px;font-size:11.5px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <div class="demo-note">
    這是<b>展示頁</b>：全部是假資料，不連資料庫、不需要 LINE 登入。<br>
    兩顆鈕可以按著玩，不會存到任何地方。<b>下面兩種按法都試一下，比較哪個順手。</b>
  </div>

  <div class="variant">
    <button class="vbtn" id="vA" onclick="setVariant('tag')">A · 點「行動填寫」</button>
    <button class="vbtn" id="vB" onclick="setVariant('name')">B · 點姓名</button>
  </div>

  <div class="hd">
    <div class="hd-name">游育杰</div>
    <div class="hd-date">8/11（二）</div>
  </div>

  <div class="tabs">
    <div class="tab">自己回報</div>
    <div class="tab on">學員</div>
    <div class="tab">指南</div>
  </div>

  <div class="daysel">
    <div class="daybtn">昨天</div>
    <div class="daybtn on">今天</div>
  </div>

  <div class="panel">
    <div class="panel-hd"><span>作業繳交</span><span>8/11</span></div>
    <div class="hint">學員交作業了嗎？教練回了嗎？兩個各點一下記錄。<br><b>點一下就自動儲存，不需要再按送出</b></div>
    <div id="rows"></div>
    <div class="total" id="total"></div>
  </div>

  <div class="ft">實戰班委員會 · 展示頁<br>定案後即刪除</div>

</div>

<script>
const DATA = [
  { name:'殷慈敏', filled:true,  d:{name_list:5, meet:3, invite:2, present:1, seminar:0, ghosted:1, rejected:0}, closes:0, stu:true,  coach:false },
  { name:'沈軍駥', filled:false, d:null, closes:0, stu:false, coach:false },
  { name:'黃育芳', filled:true,  d:{name_list:2, meet:1, invite:0, present:2, seminar:1, ghosted:0, rejected:1}, closes:2, stu:true,  coach:true  },
  { name:'林淑貞', filled:true,  d:{name_list:8, meet:0, invite:0, present:0, seminar:0, ghosted:0, rejected:0}, closes:0, stu:false, coach:false }
];
const F = [
  {k:'name_list', n:'狂列名單'}, {k:'meet', n:'認識新友'},
  {k:'invite', n:'拉近關係'},   {k:'present', n:'溝通本說明'},
  {k:'seminar', n:'邀請說明會'}, {k:'ghosted', n:'被放鴿子'},
  {k:'rejected', n:'締結未果'}
];

// 'tag' = A 點「行動填寫」／'name' = B 點姓名。可用 ?v=name 直接開 B
let variant = new URLSearchParams(location.search).get('v') === 'name' ? 'name' : 'tag';
function setVariant(v) {
  variant = v;
  document.getElementById('vA').classList.toggle('on', v === 'tag');
  document.getElementById('vB').classList.toggle('on', v === 'name');
  render();
}

function render() {
  let h = '';
  DATA.forEach((s, i) => {
    // A：名字純文字，右邊掛一個「行動填寫 ›」標籤
    // B：名字本身可點（後面加淡箭頭），沒填的人也點得下去，展開顯示「還沒填」
    const nameCell = variant === 'name'
      ? `<span class="nm tap" onclick="toggleDetail(${i})">${s.name}<span class="caret">›</span>${s.filled ? '' : '<span class="nofill">未填</span>'}</span>`
      : `<span class="nm">${s.name}</span>`;
    const look = variant === 'tag'
      ? (s.filled ? `<span class="look" onclick="toggleDetail(${i})">行動填寫 ›</span>`
                  : `<span class="look none">—</span>`)
      : '';
    let inner;
    if (s.filled) {
      const items = F.map(f => {
        const v = s.d[f.k] || 0;
        return `<div class="ditem ${v ? '' : 'z'}"><span>${f.n}</span><span>${v}</span></div>`;
      }).join('');
      inner = `<div class="detail-t">${s.name} · 8/11 填的內容</div>
        <div class="dgrid">${items}</div>
        <div class="dclose"><span>締結成功</span><span>${s.closes} 筆</span></div>`;
    } else {
      inner = `<div class="detail-t">${s.name} · 8/11</div>
        <div style="font-size:15px;font-weight:700;color:var(--muted);padding:4px 0 2px">今天還沒填</div>`;
    }
    const det = `<div class="detail" id="d${i}"><div class="detail-in">${inner}</div></div>`;
    h += `<div class="row">
      <div class="row-main">
        ${nameCell}
        ${look}
        <span class="btns">
          <button class="b stu ${s.stu ? 'on' : ''}" onclick="tog(${i},'stu')">已交</button>
          <button class="b coach ${s.coach ? 'on' : ''}" onclick="tog(${i},'coach')">已回</button>
        </span>
      </div>${det}
    </div>`;
  });
  document.getElementById('rows').innerHTML = h;
  const t = DATA.length;
  document.getElementById('total').textContent =
    `已填報 ${DATA.filter(s=>s.filled).length}/${t}　·　已交 ${DATA.filter(s=>s.stu).length}/${t}　·　已回 ${DATA.filter(s=>s.coach).length}/${t}`;
}
function tog(i, k) { DATA[i][k] = !DATA[i][k]; render(); }
function toggleDetail(i) {
  const el = document.getElementById('d' + i);
  const was = el.classList.contains('open');
  render();
  if (!was) document.getElementById('d' + i).classList.add('open');
}
setVariant(variant);   // 一併把上方 A／B 按鈕的選取狀態畫對
</script>
</body>
</html>
