<script>
const LIFF_ID = '2009692859-IGJ1xPLd';
const BATCH_ID = 1;
const GOD_KEY = 'gv9k2x7m'; // 天神視角密鑰：?god_as=會員id&god_key=gv9k2x7m 即可跳過 LIFF

const sb = window.supabase.createClient(
  'https://nsgqsopqlkhayuefdout.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y',
  { db: { schema: 'npcombat' } }
);

let memberId = null, studentId = null, memberName = '', batchInfo = null;
let certConfettiTimer = null;

function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const CERT_FIELDS = [
  { key:'name_list', label:'狂列名單', w:1 },
  { key:'meet',      label:'認識新友', w:1 },
  { key:'invite',    label:'拉近關係', w:2 },
  { key:'present',   label:'溝通本說明', w:5 },
  { key:'seminar',   label:'邀請說明會', w:5 },
  { key:'ghosted',   label:'被放鴿子', w:1 },
  { key:'rejected',  label:'締結未果', w:1 },
];
const cActPts = o => CERT_FIELDS.reduce((a, f) => a + (o[f.key] || 0) * f.w, 0);

function showMsg(msg) {
  document.getElementById('certPaper').style.display = 'none';
  document.querySelector('.cert-actions').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'cert-msg';
  el.innerHTML = msg;
  document.querySelector('.cert-scroll').appendChild(el);
}

async function loadCertData() {
  // 本人全期 logs（不限 confirmed，慶祝看努力全貌）
  const { data: logs } = await sb.from('action_logs')
    .select('student_id, log_date, name_list, meet, invite, present, seminar, ghosted, rejected, checkin_at, buddy_left, buddy_right')
    .eq('batch_id', BATCH_ID);
  const all = logs || [];
  const mine = all.filter(l => l.student_id === studentId);
  const { data: closes } = await sb.from('closing_records').select('points, close_date').eq('member_id', memberId);
  const myCloses = closes || [];
  const { data: bsRow } = await sb.from('batch_students').select('cert_comment, cert_award, coach_id, cert_by_coach, cert_ai_insight').eq('id', studentId).single();
  const customComment = bsRow && bsRow.cert_comment;
  const customAiInsight = bsRow && bsRow.cert_ai_insight;
  const customAward = bsRow && bsRow.cert_by_coach ? bsRow.cert_award : null;
  let coachName = null;
  if (bsRow && bsRow.cert_by_coach && bsRow.coach_id) {
    const { data: coachRow } = await sb.from('batch_coaches').select('member_id').eq('id', bsRow.coach_id).single();
    if (coachRow) {
      const { data: coachMember } = await sb.from('members_master').select('name').eq('id', coachRow.member_id).single();
      coachName = coachMember && coachMember.name;
    }
  }

  // 我的累積
  const sum = k => mine.reduce((a, l) => a + (l[k] || 0), 0);
  const totals = {}; CERT_FIELDS.forEach(f => totals[f.key] = sum(f.key));
  const actionPts = cActPts(totals);
  const closePts = myCloses.reduce((a, c) => a + (c.points || 0), 0);
  const total = actionPts + closePts;
  const reportDays = new Set(mine.map(l => l.log_date)).size;
  const checkinDays = new Set(mine.filter(l => l.checkin_at).map(l => l.log_date)).size;
  const buddies = mine.reduce((a, l) => a + (l.buddy_left || 0) + (l.buddy_right || 0), 0);

  // 最長連續填報天數
  const dates = [...new Set(mine.map(l => l.log_date))].sort();
  let best = 0, run = 0, prev = null;
  dates.forEach(ds => {
    if (prev && (new Date(ds) - new Date(prev)) === 86400000) run++; else run = 1;
    best = Math.max(best, run); prev = ds;
  });

  // 📈 每週成長（行動分，跟自己比）
  const today = localDateStr(new Date());
  const weeks = buildCertWeeks(batchInfo.start_date, batchInfo.end_date)
    .filter(w => localDateStr(w.start) <= today); // 只到已開始的週
  const weekly = weeks.map((w, i) => {
    const ws = localDateStr(w.start), we = localDateStr(w.end);
    const pts = mine.filter(l => l.log_date >= ws && l.log_date <= we).reduce((a, l) => a + cActPts(l), 0);
    return { num: i + 1, pts };
  });

  // 🎯 威斯汀獎勵名額（締結跨門檻，跟目標比）
  const eb = batchInfo.earlybird_score || 700, sm = batchInfo.single_month_score || 800, cm = batchInfo.cross_month_score || 900;
  const mon = {}; myCloses.forEach(c => { const m = +c.close_date.split('-')[1]; mon[m] = (mon[m] || 0) + (c.points || 0); });
  const apr = mon[4] || 0, may = mon[5] || 0, jun = mon[6] || 0;
  const aS = Math.floor(apr / eb), mS = Math.floor(may / sm), jS = Math.floor(jun / sm);
  const crossPool = (apr - aS * eb) + (may - mS * sm) + (jun - jS * sm);
  const slots = aS + mS + jS + Math.floor(crossPool / cm);

  const totalActs = CERT_FIELDS.reduce((a, f) => a + (totals[f.key] || 0), 0);

  // 📅 出勤日曆：開班～今天每天「有沒有行動」（1=有出手 / 0=空白）
  const actDates = new Set(mine.filter(l => cActPts(l) > 0).map(l => l.log_date));
  const heat = [];
  const sd = new Date(batchInfo.start_date), ed = new Date(batchInfo.end_date), tdy = new Date(today);
  const endLoop = ed < tdy ? ed : tdy;
  for (let dt = new Date(sd); dt <= endLoop; dt.setDate(dt.getDate() + 1)) {
    heat.push(actDates.has(localDateStr(dt)) ? 1 : 0);
  }
  const heatActive = heat.filter(v => v).length;

  // 📍 里程碑（只列實際發生的）
  const ms = [];
  const md = s => (s || '').slice(5).replace('-', '/');
  if (dates.length) ms.push([md(dates[0]), '開班踏出第一步，首次填報']);
  const firstSem = mine.filter(l => (l.seminar || 0) > 0).map(l => l.log_date).sort()[0];
  if (firstSem) ms.push([md(firstSem), '第一次帶人進說明會 🏛️']);
  const closeDates = myCloses.map(c => c.close_date).sort();
  if (closeDates.length) ms.push([md(closeDates[0]), '首次締結成功 🎉']);
  // 連續 7 天達成日
  let r2 = 0, p2 = null, streak7 = null;
  dates.forEach(ds => {
    if (p2 && (new Date(ds) - new Date(p2)) === 86400000) r2++; else r2 = 1;
    if (r2 === 7 && !streak7) streak7 = ds; p2 = ds;
  });
  if (streak7) ms.push([md(streak7), '連續填報 7 天 🔥']);
  if (slots >= 1 && closeDates.length) ms.push([md(closeDates[closeDates.length-1]), '達成威斯汀獎勵門檻 🏆']);
  if (dates.length) ms.push([md(dates[dates.length-1]), `堅持到底，共填報 ${reportDays} 天`]);
  ms.sort((a, b) => a[0].localeCompare(b[0]));

  return { totals, actionPts, closePts, total, reportDays, checkinDays, buddies, streak: best,
           closeCount: myCloses.length, weekly, slots, closePtsTotal: closePts, threshold: eb,
           totalActs, heat, heatActive, milestones: ms, batch: batchInfo, customComment, customAward, coachName, customAiInsight };
}

// A：主場（貢獻分最高）+ 可加強（最低）
function certAnalysis(posPts) {
  const sorted = [...posPts].sort((a, b) => b.pts - a.pts);
  const top = sorted[0], low = sorted[sorted.length - 1];
  if (!top || top.pts === 0) return `<div class="ct-analysis">開始行動，累積你的強項吧 💪</div>`;
  return `<div class="ct-analysis">
    <div class="ct-an-row"><span class="ct-an-k">💪 你的主場</span><span class="ct-an-v">${top.label}</span></div>
    <div class="ct-an-row"><span class="ct-an-k">🌱 最有潛力</span><span class="ct-an-v">${low.label}</span></div>
  </div>`;
}

// AI 數據洞察：純數據自比（不跟同儕比），成長趨勢 + 行動效率
// 26期已一次寫死進 batch_students.cert_ai_insight（結業後資料不再變動，省得每次重算）；
// 沒有預存資料的未來期別，退回即時計算版本
function aiInsight(d) {
  if (d.customAiInsight) {
    return `<div class="ct-ai-block">
      <div class="ct-ai-text" style="margin-top:0;padding-top:0;border-top:none">${d.customAiInsight}</div>
      <div class="ct-ai-note">由 AI 依你的行動紀錄生成</div>
    </div>`;
  }
  const weekly = d.weekly || [];
  const half = Math.ceil(weekly.length / 2);
  const firstHalf = weekly.slice(0, half), secondHalf = weekly.slice(half);
  const avg = arr => arr.length ? arr.reduce((a, w) => a + w.pts, 0) / arr.length : 0;
  const firstAvg = avg(firstHalf), secondAvg = avg(secondHalf);

  let trendKind, trend;
  if (!secondHalf.length || (firstAvg === 0 && secondAvg === 0)) {
    trendKind = 'na'; trend = '資料還在累積中';
  } else if (firstAvg === 0) {
    trendKind = 'up'; trend = '從零到有，後段明顯發力 🚀';
  } else {
    const pct = Math.round((secondAvg - firstAvg) / firstAvg * 100);
    if (pct >= 20) { trendKind = 'up'; trend = `後段比前段成長 ${pct}% 📈`; }
    else if (pct <= -20) { trendKind = 'down'; trend = `前段衝刺力道強，後段略緩`; }
    else { trendKind = 'flat'; trend = '維持穩定的行動節奏'; }
  }

  const efficiency = d.reportDays > 0 ? d.actionPts / d.reportDays : 0;
  const effStr = efficiency.toFixed(1);

  // 依趨勢＋效率組一句 AI 鼓勵語（系統生成，非教練親筆，語氣理性但鼓勵）
  let encourage;
  if (trendKind === 'na') encourage = '持續填報，AI 會幫你把每一步都算進成長曲線裡。';
  else if (trendKind === 'up') encourage = efficiency >= 3
    ? '不只往上走，每次行動的含金量也很高，這是最理想的成長型態。'
    : '上升趨勢很明確，接下來把每次行動的深度拉高，效益會更驚人。';
  else if (trendKind === 'down') encourage = '後段步調放緩很正常，數據看得到你前段打下的底子，重新加速隨時都來得及。';
  else encourage = efficiency >= 3
    ? '穩定中帶著高效率，這種節奏最適合長期作戰。'
    : '節奏穩定是好事，下一步試著拉高每次行動的份量，成長曲線會更明顯。';

  return `<div class="ct-ai-block">
    <div class="ct-ai-row"><span class="ct-ai-k">📈 成長趨勢</span><span class="ct-ai-v">${trend}</span></div>
    <div class="ct-ai-row"><span class="ct-ai-k">⚡ 行動效率</span><span class="ct-ai-v">${effStr} 分/填報天</span></div>
    <div class="ct-ai-text">${encourage}</div>
    <div class="ct-ai-note">由系統依你的行動紀錄自動生成</div>
  </div>`;
}

// C：行動風格稱號（依分數分布）
function certStyle(posPts) {
  const get = l => (posPts.find(p => p.label === l) || {}).pts || 0;
  const dev = get('狂列名單') + get('認識新友');           // 開發
  const rel = get('拉近關係');                              // 關係
  const close = get('溝通本說明') + get('邀請說明會');      // 推進成交
  const total = dev + rel + close;
  if (total === 0) return '🌱 起步型';
  const max = Math.max(dev, rel, close);
  // 三者都不到總和一半 → 全能均衡
  if (max < total * 0.45) return '⚖️ 全能型';
  if (max === close) return '🎓 成交推進型';
  if (max === dev) return '🏹 開發衝刺型';
  return '🤝 關係經營型';
}

// 證書週次（同排行榜邏輯：週日~週六，首週 start~下週六，末週<3天併前一週）
function buildCertWeeks(start, end) {
  const s = new Date(start), e = new Date(end), weeks = [];
  let toSat = (6 - s.getDay() + 7) % 7; if (toSat === 0) toSat = 7;
  let firstEnd = new Date(s); firstEnd.setDate(s.getDate() + toSat); if (firstEnd > e) firstEnd = new Date(e);
  weeks.push({ start: new Date(s), end: new Date(firstEnd) });
  let ws = new Date(firstEnd); ws.setDate(ws.getDate() + 1);
  while (ws <= e) { let we = new Date(ws); we.setDate(we.getDate() + 6); if (we > e) we = new Date(e); weeks.push({ start: new Date(ws), end: we }); ws.setDate(ws.getDate() + 7); }
  if (weeks.length > 1) { const last = weeks[weeks.length - 1]; if ((last.end - last.start) / 86400000 < 3) { weeks[weeks.length - 2].end = last.end; weeks.pop(); } }
  return weeks;
}

function buildCertHTML(d) {
  const fmt = s => s ? s.replace(/-/g, '.').slice(0,10) : '';
  const period = d.batch ? `${fmt(d.batch.start_date)} – ${fmt(d.batch.end_date)}` : '';
  // 稱號徽章（依突出數據）
  const tags = [];
  if (d.streak >= 7) tags.push('🔥 七日連燒');
  if (d.checkinDays >= 5) tags.push('🏢 勤跑公司');
  if (d.totals.meet >= 30) tags.push('🦋 社交蝴蝶');
  if (d.totals.name_list >= 50) tags.push('📋 滿門抄斬');
  if (d.totals.seminar >= 5) tags.push('🎯 會場常客');
  if (d.closeCount >= 1) tags.push('🔫 成交達陣');
  if (d.buddies >= 5) tags.push('🚌 動員高手');
  if (d.slots >= 1) tags.push('🏆 威斯汀達標');
  // 成長徽章：最後一週 >= 第一週 → 持續成長
  const grew = d.weekly.length >= 2 && d.weekly[d.weekly.length-1].pts >= d.weekly[0].pts && d.weekly[0].pts > 0;
  if (grew) tags.push('📈 越戰越強');
  if (!tags.length) tags.push('🌱 勇敢起步');

  // 強項橫條（5正向動作，分數＝數量×權重）+ 分析
  const POS = CERT_FIELDS.filter(f => !['ghosted','rejected'].includes(f.key));
  const posPts = POS.map(f => ({ label: f.label, pts: (d.totals[f.key] || 0) * f.w }));
  const strengths = strengthBars(posPts);
  const analysis = certAnalysis(posPts);   // A：主場 + 可加強
  const styleTag = certStyle(posPts);      // C：行動風格稱號
  const weekBars = weeklyBars(d.weekly);
  const heatmap = heatmapHTML(d.heat, d.heatActive);
  const milestone = milestoneHTML(d.milestones);
  const comment = certComment(d);
  const signName = (d.customComment && d.coachName) ? `${d.coachName} 教練` : '實戰班委員會';
  const westin = d.slots >= 1
    ? `🏆 達成 ${d.slots} 個威斯汀獎勵名額！`
    : `🎯 締結 ${d.closePtsTotal} 分，朝威斯汀獎勵邁進`;

  return `
    <div class="cert-shine"></div>
    <div class="ct-head">
      <div class="ct-badge">GROWTH CERTIFICATE</div>
      <div class="ct-title">${d.batch ? d.batch.name : '實戰班'} 結業成長證明</div>
      <div class="ct-name"><u>${memberName}</u></div>
      <div class="ct-period">${period}</div>
    </div>
    <div class="ct-hr"></div>
    <div class="ct-score-wrap">
      <div class="ct-score" data-target="${d.total}">0</div>
      <div class="ct-score-l">總戰績分數</div>
      <div class="ct-westin">${westin}</div>
    </div>
    <div class="ct-section-l">📈 每週成長軌跡</div>
    ${weekBars}
    <div class="ct-section-l">📊 行動風格分析　<span class="ct-style">${styleTag}</span></div>
    ${strengths}
    ${analysis}
    <div class="ct-section-l">📅 行動熱力圖</div>
    ${heatmap}
    <div class="ct-section-l">📍 里程碑時間軸</div>
    ${milestone}
    <div class="ct-section-l">🎖️ 歷程投入</div>
    <div class="ct-stats">
      <div class="ct-stat"><div class="ct-stat-n">${d.reportDays}</div><div class="ct-stat-l">填報天數</div></div>
      <div class="ct-stat"><div class="ct-stat-n">${d.streak}</div><div class="ct-stat-l">最長連續</div></div>
      <div class="ct-stat"><div class="ct-stat-n">${d.totalActs}</div><div class="ct-stat-l">總行動次數</div></div>
      <div class="ct-stat"><div class="ct-stat-n">${d.closeCount}</div><div class="ct-stat-l">締結件數</div></div>
    </div>
    <div class="ct-badges">${tags.map(t => `<span class="ct-tag">${t}</span>`).join('')}</div>
    <div class="ct-section-l">🤖 AI 數據洞察</div>
    ${aiInsight(d)}
    <div class="ct-section-l">🎖️ 教練頒獎</div>
    <div class="ct-coach-block">
      ${d.customAward ? `<div class="ct-coach-award">🏆 ${d.customAward}</div>` : ''}
      <div class="ct-coach-text">「${comment}」</div>
      <div class="ct-coach-sign">— ${signName}</div>
    </div>
    <div class="ct-seal"><div class="ct-seal-stamp">實戰班<br>委員會</div></div>
  `;
}

// 每週成長長條（跟自己比）
function weeklyBars(weekly) {
  if (!weekly || !weekly.length) return '';
  const max = Math.max(1, ...weekly.map(w => w.pts));
  const bars = weekly.map(w => {
    const h = Math.round(w.pts / max * 100);
    return `<div class="ct-wk">
      <div class="ct-wk-val">${w.pts}</div>
      <div class="ct-wk-bar-track"><div class="ct-wk-bar" style="height:0%" data-h="${h}"></div></div>
      <div class="ct-wk-lab">W${w.num}</div>
    </div>`;
  }).join('');
  return `<div class="ct-weeks">${bars}</div>`;
}

// 強項橫條（取代雷達，分數高到低排序，誠實好讀）
function strengthBars(posPts) {
  const sorted = [...posPts].sort((a, b) => b.pts - a.pts);
  const max = Math.max(1, ...sorted.map(p => p.pts));
  return '<div class="ct-sbars">' + sorted.map(p =>
    `<div class="ct-sbar-row">
      <div class="ct-sbar-lab">${p.label}</div>
      <div class="ct-sbar-track"><div class="ct-sbar-fill" style="width:0%" data-w="${Math.round(p.pts / max * 100)}"></div></div>
      <div class="ct-sbar-v">${p.pts}</div>
    </div>`).join('') + '</div>';
}

// 出勤軌跡條（一橫排：金=有行動 / 灰=空白，斷檔一目了然）
function heatmapHTML(heat, active) {
  if (!heat || !heat.length) return '';
  const cells = heat.map((v, i) => `<div class="ct-hm-c ${v ? 'on' : 'off'}" style="animation-delay:${i*18}ms"></div>`).join('');
  return `<div class="ct-hm-cap">出席 <b>${active}/${heat.length}</b> 天　·　最長連續 <b>${certStreakFromHeat(heat)}</b> 天 🔥</div>
    <div class="ct-hm-strip">${cells}</div>`;
}
function certStreakFromHeat(heat) {
  let best = 0, run = 0;
  heat.forEach(v => { if (v) { run++; best = Math.max(best, run); } else run = 0; });
  return best;
}

// 里程碑時間軸
function milestoneHTML(ms) {
  if (!ms || !ms.length) return '<div class="ct-analysis">你的旅程正要開始 🌱</div>';
  return '<div class="ct-tl">' + ms.map(m =>
    `<div class="ct-tl-row"><span class="ct-tl-d">${m[0]}</span>　<span class="ct-tl-x">${m[1]}</span></div>`
  ).join('') + '</div>';
}

function certComment(d) {
  // 個人化評語（batch_students.cert_comment，逐人手動撰寫）；沒有才退回規則拼句版
  if (d.customComment) return d.customComment;
  const bits = [];
  if (d.streak >= 14) bits.push('你用連續的堅持證明了什麼叫不間斷的行動力');
  else if (d.streak >= 7) bits.push('連續七天以上的回報，是自律最好的勳章');
  if (d.totals.seminar >= 5) bits.push('一次次把人帶進會場，你懂得借力使力');
  if (d.closeCount >= 1) bits.push('你把行動真正轉化成了成果');
  if (d.totals.meet >= 30) bits.push('主動認識新朋友，你的世界正在變大');
  if (!bits.length) bits.push('每一次填報，都是你對自己的承諾');
  const grew = d.weekly && d.weekly.length >= 2 && d.weekly[d.weekly.length-1].pts > d.weekly[0].pts;
  const head = grew ? `${memberName}，你一週比一週更強。` : `${memberName}，這 ${d.reportDays} 天你從未缺席自己的成長。`;
  return `${head}${bits.slice(0,2).join('，')}。願你帶著這份戰績，走向下一個高峰。🏆`;
}

function animateBars() {
  setTimeout(() => {
    document.querySelectorAll('.ct-wk-bar').forEach((b, i) => {
      setTimeout(() => { b.style.height = (b.dataset.h || 0) + '%'; }, i * 120);
    });
    document.querySelectorAll('.ct-sbar-fill').forEach((b, i) => {
      setTimeout(() => { b.style.width = (b.dataset.w || 0) + '%'; }, i * 100);
    });
  }, 300);
}

function animateCount() {
  const el = document.querySelector('.ct-score');
  if (!el) return;
  const target = +el.dataset.target || 0;
  const dur = 1400, t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 撒花
function startConfetti() {
  const cv = document.getElementById('certConfetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#d4af37','#f5d76e','#b8860b','#fff3c4','#e8c252'];
  const N = 90;
  const parts = Array.from({length: N}, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height,
    s: 4 + Math.random() * 6, vy: 1.2 + Math.random() * 2.4, vx: -1 + Math.random() * 2,
    rot: Math.random() * 6.28, vr: -0.1 + Math.random() * 0.2,
    c: colors[(Math.random() * colors.length) | 0]
  }));
  function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += p.vr;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
    });
    certConfettiTimer = requestAnimationFrame(frame);
  }
  frame();
}

async function init() {
  try {
    // 身份取得：天神視角（god_as + god_key）跳過 LIFF，否則正常 LIFF 登入
    const _p = new URLSearchParams(location.search);
    const _godAs = _p.get('god_as'), _godKey = _p.get('god_key');
    const _isGodView = _godAs && _godKey === GOD_KEY;
    let member;
    if (_isGodView) {
      const { data } = await sb.from('members_master').select('id, name').eq('id', _godAs).single();
      member = data;
    } else {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const profile = await liff.getProfile();
      const { data } = await sb.from('members_master').select('id, name')
        .eq('line_user_id', profile.userId).single();
      member = data;
    }
    if (!member) { showMsg('查無會員資料，無法顯示成長證明。'); return; }
    memberId = member.id;
    memberName = member.name;

    // 查本期學員身份
    const { data: stu } = await sb.from('batch_students').select('id, status')
      .eq('batch_id', BATCH_ID).eq('member_id', memberId).single();
    if (!stu || stu.status !== 'approved') { showMsg(member.name + '，查無你在 26 期實戰班的參與紀錄。'); return; }
    studentId = stu.id;

    // 查班次資訊
    const { data: batch } = await sb.from('batches')
      .select('name, start_date, end_date, earlybird_score, single_month_score, cross_month_score')
      .eq('id', BATCH_ID).single();
    batchInfo = batch;

    // 載入並渲染證書
    const data = await loadCertData();
    document.getElementById('certPaper').innerHTML = buildCertHTML(data);
    animateCount();
    animateBars();
    startConfetti();
  } catch (e) {
    document.getElementById('certPaper').innerHTML = '<div style="text-align:center;padding:80px 0;color:#c0392b">載入失敗：' + e.message + '</div>';
  }
}

init();
</script>
