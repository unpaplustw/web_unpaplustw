<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26期實戰班 ── 決戰威斯汀</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f5f0;--bg2:#ffffff;
  --gold:#b8960c;--gold2:#d4af37;--gold3:#96790a;
  --card:#ffffff;--border:rgba(0,0,0,0.07);
  --txt:#1a1a2e;--txt2:#6b7280;
  --green:#16a34a;--red:#dc2626;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 30% 10%,rgba(184,150,12,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 90%,rgba(184,150,12,0.04) 0%,transparent 40%);
  pointer-events:none;
}
.container{max-width:480px;margin:0 auto;padding:20px 16px;position:relative;z-index:1}
.header{text-align:center;padding:24px 0 8px}
.header h1{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:4px;text-transform:uppercase}
.header .event{font-size:32px;font-weight:900;margin-top:6px;background:linear-gradient(135deg,var(--gold3),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.motto{color:var(--txt2);font-size:13px;margin-top:10px;font-style:italic;letter-spacing:1px}
.ring-section{text-align:center;padding:32px 0 20px}
.ring-wrap{position:relative;display:inline-block;width:220px;height:220px}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,0.06);stroke-width:14}
.ring-fg{fill:none;stroke:url(#goldGrad);stroke-width:14;stroke-linecap:round;stroke-dasharray:628;stroke-dashoffset:628;transition:stroke-dashoffset 1.8s cubic-bezier(0.4,0,0.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--gold3),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.ring-pct-sign{font-size:28px}
.ring-label{color:var(--txt2);font-size:13px;margin-top:4px}
.ring-detail{margin-top:16px;font-size:18px;font-weight:700;color:var(--txt)}
.ring-detail span{color:var(--gold)}
.ring-target{color:var(--txt2);font-size:12px;margin-top:4px}
.countdown-bar{display:flex;justify-content:center;gap:16px;margin:24px 0;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.cd-item{text-align:center;min-width:56px}
.cd-num{font-size:28px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;display:block;line-height:1}
.cd-unit{font-size:11px;color:var(--txt2);margin-top:4px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:22px;font-weight:900;color:var(--gold);line-height:1}
.stat-label{font-size:11px;color:var(--txt2);margin-top:6px}
.nav-grid{display:flex;flex-direction:column;gap:10px;margin:24px 0}
.nav-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);text-decoration:none;color:var(--txt);transition:all .25s;cursor:pointer;box-shadow:var(--shadow)}
.nav-card:hover{border-color:rgba(184,150,12,0.2);transform:translateX(4px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.nav-icon{font-size:28px;flex-shrink:0}
.nav-info{flex:1}
.nav-title{font-size:15px;font-weight:700}
.nav-desc{font-size:12px;color:var(--txt2);margin-top:2px}
.nav-arrow{color:var(--txt2);font-size:18px}
.footer{text-align:center;padding:32px 0 16px;color:var(--txt2);font-size:11px}
.fade-up{opacity:0;transform:translateY(20px);animation:fadeUp .6s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
.fade-up:nth-child(2){animation-delay:.1s}
.fade-up:nth-child(3){animation-delay:.2s}
.fade-up:nth-child(4){animation-delay:.3s}
.fade-up:nth-child(5){animation-delay:.4s}
</style>
</head>
<body>
<div class="container">
  <div class="header fade-up">
    <h1>26期實戰班</h1>
    <div class="event">決戰威斯汀</div>
    <div class="motto">「一個人玩不是玩，一群人玩才是玩。」</div>
  </div>

  <div class="ring-section fade-up">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220" width="220" height="220">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#96790a"/>
            <stop offset="100%" stop-color="#d4af37"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100"/>
      </svg>
      <div class="ring-center">
        <div class="ring-pct"><span id="pctNum">0</span><span class="ring-pct-sign">%</span></div>
        <div class="ring-label">全體達標率</div>
      </div>
    </div>
    <div class="ring-detail"><span id="achievedNum">0</span> / <span id="totalNum">0</span> 人達標威斯汀</div>
  </div>

  <div style="text-align:center;margin-top:24px;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--gold);text-transform:uppercase">倒數開班</div>
  <div class="countdown-bar fade-up">
    <div class="cd-item"><span class="cd-num" id="cdDays">--</span><span class="cd-unit">天</span></div>
    <div class="cd-item"><span class="cd-num" id="cdHrs">--</span><span class="cd-unit">時</span></div>
    <div class="cd-item"><span class="cd-num" id="cdMins">--</span><span class="cd-unit">分</span></div>
    <div class="cd-item"><span class="cd-num" id="cdSecs">--</span><span class="cd-unit">秒</span></div>
  </div>

  <div class="stats-row fade-up">
    <div class="stat-card">
      <div class="stat-num" id="statWeek">--</div>
      <div class="stat-label">目前週次</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statActions">--</div>
      <div class="stat-label">全體總行動</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAvg">--</div>
      <div class="stat-label">平均積分</div>
    </div>
  </div>

  <div class="nav-grid fade-up">
    <a class="nav-card" href="brochure.html">
      <div class="nav-icon">📖</div>
      <div class="nav-info">
        <div class="nav-title">報名簡章</div>
        <div class="nav-desc">課程內容、時程、入學門檻一次看</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>
    <a class="nav-card" href="leaderboard.html">
      <div class="nav-icon">🏆</div>
      <div class="nav-info">
        <div class="nav-title">排行榜</div>
        <div class="nav-desc">本週各獎項前三名</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>
    <a class="nav-card" href="daily.html">
      <div class="nav-icon">📊</div>
      <div class="nav-info">
        <div class="nav-title">學員回報</div>
        <div class="nav-desc">填寫今日行動量與締結紀錄</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>
    <a class="nav-card" href="coach-review.html">
      <div class="nav-icon">✏️</div>
      <div class="nav-info">
        <div class="nav-title">教練回報</div>
        <div class="nav-desc">審查學員回報、補充教練欄位、確認鎖定</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>
  </div>

  <div class="footer">實戰班委員會</div>
</div>

<script>
const SUPABASE_URL = 'https://nsgqsopqlkhayuefdout.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zZ3Fzb3BxbGtoYXl1ZWZkb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MzgzMjgsImV4cCI6MjA4ODMxNDMyOH0.FCMF_WaWjmtuWUKO2vqQBM4cFVGrdqt9fdmxYwUii0Y';
const sb = typeof supabase !== 'undefined'
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'npcombat' } })
  : null;

let batchStart = null, batchEnd = null, target = 800;

function startCountdown() {
  function tick() {
    const now = new Date();
    const diff = (batchStart || now) - now;
    if (diff <= 0) {
      document.getElementById('cdDays').textContent = '0';
      document.getElementById('cdHrs').textContent = '00';
      document.getElementById('cdMins').textContent = '00';
      document.getElementById('cdSecs').textContent = '00';
      return;
    }
    document.getElementById('cdDays').textContent = Math.floor(diff / 86400000);
    document.getElementById('cdHrs').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('cdMins').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    document.getElementById('cdSecs').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
}

function animateRing(pct) {
  const circumference = 2 * Math.PI * 100;
  const offset = circumference * (1 - pct / 100);
  setTimeout(() => {
    document.getElementById('ringFg').style.strokeDashoffset = offset;
  }, 300);
  let current = 0;
  const t = Math.round(pct);
  const step = Math.max(1, Math.floor(t / 40));
  const timer = setInterval(() => {
    current += step;
    if (current >= t) { current = t; clearInterval(timer); }
    document.getElementById('pctNum').textContent = current;
  }, 30);
}

function getCurrentWeek() {
  if (!batchStart) return 0;
  const now = new Date();
  if (now < batchStart) return 0;
  return Math.min(Math.floor((now - batchStart) / (7 * 86400000)) + 1, 5);
}

async function init() {
  // 從資料庫讀班次資訊
  const { data: batch } = await sb.from('batches').select('start_date, end_date, single_month_score')
    .eq('id', 1).single();
  if (batch) {
    batchStart = new Date(batch.start_date);
    batchEnd = new Date(batch.end_date);
    target = batch.single_month_score || 800;
  }

  startCountdown();

  // 一次查學員（含 member_id）
  const { data: stuData } = await sb.from('batch_students')
    .select('id, member_id').eq('batch_id', 1).eq('status', 'approved');
  const total = stuData ? stuData.length : 0;

  document.getElementById('totalNum').textContent = total;
  document.getElementById('statWeek').textContent = '第' + getCurrentWeek() + '週';

  if (total === 0) {
    document.getElementById('achievedNum').textContent = '0';
    document.getElementById('statActions').textContent = '0';
    document.getElementById('statAvg').textContent = '0';
    animateRing(0);
    return;
  }

  // 建立對應表
  const sidToMid = {}, midToSid = {};
  stuData.forEach(s => { sidToMid[s.id] = s.member_id; midToSid[s.member_id] = s.id; });
  const memberIds = stuData.map(s => s.member_id);

  // 查行動紀錄 + 締結紀錄
  const { data: logs } = await sb.from('action_logs')
    .select('student_id, meet, invite, present, seminar, ghosted, rejected')
    .eq('batch_id', 1);
  const { data: closes } = await sb.from('closing_records')
    .select('member_id, points').in('member_id', memberIds);

  // 彙總每位學員積分
  const sums = {};
  let allActions = 0;
  (logs || []).forEach(log => {
    const sid = log.student_id;
    if (!sums[sid]) sums[sid] = 0;
    sums[sid] += (log.meet||0)*1 + (log.invite||0)*2 + (log.present||0)*5 + (log.seminar||0)*5 + (log.ghosted||0)*1 + (log.rejected||0)*1;
    allActions += (log.meet||0) + (log.invite||0) + (log.present||0) + (log.seminar||0) + (log.ghosted||0) + (log.rejected||0);
  });

  (closes || []).forEach(c => {
    const sid = midToSid[c.member_id];
    if (sid) { if (!sums[sid]) sums[sid] = 0; sums[sid] += c.points || 0; }
  });

  const achieved = Object.values(sums).filter(v => v >= target).length;
  const totalScore = Object.values(sums).reduce((a,b) => a+b, 0);
  const avgScore = total > 0 ? Math.round(totalScore / total) : 0;
  const pct = total > 0 ? Math.round((achieved / total) * 100) : 0;

  document.getElementById('achievedNum').textContent = achieved;
  document.getElementById('statActions').textContent = allActions;
  document.getElementById('statAvg').textContent = avgScore;
  animateRing(pct);
}

init();
</script>
</body>
</html>
