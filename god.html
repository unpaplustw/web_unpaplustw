<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天神管理系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#0f0f13;--card:#1a1a23;--border:rgba(255,255,255,.08);--gold:#d4a017;--gold-lt:rgba(212,160,23,.15);--text:#e8e6e1;--muted:#8a8fa8;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 80px}
.hd{text-align:center;padding:24px 0 20px}
.hd-icon{font-size:48px;margin-bottom:8px}
.hd-title{font-size:22px;font-weight:700;color:var(--gold)}
.hd-sub{font-size:13px;color:var(--muted);margin-top:4px}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:14px}
.sys-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:16px 0 8px}
.sys-label:first-child{margin-top:0}
.links-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:4px}
.link-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text);transition:.2s}
.link-card:hover,.link-card:active{border-color:var(--gold);background:var(--gold-lt)}
.link-card .lk-icon{font-size:22px}
.link-card .lk-name{font-size:13px;font-weight:600;text-align:center}
.link-card .lk-desc{font-size:11px;color:var(--muted);text-align:center}
.link-card.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px;padding:16px}
.link-card.wide .lk-name{font-size:14px}
.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="hd-icon">👁️‍🗨️</div>
    <div class="hd-title">天神管理系統</div>
    <div class="hd-sub" id="adminName">驗證中…</div>
  </div>

  <div id="mainContent" style="display:none">
    <div class="section">
      <div class="section-title">⚡ 快速入口</div>

      <div class="sys-label">LINEAI</div>
      <div class="links-grid">
        <a class="link-card wide" href="https://unpaplus.com.tw/members/hub.html" target="_blank">
          <div class="lk-icon">🏛️</div>
          <div>
            <div class="lk-name">會員中心 SA</div>
            <div class="lk-desc">10 個 OA 團隊 + 全部會員</div>
          </div>
        </a>
      </div>

      <div class="sys-label">實戰班</div>
      <div class="links-grid">
        <a class="link-card" href="https://unpaplus.com.tw/npcombat/admin.html" target="_blank">
          <div class="lk-icon">⚙️</div>
          <div class="lk-name">管理後台</div>
        </a>
        <a class="link-card" href="https://unpaplus.com.tw/npcombat/coach-review.html" target="_blank">
          <div class="lk-icon">📋</div>
          <div class="lk-name">教練審查</div>
        </a>
        <a class="link-card" href="https://unpaplus.com.tw/npcombat/leaderboard.html" target="_blank">
          <div class="lk-icon">🏆</div>
          <div class="lk-name">排行榜</div>
        </a>
        <a class="link-card" href="https://unpaplus.com.tw/npcombat/register.html" target="_blank">
          <div class="lk-icon">📝</div>
          <div class="lk-name">報名頁</div>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
const LIFF_ID = '2009692859-Rn5nXjab';
const ALLOWED_LINE_IDS = ['Ufc6ed68b2b199a1815b606e2f7a60210'];

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
    const profile = await liff.getProfile();

    if (!ALLOWED_LINE_IDS.includes(profile.userId)) {
      document.querySelector('.wrap').innerHTML =
        `<div class="empty"><div class="empty-icon">🚫</div><div class="empty-text">無天神權限</div></div>`;
      return;
    }

    document.getElementById('adminName').textContent = profile.displayName + ' 👑';
    document.getElementById('mainContent').style.display = 'block';
  } catch (e) {
    document.querySelector('.wrap').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">登入失敗：${e.message}</div></div>`;
  }
}

init();
</script>
</body>
</html>
