<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<base href="/island/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Plus 天空之城</title>
<meta name="description" content="A Plus 系統的天空之城：精神之塔、環球致富學院、LINEAI 顧問、實戰班、英雄殿。">
<meta name="theme-color" content="#f7f5f0">
<link rel="preload" href="fonts/NotoSansTC-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<main id="stage" aria-hidden="true"></main>
<button id="member-btn" type="button" hidden aria-label="會員"></button>

<aside id="list" aria-label="文字清單">
  <button id="list-toggle" type="button" aria-expanded="false" aria-controls="list-body">清單</button>
  <h1 class="list-title">A Plus 天空之城</h1>
  <p id="text-mode-note" hidden>此裝置無法顯示 3D，以下是文字清單版。</p>
  <div id="list-body"></div>
</aside>

<section id="card" hidden aria-live="polite">
  <button id="card-close" type="button" aria-label="關閉">×</button>
  <div id="card-body"></div>
</section>

<section id="tour" hidden aria-label="導覽">
  <p id="tour-count"></p>
  <p id="tour-text"></p>
  <div class="tour-actions">
    <button id="tour-skip" type="button">略過</button>
    <button id="tour-next" class="button" type="button">下一步</button>
  </div>
</section>

<div id="loader" role="status">
  <div class="loader-hex" aria-hidden="true"></div>
  <p>載入中</p>
</div>
</body>
</html>
